Influence = 
You require this resource to change government form,If [Happiness] is at 5, 10, 30 or above, you gain a maximum of 3 [Influence] per turn from [Happiness] and a extra 2 [Influence] from being in a golden age.\nIf [Happiness] is below 5, -5, -10, -15, -20 or below, you can lose a maximum of 10 [Influence] per turn.\nIf [Gold] is below -100,-200,-300 or below, you can lose a maximum of 5 [Influence] from bankruptcy per turn.\nWhen you are at negative [Influence], you have a chance of triggering stability lose event, which chance gradually increases while your Influence goes even futher into the negative. The lowest stability you can get is [Anarchy].\nWhen below -10 [Influence] you cannot increase stability. = सरकार का स्वरूप बदलने के लिए आपको इस संसाधन की आवश्यकता होती है। यदि [Happiness] 5, 10, 30 या उससे अधिक है, तो आप [Happiness] से प्रति बारी अधिकतम 3 [Influence] प्राप्त करते हैं और स्वर्ण युग में रहने से अतिरिक्त 2 [Influence] मिलता है।\nयदि [Happiness] 5, -5, -10, -15, -20 से नीचे या उससे कम है, तो आप प्रति बारी अधिकतम 10 [Influence] खो सकते हैं।\nयदि [Gold] -100, -200, -300 से नीचे या उससे कम है, तो आप दिवालियापन के कारण प्रति बारी अधिकतम 5 [Influence] खो सकते हैं।\nजब आपका [Influence] ऋणात्मक होता है, तो आपको स्थिरता हानि की घटना ट्रिगर होने की संभावना रहती है, और यह संभावना धीरे-धीरे बढ़ती जाती है जैसे-जैसे आपका प्रभाव और अधिक ऋणात्मक होता जाता है। आपको मिलने वाली सबसे कम स्थिरता [Anarchy] है।\nजब [Influence] -10 से नीचे हो, तो आप स्थिरता नहीं बढ़ा सकते।

