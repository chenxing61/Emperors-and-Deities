Start with [Primal Herder] instead of [Hunter Gatherer], [Primal Herder] can be summoned using [Influence] using [Nomadic Tribes] ability. = [Hunter Gatherer] के बजाय [Primal Herder] के साथ शुरू करें; [Primal Herder] को [Nomadic Tribes] क्षमता का उपयोग करके [Influence] से बुलाया जा सकता है।
Start with ability to generate [Slaves] during fighting, 100 [Slaves] generates a [Peon] Unit. Which is an alternative to [Worker]s. = लड़ाई के दौरान [Slaves] उत्पन्न करने की क्षमता के साथ शुरू करें; 100 [Slaves] एक [Peon] इकाई उत्पन्न करते हैं, जो [Worker]s का विकल्प है।
Unhappiness from number of cities decreased vastly. = शहरों की संख्या से होने वाली असंतुष्टि बहुत कम हो जाती है।
Nearly free migrations and internal transports. = प्रवासन और आंतरिक परिवहन लगभग मुफ़्त।
Cities cannot go above 10 population normally. = शहर सामान्यतः 10 जनसंख्या से ऊपर नहीं जा सकते।
Cannot Build [Worker]s, ['Agricultural Building']s and ['Static Defense'] aside from basic [Walls]. = [Worker]s, ['Agricultural Building']s और बुनियादी [Walls] के अलावा ['Static Defense'] का निर्माण नहीं कर सकते।
Building Speed is vastly slower. = निर्माण गति बहुत धीमी होती है।
[High Cultural Diversity],[Medium Cultural Diversity] and [Low Cultural Diversity] affects the above buff and debuffs even further, remember to check the civilpedia for further informations. = [High Cultural Diversity], [Medium Cultural Diversity] और [Low Cultural Diversity] उपरोक्त लाभ और हानि को और भी प्रभावित करते हैं; अधिक जानकारी के लिए सिविलपीडिया अवश्य देखें।
Upon entering a new era, a new culture emerges from the steppe. You would need to reach full [Influence] to let them unite the steppes to gain their bonuses. = नए युग में प्रवेश करने पर, स्तेपी से एक नई संस्कृति उभरती है। उनके बोनस पाने के लिए उन्हें स्तेपियों को एकजुट करने हेतु पूर्ण [Influence] तक पहुँचना होगा।
Unlocks [Herding Tents], [Pasture] replacement that works on tile with [Migrating Population] instead of normal population. But doesnt provide any stats starting out. = [Herding Tents] को अनलॉक करता है, [Pasture] का प्रतिस्थापन जो सामान्य जनसंख्या के बजाय [Migrating Population] वाली टाइल पर काम करता है, लेकिन शुरुआत में कोई आँकड़ा नहीं देता।
An unique government form that allows multiple uniques action that directly uses influences to creat units and give bonuses. = सरकार का एक अनूठा रूप जो कई अनूठी क्रियाओं की अनुमति देता है जो इकाइयाँ बनाने और बोनस देने के लिए सीधे प्रभाव का उपयोग करती हैं।
Unlocks [Stone Totem], [Shrine] replacement that decreases policy cost spike from city numbers. = [Stone Totem] को अनलॉक करता है, [Shrine] का प्रतिस्थापन जो शहरों की संख्या से होने वाली नीति लागत की बढ़ोतरी को घटाता है।
