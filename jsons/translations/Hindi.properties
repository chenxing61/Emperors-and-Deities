The Facists and their paramilitary militias took over the most important cities and then gradually took over the entire civilization by storm. = फ़ासिस्टों और उनके अर्धसैनिक मिलिशिया ने सबसे महत्वपूर्ण शहरों पर कब्ज़ा कर लिया और फिर धीरे-धीरे पूरी सभ्यता पर धावा बोल दिया।
Fascist Revolution! = फ़ासिस्ट क्रांति!

The revolution is dead. The government of capitalists continue their ruling, our civilization enters a state of [Struggle], But the route to Conservatism is unlocked = क्रांति समाप्त हो चुकी है। पूंजीपतियों की सरकार अपना शासन जारी रखती है; हमारी सभ्यता [Struggle] की स्थिति में प्रवेश करती है, लेकिन रूढ़िवाद का मार्ग खुल जाता है।
Socialist Democracy will save the day.. = समाजवादी लोकतंत्र ही बाज़ी बचाएगा..
Is this even a revolution when at least half of the bourgeoisie are still up on their place? Who knows. The conflict is resolved peacefully but there are long term consequences toward policy and industry development, [Planned Economy] is not available in this route. = जब बुर्जुआ वर्ग का कम से कम आधा हिस्सा अब भी अपनी जगह पर बना हुआ है, तो क्या यह क्रांति भी है? कौन जाने। संघर्ष शांतिपूर्ण ढंग से सुलझ गया, लेकिन नीति और उद्योग विकास पर दीर्घकालिक परिणाम हैं; इस मार्ग में [Planned Economy] उपलब्ध नहीं है।
The Workers have nothing to lose but their chains, they have a world to win. = मज़दूरों के पास अपनी जंजीरों के अलावा खोने को कुछ नहीं है; उन्हें एक पूरी दुनिया जीतनी है।
promotions.One revolt, followed by many, the capitalist system died by a thousand cut. And a new nation ruled by workers is built. Our civilization enters [Struggle] due to the civil war. Newly born [Red Army Troop] now have more promotions. = एक विद्रोह के बाद अनेक विद्रोह; पूंजीवादी व्यवस्था हज़ार कटावों से मर गई। और मज़दूरों द्वारा शासित एक नया राष्ट्र बनाया गया। गृहयुद्ध के कारण हमारी सभ्यता [Struggle] में प्रवेश करती है। नवजात [Red Army Troop] के पास अब अधिक पदोन्नतियाँ हैं।
Workers, Farmers, Soldiers, Students, all shall be united to bring down the capitalists! = मज़दूर, किसान, सैनिक, विद्यार्थी — सभी को पूंजीपतियों को गिराने के लिए एकजुट होना होगा!
Compare to a worker's revolution, this revolution is a combined effort of all proletariats alike, althought that makes the process of revolution much faster, but the organization of the new country is much more complicated. Our Civilization enters [Strife], New [Red Army Troop] specialises into command promotion. = मज़दूरों की क्रांति की तुलना में, यह क्रांति सभी सर्वहारा वर्गों का संयुक्त प्रयास है; यद्यपि इससे क्रांति की प्रक्रिया बहुत तेज़ हो जाती है, लेकिन नए देश का संगठन कहीं अधिक जटिल हो जाता है। हमारी सभ्यता [Strife] में प्रवेश करती है; नए [Red Army Troop] कमान पदोन्नति में विशेषज्ञ होते हैं।
Socialist Revolution! = समाजवादी क्रांति!

The revolution is dead. The government of capitalists continue their ruling, our civilization enters a state of [Struggle], But the route to Conservatism is unlocked. = क्रांति समाप्त हो चुकी है। पूंजीपतियों की सरकार अपना शासन जारी रखती है; हमारी सभ्यता [Struggle] की स्थिति में प्रवेश करती है, लेकिन रूढ़िवाद का मार्ग खुल जाता है।
What we proclaim is the Right to Well-Being; Well-Being for All! = हम जिस बात की घोषणा करते हैं वह है कल्याण का अधिकार; सबके लिए कल्याण!
One revolt, followed by many, the capitalist system died by a thousand cut. There are no oppressions anymore. We have eliminated those ticks. Now is the time we enter [Anarchy] and turn it into something else. = एक विद्रोह के बाद अनेक विद्रोह; पूंजीवादी व्यवस्था हज़ार कटावों से मर गई। अब कोई उत्पीड़न नहीं है। हमने उन परजीवियों को समाप्त कर दिया है। अब समय है कि हम [Anarchy] में प्रवेश करें और उसे कुछ और बना दें।
Installs Anarchist Ruling in all of your cities,an alternative ruling style ('Political Building') that replaces the intergration. It is free and built instantly, only providing small amount of debuff and needs Commune to be built to nullify its downsides. = आपके सभी शहरों में अराजकतावादी शासन स्थापित करता है, एक वैकल्पिक शासन शैली ('Political Building') जो एकीकरण की जगह लेती है। यह मुफ़्त है और तुरंत बन जाता है, केवल थोड़ी-सी कमज़ोरी देता है, और इसकी कमियों को दूर करने के लिए कम्यून बनाने की आवश्यकता होती है।
Anarchist Revolution! = अराजकतावादी क्रांति!

We've rebuilt our government in pursuit to adapt to the new era, but the current economy policy is outdated. We will need a economy reform before we can do anything else. = नए युग के अनुकूल होने के लिए हमने अपनी सरकार का पुनर्निर्माण किया है, लेकिन वर्तमान आर्थिक नीति पुरानी पड़ चुकी है। कुछ और करने से पहले हमें आर्थिक सुधार की आवश्यकता होगी।
Free Market = मुक्त बाज़ार
We should believe in the unseen hand and solve all our problems with massive amount of capitals. = हमें अदृश्य हाथ पर भरोसा करना चाहिए और अपनी सारी समस्याओं को भारी मात्रा में पूंजी से हल करना चाहिए।
The unseen hand of market economy is not to be fully relied upon. We should spend effort to properly and use more refined policy to guide our nation's productivity. = बाज़ार अर्थव्यवस्था के अदृश्य हाथ पर पूरी तरह निर्भर नहीं रहा जाना चाहिए। हमें अपने राष्ट्र की उत्पादकता का मार्गदर्शन करने के लिए अधिक परिष्कृत नीति का उपयोग करने का प्रयास करना चाहिए।
Stability First = पहले स्थिरता
Our economy must serve the national unity first and formost, nothing is impossible when our nation is strong and its people united. = हमारी अर्थव्यवस्था को सबसे पहले राष्ट्रीय एकता की सेवा करनी चाहिए; जब हमारा राष्ट्र मज़बूत हो और उसकी जनता एकजुट हो, तो कुछ भी असंभव नहीं है।
The might of our military overshadows any greed! = हमारी सेना की ताकत हर लालच पर भारी पड़ती है!
Nothing is beyond the power of winning in a direct conflict. We must direct all our effort into military! = सीधे संघर्ष में विजय पाने की शक्ति से बढ़कर कुछ नहीं है। हमें अपना सारा प्रयास सेना में लगाना चाहिए!
Centralised Economic Planning = केंद्रीकृत आर्थिक नियोजन
The market economy only benefits capitalists and speculators, our new socialist economy should maximise our development potential and distributes the goods to those who need it. = बाज़ार अर्थव्यवस्था केवल पूंजीपतियों और सट्टेबाज़ों को लाभ पहुँचाती है; हमारी नई समाजवादी अर्थव्यवस्था को हमारी विकास क्षमता को अधिकतम करना चाहिए और वस्तुओं को ज़रूरतमंदों तक पहुँचाना चाहिए।
Decentralised Economy = विकेंद्रीकृत अर्थव्यवस्था
The economy suffered from monopoly and hierarchy, we should liberate the economy in favour of enabling peoples'agency to work for the masses. With nationalised industries and policies being guiding forces. = अर्थव्यवस्था एकाधिकार और पदानुक्रम से पीड़ित रही है; हमें जनता की एजेंसी को जनसमूह के लिए काम करने में सक्षम बनाने के पक्ष में अर्थव्यवस्था को मुक्त करना चाहिए, जिसमें राष्ट्रीयकृत उद्योग और नीतियाँ मार्गदर्शक शक्तियाँ हों।
Self-Management Economy = स्व-प्रबंधन अर्थव्यवस्था
Worker should take the matter into their own hands instead of being some subjects of any greater entities. Mutualism and free will shall reign surpreme. = मज़दूरों को किसी बड़ी सत्ता के अधीन रहने के बजाय मामलों को अपने हाथों में लेना चाहिए। पारस्परिकता और स्वतंत्र इच्छा सर्वोच्च रूप से शासन करेंगी।
New Economic Policies = नई आर्थिक नीतियाँ

The previous policies may have proven to be less potent. A rearrangement is thus needed. = पिछली नीतियाँ कम प्रभावी साबित हुई होंगी। इसलिए पुनर्व्यवस्था की आवश्यकता है।
Changing economy policies = आर्थिक नीतियों में बदलाव

Here is a list of all of your active missions and their win conditions. = यहाँ आपके सभी सक्रिय अभियानों और उनकी जीत की शर्तों की सूची दी गई है।
Build a Foundry! = एक ढलाईघर बनाएँ!
Unify your civilization under an Empire using [Enact Policies]. = [Enact Policies] का उपयोग करके अपनी सभ्यता को एक साम्राज्य के अधीन एकजुट करें।
Adopt at least [1] policy in either [Monotheism] or [Polytheism]. = [Monotheism] या [Polytheism] में से किसी एक में कम से कम [1] नीति अपनाएँ।
Complete [4] side quests. = [4] सहायक अभियान पूरे करें।
Keep your civilization above [Anarchy]! = अपनी सभ्यता को [Anarchy] से ऊपर बनाए रखें!
Build [The Great Library]! = [The Great Library] का निर्माण करें!
Historically, Aside from the Great Library of Alexandria, the Library of Ashurbanipal, which is the Royal Library of Akkad, it was also renowned for holding the entire [The Epic of Gilgamesh] and dates further back, around 900BC. = ऐतिहासिक रूप से, अलेक्ज़ेंड्रिया के महान पुस्तकालय के अलावा, अशर्बनिपाल का पुस्तकालय, जो अक्काद का शाही पुस्तकालय है, सम्पूर्ण [The Epic of Gilgamesh] को संग्रहीत करने के लिए भी प्रसिद्ध था और यह और भी पुराना है, लगभग 900 ईसा पूर्व।
And you are probably building it too early. = और संभवतः आप इसे बहुत जल्दी बना रहे हैं।
One of the seven olde wonder of the western world. It was built around 600BC and nowadays we build it on every so called green highrises. = पश्चिमी दुनिया के सात प्राचीन अजूबों में से एक। इसे लगभग 600 ईसा पूर्व बनाया गया था और आजकल हम इसे हर तथाकथित हरित ऊँची इमारत पर बनाते हैं।
We have no idea where Tin, the most important ore in bronze making came from, but the traders came from mediterranean sea. So estabilishing a trading hub in the land of Canaan seems to be the way. = हमें पता नहीं है कि कांस्य बनाने में सबसे महत्वपूर्ण अयस्क टिन कहाँ से आता था, लेकिन व्यापारी भूमध्य सागर से आते थे। इसलिए कनान की भूमि में एक व्यापार केंद्र स्थापित करना ही रास्ता लगता है।
And you need to get enough [Pearl] by whatever means possible to conpete in mediterranean markets. = और भूमध्यसागरीय बाज़ारों में प्रतिस्पर्धा करने के लिए आपको हर संभव तरीके से पर्याप्त [Pearl] प्राप्त करने की आवश्यकता है।
Trade with North African Civilization! = उत्तरी अफ़्रीकी सभ्यता के साथ व्यापार करें!
Estabilish the [Incense] trade on the national level will encourge trade relation between our lower classes. And these egyptians are dubiously never lacking on wheats... For whatever reason. = राष्ट्रीय स्तर पर [Incense] व्यापार स्थापित करने से हमारे निचले वर्गों के बीच व्यापारिक संबंधों को बढ़ावा मिलेगा। और ये मिस्रवासी संदिग्ध रूप से कभी गेहूँ की कमी से नहीं जूझते... चाहे कारण कुछ भी हो।
We can give them some good quality copper... wait, they also have that? = हम उन्हें कुछ अच्छी गुणवत्ता वाला तांबा दे सकते हैं... रुकिए, क्या वह भी उनके पास है?
In Emperors and Deities, Trading luxuries increases output of certain ['Economic Building']s as oppose to increasing [Happiness]. = Emperors and Deities में, विलासिता की वस्तुओं का व्यापार [Happiness] बढ़ाने के बजाय कुछ ['Economic Building']s के उत्पादन को बढ़ाता है।
Build [6] [Town Hall]s! = [6] [Town Hall]s बनाएँ!
Nothing Encourages Unity more than the promise of giving land! = भूमि देने के वादे से बढ़कर एकता को प्रोत्साहित करने वाला और कुछ नहीं है!
Explore and improve more than 10 units of [Horse]! = 10 से अधिक [Horse] इकाइयों का अन्वेषण और सुधार करें!
A tile north of [Nippur] has [4] [Horse]! You may find more horses in the north eastern mountain ranges. = [Nippur] के उत्तर में एक खंड में [4] [Horse] हैं! आपको पूर्वोत्तर पर्वत श्रृंखलाओं में और अधिक घोड़े मिल सकते हैं।
Mission List = अभियान सूची

Well this tip is gonna appear every turn to annoy you out of playing the wrong civ. Maybe in the future Egypt will be playable in this scenario but the map isnt made for them. = खैर, यह सुझाव हर मोड़ पर आपको गलत सभ्यता खेलने से रोकने के लिए परेशान करने हेतु दिखाई देगा। शायद भविष्य में इस परिदृश्य में मिस्र खेलने योग्य हो, लेकिन नक्शा उनके लिए नहीं बना है।
Nope Nope Nope. = नहीं, नहीं, नहीं।
Hey, choose [Central and West Asia] for this scenario! = अरे, इस परिदृश्य के लिए [Central and West Asia] चुनें!
Spark of Civilization: Wrong Civilization = सभ्यता की चिंगारी: गलत सभ्यता

Welcome to the Emperors and Deities mod. \nOne of the biggest unciv ruleset. \nAlthough the content of the mod is vast, the story takes place in roughly the same place as the original civilization series. Namely the Journey of Humanity. \nThe mod greatly expands the technological progess, element of customization and many other aspects of civ. It is going to be a bumpy ride so strap in. = Emperors and Deities मॉड में आपका स्वागत है। \nसबसे बड़े Unciv नियम-समूहों में से एक। \nयद्यपि मॉड की सामग्री विशाल है, कहानी लगभग उसी स्थान पर घटित होती है जहाँ मूल Civilization शृंखला घटित होती है, अर्थात् मानवता की यात्रा। \nयह मॉड तकनीकी प्रगति, अनुकूलन के तत्वों और सभ्यता के कई अन्य पहलुओं को बहुत विस्तारित करता है। यह एक उबड़-खाबड़ यात्रा होने वाली है, इसलिए कमर कस लें।
Start the Tutorial = ट्यूटोरियल शुरू करें
Dont forget to check civilipedia if you are in need of understanding certain mechanics. = यदि आपको कुछ यांत्रिकी समझने की आवश्यकता हो तो civilopedia जाँचना न भूलें।
Mesopotamia, Spark of Civilization, 4000BCE = मेसोपोटामिया, सभ्यता की चिंगारी, 4000 ईसा पूर्व

You have the city of Uruk under your control as the center of your civilization. \nIt controls some lands which provides food and trade. Which abstracts into gold production. \nIn the city, there are populations, which includes the people working on the lands. = उरुक नगर आपके नियंत्रण में है, आपकी सभ्यता के केंद्र के रूप में। \nयह कुछ भूमि पर नियंत्रण रखता है जो भोजन और व्यापार प्रदान करती है, जो अमूर्त रूप से सोने के उत्पादन में बदल जाता है। \nनगर में आबादी है, जिसमें भूमि पर काम करने वाले लोग शामिल हैं।
Whats my job? = मेरा काम क्या है?
Your job in every game is to send [Settler]s, build cities and manage them along with a bunch of units. That is the most basic gameplay that civilization series has to offer. However, Emperors and Deities brings more outside factors to this gameplay. = हर खेल में आपका काम है [Settler]s भेजना, शहर बसाना और कई इकाइयों के साथ उनका प्रबंधन करना। यह सभ्यता शृंखला का सबसे बुनियादी गेमप्ले है। लेकिन, Emperors and Deities इस गेमप्ले में और बाहरी कारक लाता है।
----- = -----
In this mission you need to build a [Foundry] to jump start the production of bronze to boost your city's [Production]. Afterwhich is another new mission. And so on and so fourth, if you are able to complete all missions thats labeled as main quests, you will win this scenario. = इस मिशन में आपको कांसे के उत्पादन की शुरुआत करने के लिए एक [Foundry] बनाना होगा ताकि आपके शहर की [Production] बढ़े। उसके बाद एक और नया मिशन है। और इसी तरह आगे; यदि आप मुख्य खोजों के रूप में चिह्नित सभी मिशन पूरे कर लेते हैं, तो आप यह परिदृश्य जीत जाएँगे।
New Main Quest: Into The Bronze Age, 4000BCE = नई मुख्य खोज: कांस्य युग में, 4000 ई.पू.

With the increase of productivity, population grows, and risk of over population forced some people to set off to new lands. = उत्पादकता बढ़ने से आबादी बढ़ती है, और अधिक जनसंख्या के जोखिम ने कुछ लोगों को नई भूमि की ओर निकलने पर विवश किया।
I wonder if they would stay by our side... = मैं सोचता हूँ कि क्या वे हमारे साथ रहेंगे...
[Settler] Units can create new cities, which is absolutely essential for expanding. Every new city settled is a new production line of unit and buildings. = [Settler] इकाइयाँ नए शहर बसा सकती हैं, जो विस्तार के लिए बिल्कुल आवश्यक है। हर नया बसा शहर इकाइयों और इमारतों की एक नई उत्पादन शृंखला है।
As for how loyal would they be? Well, the game doesnt allow them to rebel. However, new cities will take a big chunk of happiness away from you since the governing body of your civilization have to diverge their power. = वे कितने वफ़ादार होंगे? खैर, खेल उन्हें विद्रोह करने की अनुमति नहीं देता। हालाँकि, नए शहर आपकी बहुत सारी खुशी छीन लेंगे, क्योंकि आपकी सभ्यता के शासक निकाय को अपनी शक्ति बाँटनी पड़ती है।
Low happiness can wreck havoc on unsuspecting civilizations as they decrease [Influence] and make negative events occur more often. = कम खुशी अनजान सभ्यताओं पर कहर बरपा सकती है, क्योंकि यह [Influence] घटाती है और नकारात्मक घटनाओं को अधिक बार होने देती है।
ALSO, LUXURY DOESNT PROVIDE HAPPINESS NATURALLY IN THIS MOD. = और, इस मॉड में विलासिता की वस्तुएँ स्वाभाविक रूप से खुशी नहीं देतीं।
Quest Reward: Into The Bronze Age, 4000BCE = खोज का पुरस्कार: कांस्य युग में, 4000 ई.पू.

A brilliant Semitic leader named Sargon has risen in the north. His military innovations and administrative talent promise to unite all of Mesopotamia. This is not a threat but an opportunity. Will you embrace unity or preserve the old city-states? = सरगोन नामक एक प्रतिभाशाली सेमिटिक नेता उत्तर में उभरा है। उसके सैन्य नवाचार और प्रशासनिक प्रतिभा पूरे मेसोपोटामिया को एकजुट करने का वादा करते हैं। यह खतरा नहीं, बल्कि एक अवसर है। क्या आप एकता अपनाएँगे या पुराने नगर-राज्यों को बनाए रखेंगे?
An Empire rises before my eyes! = मेरी आँखों के सामने एक साम्राज्य उभर रहा है!
The united realm will share knowledge and resources. = एकजुट राज्य ज्ञान और संसाधन साझा करेगा।
Maintain the independence of city-states! = नगर-राज्यों की स्वतंत्रता बनाए रखो!
Sargon fails at his mission. The cities remain separate but cooperate through trade and mutual defense. Or not? = सरगोन अपने मिशन में असफल रहता है। शहर अलग रहते हैं लेकिन व्यापार और आपसी रक्षा के माध्यम से सहयोग करते हैं। या नहीं?
Sargon's Reign, 2334BCE = सरगोन का शासन, 2334 ई.पू.

Whether through alliance or federation, the time has come to formalize the political structure of your civilization. Use the [Enact Policies] decision in your capital to consolidate your rule. If you have enough Influence, you can declare a unified empire. This will unlock new government bonuses and prepare you for future challenges. = चाहे गठबंधन से हो या संघ से, अब समय आ गया है कि आप अपनी सभ्यता की राजनीतिक संरचना को औपचारिक रूप दें। अपने शासन को मजबूत करने के लिए अपनी राजधानी में [Enact Policies] निर्णय का उपयोग करें। यदि आपके पास पर्याप्त प्रभाव है, तो आप एक एकीकृत साम्राज्य घोषित कर सकते हैं। इससे नए सरकारी बोनस खुलेंगे और आप भविष्य की चुनौतियों के लिए तैयार होंगे।
How do I unify? = मैं एकीकरण कैसे करूँ?
Open the city screen of your capital, find the [Enact Policies] building, and choose the option 'We are able to unify ourselves!' when you have at least half of your Influence Limit. = अपनी राजधानी का शहर स्क्रीन खोलें, [Enact Policies] इमारत ढूँढ़ें, और जब आपके पास अपनी प्रभाव सीमा का कम से कम आधा हो तो 'हम स्वयं को एकजुट करने में सक्षम हैं!' विकल्प चुनें।
New Main Quest: Unify Mesopotamia, 2200BCE = नई मुख्य खोज: मेसोपोटामिया को एकजुट करें, 2200 ई.पू.

And so, the mesopotamian became the soverign owner of their own region. The legacy of Sargon will last. = और इस प्रकार, मेसोपोटामिया के लोग अपने ही क्षेत्र के संप्रभु स्वामी बन गए। सरगोन की विरासत कायम रहेगी।
United and Stronger than ever. = एकजुट और पहले से कहीं अधिक मजबूत।
Quest Reward: Unify Mesopotamia, 2200BCE = खोज का पुरस्कार: मेसोपोटामिया को एकजुट करें, 2200 ई.पू.

You have declined the offer of unification, which is an interesting choice. However, there is always another way to strengthen your civilization's unity. = आपने एकीकरण के प्रस्ताव को अस्वीकार कर दिया, जो एक दिलचस्प विकल्प है। हालाँकि, आपकी सभ्यता की एकता को मजबूत करने का हमेशा कोई और रास्ता होता है।
A pantheon? Or something greater... = एक देवमंडल? या उससे भी महान कुछ...
Choose between the [Polytheism] or [Monotheism], besides a unifying government that grants powerful uniques, you can also build a religion that outlive it. = [Polytheism] या [Monotheism] में से चुनें; एक एकजुट करने वाली सरकार के अलावा जो शक्तिशाली विशिष्टताएँ देती है, आप एक ऐसा धर्म भी बना सकते हैं जो उससे अधिक समय तक टिके।
New Main Quest: A House Divided, 2200BCE = नई मुख्य खोज: एक विभाजित घर, 2200 ई.पू.

And so, although history's tide changes, a long lasting faith system starts spreading along with all the glory of the west asian civilization = और इस प्रकार, यद्यपि इतिहास की धारा बदलती है, एक लंबे समय तक टिकने वाली आस्था प्रणाली पश्चिमी एशियाई सभ्यता के समस्त वैभव के साथ फैलने लगती है
Interesting = दिलचस्प
Quest Reward: A House Divided, 2200BCE = खोज का पुरस्कार: एक विभाजित घर, 2200 ई.पू.

The Wheel of history turns its tide, the empire of akkad didnt last. But the west asian civilization is now going through an era of prosperity, complete 4 side quests and \n Prepare for the inevitable. = इतिहास का पहिया अपनी धारा बदलता है, अक्काद का साम्राज्य टिक नहीं पाया। लेकिन पश्चिमी एशियाई सभ्यता अब समृद्धि के युग से गुजर रही है; 4 सहायक खोजें पूरी करें और \n अपरिहार्य के लिए तैयार रहें।
You may check the list of available side quests by [Check Mission List] in capital. = आप राजधानी में [Check Mission List] द्वारा उपलब्ध सहायक खोजों की सूची देख सकते हैं।
New Main Quest: The Old Babylon, 1900BCE = नई मुख्य खोज: पुराना बेबीलोन, 1900 ई.पू.

You have built a nation of prosperity, now its time for durability test. = आपने समृद्धि का एक राष्ट्र बनाया है; अब टिकाऊपन की परीक्षा का समय है।
What are you talking about? = आप किस बारे में बात कर रहे हैं?
Quest Reward: The Old Babylon, 1900BCE = खोज का पुरस्कार: पुराना बेबीलोन, 1900 ई.पू.

For whatever reason, a volcano event far far away has triggered an agricultural disaster across the entire ancient world.\nOld order is crumbling. Civilizations across the eastern Mediterranean are falling to famine, rebellion, and the loss of trade routes. But here in Mesopotamia, your leadership will determine whether our light fades or endures. Over the next 15 turns, you will face a series of crises. Each requires wise use of Influence and Gold. = जो भी कारण हो, बहुत दूर हुई एक ज्वालामुखी घटना ने पूरे प्राचीन विश्व में कृषि आपदा उत्पन्न कर दी है।\nपुरानी व्यवस्था ढह रही है। पूर्वी भूमध्यसागर की सभ्यताएँ अकाल, विद्रोह और व्यापार मार्गों के नुकसान से गिर रही हैं। लेकिन यहाँ मेसोपोटामिया में, आपका नेतृत्व तय करेगा कि हमारा प्रकाश धुंधला होता है या बना रहता है। अगले 15 मोड़ों में, आपको संकटों की एक शृंखला का सामना करना पड़ेगा। हर एक में प्रभाव और सोने के विवेकपूर्ण उपयोग की आवश्यकता है।
What must I do? = मुझे क्या करना चाहिए?
Over the following turns, disasters will strike: drought, civil unrest, economic collapse. Use the [Influence], [Enact Policies] and your stored resources to mitigate them. Survive all 15 turns to complete the tutorial and unlock a special reward. = अगले मोड़ों के दौरान, आपदाएँ आएँगी: सूखा, नागरिक अशांति, आर्थिक पतन। उन्हें कम करने के लिए [Influence], [Enact Policies] और अपने संचित संसाधनों का उपयोग करें। ट्यूटोरियल पूरा करने और एक विशेष पुरस्कार खोलने के लिए पूरे 15 मोड़ों तक जीवित रहें।
New Main Quest: Survive the Bronze Age Collapse, 1200BCE = नई मुख्य खोज: कांस्य युग के पतन से बचें, 1200 ई.पू.

You have completed a side quest! This glorious deed will be recorded in the global history. = आपने एक सहायक खोज पूरी कर ली है! यह गौरवशाली कार्य वैश्विक इतिहास में दर्ज किया जाएगा।
Our story continues! = हमारी कहानी जारी है!
Side Quest Completion = सहायक खोज पूर्ण

The harvest has failed. Food stores are empty, and people are beginning to starve. Entire villages started to escape for survival. = फ़सल विफल हो गई है। अन्न भंडार खाली हैं, और लोग भूखे मरने लगे हैं। पूरे गाँव जीवित रहने के लिए भागने लगे।
Distribute emergency grain = आपातकालीन अनाज वितरित करें
The granaries opened. Providing much needed food sourced from both emergency storage and grains bought in a hurry... for now. = अन्न भंडार खुल गए। आपातकालीन भंडार और जल्दी में खरीदे गए अनाज दोनों से प्राप्त अत्यंत आवश्यक भोजन उपलब्ध कराया... फ़िलहाल के लिए।
Import Grains from Egypt = मिस्र से अनाज आयात करें
Although Egypt also suffers from this horrible disaster. You managed to maintain a desperate alliance between the civilizations and kept the people fed. = हालाँकि मिस्र भी इस भयानक आपदा से पीड़ित है। आप सभ्यताओं के बीच एक हताश गठबंधन बनाए रखने में सफल रहे और लोगों को भोजन मिलता रहा।
... = ...
The granaries are emptied! They were already sold by greedy nobles and merchants who also directed the hatred to the leader! = अन्न भंडार खाली हो गए हैं! उन्हें पहले ही लालची कुलीनों और व्यापारियों ने बेच दिया था, जिन्होंने नफ़रत को नेता की ओर भी मोड़ दिया!
Drought and Famine = सूखा और अकाल

Ambitious nobilities stopped their pursuit of expansion due to the disaster, however that only lead them into power struggle with each others, with the worsening global starvation, the Barbarians are invading as well. = महत्वाकांक्षी कुलीनों ने आपदा के कारण विस्तार की अपनी कोशिश रोक दी; हालाँकि, इसने उन्हें केवल आपसी सत्ता संघर्ष में धकेल दिया। वैश्विक भुखमरी के बिगड़ने के साथ, बर्बर लोग भी आक्रमण कर रहे हैं।
We must do something about it! = हमें इसके बारे में कुछ करना होगा!
Tighten the Rulership. The amount of [Town Hall]s will lessen the rebellions. = शासन को कड़ा करें। [Town Hall] की संख्या विद्रोहों को कम करेगी।
Let them come! = उन्हें आने दो!
Certainly, you have an army, why not use them? = निश्चय ही, आपके पास सेना है; उसका उपयोग क्यों न करें?
Usurpers and Barbarians = सत्ता हड़पने वाले और बर्बर

The tin routes from distant lands have been severely impacted by the disaster. Without metals, your artisans cannot produce bronze weapons or tools. Production slows across the empire. = दूर देशों से आने वाले टिन के मार्ग आपदा से बुरी तरह प्रभावित हुए हैं। धातुओं के बिना, आपके कारीगर कांसे के हथियार या औज़ार नहीं बना सकते। पूरे साम्राज्य में उत्पादन धीमा पड़ गया है।
Fix the route then. = तो फिर मार्ग ठीक करो।
Because you have done the related side quest. You have enough [Pearl]s to buy up all the remaining tins on the market! If you can still call it a market. = क्योंकि आपने संबंधित सहायक खोज पूरी कर ली है। आपके पास बाज़ार में बचा सारा टिन खरीदने के लिए पर्याप्त [Pearl] हैं! यदि उसे अब भी बाज़ार कहा जा सके।
Try to ration the material! = सामग्री का राशन करने की कोशिश करें!
A correct call. = एक सही निर्णय।
Encourage local alternatives. = स्थानीय विकल्पों को प्रोत्साहित करें।
Downgrading the tool to pure copper, stone and bone is the desperate, but essential move. = औज़ारों को शुद्ध ताँबे, पत्थर और हड्डी में बदल देना एक हताश, परंतु आवश्यक कदम है।
Trade Collapse = व्यापार का पतन

Scribes are fleeing the cities to avoid conscription and taxes. The art of writing is being forgotten. Your scientific progress halts. = मुंशी भर्ती और करों से बचने के लिए शहरों से भाग रहे हैं। लेखन की कला भुलाई जा रही है। आपकी वैज्ञानिक प्रगति रुक जाती है।
Reward those who stayed. Punish those who fleed. = जो रुके रहे उन्हें पुरस्कृत करो। जो भाग गए उन्हें दंडित करो।
Maintaining the order. = व्यवस्था बनाए रखना।
We have [The Great Library] = हमारे पास [The Great Library] है
Well. We always have backups in the royal library. = खैर। शाही पुस्तकालय में हमारे पास हमेशा बैकअप होता है।
Without scribes, records are lost. Generations of knowledges are lost to time. = मुंशियों के बिना, अभिलेख खो जाते हैं। पीढ़ियों का ज्ञान समय के साथ खो जाता है।
Loss of Writing = लेखन की हानि

It is appearent that the gods are angry that such a disaster has struck... The priests are recieveing a lot of backlash because of this. And the power structure of the entire region has been weakened = यह स्पष्ट है कि ऐसी आपदा आने से देवता क्रोधित हैं... इसके कारण पुजारियों को भारी विरोध झेलना पड़ रहा है। और पूरे क्षेत्र की सत्ता संरचना कमजोर हो गई है
Trample the heretic! = विधर्मी को कुचल दो!
Change [Hanging Gardens] to a site of worship and force the priests to pray to the god of fertility = [Hanging Gardens] को उपासना स्थल में बदलें और पुजारियों को उर्वरता के देवता से प्रार्थना करने के लिए बाध्य करें
