ED - Expansions, Consolidation and Modernization = ED - विस्तार, समेकन और आधुनिकीकरण
City development is organized into three tiers of building packages: "Expansion", "Consolidation", and "Modernization". = शहर विकास को भवन पैकेजों के तीन स्तरों में व्यवस्थित किया गया है: "विस्तार", "समेकन" और "आधुनिकीकरण"।
How packages work: Each package lets you build multiple related buildings at once, saving [stat] and ensuring that development becomes easier with tech investment. Packages become available as you progress through eras. For example, [buildingFilter] builds [buildingFilter2], [buildingFilter3], and [buildingFilter4] together and is unlocked by [tech]. = पैकेज कैसे काम करते हैं: प्रत्येक पैकेज आपको कई संबंधित भवन एक साथ बनाने देता है, जिससे [stat] बचता है और यह सुनिश्चित होता है कि तकनीक निवेश से विकास आसान हो जाता है। युगों में आगे बढ़ने के साथ पैकेज उपलब्ध होते जाते हैं। उदाहरण के लिए, [buildingFilter] [buildingFilter2], [buildingFilter3] और [buildingFilter4] को एक साथ बनाता है और [tech] द्वारा अनलॉक होता है।
"Expansion": \nCovers basic buildings which form the foundation of any town. Which are mostly unlocked before [buildingFilter] = "विस्तार": \nउन बुनियादी भवनों को शामिल करता है जो किसी भी कस्बे की नींव बनाते हैं। अधिकतर [buildingFilter] से पहले अनलॉक होते हैं
"Consolidation" \nCovers buildings that forms a proper city and make it useful. Which are mostly unlocked starting from [buildingFilter] and before [buildingFilter2]. = "समेकन" \nउन भवनों को शामिल करता है जो एक उचित शहर बनाते हैं और उसे उपयोगी बनाते हैं। अधिकतर [buildingFilter] से शुरू होकर [buildingFilter2] से पहले अनलॉक होते हैं।
"Modernization" \nCovers buildings that makes a city that is considered modernized. Which are mostly unlocked starting from [buildingFilter]. You wouldn't live without them in real life. = "आधुनिकीकरण" \nउन भवनों को शामिल करता है जो एक शहर को आधुनिक माना जाने योग्य बनाते हैं। अधिकतर [buildingFilter] से शुरू होकर अनलॉक होते हैं। वास्तविक जीवन में आप उनके बिना नहीं रह सकते।

