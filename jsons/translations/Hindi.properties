ED - Starting Tips & Where to Settle = ED - आरंभिक सुझाव और बसने का स्थान
When starting a new game, remember to switch to Neolithic Era if you want to build your civ from the ground up. Since Unciv defaults to Ancient Era, you might lose some content there or find some progress you didn't intend to have, like government forms being different. = नया खेल शुरू करते समय, यदि आप अपनी सभ्यता को बिल्कुल शुरुआत से बनाना चाहते हैं तो नवपाषाण युग में बदलना याद रखें। चूँकि Unciv डिफ़ॉल्ट रूप से प्राचीन युग से शुरू होता है, आप वहाँ कुछ सामग्री खो सकते हैं या कुछ ऐसी प्रगति पा सकते हैं जो आप नहीं चाहते थे, जैसे कि सरकार के स्वरूप का भिन्न होना।
When starting a new game in Neolithic Era or Ancient Era, you would likely have two types of units: [unit]s and [unit2]s. = नवपाषाण युग या प्राचीन युग में नया खेल शुरू करते समय, संभवतः आपके पास दो प्रकार की इकाइयाँ होंगी: [unit]s और [unit2]s।
The major difference between Civ 5/Unciv and this mod is that your starting unit, the [unit], is not only a ranged unit but also a worker that can build [improvementName]s, [improvementName2]s, and [improvementName3]s. However, it cannot upgrade to other units. They represent humanity's earliest endeavor at building civilizations. = Civ 5/Unciv और इस mod के बीच मुख्य अंतर यह है कि आपकी आरंभिक इकाई, [unit], न केवल एक दूरस्थ इकाई है बल्कि एक श्रमिक भी है जो [improvementName]s, [improvementName2]s और [improvementName3]s का निर्माण कर सकती है। हालाँकि, यह अन्य इकाइयों में उन्नत नहीं हो सकती। वे सभ्यताओं के निर्माण में मानवता के सबसे प्रारंभिक प्रयास का प्रतिनिधित्व करती हैं।
As for [unit]s, there are no major differences, but note that settling near [tileFilter]s gives 2 extra [stat] and an extra 1 [stat2] near [tileFilter2]. These don't stack but provide a strong starting bonus for your cities. = जहाँ तक [unit]s का सवाल है, कोई बड़ा अंतर नहीं है, लेकिन ध्यान दें कि [tileFilter]s के पास बसने से 2 अतिरिक्त [stat] और [tileFilter2] के पास 1 अतिरिक्त [stat2] मिलता है। ये एकत्रित नहीं होते लेकिन आपके शहरों के लिए एक मज़बूत आरंभिक बोनस प्रदान करते हैं।
