Government forms like [buildingFilter] and [buildingFilter2] are the first examples of government forms you might encounter. = [buildingFilter] और [buildingFilter2] जैसे सरकार के स्वरूप, सरकार के स्वरूपों के पहले उदाहरण हैं जिनका सामना आप कर सकते हैं।
A government form provides army limits like [resource], [resource2]s, and unique bonuses. For [buildingFilter], it's a discount for policies. For [buildingFilter2], it's a growth bonus and a chance to evolve into [buildingFilter3] in the Ancient Era through reforms. = सरकार का एक स्वरूप [resource], [resource2]s जैसी सेना सीमाएँ और अनूठे बोनस प्रदान करता है। [buildingFilter] के लिए, यह नीतियों पर छूट है। [buildingFilter2] के लिए, यह विकास बोनस और सुधारों के माध्यम से प्राचीन युग में [buildingFilter3] में विकसित होने का अवसर है।
There are two types of government forms: [buildingFilter] and [buildingFilter2]. [buildingFilter3] government forms have cheaper National Wonders, access to all diplomatic actions, and powerful uniques. Many historically significant empires belong to this category, like [buildingFilter4] and [buildingFilter5]. = सरकार के स्वरूप दो प्रकार के होते हैं: [buildingFilter] और [buildingFilter2]। [buildingFilter3] सरकार के स्वरूपों में सस्ते राष्ट्रीय आश्चर्य, सभी कूटनीतिक कार्यों तक पहुँच और शक्तिशाली अनूठे गुण होते हैं। कई ऐतिहासिक रूप से महत्वपूर्ण साम्राज्य इसी श्रेणी में आते हैं, जैसे [buildingFilter4] और [buildingFilter5]।
On the other hand, it doesn't mean [buildingFilter] government forms are definitely weaker. They fit into their own niche by having cheaper policy costs, access to [buildingFilter2] via [buildingFilter3], and generally taking less effort to maintain. = दूसरी ओर, इसका अर्थ यह नहीं है कि [buildingFilter] सरकार के स्वरूप निश्चित रूप से कमज़ोर हैं। सस्ती नीति लागत, [buildingFilter3] के माध्यम से [buildingFilter2] तक पहुँच और आम तौर पर बनाए रखने में कम प्रयास के कारण वे अपने विशेष स्थान में फिट होते हैं।
