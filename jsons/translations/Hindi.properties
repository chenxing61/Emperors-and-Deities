Unlocks [Great Khan], [Great Commander] replacement that has increased buff range at cost of less strength buff, can trigger golden age. = [Great Khan] को अनलॉक करता है, [Great Commander] का प्रतिस्थापन जिसकी बोनस सीमा अधिक है लेकिन शक्ति बोनस कम है, और जो स्वर्ण युग शुरू कर सकता है।
An transformation of [Nomadic Tribes] that allows you to spend influence to gain [Great Khan]s and gain building speed back for a few turns. = [Nomadic Tribes] का एक रूपांतरण जो आपको कुछ मोड़ों के लिए [Great Khan]s प्राप्त करने और निर्माण गति वापस पाने के लिए प्रभाव खर्च करने की अनुमति देता है।
Allow you to gain [Settlement Process] and settle down. Leaving Nomadic Life Style behind and inherit its legacy. = आपको [Settlement Process] प्राप्त करने और बस जाने की अनुमति देता है। खानाबदोश जीवन शैली को पीछे छोड़कर उसकी विरासत को अपनाना।
Upon reaching (20 + 5 x No. of Cities) amount of [Settlement Process]. You can transform your civilization into a sedimentary civilization, which plays like any other civilization. You can intentionally expand more to lengthen this process. = (20 + 5 x शहरों की संख्या) मात्रा का [Settlement Process] पहुँचने पर, आप अपनी सभ्यता को एक स्थायी सभ्यता में बदल सकते हैं, जो किसी भी अन्य सभ्यता की तरह खेलती है। इस प्रक्रिया को लंबा करने के लिए आप जान-बूझकर अधिक विस्तार कर सकते हैं।

