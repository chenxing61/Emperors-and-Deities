ED - Stability and Events = ED - स्थिरता और घटनाएँ
The original Unciv/Civ 5 offers a flat debuff when the empire is unhappy, but Emperors and Deities turned the flat debuff into instability and negative events. Negative events often interact with variables like the number of cities or what Era you are in. To cure the debuff from them, you can check out options in [buildingFilter] or in the building tab. = मूल Unciv/Civ 5 साम्राज्य के असंतुष्ट होने पर एक स्थिर debuff देता है, लेकिन Emperors and Deities ने उस स्थिर debuff को अस्थिरता और नकारात्मक घटनाओं में बदल दिया। नकारात्मक घटनाएँ अक्सर शहरों की संख्या या आप किस युग में हैं जैसे चरों से संबंधित होती हैं। उनसे होने वाले debuff को ठीक करने के लिए, आप [buildingFilter] या भवन टैब में विकल्प देख सकते हैं।
[param] is an event that lowers your stability. It occurs if you are lacking [stat] (going negative). It also occurs more frequently in [buildingFilter] states. You will need to choose between spending some [resource] and [stat2] to prevent it or having your stability lowered. This disables some abilities like building workers when you are in a state of [buildingFilter2]. = [param] एक ऐसी घटना है जो आपकी स्थिरता को कम करती है। यह तब घटित होती है जब आपके पास [stat] की कमी हो (ऋणात्मक हो जाए)। यह [buildingFilter] अवस्थाओं में अधिक बार घटित होती है। आपको इसे रोकने के लिए कुछ [resource] और [stat2] खर्च करने या अपनी स्थिरता घटने देने के बीच चयन करना होगा। यह कुछ क्षमताओं को अक्षम कर देता है, जैसे कि जब आप [buildingFilter2] की अवस्था में हों तो श्रमिकों का निर्माण करना।
To keep [param] from occurring, you will need to keep your [stat] and [resource] higher than normal, which is not ideal. So it is a risk you will always face. Remember to always keep some spare [stat2] and [resource2]. = [param] को घटित होने से रोकने के लिए, आपको अपने [stat] और [resource] को सामान्य से अधिक बनाए रखना होगा, जो आदर्श नहीं है। इसलिए यह एक जोखिम है जिसका सामना आपको हमेशा करना पड़ेगा। हमेशा कुछ अतिरिक्त [stat2] और [resource2] रखना याद रखें।
[param], [param2], and [param3] are events that only occur when you are lacking [stat]. They may apply debuffs to all the cities you own, which can be a nightmare to deal with. = [param], [param2] और [param3] ऐसी घटनाएँ हैं जो केवल तब घटित होती हैं जब आपके पास [stat] की कमी हो। वे आपके स्वामित्व वाले सभी शहरों पर debuff लागू कर सकती हैं, जिससे निपटना एक बुरा सपना हो सकता है।
Luckily, you can use your capital to deal with them. Unluckily, your capitals are limited, so do what you can to prevent the lack of [stat]. = सौभाग्य से, आप उनसे निपटने के लिए अपनी पूँजी का उपयोग कर सकते हैं। दुर्भाग्य से, आपकी पूँजी सीमित है, इसलिए [stat] की कमी को रोकने के लिए जो हो सके वह करें।
The Events Listed Above are only examples of what could be possible. But remember, when a event occur, as long as you have enough [resource] and [stat] as safety net, you will endure. And there are even sometimes benefits from the negative events. = ऊपर सूचीबद्ध घटनाएँ केवल उदाहरण हैं कि क्या संभव हो सकता है। लेकिन याद रखें, जब कोई घटना घटती है, तब तक आपके पास सुरक्षा कवच के रूप में पर्याप्त [resource] और [stat] हों, आप सहन कर लेंगे। और कभी-कभी नकारात्मक घटनाओं से लाभ भी होता है।
