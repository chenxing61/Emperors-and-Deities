In this decision tab, different actions are unlocked based on to how many [Influence] you have and how many unique action your civilization state has provided you with. = Neste separador de decisões, diferentes ações são desbloqueadas com base na quantidade de [Influence] que tens e em quantas ações únicas o estado da tua civilização te proporcionou.
In each era, you recieve a [Forced Shift In Politic Chance], and when you have more [Influence] than your limit in this era, you can trigger a Shift In Politic in this tab early to provide you with either a chance to unify or a chance to collapse, this grants you freedom on choices of ['Civilization State']. = Em cada era, recebes uma [Forced Shift In Politic Chance] e, quando tens mais [Influence] do que o teu limite nesta era, podes desencadear antecipadamente uma mudança política neste separador, dando-te a oportunidade de unificar ou de colapsar; isto concede-te liberdade na escolha de ['Civilization State'].
Most option will appear when you are unified or have more [Influence] than half of your limit. At the same time, some options only appear when your civilization are divided or have severe debuffs. This tab will help you solve them. = A maioria das opções aparecerá quando estiveres unificado ou tiveres mais [Influence] do que metade do teu limite. Ao mesmo tempo, algumas opções só aparecem quando a tua civilização está dividida ou tem penalizações graves. Este separador ajudar-te-á a resolvê-las.
Total mobilization in all city! = Mobilização total em todas as cidades!
This Decision will instruct all the city to mobilise its [The Levied Army] unit, regardless of the size of city. Usually you need at least 5 Population to [Call to Arms]. = Esta decisão instruirá todas as cidades a mobilizarem a sua unidade [The Levied Army], independentemente do tamanho da cidade. Normalmente precisas de pelo menos 5 de População para [Call to Arms].
By the merit of being [United], the negative [Happiness] from [Call to Arms] is also lessened. For a short amount of time. = Graças a estarmos [United], a [Happiness] negativa do [Call to Arms] também é reduzida. Durante um curto período.
Disband all Levies. = Dissolver todas as Levas.
After Conflict dies down, we may disband our [The Levied Army] units to eliminate negative effects from [Call to Arms]. = Depois de o conflito acalmar, podemos dissolver as nossas unidades [The Levied Army] para eliminar os efeitos negativos do [Call to Arms].
Increase [Influence] through different means. = Aumentar o [Influence] através de diferentes meios.
Increase/Decrease Cultural Diversity through different means. = Aumentar/diminuir a Diversidade Cultural através de diferentes meios.
Spread our [Influence] to city states. = Espalhar o nosso [Influence] pelas cidades-estado.
Costs 1 [Influence] per turn, maintain your diplomatic efforts in city states. = Custa 1 [Influence] por turno; mantém os teus esforços diplomáticos nas cidades-estado.
Costs 1 extra [Influence] per turn starting from Imperial era. = Custa 1 [Influence] adicional por turno a partir da era Imperial.
Stop Spreading our [Influence] to city states. = Parar de espalhar o nosso [Influence] pelas cidades-estado.
Build Agreements (Divided Government Form Special Action) = Estabelecer Acordos (Ação Especial da Forma de Governo Dividida)
Tho our civilization is divided, we are not weak. = Embora a nossa civilização esteja dividida, não somos fracos.
Build Agreements (Personal Union Form Special Action) = Estabelecer Acordos (Ação Especial da Forma de União Pessoal)
Commonwealth needs futher cooperation. = A Comunidade precisa de mais cooperação.
Adoption of European Cultures ([Europa] Special Action) = Adoção das Culturas Europeias (Ação Especial [Europa])
Adoption of Schools of Thought ([Warring States] Special Action) = Adoção de Escolas de Pensamento (Ação Especial [Warring States])
Tribe Assembly ([Nomadic Culture] Special Action) = Assembleia Tribal (Ação Especial [Nomadic Culture])
One Step Above Peace. = Um Passo Acima da Paz.
Through costing [Faith] and [Gold], We may propell our civilization into a even more stable state. [Harmony]. = Através do custo de [Faith] e [Gold], podemos impulsionar a nossa civilização para um estado ainda mais estável: [Harmony].
Increasing Stability. = Aumentar a Estabilidade.
We must take action against the coming chaos. = Temos de agir contra o caos que se aproxima.
Crisis Solving = Resolução de Crises
A lot of our cities are in a horrible state. We should do what we can to save them. = Muitas das nossas cidades estão num estado horrível. Devemos fazer o que pudermos para as salvar.
Changing Economic Policies = Mudar as Políticas Económicas
If the current economic policies fail to meet the situation... = Se as atuais políticas económicas não se adequarem à situação...
Changing Civilization Form = Mudar a Forma da Civilização
If your [Influence] is somehow above your [Influence Limit]. You can trigger this. = Se o teu [Influence] estiver de alguma forma acima do teu [Influence Limit], podes desencadear isto.
We can force the shift in politic to stop our civilization from entering a undesireable route... = Podemos forçar a mudança política para impedir que a nossa civilização siga um rumo indesejável...
State Reform = Reforma do Estado
Social Reform = Reforma Social
Did you know that this mod has tutorial pages in civilopedia's tutorial section? = Sabias que este mod tem páginas de tutorial na secção de tutoriais da Civilopédia?
You may want to check them out. = Talvez queiras dar-lhes uma vista de olhos.
See also: ED - Tutorial Menu = Ver também: ED - Menu de Tutoriais
Actually...I was checking what I can do. = Na verdade... estava a ver o que posso fazer.
Nothing happens. = Nada acontece.

See that long list of Resource? You can cut it down a bit. = Estás a ver aquela longa lista de recursos? Podes encurtá-la um pouco.
Hide the essentials. = Ocultar os essenciais.
Including: = Incluindo:
[Influence], [Influence Limit], [Consumption Supply], [Consumption Demand],All the kinds of [Fuel]s, Victroy related resources and the Army Maintenances = [Influence], [Influence Limit], [Consumption Supply], [Consumption Demand], todos os tipos de [Fuel], os recursos relacionados com a vitória e as manutenções do exército
Show the essentials. = Mostrar os essenciais.
Hide the raw resources. = Ocultar os recursos em bruto.
[Horse], [Metal], [Alloy], [Oil] and so on. All the resource on the map or being the prerequisite of buildings and parts productions = [Horse], [Metal], [Alloy], [Oil] e por aí fora. Todos os recursos no mapa ou que sejam pré-requisitos de edifícios e da produção de peças
Show the raw resources. = Mostrar os recursos em bruto.
Hide those parts. = Ocultar essas peças.
[Weapon Parts], [Vehicle Parts], [Ship Parts] and so on and so fourth. = [Weapon Parts], [Vehicle Parts], [Ship Parts] e por aí em diante.
Show those parts. = Mostrar essas peças.
Hide those random stuffs. = Ocultar essas coisas aleatórias.
Show those random stuffs. = Mostrar essas coisas aleatórias.
Alright. = Está bem.
Hide Strategic Resources = Ocultar Recursos Estratégicos

The structure of our civilization changes to adapt to the time. What path shall we partake? = A estrutura da nossa civilização muda para se adaptar aos tempos. Que caminho devemos trilhar?
The most convenient way to change your government form is to let it naturally evolve. When each Era begins, you are forced to have a political shift where you must actively decide what state you want to enter: ['United'] or ['Divided']. = A forma mais conveniente de mudar a tua forma de governo é deixá-la evoluir naturalmente. Quando cada Era começa, és forçado a ter uma mudança política em que deves decidir ativamente em que estado queres entrar: ['United'] ou ['Divided'].
When your [Influence] is reaching over half of the [Influence Limit] without being in low stability, this enables you to unify your civilization = Quando o teu [Influence] ultrapassa metade do [Influence Limit] sem estares em baixa estabilidade, isto permite-te unificar a tua civilização
Your [Influence] will be reseted back to a certain point below [Influence Limit]. If you can successfully unify your civilization, you will have a lot of [Influence] starting off. = O teu [Influence] será reposto para um certo ponto abaixo do [Influence Limit]. Se conseguires unificar a tua civilização com sucesso, começarás com muito [Influence].
See also: ED - Government Forms = Ver também: ED - Formas de Governo
No significant changes = Sem alterações significativas
We are still a bunch of countries prone to infighting and invasion, but what we do have is countless oppotunities. = Ainda somos um conjunto de países propensos a lutas internas e a invasões, mas o que temos são inúmeras oportunidades.
Qin has collapsed! = Qin entrou em colapso!
We are able to unify ourselves! = Somos capazes de nos unificar!
The unification has been accomplished by the largest fish in the pond. We are now an unified political entity! = A unificação foi alcançada pelo peixe maior do lago. Somos agora uma entidade política unificada!
The empire of the past crumbles... = O império do passado desmorona-se...
Our unification cannot last onto another stage of the world. Maybe its ultimately for the better, as it was stale. = A nossa unificação não consegue perdurar para outra fase do mundo. Talvez seja, em última análise, para melhor, pois estava estagnada.
Our empire lasts onto another era! = O nosso império perdura até outra era!
Our empire survives... Maybe we can reform it continuesly unto forever. = O nosso império sobrevive... Talvez possamos reformá-lo continuamente até à eternidade.
Shift in Politic = Mudança política

If an empire is stale in upward mobility, political reform and other essential aspect, it would fall behind, and crumble to ash. = Se um império estiver estagnado na mobilidade social, na reforma política e noutros aspetos essenciais, ficará para trás e desfazer-se-á em cinzas.
With some reforms, our empire can adapt to new age without problems. = Com algumas reformas, o nosso império pode adaptar-se à nova era sem problemas.
Give up your unique civilization form and return to the generic line of unified civilization form. = Desiste da tua forma de civilização única e regressa à linha genérica da forma de civilização unificada.
Also, you might've ran out of unique government forms because there arent enough of them in the first place. = Além disso, podes ter ficado sem formas de governo únicas porque, para começar, não há suficientes delas.
We must prevail at preserving our root. = Temos de prevalecer na preservação das nossas raízes.
Keep your current special civilization form = Manter a tua forma de civilização especial atual
Our way of life must be protected. = O nosso modo de vida tem de ser protegido.
There needs to be an Emperor = Tem de haver um Imperador
Focus on Centrailizing Power Structure. = Focar na Centralização da Estrutura de Poder.
Our guiding philosophy has been painting a hopeful picture of our future, this reform will lead us closer to it. = A nossa filosofia orientadora tem pintado um retrato esperançoso do nosso futuro; esta reforma levar-nos-á mais perto dele.
Disperse The Power Structure. = Descentralizar a Estrutura de Poder.
We can use our new formed policy. = Podemos usar a nossa política recém-formada.
We shall dominate the Land! = Dominaremos a Terra!
Although our empire has stood tall, it would be more efficient if we take the new route... = Embora o nosso império se tenha mantido de pé, seria mais eficiente seguirmos a nova rota...
We shall dominate the Ocean! = Dominaremos o Oceano!
We will continue our empire's glory. = Continuaremos a glória do nosso império.
Maybe... having a consistent ruling family and succession law would be better. = Talvez... ter uma família governante consistente e uma lei de sucessão fosse melhor.
No avaliable options = Sem opções disponíveis
Yet. = Ainda não.
Reformation of the unified state = Reforma do estado unificado

As the society develops, the social structure of our civilization began to shift. = À medida que a sociedade se desenvolve, a estrutura social da nossa civilização começou a mudar.
Focus on expanding the faith = Focar na expansão da fé
Focus on empowering the leadership = Focar em fortalecer a liderança
Focus on civic advancement = Focar no avanço cívico
Focus on developing trade = Focar no desenvolvimento do comércio
Focus on mitigating incoming societal issue = Focar em mitigar a questão social iminente
This can avoid negative events that natrually occurs because of change of era, but if unhappiness presists, there are still risks of more negative events. = Isto pode evitar eventos negativos que ocorrem naturalmente devido à mudança de era, mas se a infelicidade persistir, ainda há riscos de mais eventos negativos.
Reformation of our society = Reforma da nossa sociedade

We will find ways to make our civilization thrive again! = Encontraremos maneiras de fazer a nossa civilização prosperar novamente!
Building a harmonious civilization is essential = Construir uma civilização harmoniosa é essencial
We can make it so that it takes more to unstablise our civilization = Podemos fazer com que seja mais difícil desestabilizar a nossa civilização
We must make haste before situation gets any worse = Temos de nos apressar antes que a situação piore ainda mais
By investing a vast amount of social-political capital, we can stablise the situation quickly. = Ao investir uma vasta quantidade de capital sociopolítico, podemos estabilizar rapidamente a situação.
Ruling a country requires patience and subtlety = Governar um país exige paciência e subtileza
By carefully planning the route back to normal, we can stablise the situation slowly. = Ao planear cuidadosamente o caminho de regresso à normalidade, podemos estabilizar lentamente a situação.
Can we wait? = Podemos esperar?
We need more contemplation... = Precisamos de mais ponderação...
Stablising our side of the globe = Estabilizar o nosso lado do globo

We must at least do something about the things happening in the cities. = Temos de, pelo menos, fazer algo quanto ao que está a acontecer nas cidades.
Kill the benefactors. = Matar os benfeitores.
Use the loyal army to slay all who dares to oppose our just ruiling! = Usar o exército leal para abater todos os que ousarem opor-se ao nosso justo governo!
Subdue the benefactors. = Subjugar os benfeitores.
Use our socio-economical ties to force them give up their schemes. = Usar os nossos laços socioeconómicos para os forçar a abandonar os seus planos.
Use them to our benefits = Usá-los em nosso benefício
I wonder... what would they be trying to do when they have some track records right in our hands? = Pergunto-me... o que tentariam fazer quando temos provas do seu passado nas nossas mãos?
Kill the rebels. = Matar os rebeldes.
Subdue the rebels. = Subjugar os rebeldes.
Use our socio-economical ties to force them give up their schemes and join us. = Usar os nossos laços socioeconómicos para os forçar a abandonar os seus planos e a juntarem-se a nós.
Let them fight our enemies. Let them become 'heros'. = Deixá-los lutar contra os nossos inimigos. Que se tornem 'heróis'.
Remove the Slums immediately! = Remover os Bairros de Lata imediatamente!
Force the Slume dwelllers out of their residence... Might be a bad move. = Expulsar os moradores dos Bairros de Lata das suas casas... Pode ser uma má decisão.
Compromise with the upper classes. = Chegar a um compromisso com as classes altas.
By dealing with the wealth gap directly, we can provide more residential land in the cities, or at least provide better houses. = Ao lidar diretamente com a disparidade de riqueza, podemos disponibilizar mais terrenos residenciais nas cidades ou, pelo menos, proporcionar melhores casas.
If they yearn for place to live, why not go out? = Se anseiam por um lugar para viver, porque não saem?
Crisis Solver = Solucionador de Crises

Our civilization consists of multiple countries. If they do not reach agreement in some way. We are at the danger of being foods on a plate. = A nossa civilização é composta por vários países. Se não chegarem a acordo de alguma forma, corremos o perigo de sermos comida num prato.
[Military Alliance] is the most practical = [Military Alliance] é a mais prática
[Cultural Exchange] is the most elegant = [Cultural Exchange] é a mais elegante
[Trade Alliance] is the most attractive = [Trade Alliance] é a mais atraente
[Collective Security] secures our footing = [Collective Security] assegura a nossa posição
[Research Exchange] secures our progess = [Research Exchange] assegura o nosso progresso
[Economic Community] secures our interest = [Economic Community] assegura os nossos interesses
To get a ['Agreement'], you should get at least 10 [Influence], or 20 starting from the [Atomic era] = Para obter um ['Agreement'], deves obter pelo menos 10 [Influence], ou 20 a partir da [Atomic era]
Building Alliance = Formar Aliança

As the civ enters its downfall, the Union crumbles away. = À medida que a civilização entra em decadência, a União desmorona-se.
No! = Não!
Disolution of Union = Dissolução da União

The current instability in our civilization hinders our development greatly and civil wars may break out. An effort in reaching an internal peace should be made. = A atual instabilidade na nossa civilização impede enormemente o nosso desenvolvimento e podem rebentar guerras civis. Deve-se envidar esforços para alcançar uma paz interna.
Not Yet = Ainda não
State of Instability = Estado de Instabilidade

Some of the cities in our civilization are suffering from severe aftermath of some negative events, maybe we should start dealing with them. = Algumas das cidades da nossa civilização estão a sofrer as graves consequências de alguns eventos negativos; talvez devêssemos começar a lidar com elas.
We need new jobs for the people. = Precisamos de novos empregos para o povo.
The number of [Consumption Demand] increases by [33]% for a fair amount of turns. Which may provide breathing rooms for our economy. = O número de [Consumption Demand] aumenta em [33]% durante um bom número de turnos, o que pode dar um espaço de respiração à nossa economia.
State of Ruins = Estado de Ruínas

Here is the current status of your great civilization! What runs it, What state it is in and so on. = Aqui está o estado atual da tua grande civilização! Quem a governa, em que estado se encontra, e assim por diante.
No direct benefits – default stable state. = Sem benefícios diretos – estado estável por defeito.
Before adopting [Anarchism]: = Antes de adotar o [Anarchism]:
Cannot build [Settler], [Pioneer], [Worker], [Mechanised Worker], [Galley Work Ship], [Modern Work Ship] units = Não é possível construir as unidades [Settler], [Pioneer], [Worker], [Mechanised Worker], [Galley Work Ship], [Modern Work Ship]
After adopting [Anarchism]: = Depois de adotar o [Anarchism]:
No direct penalties – baseline environment. = Sem penalizações diretas – ambiente de base.
I see = Entendo
Present Current Status = Apresentar Estado Atual

As your civilization grows, the [Influence] of the ruler of your civilization fluctuates. Keeping it above a certain thershold will be beneficial for decision making. = À medida que a tua civilização cresce, a [Influence] do seu governante flutua. Mantê-la acima de um certo limiar será benéfico para a tomada de decisões.
We shall arrange a great hunt to show our military prowess! = Organizaremos uma grande caçada para mostrar a nossa proeza militar!
We shall arrange a customary worship of our ancestry. = Organizaremos um culto tradicional aos nossos antepassados.
We shall arrange a great feast to show our wealth! = Organizaremos um grande banquete para mostrar a nossa riqueza!
We shall arrange a marriage in high class society to strengthen our internal ties! = Organizaremos um casamento na alta sociedade para fortalecer os nossos laços internos!
We shall do a military march to demostrate our might! = Faremos uma marcha militar para demonstrar o nosso poder!
Remove the [Influence Maintenance Cost] = Remover o [Influence Maintenance Cost]
Popularity Crisis = Crise de Popularidade

As your civilization grows, the lifestyle of your civilization fluctuates. It is sercretly a deciding factor of what civilization states, their unique and ability would your civilization be able to foster.\nTo do this normally, [20] [Influence] is required. = À medida que a tua civilização cresce, o estilo de vida da tua civilização flutua. É secretamente um fator decisivo para determinar que estados de civilização, unidades e capacidades a tua civilização conseguirá fomentar.\nPara o fazer normalmente, são necessários [20] [Influence].
Growth requires our culture to suit the needs for new eras. = O crescimento exige que a nossa cultura se adapte às necessidades das novas eras.
I guess we can simply expand our pantheon to include marginalised gods. = Suponho que podemos simplesmente expandir o nosso panteão para incluir deuses marginalizados.
Purity of our nation is the reason why we stood fast to this era. = A pureza da nossa nação é a razão pela qual nos mantivemos firmes até esta era.
Decrease the Cultural Diversity by a level if it hasnt reached lowest level yet. = Diminuir a Diversidade Cultural em um nível, se ainda não tiver atingido o nível mais baixo.
Time to trim the leaves... = Está na hora de podar as folhas...
On the problem of Culture = Sobre o problema da Cultura

To begin our grand exploration, we must have a clear judgement of what we are dealing with. = Para começar a nossa grande exploração, temos de ter uma noção clara daquilo com que estamos a lidar.
We shall find new oppotunities across the ocean. = Encontraremos novas oportunidades do outro lado do oceano.
We shall find new oppotunities in the vast wild. = Encontraremos novas oportunidades na vasta natureza selvagem.
Exploration Focus = Foco de Exploração

Our settlement in the new land starts to adopt local plants and herds. If we import these stuff back into our continent. We could gain a lot more profits. = O nosso assentamento na nova terra começa a adotar plantas e rebanhos locais. Se importarmos estas coisas de volta para o nosso continente, poderemos obter muito mais lucros.
We should focus on the new staple crops. = Devemos concentrar-nos nas novas culturas de base.
We should focus on the new economic crops. = Devemos concentrar-nos nas novas culturas económicas.
These exotic new animals are quite beautiful. = Estes novos animais exóticos são bastante bonitos.
We should respect the locals and exchange more [culture] = Devemos respeitar os habitantes locais e trocar mais [culture]
Great Exchange = Grande Troca

The [Caste System] is getting harder to maintain by the days. It restricts the upward mobility in our civilization way too much. = O [Caste System] está a ficar cada vez mais difícil de manter. Restringe demasiado a mobilidade ascendente na nossa civilização.
We shall abandon the destinied inequality. = Abandonaremos a desigualdade predestinada.
We shall reinerpret it into a more idealistic system. = Vamos reinterpretá-lo num sistema mais idealista.
What would the lower caste do anyway? They dont deserve anything. = Que fariam os de casta inferior, afinal? Eles não merecem nada.
Casted Away = Rejeição das Castas

As the productivity increases. The absurdity of seeing other people as objects soon came to be realised. People are supporting the abolition. = À medida que a produtividade aumenta, o absurdo de ver outras pessoas como objetos cedo passou a ser compreendido. O povo está a apoiar a abolição.
Slavery is evil = A escravatura é um mal
But we are the superior race! = Mas nós somos a raça superior!
Abolitionism Strikes = O Abolicionismo Ataca

We call upon our hordes. To combat the nature and our enemies. = Convocamos as nossas hordas para combater a natureza e os nossos inimigos.
Recuit Wild Tribes into our culture = Recrutar Tribos Selvagens para a nossa cultura
Organize a hunt for glory, and additional rations = Organizar uma caçada por glória e rações adicionais
Double Yield from [Camp] for a short amount of time. = Duplica o rendimento de [Camp] por um curto período de tempo.
We should exchange our knowledges amongst our tribes = Devemos trocar conhecimentos entre as nossas tribos
[+1 Science] [in all cities] for a short amount of time. = [+1 Science] [in all cities] por um curto período de tempo.
Elect a new Khan! = Eleger um novo Khan!
Sacrifice all your [Influence] to gain a [Great Khan] unit. If a certain amount of [Influence] is sacrificed, [Great Khan] may also double as a [Great Strategist]. = Sacrifica toda a tua [Influence] para ganhar uma unidade [Great Khan]. Se uma certa quantidade de [Influence] for sacrificada, o [Great Khan] também pode funcionar como [Great Strategist].
Make use of our unified power = Fazer uso do nosso poder unificado
Study the advanced culture of the other civilizations = Estudar a cultura avançada das outras civilizações
Tribe Assembly = Assembleia Tribal

As Enough [Settlement Process] has been gained. We may now futher develop our lands. = Uma vez obtido [Settlement Process] suficiente, podemos agora desenvolver ainda mais as nossas terras.
Now we have stability in hand. = Agora temos estabilidade nas mãos.
Settle Down = Assentar

A talented young prince called Alexander decides that his dream to be the conqueror of the world... = Um jovem e talentoso príncipe chamado Alexandre decide que o seu sonho é ser o conquistador do mundo...
We shall support him at all cost! = Apoiá-lo-emos a todo o custo!
Gain access to [Diadochi States] civilization form. = Obter acesso à forma de civilização [Diadochi States].
Too much investment = Investimento excessivo
Alexander the Conqueror = Alexandre, o Conquistador

Alexander the great has died... how could it be? But his generals seems to care less about the death than the power they now holds. = Alexandre, o Grande, morreu... como pôde ser? Mas os seus generais parecem importar-se menos com a morte do que com o poder que agora detêm.
The hellenic period begins... = O período helénico começa...
Alexander's death = A morte de Alexandre

One of the mountain tribe has became a power to be recognized. = Uma das tribos da montanha tornou-se uma potência a reconhecer.
What a nice candidate... = Que excelente candidato...
Babylon's Gate remains shut. = O Portão da Babilónia permanece fechado.
Rise of the Persians = Ascensão dos Persas

A radical reformation is occuring in Shang Dynasty by the Emperor Xin, this results in a civil war. = Uma reforma radical está a ocorrer na Dinastia Shang pelo Imperador Xin, o que resulta numa guerra civil.
The Zhou State has won. = O Estado Zhou venceu.
Emperor Xin remain undefeated! = O Imperador Xin permanece invicto!
So called Mandate... = O chamado Mandato...

It seems like a lot of different new ideologies have appeared in our civilization... Maybe some of them are beneficial = Parece que muitas ideologias novas e diferentes surgiram na nossa civilização... Talvez algumas delas sejam benéficas
 # Requires translation!
