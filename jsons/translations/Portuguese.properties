Pride and Prejudice are disturbing relations between our civilization's states. = O Orgulho e o Preconceito estão a perturbar as relações entre os estados da nossa civilização.
They will find out the answer by themselves = Eles próprios encontrarão a resposta
This must be surpressed = Isto tem de ser reprimido
Tribalism permeates = O tribalismo alastra-se

