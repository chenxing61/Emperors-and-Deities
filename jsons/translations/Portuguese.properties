We must force progression by any means possible = Temos de forçar o progresso por todos os meios possíveis
Stagnation = Estagnação

Because of our civilization's divided status, internal division is exacerbating, soon military conflict will rise. = Devido ao estado dividido da nossa civilização, a divisão interna está a agravar-se e em breve surgirá um conflito militar.
One side is more correct than the others. = Um dos lados está mais correto do que os outros.
A Hostile force gathers around your capital. = Uma força hostil reúne-se em redor da tua capital.
This is a chance that the entire civilization can unite under one will! = Esta é a oportunidade de toda a civilização se unir sob uma só vontade!
Hostile forces gathers around your first [3] cities. = Forças hostis reúnem-se em redor das tuas primeiras [3] cidades.
We cannot afford to fight ourselves... = Não podemos dar-nos ao luxo de lutar entre nós...
