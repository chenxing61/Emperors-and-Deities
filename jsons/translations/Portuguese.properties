ED - Mod Manual = ED - Manual do Mod
The mod's main goal is to reshape Civ 5 into a more complex and nuanced game with many new mechanics incorporated.\nMajor Differences: = O principal objetivo do mod é transformar o Civ 5 num jogo mais complexo e matizado, incorporando muitas mecânicas novas.\nPrincipais Diferenças:
1. Keep in mind that Luxury Resources no longer provide any [stat] by default; they provide a large amount of [stat2] and development potential. However, 'We Love the King Day' and city-state quests still require Luxury Resources. As for how you gain [stat3], you can build many buildings and create a religion with suitable beliefs. = 1. Tenha em mente que os Recursos de Luxo já não fornecem qualquer [stat] por padrão; eles fornecem uma grande quantidade de [stat2] e potencial de desenvolvimento. No entanto, o 'Dia de Amar o Rei' e as missões das cidades-estado ainda exigem Recursos de Luxo. Quanto a como obter [stat3], você pode construir muitos edifícios e criar uma religião com crenças adequadas.
2. Armies are now separated into four major categories:\n 'Levy Army', 'Standing Army', 'Noble Army' and 'Mercenary Army', each with different characteristics. = 2. Os exércitos estão agora separados em quatro categorias principais:\n 'Exército de Conscritos', 'Exército Permanente', 'Exército Nobre' e 'Exército Mercenário', cada uma com características diferentes.
In other words, you cannot build a powerful army without building [buildingFilter]s like [param] to increase the unit limit. = Por outras palavras, você não pode construir um exército poderoso sem construir [buildingFilter]s como [param] para aumentar o limite de unidades.
For a more in-depth explanation = Para uma explicação mais aprofundada
3. The tag system is used widely in this mod. A tag is a word surrounded by '', and many mechanics revolve around this system. They are also in the civilopedia of any object, so feel free to check. You don't need to remember this well to use it effectively as most tags are intuitive. = 3. O sistema de etiquetas é amplamente usado neste mod. Uma etiqueta é uma palavra rodeada por '', e muitas mecânicas giram em torno deste sistema. Elas também estão na civilopédia de qualquer objeto, por isso sinta-se à vontade para verificar. Não precisa de as memorizar bem para as usar eficazmente, pois a maioria das etiquetas é intuitiva.
4. [resource] is a new currency that affects the political status of your civilization, limited by [resource2]. You get it by keeping [stat] positive, choosing the right policies, and through [buildingFilter] decisions. If your [resource3] is negative, you will get a negative event that lowers stability, which provides huge debuffs. You can check the civilopedia page of [resource4] for more information. = 4. [resource] é uma nova moeda que afeta o estado político da sua civilização, limitada por [resource2]. Você obtém-na mantendo o [stat] positivo, escolhendo as políticas certas e através de decisões de [buildingFilter]. Se o seu [resource3] estiver negativo, você terá um evento negativo que reduz a estabilidade, o que causa grandes penalizações. Pode consultar a página da civilopédia de [resource4] para mais informações.
See also: Influence = Ver também: Influência
See also: ED - Stability and Events = Ver também: ED - Estabilidade e Eventos

ED - Starting Tips & Where to Settle = ED - Dicas Iniciais e Onde se Estabelecer
When starting a new game, remember to switch to Neolithic Era if you want to build your civ from the ground up. Since Unciv defaults to Ancient Era, you might lose some content there or find some progress you didn't intend to have, like government forms being different. = Ao iniciar um novo jogo, lembre-se de mudar para a Era Neolítica se quiser construir a sua civilização a partir do zero. Como o Unciv começa por predefinição na Era Antiga, pode perder algum conteúdo ou encontrar progressos que não pretendia ter, como formas de governo diferentes.
When starting a new game in Neolithic Era or Ancient Era, you would likely have two types of units: [unit]s and [unit2]s. = Ao iniciar um novo jogo na Era Neolítica ou na Era Antiga, provavelmente terá dois tipos de unidades: [unit]s e [unit2]s.
The major difference between Civ 5/Unciv and this mod is that your starting unit, the [unit], is not only a ranged unit but also a worker that can build [improvementName]s, [improvementName2]s, and [improvementName3]s. However, it cannot upgrade to other units. They represent humanity's earliest endeavor at building civilizations. = A principal diferença entre o Civ 5/Unciv e este mod é que a sua unidade inicial, o [unit], não é apenas uma unidade de longo alcance, mas também um trabalhador capaz de construir [improvementName]s, [improvementName2]s e [improvementName3]s. No entanto, não pode ser melhorada para outras unidades. Elas representam o esforço mais antigo da humanidade na construção de civilizações.
As for [unit]s, there are no major differences, but note that settling near [tileFilter]s gives 2 extra [stat] and an extra 1 [stat2] near [tileFilter2]. These don't stack but provide a strong starting bonus for your cities. = Quanto aos [unit]s, não há grandes diferenças, mas note que estabelecer-se perto de [tileFilter]s concede 2 [stat] extra e 1 [stat2] extra perto de [tileFilter2]. Estes bónus não se acumulam, mas proporcionam um forte bónus inicial para as suas cidades.
With [buildingFilter], [unit]s also gain +1 [param] on [tileFilter] after researching [tech] technology with [promotion] promotion. Neat upgrades like this exist in many places in this mod, so you should take a proper look at each option you're given. = Com [buildingFilter], os [unit]s também ganham +1 [param] em [tileFilter] depois de pesquisar a tecnologia [tech] com a promoção [promotion]. Melhorias elegantes como esta existem em muitos lugares deste mod, por isso deve analisar bem cada opção que lhe é dada.
When looking for a place to settle, luxury resources do give you a lot of [stat] and other stats but are no longer a source of [stat2]. Maintaining a balance between [stat3]-giving resources like [resource] and [resource2], [stat4] terrains like [tileFilter] and [tileFilter2], and [stat5] resources like [resource3] and [resource4] makes your new cities much more useful. It is also important that you can do [improvementName] to connect your inland cities to the sea. And [tileFilter3]-requiring buildings like [buildingFilter] no longer require settling beside [tileFilter4]s; a 2-tile distance is also good enough. = Ao procurar um local para se estabelecer, os recursos de luxo dão-lhe muito [stat] e outros atributos, mas já não são uma fonte de [stat2]. Manter um equilíbrio entre recursos que dão [stat3], como [resource] e [resource2], terrenos de [stat4], como [tileFilter] e [tileFilter2], e recursos de [stat5], como [resource3] e [resource4], torna as suas novas cidades muito mais úteis. Também é importante poder fazer [improvementName] para ligar as suas cidades do interior ao mar. E edifícios que exigem [tileFilter3], como [buildingFilter], já não exigem estabelecer-se junto a [tileFilter4]s; uma distância de 2 casas também é suficiente.

ED - Stability and Events = ED - Estabilidade e Eventos
The original Unciv/Civ 5 offers a flat debuff when the empire is unhappy, but Emperors and Deities turned the flat debuff into instability and negative events. Negative events often interact with variables like the number of cities or what Era you are in. To cure the debuff from them, you can check out options in [buildingFilter] or in the building tab. = O Unciv/Civ 5 original aplica uma penalização fixa quando o império está infeliz, mas Emperors and Deities transformou essa penalização fixa em instabilidade e eventos negativos. Os eventos negativos interagem frequentemente com variáveis como o número de cidades ou a Era em que se encontra. Para curar a penalização que causam, pode consultar as opções em [buildingFilter] ou no separador de edifícios.
[param] is an event that lowers your stability. It occurs if you are lacking [stat] (going negative). It also occurs more frequently in [buildingFilter] states. You will need to choose between spending some [resource] and [stat2] to prevent it or having your stability lowered. This disables some abilities like building workers when you are in a state of [buildingFilter2]. = [param] é um evento que reduz a sua estabilidade. Ocorre se lhe faltar [stat] (ficar negativo). Também ocorre com mais frequência em estados de [buildingFilter]. Terá de escolher entre gastar algum [resource] e [stat2] para o evitar ou deixar a sua estabilidade baixar. Isto desativa algumas capacidades, como construir trabalhadores quando está num estado de [buildingFilter2].
To keep [param] from occurring, you will need to keep your [stat] and [resource] higher than normal, which is not ideal. So it is a risk you will always face. Remember to always keep some spare [stat2] and [resource2]. = Para impedir que [param] ocorra, terá de manter o seu [stat] e [resource] acima do normal, o que não é o ideal. Por isso, é um risco que enfrentará sempre. Lembre-se de manter sempre algum [stat2] e [resource2] de reserva.
[param], [param2], and [param3] are events that only occur when you are lacking [stat]. They may apply debuffs to all the cities you own, which can be a nightmare to deal with. = [param], [param2] e [param3] são eventos que só ocorrem quando lhe falta [stat]. Podem aplicar penalizações a todas as cidades que possui, o que pode ser um pesadelo de gerir.
Luckily, you can use your capital to deal with them. Unluckily, your capitals are limited, so do what you can to prevent the lack of [stat]. = Felizmente, pode usar o seu capital para lidar com elas. Infelizmente, o seu capital é limitado, por isso faça o que puder para evitar a falta de [stat].
The Events Listed Above are only examples of what could be possible. But remember, when a event occur, as long as you have enough [resource] and [stat] as safety net, you will endure. And there are even sometimes benefits from the negative events. = Os Eventos Acima Listados são apenas exemplos do que pode ser possível. Mas lembre-se: quando um evento ocorre, desde que tenha [resource] e [stat] suficientes como rede de segurança, conseguirá resistir. E por vezes até há benefícios dos eventos negativos.
