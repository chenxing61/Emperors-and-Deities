Though the disorder can be better controlled in a small civilization, but it still needs a permanent solution. = Embora a desordem possa ser melhor controlada numa civilização pequena, ainda assim precisa de uma solução permanente.
Chaos Spreading = Caos a Espalhar-se

As our civilization became united and peaceful. Less and less people are willing to join the army. = À medida que a nossa civilização se tornou unida e pacífica, cada vez menos pessoas estão dispostas a juntar-se ao exército.
Even if we force them into military service, these weak men would not suffice either way. = Mesmo que os forcemos ao serviço militar, estes homens fracos não seriam suficientes de qualquer maneira.
