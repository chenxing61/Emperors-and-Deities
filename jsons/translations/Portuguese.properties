The civilization starts to lose its grasp with order and splendor due to lack of [Happiness]! As unjust ruling causes outrage in your towns. = A civilização começa a perder o controlo sobre a ordem e o esplendor devido à falta de [Happiness]! Pois a governação injusta causa indignação nas tuas cidades.
