ED - Government Forms = ED - Formas de Governo
(This mechanic does exist in BNW, but the author of this mod never copied that.) = (Esta mecânica existe mesmo no BNW, mas o autor deste mod nunca a copiou.)
Government forms like [buildingFilter] and [buildingFilter2] are the first examples of government forms you might encounter. = Formas de governo como [buildingFilter] e [buildingFilter2] são os primeiros exemplos de formas de governo que pode encontrar.
A government form provides army limits like [resource], [resource2]s, and unique bonuses. For [buildingFilter], it's a discount for policies. For [buildingFilter2], it's a growth bonus and a chance to evolve into [buildingFilter3] in the Ancient Era through reforms. = Uma forma de governo proporciona limites de exército como [resource], [resource2]s e bónus únicos. Para [buildingFilter], é um desconto nas políticas. Para [buildingFilter2], é um bónus de crescimento e a possibilidade de evoluir para [buildingFilter3] na Era Antiga através de reformas.
There are two types of government forms: [buildingFilter] and [buildingFilter2]. [buildingFilter3] government forms have cheaper National Wonders, access to all diplomatic actions, and powerful uniques. Many historically significant empires belong to this category, like [buildingFilter4] and [buildingFilter5]. = Existem dois tipos de formas de governo: [buildingFilter] e [buildingFilter2]. As formas de governo [buildingFilter3] têm Maravilhas Nacionais mais baratas, acesso a todas as ações diplomáticas e características únicas poderosas. Muitos impérios historicamente significativos pertencem a esta categoria, como [buildingFilter4] e [buildingFilter5].
On the other hand, it doesn't mean [buildingFilter] government forms are definitely weaker. They fit into their own niche by having cheaper policy costs, access to [buildingFilter2] via [buildingFilter3], and generally taking less effort to maintain. = Por outro lado, isso não significa que as formas de governo [buildingFilter] sejam definitivamente mais fracas. Encaixam-se no seu próprio nicho por terem custos de políticas mais baixos, acesso a [buildingFilter2] através de [buildingFilter3] e, geralmente, exigirem menos esforço para manter.
You can also force a political shift by having your [resource] go above the [resource2] or reform a [buildingFilter] government form when your [resource3] is at half or above the [resource4]. = Também pode forçar uma mudança política fazendo com que o seu [resource] ultrapasse o [resource2], ou reformar uma forma de governo [buildingFilter] quando o seu [resource3] estiver a metade ou acima do [resource4].
Shift in politic = Mudança política
To keep a government form during a [param] event, you would need to keep your [resource] above 3/4 of the [resource2]. = Para manter uma forma de governo durante um evento [param], terá de manter o seu [resource] acima de 3/4 do [resource2].
[buildingFilter] government forms are gated behind the requirement of having enough [stat] and [resource]. You need to have your [resource2] reach half of the [resource3] and your empire being happy. = As formas de governo [buildingFilter] estão condicionadas à exigência de ter [stat] e [resource] suficientes. Precisa de ter o seu [resource2] a atingir metade do [resource3] e o seu império feliz.
List of all possible government forms = Lista de todas as formas de governo possíveis

ED - Reworked Army Mechanic = ED - Mecânica do Exército Reformulada
Armies are now separated into four major categories:\n 'Levy Army', 'Standing Army', 'Noble Army', and 'Mercenary Army', each with different characteristics. = Os exércitos estão agora divididos em quatro categorias principais:\n 'Exército de Conscrição', 'Exército Permanente', 'Exército Nobre' e 'Exército Mercenário', cada um com características diferentes.
'Levy Army' units are free and can be summoned using the [buildingFilter] function in any city with five or more population at the cost of [stat] and short-term negative effects. The [buildingFilter2] status can be reverted by disbanding your levies in peaceful times using [buildingFilter3] at the capital so they can be summoned again. = As unidades 'Exército de Conscrição' são gratuitas e podem ser convocadas usando a função [buildingFilter] em qualquer cidade com cinco ou mais de população, ao custo de [stat] e de efeitos negativos de curto prazo. O estado de [buildingFilter2] pode ser revertido dissolvendo as suas conscrições em tempos de paz, usando [buildingFilter3] na capital, para que possam ser convocadas novamente.
'Standing Army', 'Noble Army', and 'Mercenary Army' behave like normal units, except 'Mercenary Army' can only be bought and requires a [buildingFilter] to be built. 'Standing Army' and its elite variant 'Noble Army' are what you would rely upon most of the time; however, they do require resources like [param] and [resource] to be built. = 'Exército Permanente', 'Exército Nobre' e 'Exército Mercenário' comportam-se como unidades normais, exceto o 'Exército Mercenário', que só pode ser comprado e exige a construção de um [buildingFilter]. O 'Exército Permanente' e a sua variante de elite 'Exército Nobre' são aquilo em que se apoiará na maior parte do tempo; no entanto, exigem recursos como [param] e [resource] para serem construídos.
The main source of [resource] is government forms and [buildingFilter]s. = A principal fonte de [resource] são as formas de governo e os [buildingFilter]s.
The main source of [resource] is government forms and policies. = A principal fonte de [resource] são as formas de governo e as políticas.
The main source of [resource] is [buildingFilter]s and city-states. = A principal fonte de [resource] são os [buildingFilter]s e as cidades-estado.

ED - Tags = ED - Etiquetas
There are many tags for different buildings, resources, and units. = Existem muitas etiquetas para diferentes edifícios, recursos e unidades.
It is mostly a system for implementing strengths and weaknesses in terms of units, but for resources and buildings, it's a system that applies many buffs. = É sobretudo um sistema para implementar pontos fortes e fracos em termos de unidades, mas, para recursos e edifícios, é um sistema que aplica muitos efeitos positivos.
So you need to play with tags in mind. For example, when [param] from [param2] gives you a bonus on constructing [buildingFilter], you can build more [buildingFilter2]. And later adopt [param3] from [param4] to give them [stat] production. = Por isso, precisa de jogar com as etiquetas em mente. Por exemplo, quando [param] de [param2] lhe dá um bónus na construção de [buildingFilter], pode construir mais [buildingFilter2]. E mais tarde adotar [param3] de [param4] para lhes dar produção de [stat].
This is a system that doesn't require overthinking. Normally, you just need to pay some attention to what you are doing, and the tag system will reward you accordingly. = Este é um sistema que não exige pensar demasiado. Normalmente, só precisa de prestar alguma atenção ao que está a fazer, e o sistema de etiquetas recompensá-lo-á em conformidade.
All building sorted by type tags = Todos os edifícios ordenados por etiquetas de tipo
All units sorted by army tags = Todas as unidades ordenadas por etiquetas de exército

ED - Before Industrial Age = ED - Antes da Idade Industrial
Before the Industrial Era, the game runs mostly simliar to Civilization 5. You only have to worry about a few newly added features such as [resource], [resource2] and various [buildingFilter]s. = Antes da Era Industrial, o jogo decorre de forma muito semelhante a Civilization 5. Só tem de se preocupar com algumas características recém-adicionadas, como [resource], [resource2] e vários [buildingFilter]s.
'Military Buildings' = 'Edifícios Militares'
[resource] and anything that says a unit consumes are unit limits. Later you would have to worry about [resource2] and so on but right now lets just say unit limit. You would want to build a lot of [param] to increase your [resource3] to get more capable unit into field. Instead of those free levied units that are way more fragile. [buildingFilter] also provides a lot of unit limits. = [resource] e tudo o que diga que uma unidade consome são limites de unidades. Mais tarde terá de se preocupar com [resource2] e assim por diante, mas, por agora, digamos apenas limite de unidades. Vai querer construir muitos [param] para aumentar o seu [resource3] e colocar unidades mais capazes em campo, em vez daquelas unidades de conscrição gratuitas que são muito mais frágeis. [buildingFilter] também proporciona muitos limites de unidades.
Ancient Era = Era Antiga
Before the [param], the focus is to gather as much [stat], [stat2] and [stat3] and settle cities in good spots, the ways to gain [stat4] was mostly limited. = Antes do [param], o foco é reunir o máximo de [stat], [stat2] e [stat3] e estabelecer cidades em bons locais; as formas de obter [stat4] eram sobretudo limitadas.
Imperial Era = Era Imperial
However, after the [param], the focus on [stat] and [stat2] become appearent, although there are still few ways to gain [stat3], finally in [param2], you will have plenty of ways to gain [stat4]. = No entanto, depois do [param], o foco em [stat] e [stat2] torna-se evidente; embora ainda haja poucas formas de obter [stat3], finalmente em [param2] terá muitas formas de obter [stat4].

ED - The Industrial Ages = ED - As Idades Industriais
Arriving at the Industrial Age, there are a few distinctive new features. = Ao chegar à Idade Industrial, há algumas novas características distintas.
[buildingFilter]s and [buildingFilter2]s are new requirments for industries and new buildings. = [buildingFilter]s e [buildingFilter2]s são novos requisitos para indústrias e novos edifícios.
You will have to allocate tiles near your city center to construct new [improvementFilter]s if you want a full access to buildings. But if you are willing to make compromises with land, you may settle at only building [buildingFilter]s. = Terá de atribuir casas perto do centro da sua cidade para construir novos [improvementFilter]s se quiser acesso total aos edifícios. Mas, se estiver disposto a fazer concessões quanto ao terreno, pode contentar-se em construir apenas [buildingFilter]s.
[improvementFilter]s do have their own synergies akin to [improvementFilter2]s and are buffed by certain buildings and policies. = Os [improvementFilter]s têm as suas próprias sinergias, semelhantes às dos [improvementFilter2]s, e são reforçados por certos edifícios e políticas.
[resource] and [resource2] are two new parameters you should keep in mind if you want to industrialize your civilization. = [resource] e [resource2] são dois novos parâmetros que deve ter em mente se quiser industrializar a sua civilização.
If [resource] outgrows [resource2] by 3 + Current Number of Cities*2, you will gain [buildingFilter], which slows down the construction of new industries but adds some positive effects. = Se [resource] ultrapassar [resource2] em 3 + Número Atual de Cidades*2, ganhará [buildingFilter], que abranda a construção de novas indústrias mas acrescenta alguns efeitos positivos.
If [resource] outgrows [resource2] by 3 + Current Number of Cities*2, you will gain [buildingFilter], which speeds up the construction of new industries but adds some negative effects. = Se [resource] ultrapassar [resource2] em 3 + Número Atual de Cidades*2, ganhará [buildingFilter], que acelera a construção de novas indústrias mas acrescenta alguns efeitos negativos.
[resource] is also a new resource you should keep in mind if you want to keep your industries productive. = [resource] é também um novo recurso que deve ter em mente se quiser manter as suas indústrias produtivas.
Every industry will consume a certain amount of [resource]. If [resource2] is above [amount], they will have the full benefit of electricity in cities with [buildingFilter], like increased stats and resource production rates. = Cada indústria consumirá uma certa quantidade de [resource]. Se [resource2] estiver acima de [amount], terão o benefício total da eletricidade em cidades com [buildingFilter], como atributos e taxas de produção de recursos aumentados.
When below [amount] [resource], the city switches to [buildingFilter], consuming [amount2] [resource2]. = Quando abaixo de [amount] [resource], a cidade muda para [buildingFilter], consumindo [amount2] [resource2].
When between [amount] to [amount2] [resource], the city switches to [buildingFilter], consuming [amount3] [resource2]. = Quando entre [amount] e [amount2] [resource], a cidade muda para [buildingFilter], consumindo [amount3] [resource2].
When above [amount] [resource], the city switches to [buildingFilter], consuming [amount2] [resource2]. = Quando acima de [amount] [resource], a cidade muda para [buildingFilter], consumindo [amount2] [resource2].
[resource]s and [resource2]s are inevitable if you want to go anywhere in the [buildingFilter] and after that point. = [resource]s e [resource2]s são inevitáveis se quiser progredir no [buildingFilter] e depois desse ponto.
The main source of [resource] are any industry, any tile improvement, those [buildingFilter]s that uses [buildingFilter2] and Rapid consumption. = As principais fontes de [resource] são qualquer indústria, qualquer melhoria de terreno, os [buildingFilter]s que usam [buildingFilter2] e o consumo rápido.
When it comes to halting the [resource], you could intentionially halt building Industries and tile improvements that you dont need. And focus on technologies, [param] Policy tree and the various [buildingFilter] [buildingFilter2]s. = No que toca a travar o [resource], pode intencionalmente parar de construir indústrias e melhorias de terreno de que não precisa, e concentrar-se nas tecnologias, na árvore de políticas [param] e nos vários [buildingFilter] [buildingFilter2]s.
[resource] will be a great nuisance, at first it simply decrease the growth, but later it spreads to negatively influence your [stat], [stat2] and so on. Each [resource2] will get progressively ruinous to the aspect it spreads to. = [resource] será um grande incómodo; no início apenas reduz o crescimento, mas depois espalha-se e influencia negativamente o seu [stat], [stat2] e assim por diante. Cada [resource2] tornar-se-á progressivamente ruinoso para o aspeto para o qual se espalha.
