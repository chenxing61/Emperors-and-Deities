We successfully brought our fury to the Barbarian's Motherland. New problem arises. = Levámos com sucesso a nossa fúria à pátria dos Bárbaros. Surge um novo problema.
Plunder them dry and banish them! = Saqueia-os até à última gota e expulsa-os!
