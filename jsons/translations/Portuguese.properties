You need at least 10 [Influence] to adopt a school of thought. = Precisas de, pelo menos, 10 [Influence] para adotar uma escola de pensamento.
The way to rule = A forma de governar

Qin collapsed, two new leader emerged and is battling it out. Which one of them have won? = Qin ruiu; dois novos líderes emergiram e estão a travar batalha. Qual deles venceu?
Liu Bang the slayer of white snake = Liu Bang, o matador da serpente branca
Xiang Yu the dominator = Xiang Yu, o dominador
Collapse of the Great Qin = Colapso do Grande Qin

Europa has a variety of cultures scattered around. Certain culture's futher developments can improve our Civilisation's performance greatly. = A Europa tem uma variedade de culturas espalhadas. O desenvolvimento posterior de certas culturas pode melhorar enormemente o desempenho da nossa Civilização.
Gauls = Gauleses
Albions = Albions
Goths = Godos
Saxons = Saxões
Slavs = Eslavos
You need at least 5 [Influence] and 200 [Gold] to adopt a culture. = Precisas de pelo menos 5 [Influence] e 200 [Gold] para adotar uma cultura.
The Tribes of Europe = As Tribos da Europa

As the egyptian dynasty countinues to be... a new power in the same region grows... = Enquanto a dinastia egípcia continua a existir... um novo poder cresce na mesma região...
New culture, new blood... = Nova cultura, sangue novo...
Who dares to defy the pharoh? = Quem ousa desafiar o faraó?
Rise of the Punics = Ascensão dos Púnicos

A group of nomadic outsider has migrated and conquered their way into our land... With new ideals and army traditions. = Um grupo de forasteiros nómadas migrou e conquistou o seu caminho até às nossas terras... Com novos ideais e tradições militares.
So begins the Indo-Aryan's leadership in South Asia. = Assim começa a liderança indo-ariana no Sul da Ásia.
The Harappans had successfully repelled the invasion. = Os Harappans tinham repelido a invasão com sucesso.
Aryan Migration = Migração Ariana

A wealthy prince named Siddhartha Gautama has became a great philosopher of sort and started a religious movement following his own ideal... = Um príncipe rico chamado Siddhartha Gautama tornou-se uma espécie de grande filósofo e iniciou um movimento religioso seguindo o seu próprio ideal...
Maybe... We all need a bit of forgiveness in our life. = Talvez... Todos nós precisamos de um pouco de perdão na nossa vida.
Stops [Maurya Empire] from automatically adopting [Meritocracy]. = Impede o [Maurya Empire] de adotar automaticamente a [Meritocracy].
Heretical Teaching. = Ensino Herético.
Buddha's birth = Nascimento de Buda

As a new era arrives, a new culture emerges from the steppes. = À medida que uma nova era chega, uma nova cultura emerge das estepes.
The Scythians Emerges = Os Citas Emergem
The Huns Emerges = Os Hunos Emergem
The Xiong Nu Emerges = Os Xiongnu Emergem
Not yet... = Ainda não...
Emergence of Nations = Surgimento das Nações

Well every story has an end. The Great Commander finally steps down from his position in the army. But how does it play out is a story of its own. = Bem, toda história tem um fim. O Grande Comandante finalmente abandona o seu posto no exército. Mas como isso se desenrola é outra história.
Honorable Retirement = Reforma Honrosa
The Great Commander has inspired countless people. His retirement is well deserved. He will be idolised. = O Grande Comandante inspirou inúmeras pessoas. A sua reforma é bem merecida. Ele será idolatrado.
Backstabbed = Apunhalado pelas Costas
Lets just say that there are no perfect man. It would seems like power struggle and other caused this General to step down. Maybe he was too greedy? Too proud of himself? The history can't give a clear answer. = Digamos apenas que não existem homens perfeitos. Parece que lutas pelo poder e outros motivos levaram este General a demitir-se. Talvez fosse demasiado ganancioso? Demasiado orgulhoso de si mesmo? A história não consegue dar uma resposta clara.
Great Commander's Retirement = A Reforma do Grande Comandante

Many different theories has developed around how to manage our civilization's wealth and productions. As the wind of commerce starts to flow. = Muitas teorias diferentes desenvolveram-se sobre como gerir a riqueza e a produção da nossa civilização. À medida que o vento do comércio começa a soprar.
If the market is free, then its a good deed = Se o mercado é livre, então é uma boa ação
Profiteers would ruin the country. = Os especuladores arruinariam o país.
Economic Theories = Teorias Económicas

The Traditional Feudal System crumbles before the new rising bourgeoisie class as industrial revolution continues. Subsequently, bourgeoisies and proletariats revolted against the traditional system, how does the revolution happen? = O sistema feudal tradicional desmorona perante a nova classe burguesa em ascensão, à medida que a revolução industrial continua. Posteriormente, burgueses e proletários revoltaram-se contra o sistema tradicional; como acontece a revolução?
The Revolution has failed. = A Revolução falhou.
The revolution is dead. The government of nobilities continue their ruling,'Noble Army' strength are increased by a third permanently. = A revolução está morta. O governo dos nobres continua a governar; a força do 'Noble Army' aumenta permanentemente em um terço.
Peaceful Transition. = Transição Pacífica.
Long term societal divide hinders futher policy and economic development. But the revolution have its main goal achieved = A divisão social de longo prazo dificulta o desenvolvimento político e económico futuro. Mas a revolução alcançou o seu principal objetivo.
Both negotiations and conflicts are happening... = Estão a acontecer negociações e conflitos...
The revolution...is chaotic. Some cities have peacefully transitioned their power to the new ruling class, while some starts to infight violently. Our civilization has entered a state of [Struggle]. All [Revolutionaries] gain some basic promotions and the 'Standing Army' gains 5% strength bonus permanently. = A revolução... é caótica. Algumas cidades transferiram pacificamente o poder para a nova classe governante, enquanto outras começam a lutar violentamente entre si. A nossa civilização entrou num estado de [Struggle]. Todos os [Revolutionaries] ganham algumas promoções básicas e o 'Standing Army' ganha permanentemente um bónus de 5% de força.
Clean the parasites! = Limpa os parasitas!
The revolution violently shaked the basis of our society, but our society is able to leap toward progressiveness! the civilization enters a state of [Strife], but the will of the revolution is well preserved and people are more accepting to societal changes. All Revolutionaries gain many promotions and the 'Standing Army' gains 10% strength bonus permanently. = A revolução abalou violentamente as bases da nossa sociedade, mas a nossa sociedade consegue dar um salto rumo ao progresso! A civilização entra num estado de [Strife], mas a vontade da revolução está bem preservada e as pessoas aceitam melhor as mudanças sociais. Todos os Revolutionaries ganham muitas promoções e o 'Standing Army' ganha permanentemente um bónus de 10% de força.
Bourgeoisie Revolution! = Revolução Burguesa!

Through out the history of our grand civilization, what aspect should guide us to the future? = Ao longo da história da nossa grandiosa civilização, que aspeto nos deve guiar rumo ao futuro?
We have no history! = Não temos história!
How does one get conservative with no tradition to begin with? = Como é que alguém se torna conservador sem ter tradição, para começar?
We have no history? = Não temos história?
We have no history... = Não temos história...
The Gods = Os Deuses
The polytheistic root of our faith leads us to splendor, we are the most blessed out of all civilization in the world. = A raiz politeísta da nossa fé conduz-nos ao esplendor; somos os mais abençoados de todas as civilizações do mundo.
Our Lord = O Nosso Senhor
The monotheistic root of our faith leads us to connect with the truth, the faith is our sword and our plow. = A raiz monoteísta da nossa fé leva-nos a ligar-nos à verdade; a fé é a nossa espada e o nosso arado.
Our will to unite = A Nossa Vontade de nos Unir
The power of unity has guided us through most of our history, without it, where would we be? = O poder da união guiou-nos ao longo da maior parte da nossa história; sem ele, onde estaríamos?
Our wisdom = A Nossa Sabedoria
Our civilization were once master of philosophy. They lived with great wisdom and we shall never give it up. = A nossa civilização já foi mestre da filosofia. Viveram com grande sabedoria e nunca a abandonaremos.
Our honor = A Nossa Honra
Our civilization were once the most honored warriors. They died with honor and we shall never give it up. = A nossa civilização já teve os guerreiros mais honrados. Morreram com honra e nunca a abandonaremos.
Our wealth = A Nossa Riqueza
Our civilization were once the smartest traders. They left us with all the capital and insights so that we may stay flourished = A nossa civilização já teve os comerciantes mais astutos. Deixaram-nos todo o capital e os conhecimentos para que possamos continuar prósperos.
Our noble bloodline = A Nossa Linhagem Nobre
Our ruiling class has the purest blood with virtues passing down from father to son, we will stay true to the noble blood. = A nossa classe governante tem o sangue mais puro, com virtudes transmitidas de pai para filho; permaneceremos fiéis ao sangue nobre.
Our efficient bureaucracy = A Nossa Burocracia Eficiente
The fair and great system our ancestor has passed onto us is a testament to our longevity. = O sistema justo e grandioso que os nossos antepassados nos legaram é um testemunho da nossa longevidade.
Our divinity = A Nossa Divindade
Our civilization has engraved our faith into everything, we are reaching for ultimate goals. = A nossa civilização gravou a nossa fé em tudo; estamos a alcançar objetivos supremos.
Our humanitarianistic view = A Nossa Visão Humanitária
We are the pioneer for progressive value to love all human beings. We will spread our care to the world for it to become a better place. = Somos os pioneiros do valor progressista de amar todos os seres humanos. Levaremos o nosso cuidado ao mundo para que se torne um lugar melhor.
Our globe-spanning empire = O Nosso Império de Alcance Global
We must maintain dominant and make sure things go our ways. = Devemos manter-nos dominantes e garantir que as coisas correm a nosso favor.
Our glorious empire = O Nosso Império Glorioso
Flower and Beauty doesnt keep our splendor. Iron and Blood Does! = Flores e beleza não preservam o nosso esplendor. Ferro e sangue sim!
The Legacy We Inhereited. = O Legado que Herdámos.

As the gap between classes widen, the capitalists started to go overboard with their mistreatment of the working class. After struggles in the politics and countless protest, another revolution has unveiled. The Bourgeoisie had it coming... But how did this went down? = À medida que o fosso entre as classes se alarga, os capitalistas começaram a exagerar no mau tratamento da classe trabalhadora. Após lutas na política e inúmeros protestos, outra revolução desencadeou-se. A burguesia mereceu-o... Mas como é que isto aconteceu?
Do not let them pass! = Não os deixem passar!
The government and all the left wing power has sucessfully stopped Facists from taking over the civilization. = O governo e todas as forças de esquerda impediram com sucesso os fascistas de tomarem conta da civilização.
For the Leader! = Pelo Líder!
The Facists and their paramilitary militias took over the most important cities and then gradually took over the entire civilization by storm. = Os fascistas e as suas milícias paramilitares tomaram as cidades mais importantes e depois, gradualmente, apoderaram-se de toda a civilização de assalto.
Fascist Revolution! = Revolução Fascista!

The revolution is dead. The government of capitalists continue their ruling, our civilization enters a state of [Struggle], But the route to Conservatism is unlocked = A revolução está morta. O governo dos capitalistas continua a governar; a nossa civilização entra num estado de [Struggle], mas o caminho para o Conservadorismo fica desbloqueado.
Socialist Democracy will save the day.. = A Democracia Socialista salvará o dia..
Is this even a revolution when at least half of the bourgeoisie are still up on their place? Who knows. The conflict is resolved peacefully but there are long term consequences toward policy and industry development, [Planned Economy] is not available in this route. = Isto é sequer uma revolução quando pelo menos metade da burguesia continua no seu lugar? Quem sabe. O conflito é resolvido pacificamente, mas há consequências de longo prazo para o desenvolvimento das políticas e da indústria; [Planned Economy] não está disponível nesta via.
The Workers have nothing to lose but their chains, they have a world to win. = Os trabalhadores nada têm a perder senão as suas correntes; têm um mundo a ganhar.
promotions.One revolt, followed by many, the capitalist system died by a thousand cut. And a new nation ruled by workers is built. Our civilization enters [Struggle] due to the civil war. Newly born [Red Army Troop] now have more promotions. = Uma revolta, seguida por muitas; o sistema capitalista morreu por mil cortes. E constrói-se uma nova nação governada pelos trabalhadores. A nossa civilização entra em [Struggle] devido à guerra civil. Os recém-criados [Red Army Troop] têm agora mais promoções.
Workers, Farmers, Soldiers, Students, all shall be united to bring down the capitalists! = Trabalhadores, agricultores, soldados, estudantes, todos se unirão para derrubar os capitalistas!
Compare to a worker's revolution, this revolution is a combined effort of all proletariats alike, althought that makes the process of revolution much faster, but the organization of the new country is much more complicated. Our Civilization enters [Strife], New [Red Army Troop] specialises into command promotion. = Em comparação com uma revolução operária, esta revolução é um esforço conjunto de todos os proletários, o que, embora torne o processo da revolução muito mais rápido, torna a organização do novo país muito mais complicada. A nossa civilização entra em [Strife]; os novos [Red Army Troop] especializam-se em promoção de comando.
Socialist Revolution! = Revolução Socialista!

The revolution is dead. The government of capitalists continue their ruling, our civilization enters a state of [Struggle], But the route to Conservatism is unlocked. = A revolução está morta. O governo dos capitalistas continua a governar; a nossa civilização entra num estado de [Struggle], mas o caminho para o Conservadorismo fica desbloqueado.
What we proclaim is the Right to Well-Being; Well-Being for All! = O que proclamamos é o Direito ao Bem-Estar; Bem-Estar para Todos!
One revolt, followed by many, the capitalist system died by a thousand cut. There are no oppressions anymore. We have eliminated those ticks. Now is the time we enter [Anarchy] and turn it into something else. = Uma revolta, seguida por muitas; o sistema capitalista morreu por mil cortes. Já não há opressões. Eliminámos esses parasitas. Agora é o momento de entrarmos em [Anarchy] e transformá-lo noutra coisa.
Installs Anarchist Ruling in all of your cities,an alternative ruling style ('Political Building') that replaces the intergration. It is free and built instantly, only providing small amount of debuff and needs Commune to be built to nullify its downsides. = Instala a Governação Anarquista em todas as suas cidades, um estilo de governação alternativo ('Political Building') que substitui a integração. É gratuito e construído instantaneamente, fornecendo apenas uma pequena penalização, e precisa de uma Comuna construída para anular os seus inconvenientes.
Anarchist Revolution! = Revolução Anarquista!

We've rebuilt our government in pursuit to adapt to the new era, but the current economy policy is outdated. We will need a economy reform before we can do anything else. = Reconstruímos o nosso governo para nos adaptarmos à nova era, mas a atual política económica está desatualizada. Precisaremos de uma reforma económica antes de podermos fazer qualquer outra coisa.
Free Market = Mercado Livre
We should believe in the unseen hand and solve all our problems with massive amount of capitals. = Devemos acreditar na mão invisível e resolver todos os nossos problemas com grandes quantidades de capital.
The unseen hand of market economy is not to be fully relied upon. We should spend effort to properly and use more refined policy to guide our nation's productivity. = Não se deve depender totalmente da mão invisível da economia de mercado. Devemos empenhar-nos em utilizar políticas mais refinadas para orientar a produtividade da nossa nação.
Stability First = Estabilidade Primeiro
Our economy must serve the national unity first and formost, nothing is impossible when our nation is strong and its people united. = A nossa economia deve servir, antes de mais, a unidade nacional; nada é impossível quando a nossa nação é forte e o seu povo está unido.
The might of our military overshadows any greed! = O poderio do nosso exército ofusca qualquer ganância!
Nothing is beyond the power of winning in a direct conflict. We must direct all our effort into military! = Nada ultrapassa o poder de vencer num conflito direto. Devemos concentrar todo o nosso esforço no exército!
Centralised Economic Planning = Planeamento Económico Centralizado
The market economy only benefits capitalists and speculators, our new socialist economy should maximise our development potential and distributes the goods to those who need it. = A economia de mercado só beneficia capitalistas e especuladores; a nossa nova economia socialista deve maximizar o nosso potencial de desenvolvimento e distribuir os bens a quem deles precisa.
Decentralised Economy = Economia Descentralizada
The economy suffered from monopoly and hierarchy, we should liberate the economy in favour of enabling peoples'agency to work for the masses. With nationalised industries and policies being guiding forces. = A economia sofreu com o monopólio e a hierarquia; devemos libertar a economia a favor de permitir que a agência do povo trabalhe para as massas, com as indústrias nacionalizadas e as políticas como forças orientadoras.
Self-Management Economy = Economia de Autogestão
Worker should take the matter into their own hands instead of being some subjects of any greater entities. Mutualism and free will shall reign surpreme. = Os trabalhadores devem tomar as rédeas nas suas próprias mãos, em vez de serem súbditos de quaisquer entidades maiores. O mutualismo e o livre-arbítrio reinarão supremos.
New Economic Policies = Novas Políticas Económicas

The previous policies may have proven to be less potent. A rearrangement is thus needed. = As políticas anteriores podem ter-se revelado menos eficazes. É, pois, necessária uma reorganização.
Changing economy policies = Alterar políticas económicas

Here is a list of all of your active missions and their win conditions. = Aqui está uma lista de todas as suas missões ativas e as suas condições de vitória.
Build a Foundry! = Constrói uma Fundição!
Unify your civilization under an Empire using [Enact Policies]. = Unifica a tua civilização sob um Império usando [Enact Policies].
Adopt at least [1] policy in either [Monotheism] or [Polytheism]. = Adota pelo menos [1] política em [Monotheism] ou [Polytheism].
Complete [4] side quests. = Completa [4] missões secundárias.
Keep your civilization above [Anarchy]! = Mantém a tua civilização acima de [Anarchy]!
Build [The Great Library]! = Constrói [The Great Library]!
Historically, Aside from the Great Library of Alexandria, the Library of Ashurbanipal, which is the Royal Library of Akkad, it was also renowned for holding the entire [The Epic of Gilgamesh] and dates further back, around 900BC. = Historicamente, além da Grande Biblioteca de Alexandria, a Biblioteca de Assurbanípal, que é a Biblioteca Real de Acádia, também era famosa por conter todo o [The Epic of Gilgamesh] e remonta a uma época ainda mais antiga, por volta de 900 a.C.
And you are probably building it too early. = E provavelmente estás a construí-la demasiado cedo.
One of the seven olde wonder of the western world. It was built around 600BC and nowadays we build it on every so called green highrises. = Uma das sete antigas maravilhas do mundo ocidental. Foi construída por volta de 600 a.C. e hoje em dia construímo-la em todos os chamados arranha-céus verdes.
We have no idea where Tin, the most important ore in bronze making came from, but the traders came from mediterranean sea. So estabilishing a trading hub in the land of Canaan seems to be the way. = Não fazemos ideia de onde vinha o estanho, o minério mais importante no fabrico do bronze, mas os comerciantes vinham do mar Mediterrâneo. Por isso, estabelecer um centro comercial na terra de Canaã parece ser o caminho.
And you need to get enough [Pearl] by whatever means possible to conpete in mediterranean markets. = E precisas de obter [Pearl] suficiente por todos os meios possíveis para competir nos mercados mediterrânicos.
Trade with North African Civilization! = Comercia com a Civilização Norte-Africana!
Estabilish the [Incense] trade on the national level will encourge trade relation between our lower classes. And these egyptians are dubiously never lacking on wheats... For whatever reason. = Estabelecer o comércio de [Incense] a nível nacional incentivará as relações comerciais entre as nossas classes mais baixas. E estes egípcios, de forma duvidosa, nunca têm falta de trigo... Seja por que razão for.
We can give them some good quality copper... wait, they also have that? = Podemos dar-lhes um pouco de cobre de boa qualidade... espera, eles também têm isso?
In Emperors and Deities, Trading luxuries increases output of certain ['Economic Building']s as oppose to increasing [Happiness]. = Em Emperors and Deities, negociar artigos de luxo aumenta a produção de certos ['Economic Building']s, em vez de aumentar a [Happiness].
Build [6] [Town Hall]s! = Constrói [6] [Town Hall]s!
Nothing Encourages Unity more than the promise of giving land! = Nada incentiva mais a união do que a promessa de doar terras!
Explore and improve more than 10 units of [Horse]! = Explora e melhora mais de 10 unidades de [Horse]!
A tile north of [Nippur] has [4] [Horse]! You may find more horses in the north eastern mountain ranges. = Um terreno a norte de [Nippur] tem [4] [Horse]! Podes encontrar mais cavalos nas cordilheiras a nordeste.
Mission List = Lista de Missões

Well this tip is gonna appear every turn to annoy you out of playing the wrong civ. Maybe in the future Egypt will be playable in this scenario but the map isnt made for them. = Bem, esta dica vai aparecer em todos os turnos para te incomodar até deixares de jogar com a civilização errada. Talvez no futuro o Egito seja jogável neste cenário, mas o mapa não foi feito para eles.
Nope Nope Nope. = Não, não, não.
Hey, choose [Central and West Asia] for this scenario! = Ei, escolhe [Central and West Asia] para este cenário!
Spark of Civilization: Wrong Civilization = Faísca da Civilização: Civilização Errada

Welcome to the Emperors and Deities mod. \nOne of the biggest unciv ruleset. \nAlthough the content of the mod is vast, the story takes place in roughly the same place as the original civilization series. Namely the Journey of Humanity. \nThe mod greatly expands the technological progess, element of customization and many other aspects of civ. It is going to be a bumpy ride so strap in. = Bem-vindo ao mod Emperors and Deities. \nUm dos maiores rulesets do Unciv. \nEmbora o conteúdo do mod seja vasto, a história decorre sensivelmente no mesmo lugar que a série Civilization original, nomeadamente a Jornada da Humanidade. \nO mod expande grandemente o progresso tecnológico, os elementos de personalização e muitos outros aspetos da civilização. Vai ser uma viagem atribulada, por isso aperta o cinto.
Start the Tutorial = Iniciar o Tutorial
Dont forget to check civilipedia if you are in need of understanding certain mechanics. = Não te esqueças de consultar a civilopedia se precisares de compreender certas mecânicas.
Mesopotamia, Spark of Civilization, 4000BCE = Mesopotâmia, Faísca da Civilização, 4000 a.C.

You have the city of Uruk under your control as the center of your civilization. \nIt controls some lands which provides food and trade. Which abstracts into gold production. \nIn the city, there are populations, which includes the people working on the lands. = Tens a cidade de Uruk sob o teu controlo como o centro da tua civilização. \nEla controla algumas terras que fornecem alimento e comércio, o que, em abstrato, se traduz na produção de ouro. \nNa cidade há populações, que incluem as pessoas que trabalham nas terras.
Whats my job? = Qual é a minha função?
Your job in every game is to send [Settler]s, build cities and manage them along with a bunch of units. That is the most basic gameplay that civilization series has to offer. However, Emperors and Deities brings more outside factors to this gameplay. = A tua função em cada jogo é enviar [Settler]s, construir cidades e geri-las juntamente com um conjunto de unidades. Esta é a jogabilidade mais básica que a série civilization tem para oferecer. No entanto, Emperors and Deities acrescenta mais fatores externos a esta jogabilidade.
----- = -----
In this mission you need to build a [Foundry] to jump start the production of bronze to boost your city's [Production]. Afterwhich is another new mission. And so on and so fourth, if you are able to complete all missions thats labeled as main quests, you will win this scenario. = Nesta missão precisas de construir uma [Foundry] para dar início à produção de bronze e impulsionar a [Production] da tua cidade. Depois vem outra missão nova. E assim por diante; se conseguires completar todas as missões marcadas como missões principais, vencerás este cenário.
New Main Quest: Into The Bronze Age, 4000BCE = Nova Missão Principal: Rumo à Idade do Bronze, 4000 a.C.

With the increase of productivity, population grows, and risk of over population forced some people to set off to new lands. = Com o aumento da produtividade, a população cresce, e o risco de sobrepopulação forçou algumas pessoas a partir para novas terras.
I wonder if they would stay by our side... = Pergunto-me se eles ficarão do nosso lado...
[Settler] Units can create new cities, which is absolutely essential for expanding. Every new city settled is a new production line of unit and buildings. = As unidades [Settler] podem criar novas cidades, o que é absolutamente essencial para a expansão. Cada nova cidade fundada é uma nova linha de produção de unidades e edifícios.
As for how loyal would they be? Well, the game doesnt allow them to rebel. However, new cities will take a big chunk of happiness away from you since the governing body of your civilization have to diverge their power. = Quanto à sua lealdade? Bem, o jogo não lhes permite rebelar-se. No entanto, as novas cidades retiram-te uma grande parte da felicidade, pois o corpo governante da tua civilização tem de dividir o seu poder.
Low happiness can wreck havoc on unsuspecting civilizations as they decrease [Influence] and make negative events occur more often. = A baixa felicidade pode causar estragos em civilizações desprevenidas, pois diminui a [Influence] e faz com que eventos negativos ocorram com mais frequência.
ALSO, LUXURY DOESNT PROVIDE HAPPINESS NATURALLY IN THIS MOD. = E AINDA, NESTE MOD OS ARTIGOS DE LUXO NÃO FORNECEM FELICIDADE NATURALMENTE.
Quest Reward: Into The Bronze Age, 4000BCE = Recompensa da Missão: Rumo à Idade do Bronze, 4000 a.C.

A brilliant Semitic leader named Sargon has risen in the north. His military innovations and administrative talent promise to unite all of Mesopotamia. This is not a threat but an opportunity. Will you embrace unity or preserve the old city-states? = Um brilhante líder semita chamado Sargão ergueu-se no norte. As suas inovações militares e o seu talento administrativo prometem unir toda a Mesopotâmia. Isto não é uma ameaça, mas uma oportunidade. Vais abraçar a unidade ou preservar as antigas cidades-estado?
An Empire rises before my eyes! = Um Império ergue-se diante dos meus olhos!
The united realm will share knowledge and resources. = O reino unido partilhará conhecimento e recursos.
Maintain the independence of city-states! = Mantém a independência das cidades-estado!
Sargon fails at his mission. The cities remain separate but cooperate through trade and mutual defense. Or not? = Sargão falha na sua missão. As cidades permanecem separadas, mas cooperam através do comércio e da defesa mútua. Ou não?
Sargon's Reign, 2334BCE = O Reinado de Sargão, 2334 a.C.

Whether through alliance or federation, the time has come to formalize the political structure of your civilization. Use the [Enact Policies] decision in your capital to consolidate your rule. If you have enough Influence, you can declare a unified empire. This will unlock new government bonuses and prepare you for future challenges. = Quer através de aliança, quer de federação, chegou a altura de formalizar a estrutura política da tua civilização. Usa a decisão [Enact Policies] na tua capital para consolidar o teu domínio. Se tiveres Influência suficiente, podes declarar um império unificado. Isto desbloqueará novos bónus de governo e preparar-te-á para os desafios futuros.
How do I unify? = Como me unifico?
Open the city screen of your capital, find the [Enact Policies] building, and choose the option 'We are able to unify ourselves!' when you have at least half of your Influence Limit. = Abre o ecrã da cidade da tua capital, encontra o edifício [Enact Policies] e escolhe a opção 'Somos capazes de nos unificar!' quando tiveres pelo menos metade do teu Limite de Influência.
New Main Quest: Unify Mesopotamia, 2200BCE = Nova Missão Principal: Unificar a Mesopotâmia, 2200 a.C.

And so, the mesopotamian became the soverign owner of their own region. The legacy of Sargon will last. = E assim, os mesopotâmios tornaram-se os donos soberanos da sua própria região. O legado de Sargão perdurará.
United and Stronger than ever. = Unidos e mais fortes do que nunca.
Quest Reward: Unify Mesopotamia, 2200BCE = Recompensa da Missão: Unificar a Mesopotâmia, 2200 a.C.

You have declined the offer of unification, which is an interesting choice. However, there is always another way to strengthen your civilization's unity. = Recusaste a oferta de unificação, o que é uma escolha interessante. No entanto, há sempre outra forma de fortalecer a unidade da tua civilização.
A pantheon? Or something greater... = Um panteão? Ou algo maior...
Choose between the [Polytheism] or [Monotheism], besides a unifying government that grants powerful uniques, you can also build a religion that outlive it. = Escolhe entre [Polytheism] ou [Monotheism]; além de um governo unificador que concede características poderosas, também podes construir uma religião que lhe sobreviva.
New Main Quest: A House Divided, 2200BCE = Nova Missão Principal: Uma Casa Dividida, 2200 a.C.

And so, although history's tide changes, a long lasting faith system starts spreading along with all the glory of the west asian civilization = E assim, embora a maré da história mude, um sistema de fé duradouro começa a espalhar-se juntamente com toda a glória da civilização da Ásia Ocidental
Interesting = Interessante
Quest Reward: A House Divided, 2200BCE = Recompensa da Missão: Uma Casa Dividida, 2200 a.C.

The Wheel of history turns its tide, the empire of akkad didnt last. But the west asian civilization is now going through an era of prosperity, complete 4 side quests and \n Prepare for the inevitable. = A Roda da história muda a sua maré, o império de akkad não durou. Mas a civilização da Ásia Ocidental atravessa agora uma era de prosperidade; completa 4 missões secundárias e \n Prepara-te para o inevitável.
You may check the list of available side quests by [Check Mission List] in capital. = Podes consultar a lista de missões secundárias disponíveis através de [Check Mission List] na capital.
New Main Quest: The Old Babylon, 1900BCE = Nova Missão Principal: A Velha Babilónia, 1900 a.C.

You have built a nation of prosperity, now its time for durability test. = Construíste uma nação próspera; agora é hora do teste de resistência.
What are you talking about? = Do que estás a falar?
Quest Reward: The Old Babylon, 1900BCE = Recompensa da Missão: A Velha Babilónia, 1900 a.C.

For whatever reason, a volcano event far far away has triggered an agricultural disaster across the entire ancient world.\nOld order is crumbling. Civilizations across the eastern Mediterranean are falling to famine, rebellion, and the loss of trade routes. But here in Mesopotamia, your leadership will determine whether our light fades or endures. Over the next 15 turns, you will face a series of crises. Each requires wise use of Influence and Gold. = Por alguma razão, uma erupção vulcânica muito, muito distante desencadeou um desastre agrícola em todo o mundo antigo.\nA velha ordem está a ruir. As civilizações de todo o Mediterrâneo oriental estão a sucumbir à fome, à rebelião e à perda de rotas comerciais. Mas aqui na Mesopotâmia, a tua liderança determinará se a nossa luz se apaga ou perdura. Ao longo dos próximos 15 turnos, enfrentarás uma série de crises. Cada uma exige um uso sensato de Influência e Ouro.
What must I do? = O que devo fazer?
Over the following turns, disasters will strike: drought, civil unrest, economic collapse. Use the [Influence], [Enact Policies] and your stored resources to mitigate them. Survive all 15 turns to complete the tutorial and unlock a special reward. = Ao longo dos turnos seguintes, os desastres irão atingir-te: seca, agitação civil, colapso económico. Usa a [Influence], o [Enact Policies] e os teus recursos armazenados para os mitigar. Sobrevive aos 15 turnos para completares o tutorial e desbloqueares uma recompensa especial.
New Main Quest: Survive the Bronze Age Collapse, 1200BCE = Nova Missão Principal: Sobrevive ao Colapso da Idade do Bronze, 1200 a.C.

You have completed a side quest! This glorious deed will be recorded in the global history. = Completaste uma missão secundária! Este feito glorioso ficará registado na história global.
Our story continues! = A nossa história continua!
Side Quest Completion = Conclusão de Missão Secundária

The harvest has failed. Food stores are empty, and people are beginning to starve. Entire villages started to escape for survival. = A colheita falhou. Os celeiros estão vazios e as pessoas começam a passar fome. Aldeias inteiras começaram a fugir para sobreviver.
Distribute emergency grain = Distribui cereais de emergência
The granaries opened. Providing much needed food sourced from both emergency storage and grains bought in a hurry... for now. = Os celeiros abriram. Forneceram alimentos muito necessários, provenientes tanto dos armazéns de emergência como de cereais comprados à pressa... por agora.
Import Grains from Egypt = Importa Cereais do Egito
Although Egypt also suffers from this horrible disaster. You managed to maintain a desperate alliance between the civilizations and kept the people fed. = Embora o Egito também sofra com este terrível desastre. Conseguiste manter uma aliança desesperada entre as civilizações e manter o povo alimentado.
... = ...
The granaries are emptied! They were already sold by greedy nobles and merchants who also directed the hatred to the leader! = Os celeiros estão vazios! Já tinham sido vendidos por nobres e mercadores gananciosos, que ainda viraram o ódio contra o líder!
Drought and Famine = Seca e Fome

Ambitious nobilities stopped their pursuit of expansion due to the disaster, however that only lead them into power struggle with each others, with the worsening global starvation, the Barbarians are invading as well. = As nobrezas ambiciosas pararam a sua busca de expansão devido ao desastre; no entanto, isso apenas as levou a lutas de poder entre si. Com o agravamento da fome global, os Bárbaros também estão a invadir.
We must do something about it! = Temos de fazer algo quanto a isto!
Tighten the Rulership. The amount of [Town Hall]s will lessen the rebellions. = Reforça o governo. O número de [Town Hall]s diminuirá as rebeliões.
Let them come! = Deixa-os vir!
Certainly, you have an army, why not use them? = Certamente, tens um exército; porque não o usar?
Usurpers and Barbarians = Usurpadores e Bárbaros

The tin routes from distant lands have been severely impacted by the disaster. Without metals, your artisans cannot produce bronze weapons or tools. Production slows across the empire. = As rotas do estanho vindas de terras distantes foram gravemente afetadas pelo desastre. Sem metais, os teus artesãos não conseguem produzir armas ou ferramentas de bronze. A produção abranda em todo o império.
Fix the route then. = Então repara a rota.
Because you have done the related side quest. You have enough [Pearl]s to buy up all the remaining tins on the market! If you can still call it a market. = Porque completaste a missão secundária relacionada. Tens [Pearl]s suficientes para comprar todo o estanho restante no mercado! Se ainda se pode chamar-lhe mercado.
Try to ration the material! = Tenta racionar o material!
A correct call. = Uma decisão correta.
Encourage local alternatives. = Incentiva alternativas locais.
Downgrading the tool to pure copper, stone and bone is the desperate, but essential move. = Rebaixar as ferramentas para cobre puro, pedra e osso é a jogada desesperada, mas essencial.
Trade Collapse = Colapso do Comércio

Scribes are fleeing the cities to avoid conscription and taxes. The art of writing is being forgotten. Your scientific progress halts. = Os escribas estão a fugir das cidades para evitar o recrutamento e os impostos. A arte da escrita está a ser esquecida. O teu progresso científico estagna.
Reward those who stayed. Punish those who fleed. = Recompensa os que ficaram. Castiga os que fugiram.
Maintaining the order. = A manter a ordem.
We have [The Great Library] = Temos [The Great Library]
Well. We always have backups in the royal library. = Bem. Temos sempre cópias de segurança na biblioteca real.
Without scribes, records are lost. Generations of knowledges are lost to time. = Sem escribas, os registos perdem-se. Gerações de conhecimento perdem-se no tempo.
Loss of Writing = Perda da Escrita

It is appearent that the gods are angry that such a disaster has struck... The priests are recieveing a lot of backlash because of this. And the power structure of the entire region has been weakened = É evidente que os deuses estão zangados por tal desastre ter ocorrido... Os sacerdotes estão a receber muitas críticas por causa disto. E a estrutura de poder de toda a região foi enfraquecida
Trample the heretic! = Esmaga o herege!
Change [Hanging Gardens] to a site of worship and force the priests to pray to the god of fertility = Transforma os [Hanging Gardens] num local de culto e obriga os sacerdotes a rezar ao deus da fertilidade
This does absolutely nothing, but peoples are slightly less angry and let it slipped. = Isto não faz absolutamente nada, mas o povo fica um pouco menos zangado e deixa passar.
Without powerful priests, the sacredness of the throne isn't secure any more.. This leads to even more man-mode disasters. = Sem sacerdotes poderosos, a sacralidade do trono já não está segura.. Isto conduz a ainda mais desastres causados pelo homem.
Loss of Faith = Perda da Fé

The crises have passed. Mesopotamia is battered but alive. Your decisions have shaped the survival of civilization itself. One last choice awaits. = As crises passaram. A Mesopotâmia está abalada, mas viva. As tuas decisões moldaram a sobrevivência da própria civilização. Aguarda-te uma última escolha.
Look to the future (Tutorial Completion) = Olha para o futuro (Conclusão do Tutorial)
You have completed the Spark of Civilization tutorial. Your people will remember your leadership. = Completaste o tutorial A Centelha da Civilização. O teu povo recordará a tua liderança.
Thank you for playing this scenario! = Obrigado por jogares este cenário!
Just another turn... = Só mais um turno...
You may keep playing the tutorial, but thats that. = Podes continuar a jogar o tutorial, mas é só isso.
The Final Hour = A Hora Final


