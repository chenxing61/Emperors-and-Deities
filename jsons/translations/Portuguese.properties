Unacceptable. = Inaceitável.
The long lasting peace = A paz duradoura

In a united civilization, without much outer threat. The desire for advancement became lower day by day. = Numa civilização unida, sem grande ameaça externa, a vontade de progredir foi diminuindo dia após dia.
We are too big to fall. It wouldnt matter either way. = Somos demasiado grandes para cair. De qualquer forma, não faria diferença.
