The civilization starts to lose its grasp with order and splendor due to lack of [Happiness]! As inequality in wealth is detrimental to societal stability. = A civilização começa a perder o controlo sobre a ordem e o esplendor devido à falta de [Happiness]! Pois a desigualdade de riqueza é prejudicial à estabilidade social.
