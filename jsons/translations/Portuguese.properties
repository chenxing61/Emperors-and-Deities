ED - Expansions, Consolidation and Modernization = ED - Expansão, Consolidação e Modernização
City development is organized into three tiers of building packages: "Expansion", "Consolidation", and "Modernization". = O desenvolvimento urbano está organizado em três níveis de pacotes de edifícios: "Expansão", "Consolidação" e "Modernização".
How packages work: Each package lets you build multiple related buildings at once, saving [stat] and ensuring that development becomes easier with tech investment. Packages become available as you progress through eras. For example, [buildingFilter] builds [buildingFilter2], [buildingFilter3], and [buildingFilter4] together and is unlocked by [tech]. = Como funcionam os pacotes: cada pacote permite construir vários edifícios relacionados de uma só vez, poupando [stat] e garantindo que o desenvolvimento se torna mais fácil com o investimento em tecnologia. Os pacotes ficam disponíveis à medida que avança pelas eras. Por exemplo, [buildingFilter] constrói [buildingFilter2], [buildingFilter3] e [buildingFilter4] em conjunto e é desbloqueado por [tech].
"Expansion": \nCovers basic buildings which form the foundation of any town. Which are mostly unlocked before [buildingFilter] = "Expansão": \nAbrange os edifícios básicos que formam a fundação de qualquer povoação. São maioritariamente desbloqueados antes de [buildingFilter]
"Consolidation" \nCovers buildings that forms a proper city and make it useful. Which are mostly unlocked starting from [buildingFilter] and before [buildingFilter2]. = "Consolidação" \nAbrange os edifícios que formam uma cidade adequada e a tornam útil. São maioritariamente desbloqueados a partir de [buildingFilter] e antes de [buildingFilter2].
"Modernization" \nCovers buildings that makes a city that is considered modernized. Which are mostly unlocked starting from [buildingFilter]. You wouldn't live without them in real life. = "Modernização" \nAbrange os edifícios que tornam uma cidade considerada modernizada. São maioritariamente desbloqueados a partir de [buildingFilter]. Não conseguiria viver sem eles na vida real.

