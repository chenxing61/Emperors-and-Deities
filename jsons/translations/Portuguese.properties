The civilization starts to lose its grasp with order and splendor due to lack of [Happiness]! As more and more yeoman loses their land to giant landlords, they either became serfs or vargants. Which exacerbates the risk of revolts and the decline of living condition. = A civilização começa a perder o controlo sobre a ordem e o esplendor devido à falta de [Happiness]! À medida que cada vez mais pequenos proprietários perdem as suas terras para grandes senhorios, tornam-se servos ou vagabundos, o que agrava o risco de revoltas e o declínio das condições de vida.
The Population shifts between cities... = A população desloca-se entre cidades...
