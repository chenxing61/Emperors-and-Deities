ED - Invention and Innovations = ED - Invenção e Inovações
[buildingFilter]s and [buildingFilter2]s are new buildings that represent minor technological progression and act like mini National Wonders. They enable you to build certain units and buildings or give functionality boosts to existing buildings. They are built faster when other civilizations have already built them, but if you build it first, you are granted a [stat] and [stat2] boost that scales with the Era of the [buildingFilter3] or [buildingFilter4]. It is also important to state that there is no gameplay difference between [buildingFilter5]s and [buildingFilter6]s. = Os [buildingFilter]s e [buildingFilter2]s são novas construções que representam uma progressão tecnológica menor e funcionam como mini Maravilhas Nacionais. Eles permitem construir certas unidades e construções ou dão melhorias de funcionalidade a construções existentes. São construídos mais rápido quando outras civilizações já os construíram, mas, se você construí-los primeiro, recebe um bônus de [stat] e [stat2] que varia com a Era do [buildingFilter3] ou [buildingFilter4]. Também é importante dizer que não há diferença de jogabilidade entre [buildingFilter5]s e [buildingFilter6]s.
Invention bonus before Industrial Era = Bônus de invenção antes da Era Industrial
[amount] [stat], [amount2] [stat2] = [amount] [stat], [amount2] [stat2]
[amount]% production cost of [buildingFilter]s and [buildingFilter2]s for other civs = [amount]% do custo de produção dos [buildingFilter]s e [buildingFilter2]s para outras civilizações
Invention bonus Stats after Industrial Era = Atributos de bônus de invenção depois da Era Industrial
Invention bonus after Atomic Era = Bônus de invenção depois da Era Atômica

ED - Religion Changes = ED - Mudanças na Religião
faith = fé
At first, religion premise is decided by the three-way choice betwee [param], [param2] and [param3]. Although the one standing out is [param4].\nBecause the other two, [param5] seek to maintain a alliance between [stat] and [stat2], [param6] is ambiguous toward [param7], but [param8] is the way to go if you want to delve into religion faster than anyone else. They also have a different selection of wonder to build. Avoiding a fair amount of competition. = Primeiro, a premissa da religião é decidida pela escolha de três vias entre [param], [param2] e [param3]. Embora a que se destaca seja [param4].\nPorque as outras duas, [param5] busca manter uma aliança entre [stat] e [stat2], [param6] é ambíguo em relação a [param7], mas [param8] é o caminho a seguir se você quiser se aprofundar na religião mais rápido que qualquer um. Elas também têm uma seleção diferente de maravilhas para construir, evitando uma boa quantidade de competição.
Then, you have pantheon, which gives plenty of faith according to the terrain. Even [param] would have to choose a pantheon as it is a spritual step toward the lord. = Depois, você tem o panteão, que dá bastante fé de acordo com o terreno. Até [param] teria que escolher um panteão, pois é um passo espiritual rumo ao senhor.
Beliefs unlocks plenty of things, aside from buildings like [buildingFilter] and [buildingFilter2], some also unlocks wonders. They also helps with decreasing the unhappiness from the population. Some of them need specific policies like [param] to be adopted.\n Follower Beliefs are ability granters. They enable crucial abilities such as using [stat] to buy stuff.\n Enhancer Beliefs on the other hand, boosts the religion to spread itself better and gives even more bonuses toward various aspects like military and further utilises [stat2]. = As crenças desbloqueiam muitas coisas; além de construções como [buildingFilter] e [buildingFilter2], algumas também desbloqueiam maravilhas. Elas também ajudam a diminuir a infelicidade da população. Algumas precisam de políticas específicas como [param] para serem adotadas.\n Crenças de Seguidores concedem habilidades. Elas permitem habilidades cruciais, como usar [stat] para comprar coisas.\n Crenças de Aprimoramento, por outro lado, impulsionam a religião a se espalhar melhor e dão ainda mais bônus em vários aspectos, como militar, e utilizam ainda mais o [stat2].

ED - Great People Changes = ED - Mudanças nos Grandes Personagens
Great Persons have been changed. For example, [param] has been separated into [unit] and [unit2]. [unit3]s and [unit4]s have new unique mechanics like creating [resource]s and [resource2]s. Some [improvementFilter]s like [improvementName], [improvementName2]s, and [improvementName3]s have bonuses on specific tiles. = Os Grandes Personagens foram alterados. Por exemplo, [param] foi separado em [unit] e [unit2]. Os [unit3]s e [unit4]s têm novas mecânicas únicas, como criar [resource]s e [resource2]s. Alguns [improvementFilter]s como [improvementName], [improvementName2]s e [improvementName3]s têm bônus em quadrados específicos.
