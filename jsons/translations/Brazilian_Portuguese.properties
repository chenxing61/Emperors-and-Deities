ED - Mod Manual = ED - Manual do Mod
The mod's main goal is to reshape Civ 5 into a more complex and nuanced game with many new mechanics incorporated.\nMajor Differences: = O principal objetivo do mod é transformar o Civ 5 em um jogo mais complexo e matizado, incorporando muitas mecânicas novas.\nPrincipais Diferenças:
1. Keep in mind that Luxury Resources no longer provide any [stat] by default; they provide a large amount of [stat2] and development potential. However, 'We Love the King Day' and city-state quests still require Luxury Resources. As for how you gain [stat3], you can build many buildings and create a religion with suitable beliefs. = 1. Tenha em mente que os Recursos de Luxo não fornecem mais nenhum [stat] por padrão; eles fornecem uma grande quantidade de [stat2] e potencial de desenvolvimento. No entanto, o 'Dia de Amar o Rei' e as missões das cidades-estado ainda exigem Recursos de Luxo. Quanto a como obter [stat3], você pode construir muitos edifícios e criar uma religião com crenças adequadas.
2. Armies are now separated into four major categories:\n 'Levy Army', 'Standing Army', 'Noble Army' and 'Mercenary Army', each with different characteristics. = 2. Os exércitos agora estão separados em quatro categorias principais:\n 'Exército de Recrutas', 'Exército Permanente', 'Exército Nobre' e 'Exército Mercenário', cada uma com características diferentes.
In other words, you cannot build a powerful army without building [buildingFilter]s like [param] to increase the unit limit. = Em outras palavras, você não pode construir um exército poderoso sem construir [buildingFilter]s como [param] para aumentar o limite de unidades.
For a more in-depth explanation = Para uma explicação mais aprofundada
3. The tag system is used widely in this mod. A tag is a word surrounded by '', and many mechanics revolve around this system. They are also in the civilopedia of any object, so feel free to check. You don't need to remember this well to use it effectively as most tags are intuitive. = 3. O sistema de tags é amplamente usado neste mod. Uma tag é uma palavra cercada por '', e muitas mecânicas giram em torno desse sistema. Elas também estão na civilopédia de qualquer objeto, então fique à vontade para verificar. Você não precisa memorizá-las bem para usá-las de forma eficaz, pois a maioria das tags é intuitiva.
4. [resource] is a new currency that affects the political status of your civilization, limited by [resource2]. You get it by keeping [stat] positive, choosing the right policies, and through [buildingFilter] decisions. If your [resource3] is negative, you will get a negative event that lowers stability, which provides huge debuffs. You can check the civilopedia page of [resource4] for more information. = 4. [resource] é uma nova moeda que afeta o estado político da sua civilização, limitada por [resource2]. Você a obtém mantendo o [stat] positivo, escolhendo as políticas certas e por meio de decisões de [buildingFilter]. Se o seu [resource3] estiver negativo, você terá um evento negativo que reduz a estabilidade, o que causa grandes penalidades. Você pode consultar a página da civilopédia de [resource4] para mais informações.
See also: Influence = Ver também: Influência
See also: ED - Stability and Events = Veja também: ED - Estabilidade e Eventos

ED - Starting Tips & Where to Settle = ED - Dicas Iniciais e Onde Fundar Cidades
When starting a new game, remember to switch to Neolithic Era if you want to build your civ from the ground up. Since Unciv defaults to Ancient Era, you might lose some content there or find some progress you didn't intend to have, like government forms being different. = Ao iniciar um novo jogo, lembre-se de mudar para a Era Neolítica se quiser construir a sua civilização do zero. Como o Unciv começa por padrão na Era Antiga, você pode perder algum conteúdo ou encontrar progressos que não pretendia ter, como formas de governo diferentes.
When starting a new game in Neolithic Era or Ancient Era, you would likely have two types of units: [unit]s and [unit2]s. = Ao iniciar um novo jogo na Era Neolítica ou na Era Antiga, você provavelmente terá dois tipos de unidades: [unit]s e [unit2]s.
The major difference between Civ 5/Unciv and this mod is that your starting unit, the [unit], is not only a ranged unit but also a worker that can build [improvementName]s, [improvementName2]s, and [improvementName3]s. However, it cannot upgrade to other units. They represent humanity's earliest endeavor at building civilizations. = A principal diferença entre o Civ 5/Unciv e este mod é que a sua unidade inicial, o [unit], não é apenas uma unidade de combate à distância, mas também um trabalhador que pode construir [improvementName]s, [improvementName2]s e [improvementName3]s. No entanto, ela não pode evoluir para outras unidades. Elas representam o primeiro esforço da humanidade na construção de civilizações.
As for [unit]s, there are no major differences, but note that settling near [tileFilter]s gives 2 extra [stat] and an extra 1 [stat2] near [tileFilter2]. These don't stack but provide a strong starting bonus for your cities. = Quanto aos [unit]s, não há grandes diferenças, mas note que fundar perto de [tileFilter]s concede 2 [stat] extras e 1 [stat2] extra perto de [tileFilter2]. Eles não se acumulam, mas proporcionam um forte bônus inicial para as suas cidades.
With [buildingFilter], [unit]s also gain +1 [param] on [tileFilter] after researching [tech] technology with [promotion] promotion. Neat upgrades like this exist in many places in this mod, so you should take a proper look at each option you're given. = Com [buildingFilter], os [unit]s também ganham +1 [param] em [tileFilter] depois de pesquisar a tecnologia [tech] com a promoção [promotion]. Melhorias bacanas como essa existem em muitos lugares deste mod, então você deve analisar bem cada opção que recebe.
When looking for a place to settle, luxury resources do give you a lot of [stat] and other stats but are no longer a source of [stat2]. Maintaining a balance between [stat3]-giving resources like [resource] and [resource2], [stat4] terrains like [tileFilter] and [tileFilter2], and [stat5] resources like [resource3] and [resource4] makes your new cities much more useful. It is also important that you can do [improvementName] to connect your inland cities to the sea. And [tileFilter3]-requiring buildings like [buildingFilter] no longer require settling beside [tileFilter4]s; a 2-tile distance is also good enough. = Ao procurar um lugar para fundar, os recursos de luxo dão bastante [stat] e outros atributos, mas não são mais uma fonte de [stat2]. Manter um equilíbrio entre recursos que dão [stat3], como [resource] e [resource2], terrenos de [stat4], como [tileFilter] e [tileFilter2], e recursos de [stat5], como [resource3] e [resource4], torna suas novas cidades muito mais úteis. Também é importante poder fazer [improvementName] para conectar suas cidades do interior ao mar. E construções que exigem [tileFilter3], como [buildingFilter], não exigem mais fundar ao lado de [tileFilter4]s; uma distância de 2 quadrados já é suficiente.

ED - Stability and Events = ED - Estabilidade e Eventos
The original Unciv/Civ 5 offers a flat debuff when the empire is unhappy, but Emperors and Deities turned the flat debuff into instability and negative events. Negative events often interact with variables like the number of cities or what Era you are in. To cure the debuff from them, you can check out options in [buildingFilter] or in the building tab. = O Unciv/Civ 5 original aplica uma penalidade fixa quando o império está infeliz, mas Emperors and Deities transformou essa penalidade fixa em instabilidade e eventos negativos. Os eventos negativos costumam interagir com variáveis como o número de cidades ou a Era em que você está. Para curar a penalidade deles, você pode conferir as opções em [buildingFilter] ou na aba de construções.
[param] is an event that lowers your stability. It occurs if you are lacking [stat] (going negative). It also occurs more frequently in [buildingFilter] states. You will need to choose between spending some [resource] and [stat2] to prevent it or having your stability lowered. This disables some abilities like building workers when you are in a state of [buildingFilter2]. = [param] é um evento que reduz sua estabilidade. Ele ocorre se faltar [stat] (ficando negativo). Também ocorre com mais frequência em estados de [buildingFilter]. Você precisará escolher entre gastar algum [resource] e [stat2] para evitá-lo ou ter sua estabilidade reduzida. Isso desativa algumas habilidades, como construir trabalhadores quando você está em um estado de [buildingFilter2].
To keep [param] from occurring, you will need to keep your [stat] and [resource] higher than normal, which is not ideal. So it is a risk you will always face. Remember to always keep some spare [stat2] and [resource2]. = Para impedir que [param] ocorra, você precisará manter seu [stat] e [resource] acima do normal, o que não é o ideal. Então é um risco que você sempre enfrentará. Lembre-se de manter sempre um pouco de [stat2] e [resource2] de reserva.
[param], [param2], and [param3] are events that only occur when you are lacking [stat]. They may apply debuffs to all the cities you own, which can be a nightmare to deal with. = [param], [param2] e [param3] são eventos que só ocorrem quando falta [stat]. Eles podem aplicar penalidades a todas as cidades que você possui, o que pode ser um pesadelo de lidar.
Luckily, you can use your capital to deal with them. Unluckily, your capitals are limited, so do what you can to prevent the lack of [stat]. = Felizmente, você pode usar seu capital para lidar com elas. Infelizmente, seus capitais são limitados, então faça o que puder para evitar a falta de [stat].
The Events Listed Above are only examples of what could be possible. But remember, when a event occur, as long as you have enough [resource] and [stat] as safety net, you will endure. And there are even sometimes benefits from the negative events. = Os Eventos Listados Acima são apenas exemplos do que pode ser possível. Mas lembre-se: quando um evento ocorrer, desde que você tenha [resource] e [stat] suficientes como rede de segurança, você resistirá. E às vezes até há benefícios dos eventos negativos.
