Decisions reguarding the civilization's internal affair. = Decisões relativas aos assuntos internos da civilização.
Introduction = Introdução
In this decision tab, different actions are unlocked based on to how many [Influence] you have and how many unique action your civilization state has provided you with. = Nesta aba de decisões, diferentes ações são desbloqueadas com base em quanto [Influence] você tem e em quantas ações exclusivas o estado da sua civilização lhe proporcionou.
In each era, you recieve a [Forced Shift In Politic Chance], and when you have more [Influence] than your limit in this era, you can trigger a Shift In Politic in this tab early to provide you with either a chance to unify or a chance to collapse, this grants you freedom on choices of ['Civilization State']. = Em cada era, você recebe uma [Forced Shift In Politic Chance] e, quando tiver mais [Influence] do que seu limite nesta era, pode acionar antecipadamente uma mudança política nesta aba, dando a você a chance de se unificar ou de colapsar; isso lhe dá liberdade na escolha de ['Civilization State'].
Most option will appear when you are unified or have more [Influence] than half of your limit. At the same time, some options only appear when your civilization are divided or have severe debuffs. This tab will help you solve them. = A maioria das opções aparecerá quando você estiver unificado ou tiver mais [Influence] do que metade do seu limite. Ao mesmo tempo, algumas opções só aparecem quando sua civilização está dividida ou sofre penalidades severas. Esta aba ajudará você a resolvê-las.
Total mobilization in all city! = Mobilização total em todas as cidades!
This Decision will instruct all the city to mobilise its [The Levied Army] unit, regardless of the size of city. Usually you need at least 5 Population to [Call to Arms]. = Esta decisão instruirá todas as cidades a mobilizarem sua unidade [The Levied Army], independentemente do tamanho da cidade. Normalmente você precisa de pelo menos 5 de População para [Call to Arms].
By the merit of being [United], the negative [Happiness] from [Call to Arms] is also lessened. For a short amount of time. = Graças a estar [United], a [Happiness] negativa do [Call to Arms] também é reduzida. Por um curto período.
Disband all Levies. = Dissolver todas as Levas.
After Conflict dies down, we may disband our [The Levied Army] units to eliminate negative effects from [Call to Arms]. = Depois que o conflito se acalmar, podemos dissolver nossas unidades [The Levied Army] para eliminar os efeitos negativos do [Call to Arms].
Increase [Influence] through different means. = Aumentar o [Influence] por diferentes meios.
Increase/Decrease Cultural Diversity through different means. = Aumentar/diminuir a Diversidade Cultural por diferentes meios.
Spread our [Influence] to city states. = Espalhar nosso [Influence] pelas cidades-estado.
Costs 1 [Influence] per turn, maintain your diplomatic efforts in city states. = Custa 1 [Influence] por turno; mantém seus esforços diplomáticos nas cidades-estado.
Costs 1 extra [Influence] per turn starting from Imperial era. = Custa 1 [Influence] extra por turno a partir da era Imperial.
Stop Spreading our [Influence] to city states. = Parar de espalhar nosso [Influence] pelas cidades-estado.
Build Agreements (Divided Government Form Special Action) = Estabelecer Acordos (Ação Especial da Forma de Governo Dividida)
Tho our civilization is divided, we are not weak. = Embora nossa civilização esteja dividida, não somos fracos.
Build Agreements (Personal Union Form Special Action) = Estabelecer Acordos (Ação Especial da Forma de União Pessoal)
Commonwealth needs futher cooperation. = A Comunidade precisa de mais cooperação.
Adoption of European Cultures ([Europa] Special Action) = Adoção das Culturas Europeias (Ação Especial [Europa])
Adoption of Schools of Thought ([Warring States] Special Action) = Adoção de Escolas de Pensamento (Ação Especial [Warring States])
Tribe Assembly ([Nomadic Culture] Special Action) = Assembleia Tribal (Ação Especial [Nomadic Culture])
One Step Above Peace. = Um Passo Acima da Paz.
Through costing [Faith] and [Gold], We may propell our civilization into a even more stable state. [Harmony]. = Ao custar [Faith] e [Gold], podemos impulsionar nossa civilização para um estado ainda mais estável: [Harmony].
Increasing Stability. = Aumentar a Estabilidade.
We must take action against the coming chaos. = Precisamos agir contra o caos que se aproxima.
Crisis Solving = Resolução de Crises
A lot of our cities are in a horrible state. We should do what we can to save them. = Muitas das nossas cidades estão em um estado horrível. Devemos fazer o que pudermos para salvá-las.
Changing Economic Policies = Mudar as Políticas Econômicas
If the current economic policies fail to meet the situation... = Se as políticas econômicas atuais não atenderem à situação...
Changing Civilization Form = Mudar a Forma da Civilização
If your [Influence] is somehow above your [Influence Limit]. You can trigger this. = Se seu [Influence] estiver de alguma forma acima do seu [Influence Limit], você pode acionar isto.
We can force the shift in politic to stop our civilization from entering a undesireable route... = Podemos forçar a mudança política para impedir nossa civilização de entrar em uma rota indesejável...
State Reform = Reforma do Estado
Social Reform = Reforma Social
Did you know that this mod has tutorial pages in civilopedia's tutorial section? = Você sabia que este mod tem páginas de tutorial na seção de tutoriais da Civilopédia?
You may want to check them out. = Talvez você queira dar uma olhada neles.
See also: ED - Tutorial Menu = Veja também: ED - Menu de Tutoriais
Actually...I was checking what I can do. = Na verdade... eu estava vendo o que posso fazer.
Nothing happens. = Nada acontece.

See that long list of Resource? You can cut it down a bit. = Está vendo aquela longa lista de recursos? Você pode reduzi-la um pouco.
Hide the essentials. = Ocultar os essenciais.
Including: = Incluindo:
[Influence], [Influence Limit], [Consumption Supply], [Consumption Demand],All the kinds of [Fuel]s, Victroy related resources and the Army Maintenances = [Influence], [Influence Limit], [Consumption Supply], [Consumption Demand], todos os tipos de [Fuel], recursos relacionados à vitória e as manutenções do exército
Show the essentials. = Mostrar os essenciais.
Hide the raw resources. = Ocultar os recursos brutos.
[Horse], [Metal], [Alloy], [Oil] and so on. All the resource on the map or being the prerequisite of buildings and parts productions = [Horse], [Metal], [Alloy], [Oil] e assim por diante. Todos os recursos no mapa ou que sejam pré-requisitos de construções e da produção de peças
Show the raw resources. = Mostrar os recursos brutos.
Hide those parts. = Ocultar essas peças.
[Weapon Parts], [Vehicle Parts], [Ship Parts] and so on and so fourth. = [Weapon Parts], [Vehicle Parts], [Ship Parts] e assim por diante.
Show those parts. = Mostrar essas peças.
Hide those random stuffs. = Ocultar essas coisas aleatórias.
Show those random stuffs. = Mostrar essas coisas aleatórias.
Alright. = Tudo bem.
Hide Strategic Resources = Ocultar Recursos Estratégicos

The structure of our civilization changes to adapt to the time. What path shall we partake? = A estrutura da nossa civilização muda para se adaptar aos tempos. Que caminho devemos seguir?
The most convenient way to change your government form is to let it naturally evolve. When each Era begins, you are forced to have a political shift where you must actively decide what state you want to enter: ['United'] or ['Divided']. = A forma mais conveniente de mudar sua forma de governo é deixá-la evoluir naturalmente. Quando cada Era começa, você é forçado a ter uma mudança política em que deve decidir ativamente em que estado quer entrar: ['United'] ou ['Divided'].
When your [Influence] is reaching over half of the [Influence Limit] without being in low stability, this enables you to unify your civilization = Quando seu [Influence] ultrapassa metade do [Influence Limit] sem estar em baixa estabilidade, isso permite que você unifique sua civilização
Your [Influence] will be reseted back to a certain point below [Influence Limit]. If you can successfully unify your civilization, you will have a lot of [Influence] starting off. = Seu [Influence] será redefinido para um certo ponto abaixo do [Influence Limit]. Se você conseguir unificar sua civilização com sucesso, começará com muito [Influence].
See also: ED - Government Forms = Veja também: ED - Formas de Governo
No significant changes = Sem mudanças significativas
We are still a bunch of countries prone to infighting and invasion, but what we do have is countless oppotunities. = Ainda somos um bando de países propensos a brigas internas e invasões, mas o que temos são inúmeras oportunidades.
Qin has collapsed! = Qin entrou em colapso!
We are able to unify ourselves! = Somos capazes de nos unificar!
The unification has been accomplished by the largest fish in the pond. We are now an unified political entity! = A unificação foi realizada pelo maior peixe do lago. Agora somos uma entidade política unificada!
The empire of the past crumbles... = O império do passado desmorona...
Our unification cannot last onto another stage of the world. Maybe its ultimately for the better, as it was stale. = Nossa unificação não consegue durar até outra fase do mundo. Talvez seja, no fim das contas, para melhor, já que estava estagnada.
Our empire lasts onto another era! = Nosso império perdura até outra era!
Our empire survives... Maybe we can reform it continuesly unto forever. = Nosso império sobrevive... Talvez possamos reformá-lo continuamente para sempre.
Shift in Politic = Mudança política

If an empire is stale in upward mobility, political reform and other essential aspect, it would fall behind, and crumble to ash. = Se um império estiver estagnado em mobilidade social, reforma política e outros aspectos essenciais, ele ficará para trás e se desfará em cinzas.
With some reforms, our empire can adapt to new age without problems. = Com algumas reformas, nosso império pode se adaptar à nova era sem problemas.
Give up your unique civilization form and return to the generic line of unified civilization form. = Desista da sua forma de civilização única e volte à linha genérica da forma de civilização unificada.
Also, you might've ran out of unique government forms because there arent enough of them in the first place. = Além disso, você pode ter ficado sem formas de governo únicas porque, para começar, não há o suficiente delas.
We must prevail at preserving our root. = Devemos prevalecer na preservação de nossas raízes.
Keep your current special civilization form = Manter sua forma de civilização especial atual
Our way of life must be protected. = Nosso modo de vida deve ser protegido.
There needs to be an Emperor = Precisa haver um Imperador
Focus on Centrailizing Power Structure. = Focar na Centralização da Estrutura de Poder.
Our guiding philosophy has been painting a hopeful picture of our future, this reform will lead us closer to it. = Nossa filosofia orientadora vem pintando um quadro esperançoso do nosso futuro; esta reforma nos levará mais perto dele.
Disperse The Power Structure. = Descentralizar a Estrutura de Poder.
We can use our new formed policy. = Podemos usar nossa política recém-formada.
We shall dominate the Land! = Dominaremos a Terra!
Although our empire has stood tall, it would be more efficient if we take the new route... = Embora nosso império tenha permanecido de pé, seria mais eficiente tomarmos a nova rota...
We shall dominate the Ocean! = Dominaremos o Oceano!
We will continue our empire's glory. = Continuaremos a glória do nosso império.
Maybe... having a consistent ruling family and succession law would be better. = Talvez... ter uma família governante consistente e uma lei de sucessão seria melhor.
No avaliable options = Sem opções disponíveis
Yet. = Ainda não.
Reformation of the unified state = Reforma do estado unificado

As the society develops, the social structure of our civilization began to shift. = Conforme a sociedade se desenvolve, a estrutura social da nossa civilização começou a mudar.
Focus on expanding the faith = Focar na expansão da fé
Focus on empowering the leadership = Focar em fortalecer a liderança
Focus on civic advancement = Focar no avanço cívico
Focus on developing trade = Focar no desenvolvimento do comércio
Focus on mitigating incoming societal issue = Focar em mitigar a questão social iminente
This can avoid negative events that natrually occurs because of change of era, but if unhappiness presists, there are still risks of more negative events. = Isso pode evitar eventos negativos que ocorrem naturalmente devido à mudança de era, mas se a infelicidade persistir, ainda há riscos de mais eventos negativos.
Reformation of our society = Reforma da nossa sociedade

We will find ways to make our civilization thrive again! = Encontraremos maneiras de fazer a nossa civilização prosperar novamente!
Building a harmonious civilization is essential = Construir uma civilização harmoniosa é essencial
We can make it so that it takes more to unstablise our civilization = Podemos fazer com que seja mais difícil desestabilizar a nossa civilização
We must make haste before situation gets any worse = Temos de nos apressar antes que a situação piore ainda mais
By investing a vast amount of social-political capital, we can stablise the situation quickly. = Ao investir uma vasta quantidade de capital sociopolítico, podemos estabilizar rapidamente a situação.
Ruling a country requires patience and subtlety = Governar um país exige paciência e sutileza
By carefully planning the route back to normal, we can stablise the situation slowly. = Ao planejar cuidadosamente o caminho de volta à normalidade, podemos estabilizar lentamente a situação.
Can we wait? = Podemos esperar?
We need more contemplation... = Precisamos de mais ponderação...
Stablising our side of the globe = Estabilizar o nosso lado do globo

We must at least do something about the things happening in the cities. = Temos de, pelo menos, fazer algo quanto ao que está acontecendo nas cidades.
Kill the benefactors. = Matar os benfeitores.
Use the loyal army to slay all who dares to oppose our just ruiling! = Usar o exército leal para abater todos os que ousarem se opor ao nosso justo governo!
Subdue the benefactors. = Subjugar os benfeitores.
Use our socio-economical ties to force them give up their schemes. = Usar os nossos laços socioeconômicos para forçá-los a abandonar seus planos.
Use them to our benefits = Usá-los em nosso benefício
I wonder... what would they be trying to do when they have some track records right in our hands? = Pergunto-me... o que tentariam fazer quando temos provas do passado deles em nossas mãos?
Kill the rebels. = Matar os rebeldes.
Subdue the rebels. = Subjugar os rebeldes.
Use our socio-economical ties to force them give up their schemes and join us. = Usar os nossos laços socioeconômicos para forçá-los a abandonar seus planos e se juntarem a nós.
Let them fight our enemies. Let them become 'heros'. = Deixá-los lutar contra os nossos inimigos. Que se tornem 'heróis'.
Remove the Slums immediately! = Remover as Favelas imediatamente!
Force the Slume dwelllers out of their residence... Might be a bad move. = Expulsar os moradores das Favelas de suas casas... Pode ser uma má decisão.
Compromise with the upper classes. = Chegar a um compromisso com as classes altas.
By dealing with the wealth gap directly, we can provide more residential land in the cities, or at least provide better houses. = Ao lidar diretamente com a disparidade de riqueza, podemos disponibilizar mais terrenos residenciais nas cidades ou, pelo menos, proporcionar melhores casas.
If they yearn for place to live, why not go out? = Se anseiam por um lugar para viver, por que não saem?
Crisis Solver = Solucionador de Crises

Our civilization consists of multiple countries. If they do not reach agreement in some way. We are at the danger of being foods on a plate. = A nossa civilização é composta por vários países. Se não chegarem a um acordo de alguma forma, corremos o perigo de sermos comida num prato.
[Military Alliance] is the most practical = [Military Alliance] é a mais prática
[Cultural Exchange] is the most elegant = [Cultural Exchange] é a mais elegante
[Trade Alliance] is the most attractive = [Trade Alliance] é a mais atraente
[Collective Security] secures our footing = [Collective Security] assegura a nossa posição
[Research Exchange] secures our progess = [Research Exchange] assegura o nosso progresso
[Economic Community] secures our interest = [Economic Community] assegura os nossos interesses
To get a ['Agreement'], you should get at least 10 [Influence], or 20 starting from the [Atomic era] = Para obter um ['Agreement'], você deve obter pelo menos 10 [Influence], ou 20 a partir da [Atomic era]
Building Alliance = Formar Aliança

As the civ enters its downfall, the Union crumbles away. = À medida que a civilização entra em decadência, a União desmorona.
No! = Não!
Disolution of Union = Dissolução da União

The current instability in our civilization hinders our development greatly and civil wars may break out. An effort in reaching an internal peace should be made. = A atual instabilidade na nossa civilização impede enormemente o nosso desenvolvimento e podem eclodir guerras civis. Deve-se envidar esforços para alcançar uma paz interna.
Not Yet = Ainda não
State of Instability = Estado de Instabilidade

Some of the cities in our civilization are suffering from severe aftermath of some negative events, maybe we should start dealing with them. = Algumas das cidades da nossa civilização estão sofrendo as graves consequências de alguns eventos negativos; talvez devêssemos começar a lidar com elas.
We need new jobs for the people. = Precisamos de novos empregos para o povo.
The number of [Consumption Demand] increases by [33]% for a fair amount of turns. Which may provide breathing rooms for our economy. = O número de [Consumption Demand] aumenta em [33]% durante um bom número de turnos, o que pode dar um espaço de respiração à nossa economia.
State of Ruins = Estado de Ruínas

Here is the current status of your great civilization! What runs it, What state it is in and so on. = Aqui está o estado atual da sua grande civilização! Quem a governa, em que estado se encontra, e assim por diante.
No direct benefits – default stable state. = Sem benefícios diretos – estado estável por padrão.
Before adopting [Anarchism]: = Antes de adotar o [Anarchism]:
Cannot build [Settler], [Pioneer], [Worker], [Mechanised Worker], [Galley Work Ship], [Modern Work Ship] units = Não é possível construir as unidades [Settler], [Pioneer], [Worker], [Mechanised Worker], [Galley Work Ship], [Modern Work Ship]
After adopting [Anarchism]: = Depois de adotar o [Anarchism]:
No direct penalties – baseline environment. = Sem penalidades diretas – ambiente de base.
I see = Entendo
Present Current Status = Apresentar Estado Atual

As your civilization grows, the [Influence] of the ruler of your civilization fluctuates. Keeping it above a certain thershold will be beneficial for decision making. = À medida que a sua civilização cresce, a [Influence] do seu governante flutua. Mantê-la acima de um certo limiar será benéfico para a tomada de decisões.
We shall arrange a great hunt to show our military prowess! = Organizaremos uma grande caçada para mostrar a nossa proeza militar!
We shall arrange a customary worship of our ancestry. = Organizaremos um culto tradicional aos nossos antepassados.
We shall arrange a great feast to show our wealth! = Organizaremos um grande banquete para mostrar a nossa riqueza!
We shall arrange a marriage in high class society to strengthen our internal ties! = Organizaremos um casamento na alta sociedade para fortalecer os nossos laços internos!
We shall do a military march to demostrate our might! = Faremos uma marcha militar para demonstrar o nosso poder!
Remove the [Influence Maintenance Cost] = Remover o [Influence Maintenance Cost]
Popularity Crisis = Crise de Popularidade

As your civilization grows, the lifestyle of your civilization fluctuates. It is sercretly a deciding factor of what civilization states, their unique and ability would your civilization be able to foster.\nTo do this normally, [20] [Influence] is required. = À medida que a sua civilização cresce, o estilo de vida da sua civilização flutua. É secretamente um fator decisivo para determinar que estados de civilização, unidades e habilidades a sua civilização conseguirá fomentar.\nPara fazer isso normalmente, são necessários [20] [Influence].
Growth requires our culture to suit the needs for new eras. = O crescimento exige que a nossa cultura se adapte às necessidades das novas eras.
I guess we can simply expand our pantheon to include marginalised gods. = Suponho que podemos simplesmente expandir o nosso panteão para incluir deuses marginalizados.
Purity of our nation is the reason why we stood fast to this era. = A pureza da nossa nação é a razão pela qual nos mantivemos firmes até esta era.
Decrease the Cultural Diversity by a level if it hasnt reached lowest level yet. = Diminuir a Diversidade Cultural em um nível, se ainda não tiver atingido o nível mais baixo.
Time to trim the leaves... = Está na hora de podar as folhas...
On the problem of Culture = Sobre o problema da Cultura

To begin our grand exploration, we must have a clear judgement of what we are dealing with. = Para começar a nossa grande exploração, temos de ter uma noção clara daquilo com que estamos lidando.
We shall find new oppotunities across the ocean. = Encontraremos novas oportunidades do outro lado do oceano.
We shall find new oppotunities in the vast wild. = Encontraremos novas oportunidades na vasta natureza selvagem.
Exploration Focus = Foco de Exploração

Our settlement in the new land starts to adopt local plants and herds. If we import these stuff back into our continent. We could gain a lot more profits. = O nosso assentamento na nova terra começa a adotar plantas e rebanhos locais. Se importarmos essas coisas de volta para o nosso continente, poderemos obter muito mais lucros.
We should focus on the new staple crops. = Devemos nos concentrar nas novas culturas de base.
We should focus on the new economic crops. = Devemos nos concentrar nas novas culturas econômicas.
These exotic new animals are quite beautiful. = Esses novos animais exóticos são bastante bonitos.
We should respect the locals and exchange more [culture] = Devemos respeitar os habitantes locais e trocar mais [culture]
Great Exchange = Grande Troca

The [Caste System] is getting harder to maintain by the days. It restricts the upward mobility in our civilization way too much. = O [Caste System] está ficando cada vez mais difícil de manter. Ele restringe demais a mobilidade ascendente na nossa civilização.
We shall abandon the destinied inequality. = Abandonaremos a desigualdade predestinada.
We shall reinerpret it into a more idealistic system. = Vamos reinterpretá-lo num sistema mais idealista.
What would the lower caste do anyway? They dont deserve anything. = O que a casta inferior faria, afinal? Eles não merecem nada.
Casted Away = Rejeição das Castas

As the productivity increases. The absurdity of seeing other people as objects soon came to be realised. People are supporting the abolition. = À medida que a produtividade aumenta, o absurdo de ver outras pessoas como objetos logo passou a ser compreendido. O povo está apoiando a abolição.
Slavery is evil = A escravidão é um mal
But we are the superior race! = Mas nós somos a raça superior!
Abolitionism Strikes = O Abolicionismo Ataca

We call upon our hordes. To combat the nature and our enemies. = Convocamos as nossas hordas para combater a natureza e os nossos inimigos.
Recuit Wild Tribes into our culture = Recrutar Tribos Selvagens para a nossa cultura
Organize a hunt for glory, and additional rations = Organizar uma caçada por glória e rações adicionais
Double Yield from [Camp] for a short amount of time. = Duplica o rendimento de [Camp] por um curto período de tempo.
We should exchange our knowledges amongst our tribes = Devemos trocar conhecimentos entre as nossas tribos
[+1 Science] [in all cities] for a short amount of time. = [+1 Science] [in all cities] por um curto período de tempo.
Elect a new Khan! = Eleger um novo Khan!
Sacrifice all your [Influence] to gain a [Great Khan] unit. If a certain amount of [Influence] is sacrificed, [Great Khan] may also double as a [Great Strategist]. = Sacrifique toda a sua [Influence] para ganhar uma unidade [Great Khan]. Se uma certa quantidade de [Influence] for sacrificada, o [Great Khan] também pode funcionar como [Great Strategist].
Make use of our unified power = Fazer uso do nosso poder unificado
Study the advanced culture of the other civilizations = Estudar a cultura avançada das outras civilizações
Tribe Assembly = Assembleia Tribal

As Enough [Settlement Process] has been gained. We may now futher develop our lands. = Uma vez obtido [Settlement Process] suficiente, podemos agora desenvolver ainda mais as nossas terras.
Now we have stability in hand. = Agora temos estabilidade nas mãos.
Settle Down = Assentar

A talented young prince called Alexander decides that his dream to be the conqueror of the world... = Um jovem e talentoso príncipe chamado Alexandre decide que o seu sonho é ser o conquistador do mundo...
We shall support him at all cost! = Vamos apoiá-lo a todo custo!
Gain access to [Diadochi States] civilization form. = Obter acesso à forma de civilização [Diadochi States].
Too much investment = Investimento excessivo
Alexander the Conqueror = Alexandre, o Conquistador

Alexander the great has died... how could it be? But his generals seems to care less about the death than the power they now holds. = Alexandre, o Grande, morreu... como pôde ser? Mas os seus generais parecem se importar menos com a morte do que com o poder que agora detêm.
The hellenic period begins... = O período helênico começa...
Alexander's death = A morte de Alexandre

One of the mountain tribe has became a power to be recognized. = Uma das tribos da montanha tornou-se uma potência a reconhecer.
What a nice candidate... = Que excelente candidato...
Babylon's Gate remains shut. = O Portão da Babilônia permanece fechado.
Rise of the Persians = Ascensão dos Persas

A radical reformation is occuring in Shang Dynasty by the Emperor Xin, this results in a civil war. = Uma reforma radical está ocorrendo na Dinastia Shang pelo Imperador Xin, o que resulta numa guerra civil.
The Zhou State has won. = O Estado Zhou venceu.
Emperor Xin remain undefeated! = O Imperador Xin permanece invicto!
So called Mandate... = O chamado Mandato...

It seems like a lot of different new ideologies have appeared in our civilization... Maybe some of them are beneficial = Parece que muitas ideologias novas e diferentes surgiram na nossa civilização... Talvez algumas delas sejam benéficas
Daoism = Taoismo
Mohism = Moísmo
School of Diplomacy = Escola da Diplomacia
School of Forms and Names = Escola das Formas e Nomes
School of Naturalists = Escola dos Naturalistas
School of Agrarianism = Escola do Agrarismo
School of Military Strategy = Escola da Estratégia Militar
You need at least 10 [Influence] to adopt a school of thought. = Você precisa de, pelo menos, 10 [Influence] para adotar uma escola de pensamento.
The way to rule = A forma de governar

Qin collapsed, two new leader emerged and is battling it out. Which one of them have won? = Qin ruiu; dois novos líderes emergiram e estão travando batalha. Qual deles venceu?
Liu Bang the slayer of white snake = Liu Bang, o matador da serpente branca
Xiang Yu the dominator = Xiang Yu, o dominador
Collapse of the Great Qin = Colapso do Grande Qin

Europa has a variety of cultures scattered around. Certain culture's futher developments can improve our Civilisation's performance greatly. = A Europa tem uma variedade de culturas espalhadas. O desenvolvimento posterior de certas culturas pode melhorar enormemente o desempenho da nossa Civilização.
Gauls = Gauleses
Albions = Albions
Goths = Godos
Saxons = Saxões
Slavs = Eslavos
You need at least 5 [Influence] and 200 [Gold] to adopt a culture. = Você precisa de pelo menos 5 [Influence] e 200 [Gold] para adotar uma cultura.
The Tribes of Europe = As Tribos da Europa

As the egyptian dynasty countinues to be... a new power in the same region grows... = Enquanto a dinastia egípcia continua a existir... um novo poder cresce na mesma região...
New culture, new blood... = Nova cultura, sangue novo...
Who dares to defy the pharoh? = Quem ousa desafiar o faraó?
Rise of the Punics = Ascensão dos Púnicos

A group of nomadic outsider has migrated and conquered their way into our land... With new ideals and army traditions. = Um grupo de forasteiros nômades migrou e conquistou seu caminho até nossas terras... Com novos ideais e tradições militares.
So begins the Indo-Aryan's leadership in South Asia. = Assim começa a liderança indo-ariana no sul da Ásia.
The Harappans had successfully repelled the invasion. = Os harappanos repeliram a invasão com sucesso.
Aryan Migration = Migração Ariana

A wealthy prince named Siddhartha Gautama has became a great philosopher of sort and started a religious movement following his own ideal... = Um príncipe rico chamado Siddhartha Gautama se tornou uma espécie de grande filósofo e iniciou um movimento religioso seguindo seu próprio ideal...
Maybe... We all need a bit of forgiveness in our life. = Talvez... Todos nós precisamos de um pouco de perdão em nossa vida.
Stops [Maurya Empire] from automatically adopting [Meritocracy]. = Impede o [Maurya Empire] de adotar automaticamente a [Meritocracy].
Heretical Teaching. = Ensinamento Herético.
Buddha's birth = Nascimento de Buda

As a new era arrives, a new culture emerges from the steppes. = Conforme uma nova era chega, uma nova cultura emerge das estepes.
The Scythians Emerges = Os Citas Emergem
The Huns Emerges = Os Hunos Emergem
The Xiong Nu Emerges = Os Xiongnu Emergem
Not yet... = Ainda não...
Emergence of Nations = Surgimento das Nações

Well every story has an end. The Great Commander finally steps down from his position in the army. But how does it play out is a story of its own. = Bem, toda história tem um fim. O Grande Comandante finalmente deixa seu posto no exército. Mas como isso se desenrola é uma história à parte.
Honorable Retirement = Aposentadoria Honrosa
The Great Commander has inspired countless people. His retirement is well deserved. He will be idolised. = O Grande Comandante inspirou inúmeras pessoas. Sua aposentadoria é bem merecida. Ele será idolatrado.
Backstabbed = Apunhalado pelas Costas
Lets just say that there are no perfect man. It would seems like power struggle and other caused this General to step down. Maybe he was too greedy? Too proud of himself? The history can't give a clear answer. = Digamos apenas que não existem homens perfeitos. Parece que a luta pelo poder e outros motivos fizeram este General renunciar. Talvez ele fosse ganancioso demais? Orgulhoso demais de si mesmo? A história não consegue dar uma resposta clara.
Great Commander's Retirement = A Aposentadoria do Grande Comandante

Many different theories has developed around how to manage our civilization's wealth and productions. As the wind of commerce starts to flow. = Muitas teorias diferentes se desenvolveram sobre como administrar a riqueza e a produção da nossa civilização. Conforme o vento do comércio começa a soprar.
If the market is free, then its a good deed = Se o mercado é livre, então é uma boa ação
Profiteers would ruin the country. = Os especuladores arruinariam o país.
Economic Theories = Teorias Econômicas

The Traditional Feudal System crumbles before the new rising bourgeoisie class as industrial revolution continues. Subsequently, bourgeoisies and proletariats revolted against the traditional system, how does the revolution happen? = O sistema feudal tradicional desmorona diante da nova classe burguesa em ascensão, conforme a revolução industrial continua. Em seguida, burgueses e proletários se revoltaram contra o sistema tradicional; como acontece a revolução?
The Revolution has failed. = A Revolução fracassou.
The revolution is dead. The government of nobilities continue their ruling,'Noble Army' strength are increased by a third permanently. = A revolução está morta. O governo dos nobres continua a governar; a força do 'Noble Army' aumenta permanentemente em um terço.
Peaceful Transition. = Transição Pacífica.
Long term societal divide hinders futher policy and economic development. But the revolution have its main goal achieved = A divisão social de longo prazo dificulta o desenvolvimento político e econômico futuro. Mas a revolução alcançou seu principal objetivo.
Both negotiations and conflicts are happening... = Negociações e conflitos estão acontecendo...
The revolution...is chaotic. Some cities have peacefully transitioned their power to the new ruling class, while some starts to infight violently. Our civilization has entered a state of [Struggle]. All [Revolutionaries] gain some basic promotions and the 'Standing Army' gains 5% strength bonus permanently. = A revolução... é caótica. Algumas cidades transferiram pacificamente o poder para a nova classe governante, enquanto outras começam a lutar violentamente entre si. Nossa civilização entrou em um estado de [Struggle]. Todos os [Revolutionaries] ganham algumas promoções básicas e o 'Standing Army' ganha permanentemente um bônus de 5% de força.
Clean the parasites! = Limpe os parasitas!
The revolution violently shaked the basis of our society, but our society is able to leap toward progressiveness! the civilization enters a state of [Strife], but the will of the revolution is well preserved and people are more accepting to societal changes. All Revolutionaries gain many promotions and the 'Standing Army' gains 10% strength bonus permanently. = A revolução abalou violentamente as bases da nossa sociedade, mas nossa sociedade consegue dar um salto rumo ao progresso! A civilização entra em um estado de [Strife], mas a vontade da revolução está bem preservada e as pessoas aceitam melhor as mudanças sociais. Todos os Revolutionaries ganham muitas promoções e o 'Standing Army' ganha permanentemente um bônus de 10% de força.
Bourgeoisie Revolution! = Revolução Burguesa!

Through out the history of our grand civilization, what aspect should guide us to the future? = Ao longo da história da nossa grandiosa civilização, que aspecto deve nos guiar rumo ao futuro?
We have no history! = Nós não temos história!
How does one get conservative with no tradition to begin with? = Como alguém se torna conservador sem ter tradição, para começar?
We have no history? = Nós não temos história?
We have no history... = Nós não temos história...
The Gods = Os Deuses
The polytheistic root of our faith leads us to splendor, we are the most blessed out of all civilization in the world. = A raiz politeísta da nossa fé nos conduz ao esplendor; somos os mais abençoados de todas as civilizações do mundo.
Our Lord = Nosso Senhor
The monotheistic root of our faith leads us to connect with the truth, the faith is our sword and our plow. = A raiz monoteísta da nossa fé nos leva a nos conectar com a verdade; a fé é a nossa espada e o nosso arado.
Our will to unite = Nossa Vontade de nos Unir
The power of unity has guided us through most of our history, without it, where would we be? = O poder da união nos guiou ao longo da maior parte da nossa história; sem ele, onde estaríamos?
Our wisdom = Nossa Sabedoria
Our civilization were once master of philosophy. They lived with great wisdom and we shall never give it up. = Nossa civilização já foi mestre da filosofia. Viveram com grande sabedoria e jamais a abandonaremos.
Our honor = Nossa Honra
Our civilization were once the most honored warriors. They died with honor and we shall never give it up. = Nossa civilização já teve os guerreiros mais honrados. Morreram com honra e jamais a abandonaremos.
Our wealth = Nossa Riqueza
Our civilization were once the smartest traders. They left us with all the capital and insights so that we may stay flourished = Nossa civilização já teve os comerciantes mais astutos. Deixaram-nos todo o capital e os conhecimentos para que possamos continuar prósperos.
Our noble bloodline = Nossa Linhagem Nobre
Our ruiling class has the purest blood with virtues passing down from father to son, we will stay true to the noble blood. = Nossa classe governante tem o sangue mais puro, com virtudes transmitidas de pai para filho; permaneceremos fiéis ao sangue nobre.
Our efficient bureaucracy = Nossa Burocracia Eficiente
The fair and great system our ancestor has passed onto us is a testament to our longevity. = O sistema justo e grandioso que nossos antepassados nos legaram é um testemunho da nossa longevidade.
Our divinity = Nossa Divindade
Our civilization has engraved our faith into everything, we are reaching for ultimate goals. = Nossa civilização gravou nossa fé em tudo; estamos alcançando objetivos supremos.
Our humanitarianistic view = Nossa Visão Humanitária
We are the pioneer for progressive value to love all human beings. We will spread our care to the world for it to become a better place. = Somos os pioneiros do valor progressista de amar todos os seres humanos. Levaremos nosso cuidado ao mundo para que se torne um lugar melhor.
Our globe-spanning empire = Nosso Império de Alcance Global
We must maintain dominant and make sure things go our ways. = Devemos nos manter dominantes e garantir que as coisas corram a nosso favor.
Our glorious empire = Nosso Império Glorioso
Flower and Beauty doesnt keep our splendor. Iron and Blood Does! = Flores e beleza não preservam nosso esplendor. Ferro e sangue sim!
The Legacy We Inhereited. = O Legado que Herdamos.

As the gap between classes widen, the capitalists started to go overboard with their mistreatment of the working class. After struggles in the politics and countless protest, another revolution has unveiled. The Bourgeoisie had it coming... But how did this went down? = Conforme a lacuna entre as classes se alarga, os capitalistas começaram a exagerar no mau tratamento da classe trabalhadora. Após lutas na política e inúmeros protestos, outra revolução se desencadeou. A burguesia mereceu... Mas como isso aconteceu?
Do not let them pass! = Não os deixem passar!
The government and all the left wing power has sucessfully stopped Facists from taking over the civilization. = O governo e todas as forças de esquerda impediram com sucesso os fascistas de tomarem conta da civilização.
For the Leader! = Pelo Líder!
The Facists and their paramilitary militias took over the most important cities and then gradually took over the entire civilization by storm. = Os fascistas e suas milícias paramilitares tomaram as cidades mais importantes e depois, gradualmente, tomaram de assalto toda a civilização.
Fascist Revolution! = Revolução Fascista!

The revolution is dead. The government of capitalists continue their ruling, our civilization enters a state of [Struggle], But the route to Conservatism is unlocked = A revolução está morta. O governo dos capitalistas continua a governar; nossa civilização entra em um estado de [Struggle], mas o caminho para o Conservadorismo fica desbloqueado.
Socialist Democracy will save the day.. = A Democracia Socialista salvará o dia..
Is this even a revolution when at least half of the bourgeoisie are still up on their place? Who knows. The conflict is resolved peacefully but there are long term consequences toward policy and industry development, [Planned Economy] is not available in this route. = Isso é mesmo uma revolução quando pelo menos metade da burguesia continua em seu lugar? Quem sabe. O conflito é resolvido pacificamente, mas há consequências de longo prazo para o desenvolvimento das políticas e da indústria; [Planned Economy] não está disponível nesta via.
The Workers have nothing to lose but their chains, they have a world to win. = Os trabalhadores nada têm a perder além de suas correntes; têm um mundo a ganhar.
promotions.One revolt, followed by many, the capitalist system died by a thousand cut. And a new nation ruled by workers is built. Our civilization enters [Struggle] due to the civil war. Newly born [Red Army Troop] now have more promotions. = Uma revolta, seguida por muitas; o sistema capitalista morreu por mil cortes. E uma nova nação governada pelos trabalhadores é construída. Nossa civilização entra em [Struggle] devido à guerra civil. Os recém-criados [Red Army Troop] agora têm mais promoções.
Workers, Farmers, Soldiers, Students, all shall be united to bring down the capitalists! = Trabalhadores, agricultores, soldados, estudantes, todos se unirão para derrubar os capitalistas!
Compare to a worker's revolution, this revolution is a combined effort of all proletariats alike, althought that makes the process of revolution much faster, but the organization of the new country is much more complicated. Our Civilization enters [Strife], New [Red Army Troop] specialises into command promotion. = Em comparação com uma revolução operária, esta revolução é um esforço conjunto de todos os proletários, o que, embora torne o processo da revolução muito mais rápido, torna a organização do novo país muito mais complicada. Nossa civilização entra em [Strife]; os novos [Red Army Troop] se especializam em promoção de comando.
Socialist Revolution! = Revolução Socialista!

The revolution is dead. The government of capitalists continue their ruling, our civilization enters a state of [Struggle], But the route to Conservatism is unlocked. = A revolução está morta. O governo dos capitalistas continua a governar; nossa civilização entra em um estado de [Struggle], mas o caminho para o Conservadorismo fica desbloqueado.
What we proclaim is the Right to Well-Being; Well-Being for All! = O que proclamamos é o Direito ao Bem-Estar; Bem-Estar para Todos!
One revolt, followed by many, the capitalist system died by a thousand cut. There are no oppressions anymore. We have eliminated those ticks. Now is the time we enter [Anarchy] and turn it into something else. = Uma revolta, seguida por muitas; o sistema capitalista morreu por mil cortes. Não há mais opressões. Eliminamos esses parasitas. Agora é o momento de entrarmos em [Anarchy] e transformá-lo em outra coisa.
Installs Anarchist Ruling in all of your cities,an alternative ruling style ('Political Building') that replaces the intergration. It is free and built instantly, only providing small amount of debuff and needs Commune to be built to nullify its downsides. = Instala o Governo Anarquista em todas as suas cidades, um estilo de governo alternativo ('Political Building') que substitui a integração. É gratuito e construído instantaneamente, fornecendo apenas uma pequena penalidade, e precisa de uma Comuna construída para anular suas desvantagens.
Anarchist Revolution! = Revolução Anarquista!

We've rebuilt our government in pursuit to adapt to the new era, but the current economy policy is outdated. We will need a economy reform before we can do anything else. = Reconstruímos nosso governo em busca de nos adaptar à nova era, mas a atual política econômica está desatualizada. Precisaremos de uma reforma econômica antes de podermos fazer qualquer outra coisa.
Free Market = Mercado Livre
We should believe in the unseen hand and solve all our problems with massive amount of capitals. = Devemos acreditar na mão invisível e resolver todos os nossos problemas com grandes quantidades de capital.
The unseen hand of market economy is not to be fully relied upon. We should spend effort to properly and use more refined policy to guide our nation's productivity. = A mão invisível da economia de mercado não deve ser totalmente confiada. Devemos nos empenhar em usar políticas mais refinadas para orientar a produtividade da nossa nação.
Stability First = Estabilidade Primeiro
Our economy must serve the national unity first and formost, nothing is impossible when our nation is strong and its people united. = Nossa economia deve servir, antes de mais nada, à unidade nacional; nada é impossível quando nossa nação é forte e seu povo está unido.
The might of our military overshadows any greed! = O poderio do nosso exército ofusca qualquer ganância!
Nothing is beyond the power of winning in a direct conflict. We must direct all our effort into military! = Nada supera o poder de vencer em um conflito direto. Devemos direcionar todo o nosso esforço para o exército!
Centralised Economic Planning = Planejamento Econômico Centralizado
The market economy only benefits capitalists and speculators, our new socialist economy should maximise our development potential and distributes the goods to those who need it. = A economia de mercado só beneficia capitalistas e especuladores; nossa nova economia socialista deve maximizar nosso potencial de desenvolvimento e distribuir os bens a quem precisa.
Decentralised Economy = Economia Descentralizada
The economy suffered from monopoly and hierarchy, we should liberate the economy in favour of enabling peoples'agency to work for the masses. With nationalised industries and policies being guiding forces. = A economia sofreu com o monopólio e a hierarquia; devemos libertar a economia em favor de permitir que a agência do povo trabalhe para as massas, com as indústrias nacionalizadas e as políticas como forças orientadoras.
Self-Management Economy = Economia de Autogestão
Worker should take the matter into their own hands instead of being some subjects of any greater entities. Mutualism and free will shall reign surpreme. = Os trabalhadores devem tomar as rédeas em suas próprias mãos, em vez de serem súditos de quaisquer entidades maiores. O mutualismo e o livre-arbítrio reinarão supremos.
New Economic Policies = Novas Políticas Econômicas

The previous policies may have proven to be less potent. A rearrangement is thus needed. = As políticas anteriores podem ter se mostrado menos eficazes. Uma reorganização é, portanto, necessária.
Changing economy policies = Mudar políticas econômicas

Here is a list of all of your active missions and their win conditions. = Aqui está uma lista de todas as suas missões ativas e suas condições de vitória.
Build a Foundry! = Construa uma Fundição!
Unify your civilization under an Empire using [Enact Policies]. = Unifique sua civilização sob um Império usando [Enact Policies].
Adopt at least [1] policy in either [Monotheism] or [Polytheism]. = Adote pelo menos [1] política em [Monotheism] ou [Polytheism].
Complete [4] side quests. = Complete [4] missões secundárias.
Keep your civilization above [Anarchy]! = Mantenha sua civilização acima de [Anarchy]!
Build [The Great Library]! = Construa [The Great Library]!
Historically, Aside from the Great Library of Alexandria, the Library of Ashurbanipal, which is the Royal Library of Akkad, it was also renowned for holding the entire [The Epic of Gilgamesh] and dates further back, around 900BC. = Historicamente, além da Grande Biblioteca de Alexandria, a Biblioteca de Assurbanípal, que é a Biblioteca Real de Acádia, também era famosa por conter todo o [The Epic of Gilgamesh] e remonta a uma época ainda mais antiga, por volta de 900 a.C.
And you are probably building it too early. = E você provavelmente está construindo-a cedo demais.
One of the seven olde wonder of the western world. It was built around 600BC and nowadays we build it on every so called green highrises. = Uma das sete antigas maravilhas do mundo ocidental. Foi construída por volta de 600 a.C. e hoje em dia a construímos em todos os chamados arranha-céus verdes.
We have no idea where Tin, the most important ore in bronze making came from, but the traders came from mediterranean sea. So estabilishing a trading hub in the land of Canaan seems to be the way. = Não fazemos ideia de onde vinha o estanho, o minério mais importante na fabricação do bronze, mas os comerciantes vinham do mar Mediterrâneo. Portanto, estabelecer um polo comercial na terra de Canaã parece ser o caminho.
And you need to get enough [Pearl] by whatever means possible to conpete in mediterranean markets. = E você precisa obter [Pearl] suficiente por todos os meios possíveis para competir nos mercados mediterrâneos.
Trade with North African Civilization! = Comercie com a Civilização Norte-Africana!
Estabilish the [Incense] trade on the national level will encourge trade relation between our lower classes. And these egyptians are dubiously never lacking on wheats... For whatever reason. = Estabelecer o comércio de [Incense] em nível nacional incentivará as relações comerciais entre nossas classes mais baixas. E esses egípcios, de forma duvidosa, nunca têm falta de trigo... Seja por qual razão for.
We can give them some good quality copper... wait, they also have that? = Podemos dar a eles um pouco de cobre de boa qualidade... espera, eles também têm isso?
In Emperors and Deities, Trading luxuries increases output of certain ['Economic Building']s as oppose to increasing [Happiness]. = Em Emperors and Deities, negociar artigos de luxo aumenta a produção de certos ['Economic Building']s, em vez de aumentar a [Happiness].
Build [6] [Town Hall]s! = Construa [6] [Town Hall]s!
Nothing Encourages Unity more than the promise of giving land! = Nada incentiva mais a união do que a promessa de doar terras!
Explore and improve more than 10 units of [Horse]! = Explore e melhore mais de 10 unidades de [Horse]!
A tile north of [Nippur] has [4] [Horse]! You may find more horses in the north eastern mountain ranges. = Um terreno ao norte de [Nippur] tem [4] [Horse]! Você pode encontrar mais cavalos nas cordilheiras a nordeste.
Mission List = Lista de Missões

Well this tip is gonna appear every turn to annoy you out of playing the wrong civ. Maybe in the future Egypt will be playable in this scenario but the map isnt made for them. = Bem, esta dica vai aparecer em todos os turnos para te incomodar até você parar de jogar com a civilização errada. Talvez no futuro o Egito seja jogável neste cenário, mas o mapa não foi feito para eles.
Nope Nope Nope. = Não, não, não.
Hey, choose [Central and West Asia] for this scenario! = Ei, escolha [Central and West Asia] para este cenário!
Spark of Civilization: Wrong Civilization = Centelha da Civilização: Civilização Errada

Welcome to the Emperors and Deities mod. \nOne of the biggest unciv ruleset. \nAlthough the content of the mod is vast, the story takes place in roughly the same place as the original civilization series. Namely the Journey of Humanity. \nThe mod greatly expands the technological progess, element of customization and many other aspects of civ. It is going to be a bumpy ride so strap in. = Bem-vindo ao mod Emperors and Deities. \nUm dos maiores rulesets do Unciv. \nEmbora o conteúdo do mod seja vasto, a história se passa sensivelmente no mesmo lugar que a série Civilization original, a saber, a Jornada da Humanidade. \nO mod expande grandemente o progresso tecnológico, os elementos de personalização e muitos outros aspectos da civilização. Vai ser uma viagem atribulada, então aperte o cinto.
Start the Tutorial = Iniciar o Tutorial
Dont forget to check civilipedia if you are in need of understanding certain mechanics. = Não se esqueça de consultar a civilopedia se precisar de entender certas mecânicas.
Mesopotamia, Spark of Civilization, 4000BCE = Mesopotâmia, Centelha da Civilização, 4000 a.C.

You have the city of Uruk under your control as the center of your civilization. \nIt controls some lands which provides food and trade. Which abstracts into gold production. \nIn the city, there are populations, which includes the people working on the lands. = Você tem a cidade de Uruk sob seu controle como o centro da sua civilização. \nEla controla algumas terras que fornecem comida e comércio, o que, em termos abstratos, se traduz na produção de ouro. \nNa cidade há populações, que incluem as pessoas que trabalham nas terras.
Whats my job? = Qual é o meu trabalho?
Your job in every game is to send [Settler]s, build cities and manage them along with a bunch of units. That is the most basic gameplay that civilization series has to offer. However, Emperors and Deities brings more outside factors to this gameplay. = Seu trabalho em cada jogo é enviar [Settler]s, construir cidades e gerenciá-las junto com várias unidades. Essa é a jogabilidade mais básica que a série civilization tem a oferecer. Porém, Emperors and Deities traz mais fatores externos para essa jogabilidade.
----- = -----
In this mission you need to build a [Foundry] to jump start the production of bronze to boost your city's [Production]. Afterwhich is another new mission. And so on and so fourth, if you are able to complete all missions thats labeled as main quests, you will win this scenario. = Nesta missão você precisa construir uma [Foundry] para dar o pontapé inicial na produção de bronze e impulsionar a [Production] da sua cidade. Depois vem outra missão nova. E assim por diante; se você conseguir completar todas as missões marcadas como missões principais, vencerá este cenário.
New Main Quest: Into The Bronze Age, 4000BCE = Nova Missão Principal: Rumo à Idade do Bronze, 4000 a.C.

With the increase of productivity, population grows, and risk of over population forced some people to set off to new lands. = Com o aumento da produtividade, a população cresce, e o risco de superpopulação forçou algumas pessoas a partirem para novas terras.
I wonder if they would stay by our side... = Será que eles vão ficar do nosso lado...
[Settler] Units can create new cities, which is absolutely essential for expanding. Every new city settled is a new production line of unit and buildings. = Unidades [Settler] podem criar novas cidades, o que é absolutamente essencial para expandir. Cada nova cidade fundada é uma nova linha de produção de unidades e construções.
As for how loyal would they be? Well, the game doesnt allow them to rebel. However, new cities will take a big chunk of happiness away from you since the governing body of your civilization have to diverge their power. = E quanto à lealdade deles? Bem, o jogo não permite que eles se rebelem. Porém, novas cidades tiram uma boa parte da sua felicidade, já que o corpo governante da sua civilização precisa dividir seu poder.
Low happiness can wreck havoc on unsuspecting civilizations as they decrease [Influence] and make negative events occur more often. = A baixa felicidade pode causar estragos em civilizações desavisadas, pois diminui a [Influence] e faz eventos negativos ocorrerem com mais frequência.
ALSO, LUXURY DOESNT PROVIDE HAPPINESS NATURALLY IN THIS MOD. = ALÉM DISSO, NESTE MOD OS ITENS DE LUXO NÃO FORNECEM FELICIDADE NATURALMENTE.
Quest Reward: Into The Bronze Age, 4000BCE = Recompensa da Missão: Rumo à Idade do Bronze, 4000 a.C.

A brilliant Semitic leader named Sargon has risen in the north. His military innovations and administrative talent promise to unite all of Mesopotamia. This is not a threat but an opportunity. Will you embrace unity or preserve the old city-states? = Um brilhante líder semita chamado Sargão surgiu no norte. Suas inovações militares e seu talento administrativo prometem unir toda a Mesopotâmia. Isso não é uma ameaça, mas uma oportunidade. Você vai abraçar a unidade ou preservar as antigas cidades-Estado?
An Empire rises before my eyes! = Um Império surge diante dos meus olhos!
The united realm will share knowledge and resources. = O reino unido compartilhará conhecimento e recursos.
Maintain the independence of city-states! = Mantenha a independência das cidades-Estado!
Sargon fails at his mission. The cities remain separate but cooperate through trade and mutual defense. Or not? = Sargão falha em sua missão. As cidades permanecem separadas, mas cooperam por meio do comércio e da defesa mútua. Ou não?
Sargon's Reign, 2334BCE = O Reinado de Sargão, 2334 a.C.

Whether through alliance or federation, the time has come to formalize the political structure of your civilization. Use the [Enact Policies] decision in your capital to consolidate your rule. If you have enough Influence, you can declare a unified empire. This will unlock new government bonuses and prepare you for future challenges. = Seja por meio de aliança ou federação, chegou a hora de formalizar a estrutura política da sua civilização. Use a decisão [Enact Policies] na sua capital para consolidar seu domínio. Se você tiver Influência suficiente, poderá declarar um império unificado. Isso desbloqueará novos bônus de governo e o preparará para os desafios futuros.
How do I unify? = Como eu me unifico?
Open the city screen of your capital, find the [Enact Policies] building, and choose the option 'We are able to unify ourselves!' when you have at least half of your Influence Limit. = Abra a tela da cidade da sua capital, encontre o edifício [Enact Policies] e escolha a opção 'Somos capazes de nos unificar!' quando você tiver pelo menos metade do seu Limite de Influência.
New Main Quest: Unify Mesopotamia, 2200BCE = Nova Missão Principal: Unificar a Mesopotâmia, 2200 a.C.

And so, the mesopotamian became the soverign owner of their own region. The legacy of Sargon will last. = E assim, os mesopotâmios se tornaram os donos soberanos de sua própria região. O legado de Sargão vai durar.
United and Stronger than ever. = Unidos e mais fortes do que nunca.
Quest Reward: Unify Mesopotamia, 2200BCE = Recompensa da Missão: Unificar a Mesopotâmia, 2200 a.C.

You have declined the offer of unification, which is an interesting choice. However, there is always another way to strengthen your civilization's unity. = Você recusou a oferta de unificação, o que é uma escolha interessante. Porém, sempre há outra forma de fortalecer a unidade da sua civilização.
A pantheon? Or something greater... = Um panteão? Ou algo maior...
Choose between the [Polytheism] or [Monotheism], besides a unifying government that grants powerful uniques, you can also build a religion that outlive it. = Escolha entre [Polytheism] ou [Monotheism]; além de um governo unificador que concede habilidades únicas poderosas, você também pode construir uma religião que sobreviva a ele.
New Main Quest: A House Divided, 2200BCE = Nova Missão Principal: Uma Casa Dividida, 2200 a.C.

And so, although history's tide changes, a long lasting faith system starts spreading along with all the glory of the west asian civilization = E assim, embora a maré da história mude, um sistema de fé duradouro começa a se espalhar junto com toda a glória da civilização da Ásia Ocidental
Interesting = Interessante
Quest Reward: A House Divided, 2200BCE = Recompensa da Missão: Uma Casa Dividida, 2200 a.C.

The Wheel of history turns its tide, the empire of akkad didnt last. But the west asian civilization is now going through an era of prosperity, complete 4 side quests and \n Prepare for the inevitable. = A Roda da história muda sua maré, o império de akkad não durou. Mas a civilização da Ásia Ocidental está agora passando por uma era de prosperidade; complete 4 missões secundárias e \n Prepare-se para o inevitável.
You may check the list of available side quests by [Check Mission List] in capital. = Você pode conferir a lista de missões secundárias disponíveis por meio de [Check Mission List] na capital.
New Main Quest: The Old Babylon, 1900BCE = Nova Missão Principal: A Velha Babilônia, 1900 a.C.

You have built a nation of prosperity, now its time for durability test. = Você construiu uma nação próspera; agora é hora do teste de durabilidade.
What are you talking about? = Do que você está falando?
Quest Reward: The Old Babylon, 1900BCE = Recompensa da Missão: A Velha Babilônia, 1900 a.C.

For whatever reason, a volcano event far far away has triggered an agricultural disaster across the entire ancient world.\nOld order is crumbling. Civilizations across the eastern Mediterranean are falling to famine, rebellion, and the loss of trade routes. But here in Mesopotamia, your leadership will determine whether our light fades or endures. Over the next 15 turns, you will face a series of crises. Each requires wise use of Influence and Gold. = Seja qual for o motivo, uma erupção vulcânica muito distante desencadeou um desastre agrícola em todo o mundo antigo.\nA velha ordem está ruindo. Civilizações em todo o Mediterrâneo oriental estão sucumbindo à fome, à rebelião e à perda de rotas comerciais. Mas aqui na Mesopotâmia, sua liderança determinará se nossa luz se apaga ou perdura. Nos próximos 15 turnos, você enfrentará uma série de crises. Cada uma exige o uso sensato de Influência e Ouro.
What must I do? = O que eu devo fazer?
Over the following turns, disasters will strike: drought, civil unrest, economic collapse. Use the [Influence], [Enact Policies] and your stored resources to mitigate them. Survive all 15 turns to complete the tutorial and unlock a special reward. = Ao longo dos turnos seguintes, desastres vão acontecer: seca, agitação civil, colapso econômico. Use a [Influence], o [Enact Policies] e seus recursos armazenados para mitigá-los. Sobreviva aos 15 turnos para completar o tutorial e desbloquear uma recompensa especial.
New Main Quest: Survive the Bronze Age Collapse, 1200BCE = Nova Missão Principal: Sobreviva ao Colapso da Idade do Bronze, 1200 a.C.

You have completed a side quest! This glorious deed will be recorded in the global history. = Você completou uma missão secundária! Este feito glorioso ficará registrado na história global.
Our story continues! = A nossa história continua!
Side Quest Completion = Conclusão de Missão Secundária

The harvest has failed. Food stores are empty, and people are beginning to starve. Entire villages started to escape for survival. = A colheita fracassou. Os estoques de comida estão vazios e as pessoas estão começando a passar fome. Aldeias inteiras começaram a fugir para sobreviver.
Distribute emergency grain = Distribua cereais de emergência
The granaries opened. Providing much needed food sourced from both emergency storage and grains bought in a hurry... for now. = Os celeiros abriram. Fornecendo alimentos muito necessários, provenientes tanto do estoque de emergência quanto de grãos comprados às pressas... por enquanto.
Import Grains from Egypt = Importe Grãos do Egito
Although Egypt also suffers from this horrible disaster. You managed to maintain a desperate alliance between the civilizations and kept the people fed. = Embora o Egito também sofra com esse desastre horrível. Você conseguiu manter uma aliança desesperada entre as civilizações e manteve o povo alimentado.
... = ...
The granaries are emptied! They were already sold by greedy nobles and merchants who also directed the hatred to the leader! = Os celeiros estão vazios! Eles já tinham sido vendidos por nobres e mercadores gananciosos, que também direcionaram o ódio para o líder!
Drought and Famine = Seca e Fome

Ambitious nobilities stopped their pursuit of expansion due to the disaster, however that only lead them into power struggle with each others, with the worsening global starvation, the Barbarians are invading as well. = Nobrezas ambiciosas pararam sua busca por expansão devido ao desastre; no entanto, isso apenas as levou a uma luta pelo poder entre si. Com a fome global piorando, os Bárbaros também estão invadindo.
We must do something about it! = Precisamos fazer algo a respeito!
Tighten the Rulership. The amount of [Town Hall]s will lessen the rebellions. = Reforce o governo. A quantidade de [Town Hall]s reduzirá as rebeliões.
Let them come! = Deixe-os vir!
Certainly, you have an army, why not use them? = Certamente, você tem um exército; por que não usá-lo?
Usurpers and Barbarians = Usurpadores e Bárbaros

The tin routes from distant lands have been severely impacted by the disaster. Without metals, your artisans cannot produce bronze weapons or tools. Production slows across the empire. = As rotas de estanho vindas de terras distantes foram severamente afetadas pelo desastre. Sem metais, seus artesãos não conseguem produzir armas ou ferramentas de bronze. A produção desacelera em todo o império.
Fix the route then. = Então conserte a rota.
Because you have done the related side quest. You have enough [Pearl]s to buy up all the remaining tins on the market! If you can still call it a market. = Porque você completou a missão secundária relacionada. Você tem [Pearl]s suficientes para comprar todo o estanho restante no mercado! Se ainda dá para chamar isso de mercado.
Try to ration the material! = Tente racionar o material!
A correct call. = Uma decisão correta.
Encourage local alternatives. = Incentive alternativas locais.
Downgrading the tool to pure copper, stone and bone is the desperate, but essential move. = Rebaixar as ferramentas para cobre puro, pedra e osso é a jogada desesperada, porém essencial.
Trade Collapse = Colapso do Comércio

Scribes are fleeing the cities to avoid conscription and taxes. The art of writing is being forgotten. Your scientific progress halts. = Os escribas estão fugindo das cidades para evitar o recrutamento e os impostos. A arte da escrita está sendo esquecida. Seu progresso científico estagna.
Reward those who stayed. Punish those who fleed. = Recompense os que ficaram. Castigue os que fugiram.
Maintaining the order. = Mantendo a ordem.
We have [The Great Library] = Nós temos [The Great Library]
Well. We always have backups in the royal library. = Bem. Sempre temos backups na biblioteca real.
Without scribes, records are lost. Generations of knowledges are lost to time. = Sem escribas, os registros se perdem. Gerações de conhecimento se perdem no tempo.
Loss of Writing = Perda da Escrita

It is appearent that the gods are angry that such a disaster has struck... The priests are recieveing a lot of backlash because of this. And the power structure of the entire region has been weakened = É evidente que os deuses estão furiosos por tal desastre ter acontecido... Os sacerdotes estão recebendo muita reação negativa por causa disso. E a estrutura de poder de toda a região foi enfraquecida
Trample the heretic! = Esmague o herege!
Change [Hanging Gardens] to a site of worship and force the priests to pray to the god of fertility = Transforme os [Hanging Gardens] em um local de adoração e force os sacerdotes a rezar ao deus da fertilidade
This does absolutely nothing, but peoples are slightly less angry and let it slipped. = Isso não faz absolutamente nada, mas o povo fica um pouco menos irritado e deixa passar.
Without powerful priests, the sacredness of the throne isn't secure any more.. This leads to even more man-mode disasters. = Sem sacerdotes poderosos, a sacralidade do trono não está mais segura.. Isso leva a ainda mais desastres causados pelo homem.
Loss of Faith = Perda da Fé

The crises have passed. Mesopotamia is battered but alive. Your decisions have shaped the survival of civilization itself. One last choice awaits. = As crises passaram. A Mesopotâmia está abalada, mas viva. Suas decisões moldaram a sobrevivência da própria civilização. Uma última escolha o aguarda.
Look to the future (Tutorial Completion) = Olhe para o futuro (Conclusão do Tutorial)
You have completed the Spark of Civilization tutorial. Your people will remember your leadership. = Você completou o tutorial A Centelha da Civilização. Seu povo se lembrará da sua liderança.
Thank you for playing this scenario! = Obrigado por jogar este cenário!
Just another turn... = Só mais um turno...
You may keep playing the tutorial, but thats that. = Você pode continuar jogando o tutorial, mas é só isso.
The Final Hour = A Hora Final


