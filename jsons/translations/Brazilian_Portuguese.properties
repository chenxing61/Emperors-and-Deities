In a united civilization, without much outer threat. The desire for advancement became lower day by day. = Em uma civilização unida, sem muita ameaça externa, a vontade de progredir foi diminuindo a cada dia.
We are too big to fall. It wouldnt matter either way. = Somos grandes demais para cair. De qualquer jeito, não faria diferença.
