Though the disorder can be better controlled in a small civilization, but it still needs a permanent solution. = Embora a desordem possa ser melhor controlada em uma civilização pequena, ainda assim precisa de uma solução permanente.
Chaos Spreading = Caos se Espalhando

As our civilization became united and peaceful. Less and less people are willing to join the army. = À medida que nossa civilização se tornou unida e pacífica, cada vez menos pessoas estão dispostas a se juntar ao exército.
Even if we force them into military service, these weak men would not suffice either way. = Mesmo que os forcemos ao serviço militar, esses homens fracos não seriam suficientes de qualquer forma.
The number of [Standing Army Maintenance] and [Noble Army Maintenance] decreases to [75]% for a fair amount of turns. Which may impact our military in both size and strength. = O número de [Standing Army Maintenance] e [Noble Army Maintenance] diminui para [75]% durante uma boa quantidade de turnos, o que pode afetar nosso exército tanto em tamanho quanto em força.
Unacceptable. = Inaceitável.
