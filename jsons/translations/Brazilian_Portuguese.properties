See also: Great Strategist = Veja também: Grande Estrategista
See also: War Machine Blueprint = Veja também: Projeto da Máquina de Guerra

ED - Expansions, Consolidation and Modernization = ED - Expansão, Consolidação e Modernização
City development is organized into three tiers of building packages: "Expansion", "Consolidation", and "Modernization". = O desenvolvimento urbano é organizado em três níveis de pacotes de construções: "Expansão", "Consolidação" e "Modernização".
How packages work: Each package lets you build multiple related buildings at once, saving [stat] and ensuring that development becomes easier with tech investment. Packages become available as you progress through eras. For example, [buildingFilter] builds [buildingFilter2], [buildingFilter3], and [buildingFilter4] together and is unlocked by [tech]. = Como os pacotes funcionam: cada pacote permite construir várias construções relacionadas de uma vez, economizando [stat] e garantindo que o desenvolvimento fique mais fácil com o investimento em tecnologia. Os pacotes ficam disponíveis conforme você avança pelas eras. Por exemplo, [buildingFilter] constrói [buildingFilter2], [buildingFilter3] e [buildingFilter4] juntos e é desbloqueado por [tech].
"Expansion": \nCovers basic buildings which form the foundation of any town. Which are mostly unlocked before [buildingFilter] = "Expansão": \nAbrange as construções básicas que formam a fundação de qualquer cidade. São majoritariamente desbloqueadas antes de [buildingFilter]
"Consolidation" \nCovers buildings that forms a proper city and make it useful. Which are mostly unlocked starting from [buildingFilter] and before [buildingFilter2]. = "Consolidação" \nAbrange as construções que formam uma cidade de verdade e a tornam útil. São majoritariamente desbloqueadas a partir de [buildingFilter] e antes de [buildingFilter2].
"Modernization" \nCovers buildings that makes a city that is considered modernized. Which are mostly unlocked starting from [buildingFilter]. You wouldn't live without them in real life. = "Modernização" \nAbrange as construções que fazem uma cidade considerada modernizada. São majoritariamente desbloqueadas a partir de [buildingFilter]. Você não viveria sem elas na vida real.

