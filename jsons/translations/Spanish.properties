ED - Government Forms = ED - Formas de gobierno
(This mechanic does exist in BNW, but the author of this mod never copied that.) = (Esta mecánica sí existe en BNW, pero el autor de este mod nunca la copió.)
Government forms like [buildingFilter] and [buildingFilter2] are the first examples of government forms you might encounter. = Formas de gobierno como [buildingFilter] y [buildingFilter2] son los primeros ejemplos de formas de gobierno que podrías encontrar.
A government form provides army limits like [resource], [resource2]s, and unique bonuses. For [buildingFilter], it's a discount for policies. For [buildingFilter2], it's a growth bonus and a chance to evolve into [buildingFilter3] in the Ancient Era through reforms. = Una forma de gobierno proporciona límites de ejército como [resource], [resource2] y bonificaciones únicas. Para [buildingFilter], es un descuento en políticas. Para [buildingFilter2], es una bonificación de crecimiento y una oportunidad de evolucionar a [buildingFilter3] en la Era Antigua mediante reformas.
There are two types of government forms: [buildingFilter] and [buildingFilter2]. [buildingFilter3] government forms have cheaper National Wonders, access to all diplomatic actions, and powerful uniques. Many historically significant empires belong to this category, like [buildingFilter4] and [buildingFilter5]. = Hay dos tipos de formas de gobierno: [buildingFilter] y [buildingFilter2]. Las formas de gobierno [buildingFilter3] tienen Maravillas Nacionales más baratas, acceso a todas las acciones diplomáticas y únicos poderosos. Muchos imperios históricamente significativos pertenecen a esta categoría, como [buildingFilter4] y [buildingFilter5].
On the other hand, it doesn't mean [buildingFilter] government forms are definitely weaker. They fit into their own niche by having cheaper policy costs, access to [buildingFilter2] via [buildingFilter3], and generally taking less effort to maintain. = Por otro lado, no significa que las formas de gobierno [buildingFilter] sean definitivamente más débiles. Encajan en su propio nicho al tener costes de políticas más baratos, acceso a [buildingFilter2] mediante [buildingFilter3] y, en general, requerir menos esfuerzo de mantenimiento.
You can also force a political shift by having your [resource] go above the [resource2] or reform a [buildingFilter] government form when your [resource3] is at half or above the [resource4]. = También puedes forzar un cambio político haciendo que tu [resource] supere el [resource2] o reformar una forma de gobierno [buildingFilter] cuando tu [resource3] esté a la mitad o más del [resource4].
Shift in politic = Cambio político
To keep a government form during a [param] event, you would need to keep your [resource] above 3/4 of the [resource2]. = Para mantener una forma de gobierno durante un evento [param], necesitarías mantener tu [resource] por encima de 3/4 del [resource2].
[buildingFilter] government forms are gated behind the requirement of having enough [stat] and [resource]. You need to have your [resource2] reach half of the [resource3] and your empire being happy. = Las formas de gobierno [buildingFilter] están bloqueadas tras el requisito de tener suficiente [stat] y [resource]. Necesitas que tu [resource2] alcance la mitad del [resource3] y que tu imperio sea feliz.
List of all possible government forms = Lista de todas las formas de gobierno posibles

ED - Reworked Army Mechanic = ED - Mecánica del ejército reelaborada
Armies are now separated into four major categories:\n 'Levy Army', 'Standing Army', 'Noble Army', and 'Mercenary Army', each with different characteristics. = Los ejércitos ahora se dividen en cuatro categorías principales:\n 'Levy Army', 'Standing Army', 'Noble Army' y 'Mercenary Army', cada una con características diferentes.
'Levy Army' units are free and can be summoned using the [buildingFilter] function in any city with five or more population at the cost of [stat] and short-term negative effects. The [buildingFilter2] status can be reverted by disbanding your levies in peaceful times using [buildingFilter3] at the capital so they can be summoned again. = Las unidades de 'Levy Army' son gratuitas y pueden invocarse usando la función [buildingFilter] en cualquier ciudad con cinco o más de población a costa de [stat] y efectos negativos a corto plazo. El estado [buildingFilter2] puede revertirse disolviendo tus levas en tiempos de paz usando [buildingFilter3] en la capital para que puedan ser invocadas de nuevo.
'Standing Army', 'Noble Army', and 'Mercenary Army' behave like normal units, except 'Mercenary Army' can only be bought and requires a [buildingFilter] to be built. 'Standing Army' and its elite variant 'Noble Army' are what you would rely upon most of the time; however, they do require resources like [param] and [resource] to be built. = 'Standing Army', 'Noble Army' y 'Mercenary Army' se comportan como unidades normales, excepto que 'Mercenary Army' solo puede comprarse y requiere un [buildingFilter] para ser construido. 'Standing Army' y su variante de élite 'Noble Army' son en lo que confiarías la mayor parte del tiempo; sin embargo, requieren recursos como [param] y [resource] para ser construidos.
The main source of [resource] is government forms and [buildingFilter]s. = La fuente principal de [resource] son las formas de gobierno y los [buildingFilter].
The main source of [resource] is government forms and policies. = La fuente principal de [resource] son las formas de gobierno y las políticas.
The main source of [resource] is [buildingFilter]s and city-states. = La fuente principal de [resource] son los [buildingFilter] y las ciudades-estado.

ED - Tags = ED - Etiquetas
There are many tags for different buildings, resources, and units. = Hay muchas etiquetas para diferentes edificios, recursos y unidades.
It is mostly a system for implementing strengths and weaknesses in terms of units, but for resources and buildings, it's a system that applies many buffs. = Es principalmente un sistema para implementar fortalezas y debilidades en términos de unidades, pero para recursos y edificios, es un sistema que aplica muchas bonificaciones.
So you need to play with tags in mind. For example, when [param] from [param2] gives you a bonus on constructing [buildingFilter], you can build more [buildingFilter2]. And later adopt [param3] from [param4] to give them [stat] production. = Así que necesitas jugar con las etiquetas en mente. Por ejemplo, cuando [param] de [param2] te da una bonificación al construir [buildingFilter], puedes construir más [buildingFilter2]. Y más tarde adoptar [param3] de [param4] para darles producción de [stat].
This is a system that doesn't require overthinking. Normally, you just need to pay some attention to what you are doing, and the tag system will reward you accordingly. = Este es un sistema que no requiere pensar demasiado. Normalmente, solo necesitas prestar algo de atención a lo que estás haciendo, y el sistema de etiquetas te recompensará en consecuencia.
All building sorted by type tags = Todos los edificios ordenados por etiquetas de tipo
All units sorted by army tags = Todas las unidades ordenadas por etiquetas de ejército

ED - Before Industrial Age = ED - Antes de la era industrial
Before the Industrial Era, the game runs mostly simliar to Civilization 5. You only have to worry about a few newly added features such as [resource], [resource2] and various [buildingFilter]s. = Antes de la Era Industrial, el juego funciona en su mayoría similar a Civilization 5. Solo tienes que preocuparte por algunas características recién añadidas como [resource], [resource2] y varios [buildingFilter].
'Military Buildings' = 'Edificios militares'
[resource] and anything that says a unit consumes are unit limits. Later you would have to worry about [resource2] and so on but right now lets just say unit limit. You would want to build a lot of [param] to increase your [resource3] to get more capable unit into field. Instead of those free levied units that are way more fragile. [buildingFilter] also provides a lot of unit limits. = [resource] y cualquier cosa que diga que una unidad consume son límites de unidades. Más tarde tendrías que preocuparte por [resource2] y demás, pero por ahora digamos simplemente límite de unidades. Querrías construir muchos [param] para aumentar tu [resource3] y poner unidades más capaces en el campo. En lugar de esas unidades de leva gratuitas que son mucho más frágiles. [buildingFilter] también proporciona muchos límites de unidades.
Ancient Era = Era Antigua
Before the [param], the focus is to gather as much [stat], [stat2] and [stat3] and settle cities in good spots, the ways to gain [stat4] was mostly limited. = Antes del [param], el enfoque es reunir tanto [stat], [stat2] y [stat3] como sea posible y asentar ciudades en buenos lugares; las formas de obtener [stat4] eran en su mayoría limitadas.
Imperial Era = Era Imperial
However, after the [param], the focus on [stat] and [stat2] become appearent, although there are still few ways to gain [stat3], finally in [param2], you will have plenty of ways to gain [stat4]. = Sin embargo, después del [param], el enfoque en [stat] y [stat2] se vuelve evidente; aunque todavía hay pocas formas de obtener [stat3], finalmente en [param2], tendrás muchas formas de obtener [stat4].

ED - The Industrial Ages = ED - Las eras industriales
Arriving at the Industrial Age, there are a few distinctive new features. = Al llegar a la Era Industrial, hay algunas características nuevas distintivas.
[buildingFilter]s and [buildingFilter2]s are new requirments for industries and new buildings. = [buildingFilter] y [buildingFilter2] son nuevos requisitos para industrias y nuevos edificios.
You will have to allocate tiles near your city center to construct new [improvementFilter]s if you want a full access to buildings. But if you are willing to make compromises with land, you may settle at only building [buildingFilter]s. = Tendrás que asignar casillas cerca del centro de tu ciudad para construir nuevos [improvementFilter] si quieres acceso completo a los edificios. Pero si estás dispuesto a hacer concesiones con la tierra, puedes conformarte con solo construir [buildingFilter].
[improvementFilter]s do have their own synergies akin to [improvementFilter2]s and are buffed by certain buildings and policies. = Los [improvementFilter] tienen sus propias sinergias similares a los [improvementFilter2] y son potenciados por ciertos edificios y políticas.
[resource] and [resource2] are two new parameters you should keep in mind if you want to industrialize your civilization. = [resource] y [resource2] son dos nuevos parámetros que debes tener en cuenta si quieres industrializar tu civilización.
If [resource] outgrows [resource2] by 3 + Current Number of Cities*2, you will gain [buildingFilter], which slows down the construction of new industries but adds some positive effects. = Si [resource] supera a [resource2] por 3 + Número actual de ciudades*2, obtendrás [buildingFilter], lo que ralentiza la construcción de nuevas industrias pero añade algunos efectos positivos.
If [resource] outgrows [resource2] by 3 + Current Number of Cities*2, you will gain [buildingFilter], which speeds up the construction of new industries but adds some negative effects. = Si [resource2] supera a [resource] por 3 + Número actual de ciudades*2, obtendrás [buildingFilter], lo que acelera la construcción de nuevas industrias pero añade algunos efectos negativos.
[resource] is also a new resource you should keep in mind if you want to keep your industries productive. = [resource] también es un nuevo recurso que debes tener en cuenta si quieres mantener tus industrias productivas.
Every industry will consume a certain amount of [resource]. If [resource2] is above [amount], they will have the full benefit of electricity in cities with [buildingFilter], like increased stats and resource production rates. = Cada industria consumirá una cierta cantidad de [resource]. Si [resource2] está por encima de [amount], tendrán el beneficio completo de la electricidad en ciudades con [buildingFilter], como estadísticas aumentadas y tasas de producción de recursos.
When below [amount] [resource], the city switches to [buildingFilter], consuming [amount2] [resource2]. = Cuando está por debajo de [amount] [resource], la ciudad cambia a [buildingFilter], consumiendo [amount2] [resource2].
When between [amount] to [amount2] [resource], the city switches to [buildingFilter], consuming [amount3] [resource2]. = Cuando está entre [amount] y [amount2] [resource], la ciudad cambia a [buildingFilter], consumiendo [amount3] [resource2].
When above [amount] [resource], the city switches to [buildingFilter], consuming [amount2] [resource2]. = Cuando está por encima de [amount] [resource], la ciudad cambia a [buildingFilter], consumiendo [amount2] [resource2].
[resource]s and [resource2]s are inevitable if you want to go anywhere in the [buildingFilter] and after that point. = Los [resource] y [resource2] son inevitables si quieres llegar a algún lado en el [buildingFilter] y después de ese punto.
The main source of [resource] are any industry, any tile improvement, those [buildingFilter]s that uses [buildingFilter2] and Rapid consumption. = La fuente principal de [resource] son cualquier industria, cualquier mejora de casilla, aquellos [buildingFilter] que usan [buildingFilter2] y el consumo rápido.
When it comes to halting the [resource], you could intentionially halt building Industries and tile improvements that you dont need. And focus on technologies, [param] Policy tree and the various [buildingFilter] [buildingFilter2]s. = Cuando se trata de detener el [resource], podrías detener intencionadamente la construcción de Industrias y mejoras de casilla que no necesitas. Y centrarte en tecnologías, el árbol de políticas [param] y los diversos [buildingFilter] [buildingFilter2].
[resource] will be a great nuisance, at first it simply decrease the growth, but later it spreads to negatively influence your [stat], [stat2] and so on. Each [resource2] will get progressively ruinous to the aspect it spreads to. = [resource] será una gran molestia; al principio simplemente disminuye el crecimiento, pero luego se propaga para influir negativamente en tu [stat], [stat2], etc. Cada [resource2] se volverá progresivamente ruinoso para el aspecto al que se propague.
