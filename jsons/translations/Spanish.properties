Actually...I was checking what I can do. = En realidad... solo estaba viendo qué puedo hacer.
Nothing happens. = No pasa nada.

See that long list of Resource? You can cut it down a bit. = ¿Ves esa larga lista de Recursos? Puedes acortarla un poco.
Hide the essentials. = Ocultar los esenciales.
Including: = Incluyendo:
[Influence], [Influence Limit], [Consumption Supply], [Consumption Demand],All the kinds of [Fuel]s, Victroy related resources and the Army Maintenances = [Influence], [Influence Limit], [Consumption Supply], [Consumption Demand], todos los tipos de [Fuel], recursos relacionados con la victoria y los mantenimientos del ejército.
Show the essentials. = Mostrar los esenciales.
Hide the raw resources. = Ocultar los recursos brutos.
[Horse], [Metal], [Alloy], [Oil] and so on. All the resource on the map or being the prerequisite of buildings and parts productions = [Horse], [Metal], [Alloy], [Oil], etc. Todos los recursos en el mapa o que son requisito previo de edificios y producción de piezas.
Show the raw resources. = Mostrar los recursos brutos.
Hide those parts. = Ocultar esas piezas.
[Weapon Parts], [Vehicle Parts], [Ship Parts] and so on and so fourth. = [Weapon Parts], [Vehicle Parts], [Ship Parts], etcétera, etcétera.
Show those parts. = Mostrar esas piezas.
Hide those random stuffs. = Ocultar esas cosas varias.
Show those random stuffs. = Mostrar esas cosas varias.
Alright. = De acuerdo.
Hide Strategic Resources = Ocultar recursos estratégicos

The structure of our civilization changes to adapt to the time. What path shall we partake? = La estructura de nuestra civilización cambia para adaptarse a los tiempos. ¿Qué camino tomaremos?
The most convenient way to change your government form is to let it naturally evolve. When each Era begins, you are forced to have a political shift where you must actively decide what state you want to enter: ['United'] or ['Divided']. = La forma más conveniente de cambiar tu forma de gobierno es dejarla evolucionar naturalmente. Cuando comienza cada Era, te ves forzado a tener un cambio político en el que debes decidir activamente en qué estado quieres entrar: ['United'] o ['Divided'].
When your [Influence] is reaching over half of the [Influence Limit] without being in low stability, this enables you to unify your civilization = Cuando tu [Influence] alcanza más de la mitad del [Influence Limit] sin estar en baja estabilidad, esto te permite unificar tu civilización.
Your [Influence] will be reseted back to a certain point below [Influence Limit]. If you can successfully unify your civilization, you will have a lot of [Influence] starting off. = Tu [Influence] se restablecerá a un cierto punto por debajo del [Influence Limit]. Si logras unificar tu civilización con éxito, comenzarás con una gran cantidad de [Influence].
See also: ED - Government Forms = Véase también: ED - Formas de gobierno
No significant changes = Sin cambios significativos
We are still a bunch of countries prone to infighting and invasion, but what we do have is countless oppotunities. = Seguimos siendo un montón de países propensos a luchas internas e invasiones, pero lo que sí tenemos son innumerables oportunidades.
Qin has collapsed! = ¡Qin ha colapsado!
We are able to unify ourselves! = ¡Podemos unificarnos!
The unification has been accomplished by the largest fish in the pond. We are now an unified political entity! = La unificación ha sido lograda por el pez más grande del estanque. ¡Ahora somos una entidad política unificada!
The empire of the past crumbles... = El imperio del pasado se desmorona...
Our unification cannot last onto another stage of the world. Maybe its ultimately for the better, as it was stale. = Nuestra unificación no puede perdurar en otra etapa del mundo. Quizá sea mejor así, pues estaba estancada.
Our empire lasts onto another era! = ¡Nuestro imperio perdura en otra era!
Our empire survives... Maybe we can reform it continuesly unto forever. = Nuestro imperio sobrevive... Quizá podamos reformarlo continuamente hasta la eternidad.
Shift in Politic = Cambio político

If an empire is stale in upward mobility, political reform and other essential aspect, it would fall behind, and crumble to ash. = Si un imperio está estancado en movilidad ascendente, reforma política y otros aspectos esenciales, se quedará atrás y se desmoronará hasta convertirse en cenizas.
With some reforms, our empire can adapt to new age without problems. = Con algunas reformas, nuestro imperio puede adaptarse a la nueva era sin problemas.
Give up your unique civilization form and return to the generic line of unified civilization form. = Abandona tu forma de civilización única y vuelve a la línea genérica de forma de civilización unificada.
Also, you might've ran out of unique government forms because there arent enough of them in the first place. = Además, es posible que te hayas quedado sin formas de gobierno únicas porque no hay suficientes para empezar.
We must prevail at preserving our root. = Debemos prevalecer preservando nuestra raíz.
Keep your current special civilization form = Conserva tu forma de civilización especial actual
Our way of life must be protected. = Nuestro modo de vida debe ser protegido.
There needs to be an Emperor = Necesita haber un Emperador
Focus on Centrailizing Power Structure. = Centrarse en centralizar la estructura de poder.
Our guiding philosophy has been painting a hopeful picture of our future, this reform will lead us closer to it. = Nuestra filosofía guía ha estado pintando un cuadro esperanzador de nuestro futuro; esta reforma nos acercará más a él.
Disperse The Power Structure. = Dispersar la estructura de poder.
We can use our new formed policy. = Podemos usar nuestra nueva política formada.
We shall dominate the Land! = ¡Dominaremos la tierra!
Although our empire has stood tall, it would be more efficient if we take the new route... = Aunque nuestro imperio se ha mantenido en pie, sería más eficiente si tomamos la nueva ruta...
We shall dominate the Ocean! = ¡Dominaremos el océano!
We will continue our empire's glory. = Continuaremos la gloria de nuestro imperio.
Maybe... having a consistent ruling family and succession law would be better. = Quizá... tener una familia gobernante consistente y una ley de sucesión sería mejor.
No avaliable options = No hay opciones disponibles.
Yet. = Todavía.
Reformation of the unified state = Reforma del estado unificado

As the society develops, the social structure of our civilization began to shift. = A medida que la sociedad se desarrolla, la estructura social de nuestra civilización comenzó a cambiar.
Focus on expanding the faith = Centrarse en expandir la fe
Focus on empowering the leadership = Centrarse en empoderar al liderazgo
Focus on civic advancement = Centrarse en el avance cívico
Focus on developing trade = Centrarse en desarrollar el comercio
Focus on mitigating incoming societal issue = Centrarse en mitigar los problemas sociales venideros
This can avoid negative events that natrually occurs because of change of era, but if unhappiness presists, there are still risks of more negative events. = Esto puede evitar eventos negativos que ocurren naturalmente por el cambio de era, pero si la infelicidad persiste, aún hay riesgo de más eventos negativos.
Reformation of our society = Reforma de nuestra sociedad

We will find ways to make our civilization thrive again! = ¡Encontraremos formas de hacer que nuestra civilización prospere de nuevo!
Building a harmonious civilization is essential = Construir una civilización armoniosa es esencial
We can make it so that it takes more to unstablise our civilization = Podemos hacer que se necesite más para desestabilizar nuestra civilización
We must make haste before situation gets any worse = Debemos darnos prisa antes de que la situación empeore
By investing a vast amount of social-political capital, we can stablise the situation quickly. = Invirtiendo una vasta cantidad de capital sociopolítico, podemos estabilizar la situación rápidamente.
Ruling a country requires patience and subtlety = Gobernar un país requiere paciencia y sutileza
By carefully planning the route back to normal, we can stablise the situation slowly. = Planificando cuidadosamente la ruta de regreso a la normalidad, podemos estabilizar la situación lentamente.
Can we wait? = ¿Podemos esperar?
We need more contemplation... = Necesitamos más contemplación...
Stablising our side of the globe = Estabilizando nuestra parte del globo

We must at least do something about the things happening in the cities. = Al menos debemos hacer algo sobre lo que está pasando en las ciudades.
Kill the benefactors. = Matar a los benefactores.
Use the loyal army to slay all who dares to oppose our just ruiling! = ¡Usa el ejército leal para matar a todos los que se atrevan a oponerse a nuestro justo gobierno!
Subdue the benefactors. = Someter a los benefactores.
Use our socio-economical ties to force them give up their schemes. = Usar nuestros lazos socioeconómicos para obligarlos a abandonar sus planes.
Use them to our benefits = Usarlos para nuestro beneficio
I wonder... what would they be trying to do when they have some track records right in our hands? = Me pregunto... ¿qué intentarían hacer cuando tenemos algunos antecedentes justo en nuestras manos?
Kill the rebels. = Matar a los rebeldes.
Subdue the rebels. = Someter a los rebeldes.
Use our socio-economical ties to force them give up their schemes and join us. = Usar nuestros lazos socioeconómicos para obligarlos a abandonar sus planes y unirse a nosotros.
Let them fight our enemies. Let them become 'heros'. = Dejadlos luchar contra nuestros enemigos. Dejadlos convertirse en 'héroes'.
Remove the Slums immediately! = ¡Eliminar los barrios marginales inmediatamente!
Force the Slume dwelllers out of their residence... Might be a bad move. = Forzar a los habitantes de los barrios marginales a salir de sus residencias... Podría ser una mala jugada.
Compromise with the upper classes. = Comprometerse con las clases altas.
By dealing with the wealth gap directly, we can provide more residential land in the cities, or at least provide better houses. = Al abordar directamente la brecha de riqueza, podemos proporcionar más suelo residencial en las ciudades, o al menos proporcionar mejores viviendas.
If they yearn for place to live, why not go out? = Si anhelan un lugar donde vivir, ¿por qué no salen?
Crisis Solver = Solucionador de crisis

Our civilization consists of multiple countries. If they do not reach agreement in some way. We are at the danger of being foods on a plate. = Nuestra civilización está compuesta por múltiples países. Si no llegan a un acuerdo de alguna manera, corremos el peligro de ser comida en un plato.
[Military Alliance] is the most practical = [Military Alliance] es la más práctica
[Cultural Exchange] is the most elegant = [Cultural Exchange] es la más elegante
[Trade Alliance] is the most attractive = [Trade Alliance] es la más atractiva
[Collective Security] secures our footing = [Collective Security] asegura nuestro posicionamiento
[Research Exchange] secures our progess = [Research Exchange] asegura nuestro progreso
[Economic Community] secures our interest = [Economic Community] asegura nuestro interés
To get a ['Agreement'], you should get at least 10 [Influence], or 20 starting from the [Atomic era] = Para obtener un ['Agreement'], debes tener al menos 10 [Influence], o 20 a partir de la [Atomic era].
Building Alliance = Construir alianza

As the civ enters its downfall, the Union crumbles away. = Cuando la civilización entra en su decadencia, la Unión se desmorona.
No! = ¡No!
Disolution of Union = Disolución de la Unión

The current instability in our civilization hinders our development greatly and civil wars may break out. An effort in reaching an internal peace should be made. = La inestabilidad actual en nuestra civilización obstaculiza enormemente nuestro desarrollo y pueden estallar guerras civiles. Debería hacerse un esfuerzo por alcanzar la paz interna.
Not Yet = Todavía no
State of Instability = Estado de inestabilidad

Some of the cities in our civilization are suffering from severe aftermath of some negative events, maybe we should start dealing with them. = Algunas de las ciudades de nuestra civilización están sufriendo las graves secuelas de algunos eventos negativos; quizá deberíamos empezar a ocuparnos de ellas.
We need new jobs for the people. = Necesitamos nuevos empleos para la gente.
The number of [Consumption Demand] increases by [33]% for a fair amount of turns. Which may provide breathing rooms for our economy. = El número de [Consumption Demand] aumenta en un [33]% durante una cantidad considerable de turnos. Lo que puede dar un respiro a nuestra economía.
State of Ruins = Estado de ruinas

Here is the current status of your great civilization! What runs it, What state it is in and so on. = ¡Aquí está el estado actual de tu gran civilización! Quién la dirige, en qué estado se encuentra, etc.
No direct benefits – default stable state. = Sin beneficios directos – estado estable por defecto.
Before adopting [Anarchism]: = Antes de adoptar [Anarchism]:
Cannot build [Settler], [Pioneer], [Worker], [Mechanised Worker], [Galley Work Ship], [Modern Work Ship] units = No se pueden construir unidades [Settler], [Pioneer], [Worker], [Mechanised Worker], [Galley Work Ship], [Modern Work Ship]
After adopting [Anarchism]: = Después de adoptar [Anarchism]:
No direct penalties – baseline environment. = Sin penalizaciones directas – entorno de referencia.
I see = Ya veo
Present Current Status = Presentar estado actual

As your civilization grows, the [Influence] of the ruler of your civilization fluctuates. Keeping it above a certain thershold will be beneficial for decision making. = A medida que tu civilización crece, la [Influence] del gobernante de tu civilización fluctúa. Mantenerla por encima de cierto umbral será beneficioso para la toma de decisiones.
We shall arrange a great hunt to show our military prowess! = ¡Organizaremos una gran cacería para mostrar nuestra destreza militar!
We shall arrange a customary worship of our ancestry. = Organizaremos una adoración habitual a nuestros antepasados.
We shall arrange a great feast to show our wealth! = ¡Organizaremos un gran festín para mostrar nuestra riqueza!
We shall arrange a marriage in high class society to strengthen our internal ties! = ¡Organizaremos un matrimonio en la alta sociedad para fortalecer nuestros lazos internos!
We shall do a military march to demostrate our might! = ¡Haremos una marcha militar para demostrar nuestro poder!
Remove the [Influence Maintenance Cost] = Eliminar el [Influence Maintenance Cost]
Popularity Crisis = Crisis de popularidad

As your civilization grows, the lifestyle of your civilization fluctuates. It is sercretly a deciding factor of what civilization states, their unique and ability would your civilization be able to foster.\nTo do this normally, [20] [Influence] is required. = A medida que tu civilización crece, el estilo de vida de tu civilización fluctúa. Es secretamente un factor decisivo de qué estados de civilización, sus unidades únicas y habilidades podrá fomentar tu civilización.\nPara hacer esto normalmente, se requieren [20] [Influence].
Growth requires our culture to suit the needs for new eras. = El crecimiento requiere que nuestra cultura se adapte a las necesidades de las nuevas eras.
I guess we can simply expand our pantheon to include marginalised gods. = Supongo que podemos simplemente expandir nuestro panteón para incluir dioses marginados.
Purity of our nation is the reason why we stood fast to this era. = La pureza de nuestra nación es la razón por la que nos mantuvimos firmes en esta era.
Decrease the Cultural Diversity by a level if it hasnt reached lowest level yet. = Disminuye la Diversidad Cultural en un nivel si aún no ha alcanzado el nivel más bajo.
Time to trim the leaves... = Hora de podar las hojas...
On the problem of Culture = Sobre el problema de la Cultura

To begin our grand exploration, we must have a clear judgement of what we are dealing with. = Para comenzar nuestra gran exploración, debemos tener un juicio claro de con qué estamos tratando.
We shall find new oppotunities across the ocean. = Encontraremos nuevas oportunidades al otro lado del océano.
We shall find new oppotunities in the vast wild. = Encontraremos nuevas oportunidades en la vasta naturaleza salvaje.
Exploration Focus = Enfoque de exploración

Our settlement in the new land starts to adopt local plants and herds. If we import these stuff back into our continent. We could gain a lot more profits. = Nuestro asentamiento en la nueva tierra comienza a adoptar plantas y rebaños locales. Si importamos estas cosas de vuelta a nuestro continente, podríamos obtener muchas más ganancias.
We should focus on the new staple crops. = Deberíamos centrarnos en los nuevos cultivos básicos.
We should focus on the new economic crops. = Deberíamos centrarnos en los nuevos cultivos comerciales.
These exotic new animals are quite beautiful. = Estos nuevos animales exóticos son bastante hermosos.
We should respect the locals and exchange more [culture] = Deberíamos respetar a los lugareños e intercambiar más [culture].
Great Exchange = Gran Intercambio

The [Caste System] is getting harder to maintain by the days. It restricts the upward mobility in our civilization way too much. = El [Caste System] se vuelve más difícil de mantener con los días. Restringe demasiado la movilidad ascendente en nuestra civilización.
We shall abandon the destinied inequality. = Abandonaremos la desigualdad destinada.
We shall reinerpret it into a more idealistic system. = Lo reinterpretaremos en un sistema más idealista.
What would the lower caste do anyway? They dont deserve anything. = ¿Qué haría la casta inferior de todos modos? No merecen nada.
Casted Away = Desechado

As the productivity increases. The absurdity of seeing other people as objects soon came to be realised. People are supporting the abolition. = A medida que la productividad aumenta, la absurdidad de ver a otras personas como objetos pronto se hace evidente. La gente apoya la abolición.
Slavery is evil = La esclavitud es mala
But we are the superior race! = ¡Pero somos la raza superior!
Abolitionism Strikes = El abolicionismo golpea

We call upon our hordes. To combat the nature and our enemies. = Convocamos a nuestras hordas. Para combatir la naturaleza y a nuestros enemigos.
Recuit Wild Tribes into our culture = Reclutar tribus salvajes en nuestra cultura
Organize a hunt for glory, and additional rations = Organizar una cacería por gloria y raciones adicionales
Double Yield from [Camp] for a short amount of time. = Duplica el rendimiento de [Camp] durante un breve período.
We should exchange our knowledges amongst our tribes = Deberíamos intercambiar nuestros conocimientos entre nuestras tribus
[+1 Science] [in all cities] for a short amount of time. = [+1 Science] [in all cities] durante un breve período.
Elect a new Khan! = ¡Elegir un nuevo Khan!
Sacrifice all your [Influence] to gain a [Great Khan] unit. If a certain amount of [Influence] is sacrificed, [Great Khan] may also double as a [Great Strategist]. = Sacrifica toda tu [Influence] para obtener una unidad [Great Khan]. Si se sacrifica una cierta cantidad de [Influence], [Great Khan] también puede actuar como [Great Strategist].
Make use of our unified power = Aprovechar nuestro poder unificado
Study the advanced culture of the other civilizations = Estudiar la cultura avanzada de las otras civilizaciones
Tribe Assembly = Asamblea tribal

As Enough [Settlement Process] has been gained. We may now futher develop our lands. = Como se ha obtenido suficiente [Settlement Process], ahora podemos desarrollar más nuestras tierras.
Now we have stability in hand. = Ahora tenemos la estabilidad en la mano.
Settle Down = Asentarse

A talented young prince called Alexander decides that his dream to be the conqueror of the world... = Un talentoso príncipe joven llamado Alejandro decide que su sueño es ser el conquistador del mundo...
We shall support him at all cost! = ¡Lo apoyaremos a toda costa!
Gain access to [Diadochi States] civilization form. = Obtienes acceso a la forma de civilización [Diadochi States].
Too much investment = Demasiada inversión
Alexander the Conqueror = Alejandro el Conquistador

Alexander the great has died... how could it be? But his generals seems to care less about the death than the power they now holds. = Alejandro Magno ha muerto... ¿cómo pudo ser? Pero sus generales parecen preocuparse menos por la muerte que por el poder que ahora ostentan.
The hellenic period begins... = Comienza el período helenístico...
Alexander's death = La muerte de Alejandro

One of the mountain tribe has became a power to be recognized. = Una de las tribus de la montaña se ha convertido en una potencia reconocida.
What a nice candidate... = Qué buen candidato...
Babylon's Gate remains shut. = La Puerta de Babilonia permanece cerrada.
Rise of the Persians = Auge de los persas

A radical reformation is occuring in Shang Dynasty by the Emperor Xin, this results in a civil war. = Una reforma radical está ocurriendo en la Dinastía Shang por el Emperador Xin; esto resulta en una guerra civil.
The Zhou State has won. = El Estado Zhou ha ganado.
Emperor Xin remain undefeated! = ¡El Emperador Xin permanece invicto!
So called Mandate... = El llamado Mandato...

It seems like a lot of different new ideologies have appeared in our civilization... Maybe some of them are beneficial = Parece que muchas ideologías nuevas y diferentes han aparecido en nuestra civilización... Quizá algunas sean beneficiosas.
Daoism = Taoísmo
Mohism = Mohismo
School of Diplomacy = Escuela de la Diplomacia
School of Forms and Names = Escuela de las Formas y los Nombres
School of Naturalists = Escuela de los Naturalistas
School of Agrarianism = Escuela del Agrarianismo
School of Military Strategy = Escuela de la Estrategia Militar
You need at least 10 [Influence] to adopt a school of thought. = Necesitas al menos 10 [Influence] para adoptar una escuela de pensamiento.
The way to rule = El camino de gobernar

Qin collapsed, two new leader emerged and is battling it out. Which one of them have won? = Qin colapsó, dos nuevos líderes surgieron y están luchando. ¿Cuál de ellos ha ganado?
Liu Bang the slayer of white snake = Liu Bang, el matador de la serpiente blanca
Xiang Yu the dominator = Xiang Yu, el dominador
Collapse of the Great Qin = Colapso del Gran Qin

Europa has a variety of cultures scattered around. Certain culture's futher developments can improve our Civilisation's performance greatly. = Europa tiene una variedad de culturas dispersas. Ciertos desarrollos posteriores de ciertas culturas pueden mejorar enormemente el rendimiento de nuestra civilización.
Gauls = Galos
Albions = Albiones
Goths = Godos
Saxons = Sajones
Slavs = Eslavos
You need at least 5 [Influence] and 200 [Gold] to adopt a culture. = Necesitas al menos 5 [Influence] y 200 [Gold] para adoptar una cultura.
The Tribes of Europe = Las tribus de Europa

As the egyptian dynasty countinues to be... a new power in the same region grows... = Mientras la dinastía egipcia continúa siendo... una nueva potencia en la misma región crece...
New culture, new blood... = Nueva cultura, nueva sangre...
Who dares to defy the pharoh? = ¿Quién se atreve a desafiar al faraón?
Rise of the Punics = Auge de los púnicos

A group of nomadic outsider has migrated and conquered their way into our land... With new ideals and army traditions. = Un grupo de nómadas forasteros ha migrado y conquistado su camino hacia nuestra tierra... Con nuevos ideales y tradiciones militares.
So begins the Indo-Aryan's leadership in South Asia. = Así comienza el liderazgo indo-ario en el sur de Asia.
The Harappans had successfully repelled the invasion. = Los harappanos habían repelido con éxito la invasión.
Aryan Migration = Migración aria

A wealthy prince named Siddhartha Gautama has became a great philosopher of sort and started a religious movement following his own ideal... = Un príncipe adinerado llamado Siddhartha Gautama se ha convertido en una especie de gran filósofo y comenzó un movimiento religioso siguiendo su propio ideal...
Maybe... We all need a bit of forgiveness in our life. = Quizá... todos necesitamos un poco de perdón en nuestra vida.
Stops [Maurya Empire] from automatically adopting [Meritocracy]. = Evita que [Maurya Empire] adopte automáticamente [Meritocracy].
Heretical Teaching. = Enseñanza herética.
Buddha's birth = Nacimiento de Buda

As a new era arrives, a new culture emerges from the steppes. = Cuando llega una nueva era, una nueva cultura emerge de las estepas.
The Scythians Emerges = Emergen los escitas
The Huns Emerges = Emergen los hunos
The Xiong Nu Emerges = Emergen los xiongnu
Not yet... = Todavía no...
Emergence of Nations = Emergencia de naciones

Well every story has an end. The Great Commander finally steps down from his position in the army. But how does it play out is a story of its own. = Bueno, toda historia tiene un final. El Gran Comandante finalmente renuncia a su posición en el ejército. Pero cómo se desarrolla es una historia en sí misma.
Honorable Retirement = Retiro honorable
The Great Commander has inspired countless people. His retirement is well deserved. He will be idolised. = El Gran Comandante ha inspirado a innumerables personas. Su retiro es bien merecido. Será idolatrado.
Backstabbed = Apuñalado por la espalda
Lets just say that there are no perfect man. It would seems like power struggle and other caused this General to step down. Maybe he was too greedy? Too proud of himself? The history can't give a clear answer. = Digamos simplemente que no hay hombre perfecto. Parece que la lucha por el poder y otras causas hicieron que este General renunciara. ¿Quizá era demasiado codicioso? ¿Demasiado orgulloso de sí mismo? La historia no puede dar una respuesta clara.
Great Commander's Retirement = El retiro del Gran Comandante

Many different theories has developed around how to manage our civilization's wealth and productions. As the wind of commerce starts to flow. = Muchas teorías diferentes se han desarrollado sobre cómo gestionar la riqueza y la producción de nuestra civilización. Mientras el viento del comercio comienza a fluir.
If the market is free, then its a good deed = Si el mercado es libre, entonces es una buena acción
Profiteers would ruin the country. = Los aprovechados arruinarían el país.
Economic Theories = Teorías económicas

The Traditional Feudal System crumbles before the new rising bourgeoisie class as industrial revolution continues. Subsequently, bourgeoisies and proletariats revolted against the traditional system, how does the revolution happen? = El sistema feudal tradicional se desmorona ante la nueva clase burguesa ascendente mientras continúa la revolución industrial. Posteriormente, burgueses y proletarios se rebelaron contra el sistema tradicional, ¿cómo ocurre la revolución?
The Revolution has failed. = La revolución ha fracasado.
The revolution is dead. The government of nobilities continue their ruling,'Noble Army' strength are increased by a third permanently. = La revolución está muerta. El gobierno de las noblezas continúa su mandato; la fuerza del 'Noble Army' aumenta en un tercio permanentemente.
Peaceful Transition. = Transición pacífica.
Long term societal divide hinders futher policy and economic development. But the revolution have its main goal achieved = La división social a largo plazo obstaculiza más políticas y desarrollo económico. Pero la revolución ha logrado su objetivo principal.
Both negotiations and conflicts are happening... = Están ocurriendo tanto negociaciones como conflictos...
The revolution...is chaotic. Some cities have peacefully transitioned their power to the new ruling class, while some starts to infight violently. Our civilization has entered a state of [Struggle]. All [Revolutionaries] gain some basic promotions and the 'Standing Army' gains 5% strength bonus permanently. = La revolución... es caótica. Algunas ciudades han transferido pacíficamente su poder a la nueva clase gobernante, mientras que otras comienzan a luchar violentamente entre sí. Nuestra civilización ha entrado en un estado de [Struggle]. Todos los [Revolutionaries] obtienen algunas promociones básicas y el 'Standing Army' obtiene un 5% de bonificación de fuerza permanentemente.
Clean the parasites! = ¡Limpiad a los parásitos!
The revolution violently shaked the basis of our society, but our society is able to leap toward progressiveness! the civilization enters a state of [Strife], but the will of the revolution is well preserved and people are more accepting to societal changes. All Revolutionaries gain many promotions and the 'Standing Army' gains 10% strength bonus permanently. = La revolución sacudió violentamente las bases de nuestra sociedad, ¡pero nuestra sociedad es capaz de saltar hacia el progresismo! La civilización entra en un estado de [Strife], pero la voluntad de la revolución se conserva bien y la gente acepta más los cambios sociales. Todos los Revolucionarios obtienen muchas promociones y el 'Standing Army' obtiene un 10% de bonificación de fuerza permanentemente.
Bourgeoisie Revolution! = ¡Revolución burguesa!

Through out the history of our grand civilization, what aspect should guide us to the future? = A lo largo de la historia de nuestra gran civilización, ¿qué aspecto debería guiarnos hacia el futuro?
We have no history! = ¡No tenemos historia!
How does one get conservative with no tradition to begin with? = ¿Cómo se vuelve uno conservador sin tradición alguna para empezar?
We have no history? = ¿No tenemos historia?
We have no history... = No tenemos historia...
The Gods = Los Dioses
The polytheistic root of our faith leads us to splendor, we are the most blessed out of all civilization in the world. = La raíz politeísta de nuestra fe nos lleva al esplendor; somos los más bendecidos de todas las civilizaciones del mundo.
Our Lord = Nuestro Señor
The monotheistic root of our faith leads us to connect with the truth, the faith is our sword and our plow. = La raíz monoteísta de nuestra fe nos lleva a conectar con la verdad; la fe es nuestra espada y nuestro arado.
Our will to unite = Nuestra voluntad de unirnos
The power of unity has guided us through most of our history, without it, where would we be? = El poder de la unidad nos ha guiado a través de la mayor parte de nuestra historia; sin él, ¿dónde estaríamos?
Our wisdom = Nuestra sabiduría
Our civilization were once master of philosophy. They lived with great wisdom and we shall never give it up. = Nuestra civilización fue alguna vez maestra de la filosofía. Vivieron con gran sabiduría y nunca la abandonaremos.
Our honor = Nuestro honor
Our civilization were once the most honored warriors. They died with honor and we shall never give it up. = Nuestra civilización fue alguna vez los guerreros más honorables. Murieron con honor y nunca lo abandonaremos.
Our wealth = Nuestra riqueza
Our civilization were once the smartest traders. They left us with all the capital and insights so that we may stay flourished = Nuestra civilización fue alguna vez los comerciantes más inteligentes. Nos dejaron todo el capital y la perspicacia para que podamos seguir floreciendo.
Our noble bloodline = Nuestra noble línea de sangre
Our ruiling class has the purest blood with virtues passing down from father to son, we will stay true to the noble blood. = Nuestra clase gobernante tiene la sangre más pura con virtudes transmitidas de padre a hijo; permaneceremos fieles a la sangre noble.
Our efficient bureaucracy = Nuestra burocracia eficiente
The fair and great system our ancestor has passed onto us is a testament to our longevity. = El sistema justo y grandioso que nuestros antepasados nos han legado es un testimonio de nuestra longevidad.
Our divinity = Nuestra divinidad
Our civilization has engraved our faith into everything, we are reaching for ultimate goals. = Nuestra civilización ha grabado nuestra fe en todo; estamos alcanzando metas últimas.
Our humanitarianistic view = Nuestra visión humanitarista
We are the pioneer for progressive value to love all human beings. We will spread our care to the world for it to become a better place. = Somos pioneros de los valores progresistas de amar a todos los seres humanos. Difundiremos nuestro cuidado por el mundo para que se convierta en un lugar mejor.
Our globe-spanning empire = Nuestro imperio global
We must maintain dominant and make sure things go our ways. = Debemos mantener el dominio y asegurarnos de que las cosas vayan a nuestra manera.
Our glorious empire = Nuestro glorioso imperio
Flower and Beauty doesnt keep our splendor. Iron and Blood Does! = La flor y la belleza no mantienen nuestro esplendor. ¡El hierro y la sangre sí!
The Legacy We Inhereited. = El legado que heredamos.

As the gap between classes widen, the capitalists started to go overboard with their mistreatment of the working class. After struggles in the politics and countless protest, another revolution has unveiled. The Bourgeoisie had it coming... But how did this went down? = A medida que la brecha entre clases se amplía, los capitalistas comenzaron a excederse en su maltrato a la clase trabajadora. Tras luchas políticas y protestas incontables, otra revolución ha estallado. La burguesía se lo tenía merecido... Pero, ¿cómo sucedió esto?
Do not let them pass! = ¡No los dejéis pasar!
The government and all the left wing power has sucessfully stopped Facists from taking over the civilization. = El gobierno y todo el poder de izquierda han detenido con éxito a los fascistas de tomar el control de la civilización.
For the Leader! = ¡Por el Líder!
The Facists and their paramilitary militias took over the most important cities and then gradually took over the entire civilization by storm. = Los fascistas y sus milicias paramilitares tomaron las ciudades más importantes y luego tomaron gradualmente toda la civilización por asalto.
Fascist Revolution! = ¡Revolución fascista!

The revolution is dead. The government of capitalists continue their ruling, our civilization enters a state of [Struggle], But the route to Conservatism is unlocked = La revolución está muerta. El gobierno de los capitalistas continúa su mandato, nuestra civilización entra en un estado de [Struggle], pero la ruta hacia el Conservadurismo está desbloqueada.
Socialist Democracy will save the day.. = La democracia socialista salvará el día...
Is this even a revolution when at least half of the bourgeoisie are still up on their place? Who knows. The conflict is resolved peacefully but there are long term consequences toward policy and industry development, [Planned Economy] is not available in this route. = ¿Es esto siquiera una revolución cuando al menos la mitad de la burguesía sigue en su lugar? Quién sabe. El conflicto se resuelve pacíficamente, pero hay consecuencias a largo plazo para el desarrollo de políticas e industria; [Planned Economy] no está disponible en esta ruta.
The Workers have nothing to lose but their chains, they have a world to win. = Los trabajadores no tienen nada que perder más que sus cadenas; tienen un mundo que ganar.
promotions.One revolt, followed by many, the capitalist system died by a thousand cut. And a new nation ruled by workers is built. Our civilization enters [Struggle] due to the civil war. Newly born [Red Army Troop] now have more promotions. = promociones. Una revuelta, seguida de muchas, el sistema capitalista murió por mil cortes. Y se construye una nueva nación gobernada por trabajadores. Nuestra civilización entra en [Struggle] debido a la guerra civil. Las recién nacidas [Red Army Troop] ahora tienen más promociones.
Workers, Farmers, Soldiers, Students, all shall be united to bring down the capitalists! = ¡Trabajadores, campesinos, soldados, estudiantes, todos deben unirse para derribar a los capitalistas!
Compare to a worker's revolution, this revolution is a combined effort of all proletariats alike, althought that makes the process of revolution much faster, but the organization of the new country is much more complicated. Our Civilization enters [Strife], New [Red Army Troop] specialises into command promotion. = Comparada con una revolución obrera, esta revolución es un esfuerzo combinado de todos los proletarios por igual; aunque eso hace que el proceso de revolución sea mucho más rápido, la organización del nuevo país es mucho más complicada. Nuestra Civilización entra en [Strife]; las nuevas [Red Army Troop] se especializan en promociones de mando.
Socialist Revolution! = ¡Revolución socialista!

The revolution is dead. The government of capitalists continue their ruling, our civilization enters a state of [Struggle], But the route to Conservatism is unlocked. = La revolución está muerta. El gobierno de los capitalistas continúa su mandato, nuestra civilización entra en un estado de [Struggle], pero la ruta hacia el Conservadurismo está desbloqueada.
What we proclaim is the Right to Well-Being; Well-Being for All! = ¡Lo que proclamamos es el Derecho al Bienestar; Bienestar para Todos!
One revolt, followed by many, the capitalist system died by a thousand cut. There are no oppressions anymore. We have eliminated those ticks. Now is the time we enter [Anarchy] and turn it into something else. = Una revuelta, seguida de muchas, el sistema capitalista murió por mil cortes. Ya no hay opresiones. Hemos eliminado a esos parásitos. Ahora es el momento de entrar en [Anarchy] y convertirlo en algo diferente.
Installs Anarchist Ruling in all of your cities,an alternative ruling style ('Political Building') that replaces the intergration. It is free and built instantly, only providing small amount of debuff and needs Commune to be built to nullify its downsides. = Instala Gobierno anarquista en todas tus ciudades, un estilo de gobierno alternativo ('Political Building') que reemplaza la integración. Es gratis y se construye al instante, solo proporciona una pequeña cantidad de desventajas y necesita que se construya Commune para anular sus aspectos negativos.
Anarchist Revolution! = ¡Revolución anarquista!

We've rebuilt our government in pursuit to adapt to the new era, but the current economy policy is outdated. We will need a economy reform before we can do anything else. = Hemos reconstruido nuestro gobierno para adaptarnos a la nueva era, pero la política económica actual está desactualizada. Necesitaremos una reforma económica antes de poder hacer cualquier otra cosa.
Free Market = Libre mercado
We should believe in the unseen hand and solve all our problems with massive amount of capitals. = ¡Deberíamos creer en la mano invisible y resolver todos nuestros problemas con una cantidad masiva de capitales!
The unseen hand of market economy is not to be fully relied upon. We should spend effort to properly and use more refined policy to guide our nation's productivity. = No se debe confiar plenamente en la mano invisible de la economía de mercado. Deberíamos esforzarnos por usar políticas más refinadas para guiar la productividad de nuestra nación.
Stability First = Estabilidad primero
Our economy must serve the national unity first and formost, nothing is impossible when our nation is strong and its people united. = Nuestra economía debe servir primero y ante todo a la unidad nacional; nada es imposible cuando nuestra nación es fuerte y su pueblo está unido.
The might of our military overshadows any greed! = ¡El poder de nuestro ejército eclipsa cualquier codicia!
Nothing is beyond the power of winning in a direct conflict. We must direct all our effort into military! = Nada está más allá del poder de ganar en un conflicto directo. ¡Debemos dirigir todos nuestros esfuerzos a lo militar!
Centralised Economic Planning = Planificación económica centralizada
The market economy only benefits capitalists and speculators, our new socialist economy should maximise our development potential and distributes the goods to those who need it. = La economía de mercado solo beneficia a capitalistas y especuladores; nuestra nueva economía socialista debería maximizar nuestro potencial de desarrollo y distribuir los bienes a quienes los necesitan.
Decentralised Economy = Economía descentralizada
The economy suffered from monopoly and hierarchy, we should liberate the economy in favour of enabling peoples'agency to work for the masses. With nationalised industries and policies being guiding forces. = La economía sufrió por el monopolio y la jerarquía; deberíamos liberar la economía a favor de permitir la agencia del pueblo para trabajar por las masas. Con industrias nacionalizadas y políticas como fuerzas guía.
Self-Management Economy = Economía de autogestión
Worker should take the matter into their own hands instead of being some subjects of any greater entities. Mutualism and free will shall reign surpreme. = Los trabajadores deberían tomar el asunto en sus propias manos en lugar de ser súbditos de cualquier entidad superior. El mutualismo y la libre voluntad deben reinar supremamente.
New Economic Policies = Nuevas políticas económicas

The previous policies may have proven to be less potent. A rearrangement is thus needed. = Las políticas anteriores pueden haber demostrado ser menos potentes. Por lo tanto, se necesita una reordenación.
Changing economy policies = Cambiar políticas económicas

Here is a list of all of your active missions and their win conditions. = Aquí hay una lista de todas tus misiones activas y sus condiciones de victoria.
Build a Foundry! = ¡Construye una Fundición!
Unify your civilization under an Empire using [Enact Policy]. = Unifica tu civilización bajo un Imperio usando [Enact Policy].
Adopt at least [1] policy in either [Monotheism] or [Polytheism]. = Adopta al menos [1] política en [Monotheism] o [Polytheism].
Complete [4] side quests. = Completa [4] misiones secundarias.
Keep your civilization above [Anarchy]! = ¡Mantén tu civilización por encima de [Anarchy]!
Build [The Great Library]! = ¡Construye [The Great Library]!
Historically, Aside from the Great Library of Alexandria, the Library of Ashurbanipal, which is the Royal Library of Akkad, it was also renowned for holding the entire [The Epic of Gilgamesh] and dates further back, around 900BC. = Históricamente, además de la Gran Biblioteca de Alejandría, la Biblioteca de Ashurbanipal, que es la Biblioteca Real de Akkad, también era famosa por albergar la [The Epic of Gilgamesh] completa y data de más atrás, alrededor del 900 a. C.
And you are probably building it too early. = Y probablemente lo estás construyendo demasiado pronto.
One of the seven olde wonder of the western world. It was built around 600BC and nowadays we build it on every so called green highrises. = Una de las siete maravillas del mundo occidental antiguo. Fue construida alrededor del 600 a. C. y hoy en día la construimos en cada llamado rascacielos verde.
We have no idea where Tin, the most important ore in bronze making came from, but the traders came from mediterranean sea. So estabilishing a trading hub in the land of Canaan seems to be the way. = No tenemos idea de dónde venía el estaño, el mineral más importante en la fabricación de bronce, pero los comerciantes venían del mar Mediterráneo. Así que establecer un centro comercial en la tierra de Canaán parece ser el camino.
And you need to get enough [Pearl] by whatever means possible to conpete in mediterranean markets. = Y necesitas obtener suficientes [Pearl] por cualquier medio posible para competir en los mercados mediterráneos.
Trade with North African Civilization! = ¡Comercia con la Civilización del Norte de África!
Estabilish the [Incense] trade on the national level will encourge trade relation between our lower classes. And these egyptians are dubiously never lacking on wheats... For whatever reason. = Establecer el comercio de [Incense] a nivel nacional fomentará las relaciones comerciales entre nuestras clases bajas. Y estos egipcios dudosamente nunca carecen de trigo... Por alguna razón.
We can give them some good quality copper... wait, they also have that? = Podemos darles cobre de buena calidad... espera, ¿ellos también tienen eso?
In Emperors and Deities, Trading luxuries increases output of certain ['Economic Building']s as oppose to increasing [Happiness]. = En Emperors and Deities, comerciar lujos aumenta la producción de ciertos ['Economic Building'] en lugar de aumentar [Happiness].
Build [6] [Town Hall]s! = ¡Construye [6] [Town Hall]!
Nothing Encourages Unity more than the promise of giving land! = ¡Nada fomenta más la unidad que la promesa de entregar tierras!
Explore and improve more than 10 units of [Horse]! = ¡Explora y mejora más de 10 unidades de [Horse]!
A tile north of [Nippur] has [4] [Horse]! You may find more horses in the north eastern mountain ranges. = ¡Una casilla al norte de [Nippur] tiene [4] [Horse]! Puedes encontrar más caballos en las cordilleras del noreste.
Mission List = Lista de misiones

Well this tip is gonna appear every turn to annoy you out of playing the wrong civ. Maybe in the future Egypt will be playable in this scenario but the map isnt made for them. = Bueno, este consejo aparecerá cada turno para molestarte hasta que dejes de jugar la civilización equivocada. Quizá en el futuro Egipto sea jugable en este escenario, pero el mapa no está hecho para ellos.
Nope Nope Nope. = No, no, no.
Hey, choose [Central and West Asia] for this scenario! = ¡Oye, elige [Central and West Asia] para este escenario!
Spark of Civilization: Wrong Civilization = Chispa de la Civilización: Civilización equivocada

Welcome to the Emperors and Deities mod. \nOne of the biggest unciv ruleset. \nAlthough the content of the mod is vast, the story takes place in roughly the same place as the original civilization series. Namely the Journey of Humanity. \nThe mod greatly expands the technological progess, element of customization and many other aspects of civ. It is going to be a bumpy ride so strap in. = Bienvenido al mod Emperors and Deities. \nUno de los conjuntos de reglas más grandes de Unciv. \nAunque el contenido del mod es vasto, la historia ocurre aproximadamente en el mismo lugar que la serie original de Civilization. Es decir, el Viaje de la Humanidad. \nEl mod expande enormemente el progreso tecnológico, los elementos de personalización y muchos otros aspectos de civ. Va a ser un viaje lleno de baches, así que abróchate el cinturón.
Start the Tutorial = Comenzar el tutorial
Dont forget to check civilipedia if you are in need of understanding certain mechanics. = No olvides consultar la civilipedia si necesitas entender ciertas mecánicas.
Mesopotamia, Spark of Civilization, 4000BCE = Mesopotamia, Chispa de la Civilización, 4000 a. C.

You have the city of Uruk under your control as the center of your civilization. \nIt controls some lands which provides food and trade. Which abstracts into gold production. \nIn the city, there are populations, which includes the people working on the lands. = Tienes la ciudad de Uruk bajo tu control como centro de tu civilización. \nControla algunas tierras que proporcionan comida y comercio. Lo cual se abstrae en producción de oro. \nEn la ciudad hay población, que incluye a las personas que trabajan las tierras.
Whats my job? = ¿Cuál es mi trabajo?
Your job in every game is to send [Settler]s, build cities and manage them along with a bunch of units. That is the most basic gameplay that civilization series has to offer. However, Emperors and Deities brings more outside factors to this gameplay. = Tu trabajo en cada partida es enviar [Settler], construir ciudades y gestionarlas junto con un montón de unidades. Esa es la jugabilidad más básica que ofrece la serie Civilization. Sin embargo, Emperors and Deities trae más factores externos a esta jugabilidad.
----- = -----
In this mission you need to build a [Foundry] to jump start the production of bronze to boost your city's [Production]. Afterwhich is another new mission. And so on and so fourth, if you are able to complete all missions thats labeled as main quests, you will win this scenario. = En esta misión necesitas construir una [Foundry] para iniciar la producción de bronce y aumentar la [Production] de tu ciudad. Después viene otra nueva misión. Y así sucesivamente; si logras completar todas las misiones etiquetadas como misiones principales, ganarás este escenario.
New Main Quest: Into The Bronze Age, 4000BCE = Nueva misión principal: Hacia la Edad de Bronce, 4000 a. C.

With the increase of productivity, population grows, and risk of over population forced some people to set off to new lands. = Con el aumento de la productividad, la población crece, y el riesgo de superpoblación obligó a algunas personas a partir hacia nuevas tierras.
I wonder if they would stay by our side... = Me pregunto si se quedarían a nuestro lado...
[Settler] Units can create new cities, which is absolutely essential for expanding. Every new city settled is a new production line of unit and buildings. = Las unidades [Settler] pueden crear nuevas ciudades, lo cual es absolutamente esencial para expandirse. Cada nueva ciudad fundada es una nueva línea de producción de unidades y edificios.
As for how loyal would they be? Well, the game doesnt allow them to rebel. However, new cities will take a big chunk of happiness away from you since the governing body of your civilization have to diverge their power. = En cuanto a cuán leales serían, bueno, el juego no les permite rebelarse. Sin embargo, las nuevas ciudades te quitarán una gran parte de felicidad, ya que el órgano de gobierno de tu civilización tiene que dividir su poder.
Low happiness can wreck havoc on unsuspecting civilizations as they decrease [Influence] and make negative events occur more often. = La baja felicidad puede causar estragos en civilizaciones desprevenidas, ya que reduce la [Influence] y hace que los eventos negativos ocurran con más frecuencia.
ALSO, LUXURY DOESNT PROVIDE HAPPINESS NATURALLY IN THIS MOD. = ADEMÁS, EL LUJO NO PROPORCIONA FELICIDAD DE FORMA NATURAL EN ESTE MOD.
Quest Reward: Into The Bronze Age, 4000BCE = Recompensa de misión: Hacia la Edad de Bronce, 4000 a. C.

A brilliant Semitic leader named Sargon has risen in the north. His military innovations and administrative talent promise to unite all of Mesopotamia. This is not a threat but an opportunity. Will you embrace unity or preserve the old city-states? = Un brillante líder semita llamado Sargón ha surgido en el norte. Sus innovaciones militares y talento administrativo prometen unir toda Mesopotamia. Esto no es una amenaza, sino una oportunidad. ¿Abrazarás la unidad o preservarás las antiguas ciudades-estado?
An Empire rises before my eyes! = ¡Un Imperio se alza ante mis ojos!
The united realm will share knowledge and resources. = El reino unido compartirá conocimiento y recursos.
Maintain the independence of city-states! = ¡Mantener la independencia de las ciudades-estado!
Sargon fails at his mission. The cities remain separate but cooperate through trade and mutual defense. Or not? = Sargón fracasa en su misión. Las ciudades permanecen separadas pero cooperan mediante el comercio y la defensa mutua. ¿O no?
Sargon's Reign, 2334BCE = El reinado de Sargón, 2334 a. C.

Whether through alliance or federation, the time has come to formalize the political structure of your civilization. Use the [Enact Policies] decision in your capital to consolidate your rule. If you have enough Influence, you can declare a unified empire. This will unlock new government bonuses and prepare you for future challenges. = Ya sea mediante alianza o federación, ha llegado el momento de formalizar la estructura política de tu civilización. Usa la decisión [Enact Policies] en tu capital para consolidar tu gobierno. Si tienes suficiente Influencia, puedes declarar un imperio unificado. Esto desbloqueará nuevas bonificaciones de gobierno y te preparará para desafíos futuros.
How do I unify? = ¿Cómo me unifico?
Open the city screen of your capital, find the [Enact Policies] building, and choose the option 'We are able to unify ourselves!' when you have at least half of your Influence Limit. = Abre la pantalla de la ciudad de tu capital, encuentra el edificio [Enact Policies] y elige la opción '¡Podemos unificarnos!' cuando tengas al menos la mitad de tu Límite de Influencia.
New Main Quest: Unify Mesopotamia, 2200BCE = Nueva misión principal: Unificar Mesopotamia, 2200 a. C.

And so, the mesopotamian became the soverign owner of their own region. The legacy of Sargon will last. = Y así, los mesopotámicos se convirtieron en los dueños soberanos de su propia región. El legado de Sargón perdurará.
United and Stronger than ever. = Unidos y más fuertes que nunca.
Quest Reward: Unify Mesopotamia, 2200BCE = Recompensa de misión: Unificar Mesopotamia, 2200 a. C.

You have declined the offer of unification, which is an interesting choice. However, there is always another way to strengthen your civilization's unity. = Has rechazado la oferta de unificación, lo cual es una elección interesante. Sin embargo, siempre hay otra forma de fortalecer la unidad de tu civilización.
A pantheon? Or something greater... = ¿Un panteón? O algo más grande...
Choose between the [Polytheism] or [Monotheism], besides a unifying government that grants powerful uniques, you can also build a religion that outlive it. = Elige entre [Polytheism] o [Monotheism]; además de un gobierno unificador que otorga unidades únicas poderosas, también puedes construir una religión que lo sobreviva.
New Main Quest: A House Divided, 2200BCE = Nueva misión principal: Una casa dividida, 2200 a. C.

And so, although history's tide changes, a long lasting faith system starts spreading along with all the glory of the west asian civilization = Y así, aunque la marea de la historia cambie, un sistema de fe duradero comienza a extenderse junto con toda la gloria de la civilización de Asia occidental.
Interesting = Interesante.
Quest Reward: A House Divided, 2200BCE = Recompensa de misión: Una casa dividida, 2200 a. C.

The Wheel of history turns its tide, the empire of akkad didnt last. But the west asian civilization is now going through an era of prosperity, complete 4 side quests and \n Prepare for the inevitable. = La rueda de la historia gira su marea; el imperio de Akkad no perduró. Pero la civilización de Asia occidental atraviesa ahora una era de prosperidad; completa 4 misiones secundarias y \n prepárate para lo inevitable.
You may check the list of available side quests by [Check Mission List] in capital. = Puedes consultar la lista de misiones secundarias disponibles mediante [Check Mission List] en la capital.
New Main Quest: The Old Babylon, 1900BCE = Nueva misión principal: La Antigua Babilonia, 1900 a. C.

You have built a nation of prosperity, now its time for durability test. = Has construido una nación de prosperidad; ahora es el momento de la prueba de durabilidad.
What are you talking about? = ¿De qué estás hablando?
Quest Reward: The Old Babylon, 1900BCE = Recompensa de misión: La Antigua Babilonia, 1900 a. C.

For whatever reason, a volcano event far far away has triggered an agricultural disaster across the entire ancient world.\nOld order is crumbling. Civilizations across the eastern Mediterranean are falling to famine, rebellion, and the loss of trade routes. But here in Mesopotamia, your leadership will determine whether our light fades or endures. Over the next 15 turns, you will face a series of crises. Each requires wise use of Influence and Gold. = Por alguna razón, un evento volcánico muy, muy lejano ha desencadenado un desastre agrícola en todo el mundo antiguo.\nEl viejo orden se desmorona. Las civilizaciones del Mediterráneo oriental están cayendo ante la hambruna, la rebelión y la pérdida de rutas comerciales. Pero aquí en Mesopotamia, tu liderazgo determinará si nuestra luz se desvanece o perdura. Durante los próximos 15 turnos, enfrentarás una serie de crisis. Cada una requiere un uso sabio de Influencia y Oro.
What must I do? = ¿Qué debo hacer?
Over the following turns, disasters will strike: drought, civil unrest, economic collapse. Use the [Influence], [Enact Policies] and your stored resources to mitigate them. Survive all 15 turns to complete the tutorial and unlock a special reward. = Durante los siguientes turnos, golpearán desastres: sequía, disturbios civiles, colapso económico. Usa la [Influence], [Enact Policies] y tus recursos almacenados para mitigarlos. Sobrevive los 15 turnos para completar el tutorial y desbloquear una recompensa especial.
New Main Quest: Survive the Bronze Age Collapse, 1200BCE = Nueva misión principal: Sobrevivir al Colapso de la Edad de Bronce, 1200 a. C.

You have completed a side quest! This glorious deed will be recorded in the global history. = ¡Has completado una misión secundaria! Esta gloriosa hazaña quedará registrada en la historia global.
Our story continues! = ¡Nuestra historia continúa!
Side Quest Completion = Misión secundaria completada

The harvest has failed. Food stores are empty, and people are beginning to starve. Entire villages started to escape for survival. = La cosecha ha fracasado. Los almacenes de comida están vacíos y la gente empieza a morir de hambre. Aldeas enteras comenzaron a escapar para sobrevivir.
Distribute emergency grain = Distribuir grano de emergencia
The granaries opened. Providing much needed food sourced from both emergency storage and grains bought in a hurry... for now. = Los graneros se abrieron. Proporcionando comida muy necesaria proveniente tanto del almacenamiento de emergencia como de granos comprados a las apuradas... por ahora.
Import Grains from Egypt = Importar granos de Egipto
Although Egypt also suffers from this horrible disaster. You managed to maintain a desperate alliance between the civilizations and kept the people fed. = Aunque Egipto también sufre este horrible desastre. Lograste mantener una alianza desesperada entre las civilizaciones y mantener alimentada a la gente.
... = ...
The granaries are emptied! They were already sold by greedy nobles and merchants who also directed the hatred to the leader! = ¡Los graneros están vacíos! ¡Ya habían sido vendidos por nobles y comerciantes codiciosos, quienes además dirigieron el odio hacia el líder!
Drought and Famine = Sequía y hambruna

Ambitious nobilities stopped their pursuit of expansion due to the disaster, however that only lead them into power struggle with each others, with the worsening global starvation, the Barbarians are invading as well. = Las noblezas ambiciosas detuvieron su búsqueda de expansión debido al desastre; sin embargo, eso solo los llevó a luchas de poder entre sí. Con el empeoramiento de la hambruna global, los bárbaros también están invadiendo.
We must do something about it! = ¡Debemos hacer algo al respecto!
Tighten the Rulership. The amount of [Town Hall]s will lessen the rebellions. = Apretar el gobierno. La cantidad de [Town Hall] reducirá las rebeliones.
Let them come! = ¡Que vengan!
Certainly, you have an army, why not use them? = Ciertamente, tienes un ejército, ¿por qué no usarlo?
Usurpers and Barbarians = Usurpadores y bárbaros

The tin routes from distant lands have been severely impacted by the disaster. Without metals, your artisans cannot produce bronze weapons or tools. Production slows across the empire. = Las rutas de estaño desde tierras lejanas han sido gravemente afectadas por el desastre. Sin metales, tus artesanos no pueden producir armas o herramientas de bronce. La producción se ralentiza en todo el imperio.
Fix the route then. = Entonces arregla la ruta.
Because you have done the related side quest. You have enough [Pearl]s to buy up all the remaining tins on the market! If you can still call it a market. = Porque has hecho la misión secundaria relacionada. ¡Tienes suficientes [Pearl] para comprar todo el estaño restante en el mercado! Si es que todavía puedes llamarlo mercado.
Try to ration the material! = ¡Intenta racionar el material!
A correct call. = Una decisión correcta.
Encourage local alternatives. = Fomentar alternativas locales.
Downgrading the tool to pure copper, stone and bone is the desperate, but essential move. = Degradar la herramienta a cobre puro, piedra y hueso es una medida desesperada pero esencial.
Trade Collapse = Colapso comercial

Scribes are fleeing the cities to avoid conscription and taxes. The art of writing is being forgotten. Your scientific progress halts. = Los escribas huyen de las ciudades para evitar el reclutamiento y los impuestos. El arte de la escritura está siendo olvidado. Tu progreso científico se detiene.
Reward those who stayed. Punish those who fleed. = Recompensa a los que se quedaron. Castiga a los que huyeron.
Maintaining the order. = Mantener el orden.
We have [The Great Library] = Tenemos [The Great Library]
Well. We always have backups in the royal library. = Bueno. Siempre tenemos copias de seguridad en la biblioteca real.
Without scribes, records are lost. Generations of knowledges are lost to time. = Sin escribas, los registros se pierden. Generaciones de conocimiento se pierden en el tiempo.
Loss of Writing = Pérdida de la escritura

It is appearent that the gods are angry that such a disaster has struck... The priests are recieveing a lot of backlash because of this. And the power structure of the entire region has been weakened = Es evidente que los dioses están enojados de que haya ocurrido tal desastre... Los sacerdotes están recibiendo muchas críticas por esto. Y la estructura de poder de toda la región se ha debilitado.
Trample the heretic! = ¡Pisotear al hereje!
Change [Hanging Gardens] to a site of worship and force the priests to pray to the god of fertility = Cambiar [Hanging Gardens] a un sitio de culto y obligar a los sacerdotes a rezar al dios de la fertilidad
This does absolutely nothing, but peoples are slightly less angry and let it slipped. = Esto no hace absolutamente nada, pero la gente está un poco menos enojada y lo dejó pasar.
Without powerful priests, the sacredness of the throne isn't secure any more.. This leads to even more man-mode disasters. = Sin sacerdotes poderosos, la sacralidad del trono ya no está segura... Esto lleva a aún más desastres provocados por el hombre.
Loss of Faith = Pérdida de fe

The crises have passed. Mesopotamia is battered but alive. Your decisions have shaped the survival of civilization itself. One last choice awaits. = Las crisis han pasado. Mesopotamia está golpeada pero viva. Tus decisiones han moldeado la supervivencia de la civilización misma. Una última elección aguarda.
Look to the future (Tutorial Completion) = Mirar hacia el futuro (Tutorial completado)
You have completed the Spark of Civilization tutorial. Your people will remember your leadership. = Has completado el tutorial Chispa de la Civilización. Tu pueblo recordará tu liderazgo.
Thank you for playing this scenario! = ¡Gracias por jugar este escenario!
Just another turn... = Solo un turno más...
You may keep playing the tutorial, but thats that. = Puedes seguir jugando el tutorial, pero eso es todo.
The Final Hour = La Hora Final


