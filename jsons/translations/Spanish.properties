ED - Invention and Innovations = ED - Invención e Innovaciones
[buildingFilter]s and [buildingFilter2]s are new buildings that represent minor technological progression and act like mini National Wonders. They enable you to build certain units and buildings or give functionality boosts to existing buildings. They are built faster when other civilizations have already built them, but if you build it first, you are granted a [stat] and [stat2] boost that scales with the Era of the [buildingFilter3] or [buildingFilter4]. It is also important to state that there is no gameplay difference between [buildingFilter5]s and [buildingFilter6]s. = [buildingFilter] y [buildingFilter2] son nuevos edificios que representan un progreso tecnológico menor y actúan como mini Maravillas Nacionales. Te permiten construir ciertas unidades y edificios o dar mejoras de funcionalidad a edificios existentes. Se construyen más rápido cuando otras civilizaciones ya los han construido, pero si lo construyes primero, se te concede un impulso de [stat] y [stat2] que escala con la Era del [buildingFilter3] o [buildingFilter4]. También es importante señalar que no hay diferencia de jugabilidad entre [buildingFilter5] y [buildingFilter6].
Invention bonus before Industrial Era = Bonificación de invención antes de la Era Industrial
[amount] [stat], [amount2] [stat2] = [amount] [stat], [amount2] [stat2]
[amount]% production cost of [buildingFilter]s and [buildingFilter2]s for other civs = [amount]% del coste de producción de [buildingFilter] y [buildingFilter2] para otras civilizaciones
Invention bonus Stats after Industrial Era = Estadísticas de bonificación de invención después de la Era Industrial
Invention bonus after Atomic Era = Bonificación de invención después de la Era Atómica

ED - Religion Changes = ED - Cambios en la religión
faith = fe
At first, religion premise is decided by the three-way choice betwee [param], [param2] and [param3]. Although the one standing out is [param4].\nBecause the other two, [param5] seek to maintain a alliance between [stat] and [stat2], [param6] is ambiguous toward [param7], but [param8] is the way to go if you want to delve into religion faster than anyone else. They also have a different selection of wonder to build. Avoiding a fair amount of competition. = Al principio, la premisa de la religión se decide por la elección triple entre [param], [param2] y [param3]. Aunque el que destaca es [param4].\nPorque los otros dos, [param5] buscan mantener una alianza entre [stat] y [stat2], [param6] es ambiguo hacia [param7], pero [param8] es el camino a seguir si quieres profundizar en la religión más rápido que nadie. También tienen una selección diferente de maravillas para construir. Evitando una buena cantidad de competencia.
Then, you have pantheon, which gives plenty of faith according to the terrain. Even [param] would have to choose a pantheon as it is a spritual step toward the lord. = Luego, tienes el panteón, que da mucha fe según el terreno. Incluso [param] tendría que elegir un panteón, ya que es un paso espiritual hacia el señor.
Beliefs unlocks plenty of things, aside from buildings like [buildingFilter] and [buildingFilter2], some also unlocks wonders. They also helps with decreasing the unhappiness from the population. Some of them need specific policies like [param] to be adopted.\n Follower Beliefs are ability granters. They enable crucial abilities such as using [stat] to buy stuff.\n Enhancer Beliefs on the other hand, boosts the religion to spread itself better and gives even more bonuses toward various aspects like military and further utilises [stat2]. = Las creencias desbloquean muchas cosas; además de edificios como [buildingFilter] y [buildingFilter2], algunas también desbloquean maravillas. También ayudan a disminuir la infelicidad de la población. Algunas de ellas necesitan políticas específicas como [param] para ser adoptadas.\n Las Creencias de Seguidor otorgan habilidades. Permiten habilidades cruciales como usar [stat] para comprar cosas.\n Las Creencias de Mejora, por otro lado, impulsan la religión para que se extienda mejor y dan aún más bonificaciones hacia varios aspectos como el militar y utilizan más [stat2].

ED - Great People Changes = ED - Cambios en los grandes personajes
Great Persons have been changed. For example, [param] has been separated into [unit] and [unit2]. [unit3]s and [unit4]s have new unique mechanics like creating [resource]s and [resource2]s. Some [improvementFilter]s like [improvementName], [improvementName2]s, and [improvementName3]s have bonuses on specific tiles. = Los Grandes Personajes han cambiado. Por ejemplo, [param] se ha separado en [unit] y [unit2]. [unit3] y [unit4] tienen nuevas mecánicas únicas como crear [resource] y [resource2]. Algunos [improvementFilter] como [improvementName], [improvementName2] y [improvementName3] tienen bonificaciones en casillas específicas.
