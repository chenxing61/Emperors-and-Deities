ED - Expansions, Consolidation and Modernization = ED - Expansiones, Consolidación y Modernización
City development is organized into three tiers of building packages: "Expansion", "Consolidation", and "Modernization". = El desarrollo de la ciudad se organiza en tres niveles de paquetes de edificios: "Expansión", "Consolidación" y "Modernización".
How packages work: Each package lets you build multiple related buildings at once, saving [stat] and ensuring that development becomes easier with tech investment. Packages become available as you progress through eras. For example, [buildingFilter] builds [buildingFilter2], [buildingFilter3], and [buildingFilter4] together and is unlocked by [tech]. = Cómo funcionan los paquetes: Cada paquete te permite construir múltiples edificios relacionados a la vez, ahorrando [stat] y asegurando que el desarrollo sea más fácil con la inversión en tecnología. Los paquetes se vuelven disponibles a medida que avanzas por las eras. Por ejemplo, [buildingFilter] construye [buildingFilter2], [buildingFilter3] y [buildingFilter4] juntos y se desbloquea con [tech].
"Expansion": \nCovers basic buildings which form the foundation of any town. Which are mostly unlocked before [buildingFilter] = "Expansión": \nCubre edificios básicos que forman la base de cualquier ciudad. Que en su mayoría se desbloquean antes de [buildingFilter]
"Consolidation" \nCovers buildings that forms a proper city and make it useful. Which are mostly unlocked starting from [buildingFilter] and before [buildingFilter2]. = "Consolidación" \nCubre edificios que forman una ciudad adecuada y la hacen útil. Que en su mayoría se desbloquean a partir de [buildingFilter] y antes de [buildingFilter2].
"Modernization" \nCovers buildings that makes a city that is considered modernized. Which are mostly unlocked starting from [buildingFilter]. You wouldn't live without them in real life. = "Modernización" \nCubre edificios que hacen que una ciudad sea considerada modernizada. Que en su mayoría se desbloquean a partir de [buildingFilter]. No podrías vivir sin ellos en la vida real.

