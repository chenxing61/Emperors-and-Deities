Be prepared. = Prepárate.
Hidden Anger = Ira oculta

The civilization starts to lose its grasp with order and splendor due to lack of [Happiness]! = ¡La civilización empieza a perder su dominio del orden y el esplendor debido a la falta de [Happiness]!
Who do they think they are? = ¿Quiénes se creen que son?
Preventing losing stability for this one time... = Evitando perder estabilidad por esta única vez...
