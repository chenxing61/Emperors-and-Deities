The civilization starts to lose its grasp with order and splendor due to lack of [Happiness]! As inequality in wealth is detrimental to societal stability. = ¡La civilización empieza a perder su dominio del orden y el esplendor debido a la falta de [Happiness]! La desigualdad de riqueza es perjudicial para la estabilidad social.
Wealth Gap Widens = La brecha de riqueza se amplía

The civilization starts to lose its grasp with order and splendor due to lack of [Happiness]! As unjust ruling causes outrage in your towns. = ¡La civilización empieza a perder su dominio del orden y el esplendor debido a la falta de [Happiness]! El gobierno injusto causa indignación en tus ciudades.
Rampant Corruption = Corrupción desenfrenada

The civilization starts to lose its grasp with order and splendor due to lack of [Happiness]! As more and more yeoman loses their land to giant landlords, they either became serfs or vargants. Which exacerbates the risk of revolts and the decline of living condition. = ¡La civilización empieza a perder su dominio del orden y el esplendor debido a la falta de [Happiness]! A medida que más y más pequeños propietarios pierden sus tierras ante los grandes terratenientes, se convierten en siervos o vagabundos. Esto exacerba el riesgo de revueltas y el deterioro de las condiciones de vida.
The Population shifts between cities... = La población se desplaza entre ciudades...
Vagrancy Crisis = Crisis de vagabundaje

Though the disorder can be better controlled in a small civilization, but it still needs a permanent solution. = Aunque el desorden puede controlarse mejor en una civilización pequeña, todavía necesita una solución permanente.
Chaos Spreading = El caos se extiende

As our civilization became united and peaceful. Less and less people are willing to join the army. = A medida que nuestra civilización se unificó y pacificó, cada vez menos gente está dispuesta a unirse al ejército.
Even if we force them into military service, these weak men would not suffice either way. = Incluso si los forzamos al servicio militar, estos hombres débiles no servirían de todos modos.
The number of [Standing Army Maintenance] and [Noble Army Maintenance] decreases to [75]% for a fair amount of turns. Which may impact our military in both size and strength. = La cantidad de [Standing Army Maintenance] y [Noble Army Maintenance] se reduce a [75]% durante una cantidad considerable de turnos. Esto puede afectar a nuestro ejército tanto en tamaño como en fuerza.
Unacceptable. = Inaceptable.
The long lasting peace = La paz duradera

In a united civilization, without much outer threat. The desire for advancement became lower day by day. = En una civilización unida, sin mucha amenaza externa, el deseo de progreso disminuye día a día.
We are too big to fall. It wouldnt matter either way. = Somos demasiado grandes para caer. No importaría de todos modos.
[Science] production falls by [15]% and Policy Cost Spikes by [10]% for a fair amount of turns. = La producción de [Science] cae un [15]% y el coste de políticas aumenta un [10]% durante una cantidad considerable de turnos.
We must force progression by any means possible = Debemos forzar el progreso por cualquier medio posible
Stagnation = Estancamiento

Because of our civilization's divided status, internal division is exacerbating, soon military conflict will rise. = Debido al estado dividido de nuestra civilización, la división interna se exacerba; pronto surgirá un conflicto militar.
One side is more correct than the others. = Un lado es más correcto que los demás.
A Hostile force gathers around your capital. = Una fuerza hostil se reúne alrededor de tu capital.
This is a chance that the entire civilization can unite under one will! = ¡Esta es una oportunidad para que toda la civilización se una bajo una sola voluntad!
Hostile forces gathers around your first [3] cities. = Fuerzas hostiles se reúnen alrededor de tus primeras [3] ciudades.
We cannot afford to fight ourselves... = No podemos permitirnos luchar entre nosotros...
Risk of Civil War = Riesgo de guerra civil

Pride and Prejudice are disturbing relations between our civilization's states. = El orgullo y el prejuicio están perturbando las relaciones entre los estados de nuestra civilización.
They will find out the answer by themselves = Ellos encontrarán la respuesta por sí mismos
This must be surpressed = Esto debe ser reprimido
Tribalism permeates = El tribalismo impregna

The [Great Khan] has been losing [Influence] gradually, until today, when he no longer has to worry about backstabs anymore. He is now one with the heaven. = El [Great Khan] ha ido perdiendo [Influence] gradualmente, hasta hoy, cuando ya no tiene que preocuparse por traiciones. Ahora es uno con el cielo.
Khannnnnn! = ¡Khannnnnn!
Khan's Death = Muerte del Khan

As the financial bubble bursts because of [Overproduction], the stockmarket has crashed hard. = Cuando la burbuja financiera estalla debido a la [Overproduction], el mercado de valores se desploma con fuerza.
We need as much aid as possible = Necesitamos toda la ayuda posible
I wish we could do something! = ¡Ojalá pudiéramos hacer algo!
