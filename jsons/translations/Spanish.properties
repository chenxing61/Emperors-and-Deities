This mod offers some brand new mechanics that are of note, you might want to play through the Scenario Tutorial first in order to gain basic understandings of them. Since they are very relevant throughout the entire ruleset. = Este mod ofrece algunas mecánicas totalmente nuevas que son dignas de mención; quizá quieras jugar primero el Tutorial del Escenario para obtener una comprensión básica de ellas. Ya que son muy relevantes en todo el conjunto de reglas.
Problems and solutions never seen before! = ¡Problemas y soluciones nunca vistos antes!
Open up the [Enact Policies] tab and have a look! = ¡Abre la pestaña [Enact Policies] y echa un vistazo!
You can open this in your capital at any moment to solve debuffs and manage a lot of stuff. = Puedes abrir esto en tu capital en cualquier momento para resolver desventajas y gestionar muchas cosas.
And then theres also a link to the in game documentation of the mod, which you also will NEED to take a look if you want to gain a greater understanding of this ruleset. = Y además hay un enlace a la documentación del mod dentro del juego, que también **necesitarás** consultar si quieres comprender mejor este conjunto de reglas.
I already knew it = Ya lo sabía
Good luck. = Buena suerte.
The internal affair... = Los asuntos internos...

There are no perfect world where our people will unite forever. Under just or unjust rulings from leaders of various competency. They will react differently, some reactions are more negative than others. = No existe un mundo perfecto donde nuestro pueblo se una para siempre. Bajo gobiernos justos o injustos de líderes de diversa competencia, reaccionarán de manera diferente; algunas reacciones son más negativas que otras.
Well that sucks = Vaya, eso apesta
