[Overproduction] meant disposability. And it has found its way into our people's mentality. = [Overproduction] significaba desechabilidad. Y se ha infiltrado en la mentalidad de nuestra gente.
Bad habit die hard, but it must die. = Los malos hábitos mueren difícil, pero deben morir.
We must save the earth. = Debemos salvar la tierra.
Whatever floats my boat. = Lo que a mí me convenga.
Wasteful Habits = Hábitos derrochadores

The shelves are running out of goods. [Underproduction] had its effect on our people's daily lives. = Las estanterías se quedan sin productos. [Underproduction] ha afectado la vida diaria de nuestra gente.
We must stabilise the production of necessary goods. = Debemos estabilizar la producción de bienes necesarios.
Import! = ¡Importar!
Goods Shortage = Escasez de bienes

Even though theres enough incentive to build new factories, [Underproduction] slowed our industrial growth! = Aunque hay suficiente incentivo para construir nuevas fábricas, ¡[Underproduction] ha frenado nuestro crecimiento industrial!
We shall intervene officially. = Intervendremos oficialmente.
If we could just buy it, why should we produce it? = Si pudiéramos comprarlo, ¿por qué producirlo?
Leave it be for a while. = Déjalo estar por un tiempo.
[-33%] Production when constructing all normal buildings for a short amount of time. = [-33%] de Producción al construir todos los edificios normales durante un breve período.
Machine Shortage = Escasez de maquinaria

We successfully brought our fury to the Barbarian's Motherland. New problem arises. = Llevamos con éxito nuestra furia a la Patria de los Bárbaros. Surge un nuevo problema.
Plunder them dry and banish them! = ¡Saquearlos hasta dejarlos secos y desterrarlos!
In the grand scheme of things, this counts as a uncivilized [Cultural Exchange]. = En el gran esquema de las cosas, esto cuenta como un [Cultural Exchange] incivilizado.
Increase the Cultural Diversity by a level if it hasnt reached highest level yet. = Aumenta la Diversidad Cultural en un nivel si aún no ha alcanzado el nivel más alto.
Intergrate them into our glorious empire! = ¡Integradlos en nuestro glorioso imperio!
Enslavement would teach them how to behave = La esclavitud les enseñaría a comportarse
These men need a shepherd leading them to the lord = Estos hombres necesitan un pastor que los guíe hacia el señor.
The Barbarian's Surrender = La rendición de los bárbaros

Decisions reguarding the civilization's internal affair. = Decisiones relativas a los asuntos internos de la civilización.
Introduction = Introducción
In this decision tab, different actions are unlocked based on to how many [Influence] you have and how many unique action your civilization state has provided you with. = En esta pestaña de decisiones, se desbloquean diferentes acciones según la cantidad de [Influence] que tengas y cuántas acciones únicas te haya proporcionado el estado de tu civilización.
In each era, you recieve a [Forced Shift In Politic Chance], and when you have more [Influence] than your limit in this era, you can trigger a Shift In Politic in this tab early to provide you with either a chance to unify or a chance to collapse, this grants you freedom on choices of ['Civilization State']. = En cada era, recibes una [Forced Shift In Politic Chance], y cuando tienes más [Influence] que tu límite en esta era, puedes desencadenar un Cambio Político en esta pestaña anticipadamente para obtener una oportunidad de unificar o una oportunidad de colapsar; esto te otorga libertad en la elección de ['Civilization State'].
Most option will appear when you are unified or have more [Influence] than half of your limit. At the same time, some options only appear when your civilization are divided or have severe debuffs. This tab will help you solve them. = La mayoría de las opciones aparecerán cuando estés unificado o tengas más [Influence] que la mitad de tu límite. Al mismo tiempo, algunas opciones solo aparecen cuando tu civilización está dividida o tiene desventajas graves. Esta pestaña te ayudará a resolverlas.
Total mobilization in all city! = ¡Movilización total en todas las ciudades!
This Decision will instruct all the city to mobilise its [The Levied Army] unit, regardless of the size of city. Usually you need at least 5 Population to [Call to Arms]. = Esta Decisión instruirá a todas las ciudades a movilizar su unidad [The Levied Army], independientemente del tamaño de la ciudad. Normalmente necesitas al menos 5 de población para [Call to Arms].
By the merit of being [United], the negative [Happiness] from [Call to Arms] is also lessened. For a short amount of time. = Por el mérito de estar [United], el [Happiness] negativo de [Call to Arms] también se reduce. Durante un breve período.
Disband all Levies. = Disolver todas las levas.
After Conflict dies down, we may disband our [The Levied Army] units to eliminate negative effects from [Call to Arms]. = Después de que el conflicto disminuya, podemos disolver nuestras unidades [The Levied Army] para eliminar los efectos negativos de [Call to Arms].
Increase [Influence] through different means. = Aumentar [Influence] mediante diferentes medios.
Increase/Decrease Cultural Diversity through different means. = Aumentar/Disminuir la Diversidad Cultural mediante diferentes medios.
Spread our [Influence] to city states. = Difundir nuestra [Influence] a las ciudades-estado.
Costs 1 [Influence] per turn, maintain your diplomatic efforts in city states. = Cuesta 1 [Influence] por turno, mantén tus esfuerzos diplomáticos en las ciudades-estado.
Costs 1 extra [Influence] per turn starting from Imperial era. = Cuesta 1 [Influence] extra por turno a partir de la era Imperial.
Stop Spreading our [Influence] to city states. = Detener la difusión de nuestra [Influence] a las ciudades-estado.
Build Agreements (Divided Government Form Special Action) = Construir Acuerdos (Acción especial de forma de gobierno dividida)
Tho our civilization is divided, we are not weak. = Aunque nuestra civilización esté dividida, no somos débiles.
Build Agreements (Personal Union Form Special Action) = Construir Acuerdos (Acción especial de forma de Unión Personal)
Commonwealth needs futher cooperation. = La Mancomunidad necesita más cooperación.
Adoption of European Cultures ([Europa] Special Action) = Adopción de culturas europeas (Acción especial [Europa])
Adoption of Schools of Thought ([Warring States] Special Action) = Adopción de Escuelas de Pensamiento (Acción especial [Warring States])
Tribe Assembly ([Nomadic Culture] Special Action) = Asamblea tribal (Acción especial [Nomadic Culture])
One Step Above Peace. = Un paso por encima de la paz.
Through costing [Faith] and [Gold], We may propell our civilization into a even more stable state. [Harmony]. = A costa de [Faith] y [Gold], podemos impulsar nuestra civilización a un estado aún más estable: [Harmony].
Increasing Stability. = Aumentar la estabilidad.
We must take action against the coming chaos. = Debemos tomar medidas contra el caos venidero.
Crisis Solving = Resolución de crisis
A lot of our cities are in a horrible state. We should do what we can to save them. = Muchas de nuestras ciudades están en un estado horrible. Deberíamos hacer lo posible para salvarlas.
Changing Economic Policies = Cambiar políticas económicas.
If the current economic policies fail to meet the situation... = Si las políticas económicas actuales no satisfacen la situación...
Changing Civilization Form = Cambiar forma de civilización
If your [Influence] is somehow above your [Influence Limit]. You can trigger this. = Si tu [Influence] está de alguna manera por encima de tu [Influence Limit]. Puedes activar esto.
We can force the shift in politic to stop our civilization from entering a undesireable route... = Podemos forzar el cambio político para evitar que nuestra civilización tome una ruta indeseable...
State Reform = Reforma del estado
Social Reform = Reforma social
Did you know that this mod has tutorial pages in civilopedia's tutorial section? = ¿Sabías que este mod tiene páginas de tutorial en la sección de tutoriales de la civilopedia?
You may want to check them out. = Quizá quieras echarles un vistazo.
