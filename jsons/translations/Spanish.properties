ED - Mod Manual = ED - Manual del mod
The mod's main goal is to reshape Civ 5 into a more complex and nuanced game with many new mechanics incorporated.\nMajor Differences: = El objetivo principal del mod es remodelar Civ 5 en un juego más complejo y matizado con muchas mecánicas nuevas incorporadas.\nDiferencias principales:
1. Keep in mind that Luxury Resources no longer provide any [stat] by default; they provide a large amount of [stat2] and development potential. However, 'We Love the King Day' and city-state quests still require Luxury Resources. As for how you gain [stat3], you can build many buildings and create a religion with suitable beliefs. = 1. Ten en cuenta que los Recursos de lujo ya no proporcionan ningún [stat] por defecto; proporcionan una gran cantidad de [stat2] y potencial de desarrollo. Sin embargo, 'We Love the King Day' y las misiones de ciudades-estado todavía requieren Recursos de lujo. En cuanto a cómo obtienes [stat3], puedes construir muchos edificios y crear una religión con creencias adecuadas.
2. Armies are now separated into four major categories:\n 'Levy Army', 'Standing Army', 'Noble Army' and 'Mercenary Army', each with different characteristics. = 2. Los ejércitos ahora se dividen en cuatro categorías principales:\n 'Levy Army', 'Standing Army', 'Noble Army' y 'Mercenary Army', cada una con características diferentes.
In other words, you cannot build a powerful army without building [buildingFilter]s like [param] to increase the unit limit. = En otras palabras, no puedes construir un ejército poderoso sin construir [buildingFilter] como [param] para aumentar el límite de unidades.
For a more in-depth explanation = Para una explicación más detallada
3. The tag system is used widely in this mod. A tag is a word surrounded by '', and many mechanics revolve around this system. They are also in the civilopedia of any object, so feel free to check. You don't need to remember this well to use it effectively as most tags are intuitive. = 3. El sistema de etiquetas se usa ampliamente en este mod. Una etiqueta es una palabra rodeada por '', y muchas mecánicas giran en torno a este sistema. También están en la civilopedia de cualquier objeto, así que siéntete libre de consultar. No necesitas recordarlo bien para usarlo efectivamente, ya que la mayoría de las etiquetas son intuitivas.
4. [resource] is a new currency that affects the political status of your civilization, limited by [resource2]. You get it by keeping [stat] positive, choosing the right policies, and through [buildingFilter] decisions. If your [resource3] is negative, you will get a negative event that lowers stability, which provides huge debuffs. You can check the civilopedia page of [resource4] for more information. = 4. [resource] es una nueva moneda que afecta el estado político de tu civilización, limitada por [resource2]. La obtienes manteniendo [stat] positivo, eligiendo las políticas correctas y mediante decisiones de [buildingFilter]. Si tu [resource3] es negativo, obtendrás un evento negativo que reduce la estabilidad, lo que proporciona enormes desventajas. Puedes consultar la página de civilopedia de [resource4] para más información.
See also: Influence = Véase también: Influencia
See also: ED - Stability and Events = Véase también: ED - Estabilidad y eventos

ED - Starting Tips & Where to Settle = ED - Consejos iniciales y dónde asentarse
When starting a new game, remember to switch to Neolithic Era if you want to build your civ from the ground up. Since Unciv defaults to Ancient Era, you might lose some content there or find some progress you didn't intend to have, like government forms being different. = Al comenzar una nueva partida, recuerda cambiar a la Era Neolítica si quieres construir tu civilización desde cero. Dado que Unciv por defecto usa la Era Antigua, podrías perder algo de contenido allí o encontrar algún progreso que no pretendías tener, como formas de gobierno diferentes.
When starting a new game in Neolithic Era or Ancient Era, you would likely have two types of units: [unit]s and [unit2]s. = Al comenzar una nueva partida en la Era Neolítica o la Era Antigua, probablemente tendrás dos tipos de unidades: [unit] y [unit2].
The major difference between Civ 5/Unciv and this mod is that your starting unit, the [unit], is not only a ranged unit but also a worker that can build [improvementName]s, [improvementName2]s, and [improvementName3]s. However, it cannot upgrade to other units. They represent humanity's earliest endeavor at building civilizations. = La diferencia principal entre Civ 5/Unciv y este mod es que tu unidad inicial, la [unit], no solo es una unidad a distancia sino también un trabajador que puede construir [improvementName], [improvementName2] y [improvementName3]. Sin embargo, no puede mejorarse a otras unidades. Representan el esfuerzo más temprano de la humanidad por construir civilizaciones.
As for [unit]s, there are no major differences, but note that settling near [tileFilter]s gives 2 extra [stat] and an extra 1 [stat2] near [tileFilter2]. These don't stack but provide a strong starting bonus for your cities. = En cuanto a las [unit], no hay diferencias importantes, pero ten en cuenta que asentarse cerca de [tileFilter] da 2 [stat] extra y 1 [stat2] extra cerca de [tileFilter2]. Estos no se acumulan pero proporcionan una fuerte bonificación inicial para tus ciudades.
With [buildingFilter], [unit]s also gain +1 [param] on [tileFilter] after researching [tech] technology with [promotion] promotion. Neat upgrades like this exist in many places in this mod, so you should take a proper look at each option you're given. = Con [buildingFilter], las [unit] también ganan +1 [param] en [tileFilter] después de investigar la tecnología [tech] con la promoción [promotion]. Mejoras ingeniosas como esta existen en muchos lugares de este mod, así que deberías echar un vistazo adecuado a cada opción que se te dé.
When looking for a place to settle, luxury resources do give you a lot of [stat] and other stats but are no longer a source of [stat2]. Maintaining a balance between [stat3]-giving resources like [resource] and [resource2], [stat4] terrains like [tileFilter] and [tileFilter2], and [stat5] resources like [resource3] and [resource4] makes your new cities much more useful. It is also important that you can do [improvementName] to connect your inland cities to the sea. And [tileFilter3]-requiring buildings like [buildingFilter] no longer require settling beside [tileFilter4]s; a 2-tile distance is also good enough. = Al buscar un lugar para asentarse, los recursos de lujo sí te dan mucho [stat] y otras estadísticas, pero ya no son una fuente de [stat2]. Mantener un equilibrio entre recursos que dan [stat3] como [resource] y [resource2], terrenos de [stat4] como [tileFilter] y [tileFilter2], y recursos de [stat5] como [resource3] y [resource4] hace que tus nuevas ciudades sean mucho más útiles. También es importante que puedas hacer [improvementName] para conectar tus ciudades interiores con el mar. Y los edificios que requieren [tileFilter3] como [buildingFilter] ya no requieren asentarse al lado de [tileFilter4]; una distancia de 2 casillas también es suficiente.

ED - Stability and Events = ED - Estabilidad y eventos
The original Unciv/Civ 5 offers a flat debuff when the empire is unhappy, but Emperors and Deities turned the flat debuff into instability and negative events. Negative events often interact with variables like the number of cities or what Era you are in. To cure the debuff from them, you can check out options in [buildingFilter] or in the building tab. = El Unciv/Civ 5 original ofrece una desventaja fija cuando el imperio es infeliz, pero Emperors and Deities convirtió la desventaja fija en inestabilidad y eventos negativos. Los eventos negativos a menudo interactúan con variables como el número de ciudades o la Era en la que estás. Para curar la desventaja de ellos, puedes consultar las opciones en [buildingFilter] o en la pestaña de edificios.
[param] is an event that lowers your stability. It occurs if you are lacking [stat] (going negative). It also occurs more frequently in [buildingFilter] states. You will need to choose between spending some [resource] and [stat2] to prevent it or having your stability lowered. This disables some abilities like building workers when you are in a state of [buildingFilter2]. = [param] es un evento que reduce tu estabilidad. Ocurre si te falta [stat] (volviéndose negativo). También ocurre con más frecuencia en estados [buildingFilter]. Tendrás que elegir entre gastar algo de [resource] y [stat2] para prevenirlo o dejar que tu estabilidad se reduzca. Esto desactiva algunas habilidades como construir trabajadores cuando estás en un estado de [buildingFilter2].
To keep [param] from occurring, you will need to keep your [stat] and [resource] higher than normal, which is not ideal. So it is a risk you will always face. Remember to always keep some spare [stat2] and [resource2]. = Para evitar que ocurra [param], necesitarás mantener tu [stat] y [resource] más altos de lo normal, lo cual no es ideal. Así que es un riesgo que siempre enfrentarás. Recuerda siempre mantener algo de [stat2] y [resource2] de reserva.
[param], [param2], and [param3] are events that only occur when you are lacking [stat]. They may apply debuffs to all the cities you own, which can be a nightmare to deal with. = [param], [param2] y [param3] son eventos que solo ocurren cuando te falta [stat]. Pueden aplicar desventajas a todas las ciudades que posees, lo cual puede ser una pesadilla de manejar.
Luckily, you can use your capital to deal with them. Unluckily, your capitals are limited, so do what you can to prevent the lack of [stat]. = Por suerte, puedes usar tu capital para lidiar con ellos. Por desgracia, tus capitales son limitadas, así que haz lo posible para prevenir la falta de [stat].
The Events Listed Above are only examples of what could be possible. But remember, when a event occur, as long as you have enough [resource] and [stat] as safety net, you will endure. And there are even sometimes benefits from the negative events. = Los eventos listados arriba son solo ejemplos de lo que podría ser posible. Pero recuerda, cuando ocurre un evento, siempre que tengas suficiente [resource] y [stat] como red de seguridad, resistirás. Y a veces incluso hay beneficios de los eventos negativos.
