ED - Mod Manual = ED - Panduan Mod
The mod's main goal is to reshape Civ 5 into a more complex and nuanced game with many new mechanics incorporated.\nMajor Differences: = Tujuan utama mod ini adalah mengubah Civ 5 menjadi game yang lebih kompleks dan bernuansa dengan banyak mekanik baru yang disertakan.\nPerbedaan Utama:
1. Keep in mind that Luxury Resources no longer provide any [stat] by default; they provide a large amount of [stat2] and development potential. However, 'We Love the King Day' and city-state quests still require Luxury Resources. As for how you gain [stat3], you can build many buildings and create a religion with suitable beliefs. = 1. Ingatlah bahwa Sumber Daya Mewah tidak lagi memberikan [stat] apa pun secara bawaan; mereka memberikan banyak [stat2] dan potensi pengembangan. Namun, 'Hari Mencintai Raja' dan misi negara-kota masih membutuhkan Sumber Daya Mewah. Adapun cara memperoleh [stat3], kamu bisa membangun banyak bangunan dan menciptakan agama dengan keyakinan yang sesuai.
2. Armies are now separated into four major categories:\n 'Levy Army', 'Standing Army', 'Noble Army' and 'Mercenary Army', each with different characteristics. = 2. Tentara kini dibagi menjadi empat kategori utama:\n 'Tentara Wajib', 'Tentara Tetap', 'Tentara Bangsawan', dan 'Tentara Bayaran', masing-masing dengan karakteristik berbeda.
In other words, you cannot build a powerful army without building [buildingFilter]s like [param] to increase the unit limit. = Dengan kata lain, kamu tidak dapat membangun tentara yang kuat tanpa membangun [buildingFilter] seperti [param] untuk meningkatkan batas unit.
For a more in-depth explanation = Untuk penjelasan yang lebih mendalam
3. The tag system is used widely in this mod. A tag is a word surrounded by '', and many mechanics revolve around this system. They are also in the civilopedia of any object, so feel free to check. You don't need to remember this well to use it effectively as most tags are intuitive. = 3. Sistemas tag digunakan secara luas dalam mod ini. Tag adalah kata yang dikelilingi oleh '', dan banyak mekanik berkisar pada sistem ini. Tag juga ada di civilopedia objek apa pun, jadi silakan memeriksanya. Kamu tidak perlu mengingatnya dengan baik untuk menggunakannya secara efektif karena sebagian besar tag bersifat intuitif.
4. [resource] is a new currency that affects the political status of your civilization, limited by [resource2]. You get it by keeping [stat] positive, choosing the right policies, and through [buildingFilter] decisions. If your [resource3] is negative, you will get a negative event that lowers stability, which provides huge debuffs. You can check the civilopedia page of [resource4] for more information. = 4. [resource] adalah mata uang baru yang memengaruhi status politik peradabanmu, dibatasi oleh [resource2]. Kamu memperolehnya dengan menjaga [stat] tetap positif, memilih kebijakan yang tepat, dan melalui keputusan [buildingFilter]. Jika [resource3]-mu negatif, kamu akan mendapat peristiwa negatif yang menurunkan stabilitas, yang memberikan penalti besar. Kamu dapat memeriksa halaman civilopedia [resource4] untuk informasi lebih lanjut.
See also: Influence = Lihat juga: Pengaruh
See also: ED - Stability and Events = Lihat juga: ED - Stabilitas dan Peristiwa

ED - Starting Tips & Where to Settle = ED - Tips Awal & Tempat Mendirikan Kota
When starting a new game, remember to switch to Neolithic Era if you want to build your civ from the ground up. Since Unciv defaults to Ancient Era, you might lose some content there or find some progress you didn't intend to have, like government forms being different. = Saat memulai permainan baru, ingatlah untuk beralih ke Era Neolitikum jika Anda ingin membangun peradaban Anda dari awal. Karena Unciv secara bawaan dimulai di Era Kuno, Anda mungkin kehilangan sebagian konten di sana atau menemukan kemajuan yang tidak Anda maksudkan, seperti bentuk pemerintahan yang berbeda.
When starting a new game in Neolithic Era or Ancient Era, you would likely have two types of units: [unit]s and [unit2]s. = Saat memulai permainan baru di Era Neolitikum atau Era Kuno, kemungkinan Anda akan memiliki dua jenis unit: [unit]s dan [unit2]s.
The major difference between Civ 5/Unciv and this mod is that your starting unit, the [unit], is not only a ranged unit but also a worker that can build [improvementName]s, [improvementName2]s, and [improvementName3]s. However, it cannot upgrade to other units. They represent humanity's earliest endeavor at building civilizations. = Perbedaan utama antara Civ 5/Unciv dan mod ini adalah bahwa unit awal Anda, [unit], tidak hanya merupakan unit jarak jauh tetapi juga pekerja yang dapat membangun [improvementName]s, [improvementName2]s, dan [improvementName3]s. Namun, unit tersebut tidak dapat ditingkatkan menjadi unit lain. Mereka mewakili upaya paling awal umat manusia dalam membangun peradaban.
As for [unit]s, there are no major differences, but note that settling near [tileFilter]s gives 2 extra [stat] and an extra 1 [stat2] near [tileFilter2]. These don't stack but provide a strong starting bonus for your cities. = Mengenai [unit]s, tidak ada perbedaan besar, tetapi perhatikan bahwa mendirikan kota di dekat [tileFilter]s memberikan 2 [stat] tambahan dan 1 [stat2] tambahan di dekat [tileFilter2]. Ini tidak menumpuk tetapi memberikan bonus awal yang kuat untuk kota-kota Anda.
With [buildingFilter], [unit]s also gain +1 [param] on [tileFilter] after researching [tech] technology with [promotion] promotion. Neat upgrades like this exist in many places in this mod, so you should take a proper look at each option you're given. = Dengan [buildingFilter], [unit]s juga memperoleh +1 [param] di [tileFilter] setelah meneliti teknologi [tech] dengan promosi [promotion]. Peningkatan rapi seperti ini ada di banyak tempat dalam mod ini, jadi Anda harus memperhatikan setiap pilihan yang diberikan dengan saksama.
When looking for a place to settle, luxury resources do give you a lot of [stat] and other stats but are no longer a source of [stat2]. Maintaining a balance between [stat3]-giving resources like [resource] and [resource2], [stat4] terrains like [tileFilter] and [tileFilter2], and [stat5] resources like [resource3] and [resource4] makes your new cities much more useful. It is also important that you can do [improvementName] to connect your inland cities to the sea. And [tileFilter3]-requiring buildings like [buildingFilter] no longer require settling beside [tileFilter4]s; a 2-tile distance is also good enough. = Saat mencari tempat untuk mendirikan kota, sumber daya mewah memang memberi banyak [stat] dan atribut lain, tetapi tidak lagi menjadi sumber [stat2]. Menjaga keseimbangan antara sumber daya pemberi [stat3] seperti [resource] dan [resource2], medan [stat4] seperti [tileFilter] dan [tileFilter2], serta sumber daya [stat5] seperti [resource3] dan [resource4] membuat kota-kota baru Anda jauh lebih berguna. Penting juga bahwa Anda dapat melakukan [improvementName] untuk menghubungkan kota-kota pedalaman Anda ke laut. Dan bangunan yang membutuhkan [tileFilter3] seperti [buildingFilter] tidak lagi mengharuskan mendirikan kota di samping [tileFilter4]s; jarak 2 petak juga sudah cukup.

ED - Stability and Events = ED - Stabilitas dan Peristiwa
The original Unciv/Civ 5 offers a flat debuff when the empire is unhappy, but Emperors and Deities turned the flat debuff into instability and negative events. Negative events often interact with variables like the number of cities or what Era you are in. To cure the debuff from them, you can check out options in [buildingFilter] or in the building tab. = Unciv/Civ 5 asli memberikan debuff tetap saat kekaisaran tidak bahagia, tetapi Emperors and Deities mengubah debuff tetap itu menjadi ketidakstabilan dan peristiwa negatif. Peristiwa negatif sering berinteraksi dengan variabel seperti jumlah kota atau Era tempat Anda berada. Untuk menyembuhkan debuff darinya, Anda dapat melihat opsi di [buildingFilter] atau di tab bangunan.
[param] is an event that lowers your stability. It occurs if you are lacking [stat] (going negative). It also occurs more frequently in [buildingFilter] states. You will need to choose between spending some [resource] and [stat2] to prevent it or having your stability lowered. This disables some abilities like building workers when you are in a state of [buildingFilter2]. = [param] adalah peristiwa yang menurunkan stabilitas Anda. Peristiwa ini terjadi jika Anda kekurangan [stat] (menjadi negatif). Peristiwa ini juga lebih sering terjadi dalam keadaan [buildingFilter]. Anda harus memilih antara mengeluarkan sejumlah [resource] dan [stat2] untuk mencegahnya atau stabilitas Anda menurun. Ini menonaktifkan beberapa kemampuan seperti membangun pekerja saat Anda berada dalam keadaan [buildingFilter2].
To keep [param] from occurring, you will need to keep your [stat] and [resource] higher than normal, which is not ideal. So it is a risk you will always face. Remember to always keep some spare [stat2] and [resource2]. = Untuk mencegah terjadinya [param], Anda perlu menjaga [stat] dan [resource] Anda lebih tinggi dari biasanya, yang tidak ideal. Jadi ini adalah risiko yang akan selalu Anda hadapi. Ingatlah untuk selalu menyimpan sedikit cadangan [stat2] dan [resource2].
[param], [param2], and [param3] are events that only occur when you are lacking [stat]. They may apply debuffs to all the cities you own, which can be a nightmare to deal with. = [param], [param2], dan [param3] adalah peristiwa yang hanya terjadi saat Anda kekurangan [stat]. Peristiwa tersebut dapat memberikan debuff ke semua kota yang Anda miliki, yang bisa menjadi mimpi buruk untuk ditangani.
Luckily, you can use your capital to deal with them. Unluckily, your capitals are limited, so do what you can to prevent the lack of [stat]. = Untungnya, Anda dapat menggunakan modal Anda untuk menanganinya. Sayangnya, modal Anda terbatas, jadi lakukan apa yang Anda bisa untuk mencegah kekurangan [stat].
The Events Listed Above are only examples of what could be possible. But remember, when a event occur, as long as you have enough [resource] and [stat] as safety net, you will endure. And there are even sometimes benefits from the negative events. = Peristiwa yang Tercantum di Atas hanyalah contoh dari apa yang mungkin terjadi. Namun ingatlah, ketika suatu peristiwa terjadi, selama Anda memiliki cukup [resource] dan [stat] sebagai jaring pengaman, Anda akan bertahan. Dan terkadang bahkan ada manfaat dari peristiwa negatif.
