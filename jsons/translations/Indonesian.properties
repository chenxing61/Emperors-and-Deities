A talented young prince called Alexander decides that his dream to be the conqueror of the world... = Seorang pangeran muda berbakat bernama Alexander memutuskan bahwa mimpinya adalah menjadi penakluk dunia...
We shall support him at all cost! = Kita akan mendukungnya dengan segala cara!
Gain access to [Diadochi States] civilization form. = Dapatkan akses ke bentuk peradaban [Diadochi States].
Too much investment = Terlalu banyak investasi
Alexander the Conqueror = Alexander sang Penakluk

Alexander the great has died... how could it be? But his generals seems to care less about the death than the power they now holds. = Alexander Agung telah wafat... bagaimana bisa? Namun para jenderalnya tampak lebih tidak peduli pada kematiannya daripada kekuasaan yang kini mereka pegang.
The hellenic period begins... = Periode Helenistik dimulai...
Alexander's death = Kematian Alexander

One of the mountain tribe has became a power to be recognized. = Salah satu suku pegunungan telah menjadi kekuatan yang patut diperhitungkan.
What a nice candidate... = Kandidat yang bagus sekali...
Babylon's Gate remains shut. = Gerbang Babilonia tetap tertutup.
Rise of the Persians = Kebangkitan Bangsa Persia

A radical reformation is occuring in Shang Dynasty by the Emperor Xin, this results in a civil war. = Sebuah reformasi radikal sedang terjadi di Dinasti Shang oleh Kaisar Xin, yang mengakibatkan perang saudara.
The Zhou State has won. = Negara Zhou telah menang.
Emperor Xin remain undefeated! = Kaisar Xin tetap tak terkalahkan!
So called Mandate... = Yang disebut Mandat...

It seems like a lot of different new ideologies have appeared in our civilization... Maybe some of them are beneficial = Tampaknya banyak ideologi baru yang berbeda telah muncul di peradaban kita... Mungkin beberapa di antaranya bermanfaat
Daoism = Taoisme
