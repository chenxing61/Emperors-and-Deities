This mod offers some brand new mechanics that are of note, you might want to play through the Scenario Tutorial first in order to gain basic understandings of them. Since they are very relevant throughout the entire ruleset. = Mod ini menawarkan beberapa mekanika baru yang patut dicatat; sebaiknya kamu memainkan Tutorial Skenario terlebih dahulu untuk memperoleh pemahaman dasar tentangnya, karena mekanika itu sangat relevan di seluruh ruleset.
Problems and solutions never seen before! = Masalah dan solusi yang belum pernah terlihat sebelumnya!
Open up the [Enact Policies] tab and have a look! = Buka tab [Enact Policies] dan lihatlah!
You can open this in your capital at any moment to solve debuffs and manage a lot of stuff. = Kamu dapat membukanya di ibu kota kapan saja untuk mengatasi debuff dan mengelola banyak hal.
And then theres also a link to the in game documentation of the mod, which you also will NEED to take a look if you want to gain a greater understanding of this ruleset. = Lalu ada juga tautan ke dokumentasi mod di dalam game, yang juga PERLU kamu lihat jika ingin memperoleh pemahaman lebih dalam tentang ruleset ini.
