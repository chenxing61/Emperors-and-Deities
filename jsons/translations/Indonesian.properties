Wasteful Habits = Kebiasaan Boros

The shelves are running out of goods. [Underproduction] had its effect on our people's daily lives. = Rak-rak mulai kehabisan barang. [Underproduction] berdampak pada kehidupan sehari-hari rakyat kita.
We must stabilise the production of necessary goods. = Kita harus menstabilkan produksi barang-barang kebutuhan pokok.
Import! = Impor!
Goods Shortage = Kelangkaan Barang

Even though theres enough incentive to build new factories, [Underproduction] slowed our industrial growth! = Meskipun ada cukup insentif untuk membangun pabrik baru, [Underproduction] memperlambat pertumbuhan industri kita!
We shall intervene officially. = Kita akan campur tangan secara resmi.
If we could just buy it, why should we produce it? = Jika kita bisa membelinya saja, mengapa harus memproduksinya?
Leave it be for a while. = Biarkan saja untuk sementara.
[-33%] Production when constructing all normal buildings for a short amount of time. = [-33%] Produksi saat membangun semua bangunan normal untuk waktu singkat.
Machine Shortage = Kelangkaan Mesin

We successfully brought our fury to the Barbarian's Motherland. New problem arises. = Kita berhasil membawa amarah kita ke Tanah Air kaum Barbar. Masalah baru muncul.
Plunder them dry and banish them! = Jarah habis-habisan dan usir mereka!
In the grand scheme of things, this counts as a uncivilized [Cultural Exchange]. = Dalam gambaran besarnya, ini dianggap sebagai [Cultural Exchange] yang tidak beradab.
Increase the Cultural Diversity by a level if it hasnt reached highest level yet. = Tingkatkan Keberagaman Budaya satu tingkat jika belum mencapai tingkat tertinggi.
Intergrate them into our glorious empire! = Integrasikan mereka ke dalam kekaisaran kita yang jaya!
Enslavement would teach them how to behave = Perbudakan akan mengajari mereka cara berperilaku
These men need a shepherd leading them to the lord = Orang-orang ini membutuhkan seorang gembala yang menuntun mereka kepada Tuhan
The Barbarian's Surrender = Penyerahan Diri kaum Barbar

Decisions reguarding the civilization's internal affair. = Keputusan mengenai urusan internal peradaban.
Introduction = Pendahuluan
In this decision tab, different actions are unlocked based on to how many [Influence] you have and how many unique action your civilization state has provided you with. = Di tab keputusan ini, berbagai aksi terbuka berdasarkan seberapa banyak [Influence] yang kamu miliki dan berapa banyak aksi unik yang diberikan oleh negara bagian peradabanmu.
In each era, you recieve a [Forced Shift In Politic Chance], and when you have more [Influence] than your limit in this era, you can trigger a Shift In Politic in this tab early to provide you with either a chance to unify or a chance to collapse, this grants you freedom on choices of ['Civilization State']. = Di setiap era, kamu menerima satu [Forced Shift In Politic Chance], dan ketika kamu memiliki lebih banyak [Influence] daripada batasmu di era ini, kamu dapat memicu Pergeseran Politik di tab ini lebih awal untuk memberimu peluang bersatu atau peluang runtuh; ini memberimu kebebasan dalam memilih ['Civilization State'].
Most option will appear when you are unified or have more [Influence] than half of your limit. At the same time, some options only appear when your civilization are divided or have severe debuffs. This tab will help you solve them. = Sebagian besar opsi akan muncul saat kamu bersatu atau memiliki lebih banyak [Influence] daripada setengah batasmu. Pada saat yang sama, beberapa opsi hanya muncul saat peradabanmu terpecah atau memiliki efek negatif berat. Tab ini akan membantumu menyelesaikannya.
Total mobilization in all city! = Mobilisasi total di semua kota!
This Decision will instruct all the city to mobilise its [The Levied Army] unit, regardless of the size of city. Usually you need at least 5 Population to [Call to Arms]. = Keputusan ini akan memerintahkan semua kota untuk mengerahkan unit [The Levied Army]-nya, terlepas dari ukuran kota. Biasanya kamu membutuhkan setidaknya 5 Populasi untuk [Call to Arms].
By the merit of being [United], the negative [Happiness] from [Call to Arms] is also lessened. For a short amount of time. = Berkat status [United], [Happiness] negatif dari [Call to Arms] juga berkurang. Untuk waktu singkat.
Disband all Levies. = Bubarkan semua Pasukan Kerahan.
After Conflict dies down, we may disband our [The Levied Army] units to eliminate negative effects from [Call to Arms]. = Setelah konflik mereda, kita dapat membubarkan unit [The Levied Army] kita untuk menghilangkan efek negatif dari [Call to Arms].
Increase [Influence] through different means. = Meningkatkan [Influence] melalui berbagai cara.
Increase/Decrease Cultural Diversity through different means. = Menaikkan/menurunkan Keberagaman Budaya melalui berbagai cara.
Spread our [Influence] to city states. = Sebarkan [Influence] kita ke negara-negara kota.
Costs 1 [Influence] per turn, maintain your diplomatic efforts in city states. = Menghabiskan 1 [Influence] per giliran, menjaga upaya diplomatikmu di negara-negara kota.
Costs 1 extra [Influence] per turn starting from Imperial era. = Menghabiskan 1 [Influence] tambahan per giliran mulai dari era Kekaisaran.
Stop Spreading our [Influence] to city states. = Berhenti menyebarkan [Influence] kita ke negara-negara kota.
Build Agreements (Divided Government Form Special Action) = Membangun Perjanjian (Aksi Khusus Bentuk Pemerintahan Terpecah)
Tho our civilization is divided, we are not weak. = Meski peradaban kita terpecah, kita tidak lemah.
Build Agreements (Personal Union Form Special Action) = Membangun Perjanjian (Aksi Khusus Bentuk Uni Personal)
Commonwealth needs futher cooperation. = Persemakmuran membutuhkan kerja sama lebih lanjut.
Adoption of European Cultures ([Europa] Special Action) = Adopsi Budaya-Budaya Eropa (Aksi Khusus [Europa])
Adoption of Schools of Thought ([Warring States] Special Action) = Adopsi Aliran-Aliran Pemikiran (Aksi Khusus [Warring States])
Tribe Assembly ([Nomadic Culture] Special Action) = Majelis Suku (Aksi Khusus [Nomadic Culture])
One Step Above Peace. = Selangkah di Atas Perdamaian.
Through costing [Faith] and [Gold], We may propell our civilization into a even more stable state. [Harmony]. = Dengan mengorbankan [Faith] dan [Gold], kita dapat mendorong peradaban kita ke keadaan yang lebih stabil: [Harmony].
Increasing Stability. = Meningkatkan Stabilitas.
We must take action against the coming chaos. = Kita harus bertindak menghadapi kekacauan yang akan datang.
Crisis Solving = Penyelesaian Krisis
A lot of our cities are in a horrible state. We should do what we can to save them. = Banyak kota kita dalam keadaan yang mengerikan. Kita harus melakukan apa pun yang bisa untuk menyelamatkannya.
Changing Economic Policies = Mengubah Kebijakan Ekonomi
If the current economic policies fail to meet the situation... = Jika kebijakan ekonomi saat ini gagal menghadapi situasi...
Changing Civilization Form = Mengubah Bentuk Peradaban
If your [Influence] is somehow above your [Influence Limit]. You can trigger this. = Jika [Influence]-mu entah bagaimana berada di atas [Influence Limit]-mu, kamu dapat memicu ini.
We can force the shift in politic to stop our civilization from entering a undesireable route... = Kita dapat memaksakan perubahan politik untuk mencegah peradaban kita memasuki jalur yang tidak diinginkan...
State Reform = Reformasi Negara
Social Reform = Reformasi Sosial
Did you know that this mod has tutorial pages in civilopedia's tutorial section? = Tahukah kamu bahwa mod ini memiliki halaman tutorial di bagian tutorial Civilopedia?
You may want to check them out. = Mungkin kamu ingin melihatnya.
See also: ED - Tutorial Menu = Lihat juga: ED - Menu Tutorial
Actually...I was checking what I can do. = Sebenarnya... aku sedang memeriksa apa yang bisa kulakukan.
Nothing happens. = Tidak terjadi apa-apa.

See that long list of Resource? You can cut it down a bit. = Lihat daftar Sumber Daya yang panjang itu? Kamu bisa memangkasnya sedikit.
Hide the essentials. = Sembunyikan yang penting-penting.
Including: = Termasuk:
[Influence], [Influence Limit], [Consumption Supply], [Consumption Demand],All the kinds of [Fuel]s, Victroy related resources and the Army Maintenances = [Influence], [Influence Limit], [Consumption Supply], [Consumption Demand], semua jenis [Fuel], sumber daya terkait kemenangan, dan pemeliharaan pasukan
Show the essentials. = Tampilkan yang penting-penting.
Hide the raw resources. = Sembunyikan sumber daya mentah.
[Horse], [Metal], [Alloy], [Oil] and so on. All the resource on the map or being the prerequisite of buildings and parts productions = [Horse], [Metal], [Alloy], [Oil] dan seterusnya. Semua sumber daya di peta atau yang menjadi prasyarat bangunan dan produksi komponen
Show the raw resources. = Tampilkan sumber daya mentah.
Hide those parts. = Sembunyikan komponen-komponen itu.
[Weapon Parts], [Vehicle Parts], [Ship Parts] and so on and so fourth. = [Weapon Parts], [Vehicle Parts], [Ship Parts] dan seterusnya.
Show those parts. = Tampilkan komponen-komponen itu.
Hide those random stuffs. = Sembunyikan barang-barang acak itu.
Show those random stuffs. = Tampilkan barang-barang acak itu.
Alright. = Baiklah.
Hide Strategic Resources = Sembunyikan Sumber Daya Strategis

The structure of our civilization changes to adapt to the time. What path shall we partake? = Struktur peradaban kita berubah untuk menyesuaikan zaman. Jalan mana yang harus kita tempuh?
The most convenient way to change your government form is to let it naturally evolve. When each Era begins, you are forced to have a political shift where you must actively decide what state you want to enter: ['United'] or ['Divided']. = Cara paling mudah untuk mengubah bentuk pemerintahanmu adalah membiarkannya berevolusi secara alami. Saat setiap Era dimulai, kamu dipaksa mengalami pergeseran politik di mana kamu harus secara aktif memutuskan keadaan yang ingin kamu masuki: ['United'] atau ['Divided'].
When your [Influence] is reaching over half of the [Influence Limit] without being in low stability, this enables you to unify your civilization = Saat [Influence]-mu mencapai lebih dari setengah [Influence Limit] tanpa berada dalam stabilitas rendah, ini memungkinkanmu menyatukan peradabanmu
Your [Influence] will be reseted back to a certain point below [Influence Limit]. If you can successfully unify your civilization, you will have a lot of [Influence] starting off. = [Influence]-mu akan diatur ulang kembali ke titik tertentu di bawah [Influence Limit]. Jika kamu berhasil menyatukan peradabanmu, kamu akan memulai dengan banyak [Influence].
See also: ED - Government Forms = Lihat juga: ED - Bentuk Pemerintahan
No significant changes = Tidak ada perubahan berarti
We are still a bunch of countries prone to infighting and invasion, but what we do have is countless oppotunities. = Kita masih sekumpulan negara yang rentan terhadap pertikaian internal dan invasi, tetapi yang kita miliki adalah peluang yang tak terhitung jumlahnya.
Qin has collapsed! = Qin telah runtuh!
We are able to unify ourselves! = Kita mampu menyatukan diri!
The unification has been accomplished by the largest fish in the pond. We are now an unified political entity! = Penyatuan telah dicapai oleh ikan terbesar di kolam. Kini kita menjadi satu entitas politik yang bersatu!
The empire of the past crumbles... = Kekaisaran masa lalu runtuh...
Our unification cannot last onto another stage of the world. Maybe its ultimately for the better, as it was stale. = Penyatuan kita tidak dapat bertahan hingga ke tahap dunia berikutnya. Mungkin ini pada akhirnya lebih baik, karena keadaan itu sudah mandek.
Our empire lasts onto another era! = Kekaisaran kita bertahan hingga era berikutnya!
Our empire survives... Maybe we can reform it continuesly unto forever. = Kekaisaran kita bertahan... Mungkin kita dapat terus mereformasinya selamanya.
Shift in Politic = Pergeseran politik

If an empire is stale in upward mobility, political reform and other essential aspect, it would fall behind, and crumble to ash. = Jika sebuah kekaisaran mandek dalam mobilitas ke atas, reformasi politik, dan aspek penting lainnya, ia akan tertinggal dan hancur menjadi abu.
With some reforms, our empire can adapt to new age without problems. = Dengan beberapa reformasi, kekaisaran kita dapat beradaptasi dengan zaman baru tanpa masalah.
Give up your unique civilization form and return to the generic line of unified civilization form. = Lepaskan bentuk peradaban unikmu dan kembalilah ke garis umum bentuk peradaban yang bersatu.
Also, you might've ran out of unique government forms because there arent enough of them in the first place. = Selain itu, kamu mungkin kehabisan bentuk pemerintahan unik karena sejak awal jumlahnya memang tidak cukup.
We must prevail at preserving our root. = Kita harus unggul dalam melestarikan akar kita.
Keep your current special civilization form = Pertahankan bentuk peradaban spesialmu saat ini
Our way of life must be protected. = Cara hidup kita harus dilindungi.
There needs to be an Emperor = Harus ada seorang Kaisar
Focus on Centrailizing Power Structure. = Berfokus pada Sentralisasi Struktur Kekuasaan.
Our guiding philosophy has been painting a hopeful picture of our future, this reform will lead us closer to it. = Filosofi penuntun kita telah melukiskan gambaran penuh harapan tentang masa depan kita; reformasi ini akan membawa kita lebih dekat kepadanya.
Disperse The Power Structure. = Menyebarkan Struktur Kekuasaan.
We can use our new formed policy. = Kita dapat menggunakan kebijakan yang baru terbentuk.
We shall dominate the Land! = Kita akan menguasai Daratan!
Although our empire has stood tall, it would be more efficient if we take the new route... = Meskipun kekaisaran kita berdiri tegak, akan lebih efisien jika kita mengambil jalur baru...
We shall dominate the Ocean! = Kita akan menguasai Samudra!
We will continue our empire's glory. = Kita akan melanjutkan kejayaan kekaisaran kita.
Maybe... having a consistent ruling family and succession law would be better. = Mungkin... memiliki keluarga penguasa yang konsisten dan hukum suksesi akan lebih baik.
No avaliable options = Tidak ada opsi yang tersedia
Yet. = Belum.
Reformation of the unified state = Reformasi negara yang bersatu

As the society develops, the social structure of our civilization began to shift. = Seiring berkembangnya masyarakat, struktur sosial peradaban kita mulai bergeser.
Focus on expanding the faith = Berfokus pada perluasan iman
Focus on empowering the leadership = Fokus pada memperkuat kepemimpinan
Focus on civic advancement = Fokus pada kemajuan sipil
Focus on developing trade = Fokus pada pengembangan perdagangan
Focus on mitigating incoming societal issue = Fokus pada meredakan masalah sosial yang akan datang
This can avoid negative events that natrually occurs because of change of era, but if unhappiness presists, there are still risks of more negative events. = Ini dapat menghindari peristiwa negatif yang terjadi secara alami akibat perubahan era, tetapi jika ketidakbahagiaan berlanjut, masih ada risiko lebih banyak peristiwa negatif.
Reformation of our society = Reformasi masyarakat kita

We will find ways to make our civilization thrive again! = Kita akan menemukan cara untuk membuat peradaban kita berkembang kembali!
Building a harmonious civilization is essential = Membangun peradaban yang harmonis adalah hal yang penting
We can make it so that it takes more to unstablise our civilization = Kita dapat membuatnya agar dibutuhkan lebih banyak untuk menggoyahkan peradaban kita
We must make haste before situation gets any worse = Kita harus bertindak cepat sebelum situasi semakin memburuk
By investing a vast amount of social-political capital, we can stablise the situation quickly. = Dengan menginvestasikan sejumlah besar modal sosial-politik, kita dapat menstabilkan situasi dengan cepat.
Ruling a country requires patience and subtlety = Memerintah sebuah negara membutuhkan kesabaran dan kehalusan
By carefully planning the route back to normal, we can stablise the situation slowly. = Dengan merencanakan jalur kembali ke keadaan normal secara hati-hati, kita dapat menstabilkan situasi secara perlahan.
Can we wait? = Bisakah kita menunggu?
We need more contemplation... = Kita perlu lebih banyak perenungan...
Stablising our side of the globe = Menstabilkan sisi dunia kita

We must at least do something about the things happening in the cities. = Setidaknya kita harus melakukan sesuatu terhadap hal-hal yang terjadi di kota-kota.
Kill the benefactors. = Bunuh para dermawan.
Use the loyal army to slay all who dares to oppose our just ruiling! = Gunakan pasukan yang setia untuk membantai semua yang berani menentang pemerintahan kita yang adil!
Subdue the benefactors. = Taklukkan para dermawan.
Use our socio-economical ties to force them give up their schemes. = Gunakan ikatan sosial-ekonomi kita untuk memaksa mereka menyerah pada rencana mereka.
Use them to our benefits = Manfaatkan mereka untuk keuntungan kita
I wonder... what would they be trying to do when they have some track records right in our hands? = Aku bertanya-tanya... apa yang akan mereka coba lakukan ketika kita memegang rekam jejak mereka di tangan kita?
Kill the rebels. = Bunuh para pemberontak.
Subdue the rebels. = Taklukkan para pemberontak.
Use our socio-economical ties to force them give up their schemes and join us. = Gunakan ikatan sosial-ekonomi kita untuk memaksa mereka menyerah pada rencana mereka dan bergabung dengan kita.
Let them fight our enemies. Let them become 'heros'. = Biarkan mereka melawan musuh-musuh kita. Biarkan mereka menjadi 'pahlawan'.
Remove the Slums immediately! = Singkirkan Permukiman Kumuh segera!
Force the Slume dwelllers out of their residence... Might be a bad move. = Paksa para penghuni permukiman kumuh keluar dari tempat tinggal mereka... Mungkin langkah yang buruk.
Compromise with the upper classes. = Berkompromi dengan kelas atas.
By dealing with the wealth gap directly, we can provide more residential land in the cities, or at least provide better houses. = Dengan menangani kesenjangan kekayaan secara langsung, kita dapat menyediakan lebih banyak lahan pemukiman di kota-kota, atau setidaknya menyediakan rumah yang lebih baik.
If they yearn for place to live, why not go out? = Jika mereka mendambakan tempat tinggal, mengapa tidak pergi saja?
Crisis Solver = Penyelesai Krisis

Our civilization consists of multiple countries. If they do not reach agreement in some way. We are at the danger of being foods on a plate. = Peradaban kita terdiri dari banyak negara. Jika mereka tidak mencapai kesepakatan dengan cara tertentu, kita dalam bahaya menjadi makanan di atas piring.
[Military Alliance] is the most practical = [Military Alliance] adalah yang paling praktis
[Cultural Exchange] is the most elegant = [Cultural Exchange] adalah yang paling elegan
[Trade Alliance] is the most attractive = [Trade Alliance] adalah yang paling menarik
[Collective Security] secures our footing = [Collective Security] mengamankan pijakan kita
[Research Exchange] secures our progess = [Research Exchange] mengamankan kemajuan kita
[Economic Community] secures our interest = [Economic Community] mengamankan kepentingan kita
To get a ['Agreement'], you should get at least 10 [Influence], or 20 starting from the [Atomic era] = Untuk mendapatkan ['Agreement'], kamu harus memperoleh setidaknya 10 [Influence], atau 20 mulai dari [Atomic era]
Building Alliance = Membangun Aliansi

As the civ enters its downfall, the Union crumbles away. = Saat peradaban memasuki kejatuhannya, Persatuan itu runtuh.
No! = Tidak!
Disolution of Union = Pembubaran Persatuan

The current instability in our civilization hinders our development greatly and civil wars may break out. An effort in reaching an internal peace should be made. = Ketidakstabilan saat ini dalam peradaban kita sangat menghambat perkembangan kita dan perang saudara dapat pecah. Upaya untuk mencapai perdamaian internal harus dilakukan.
Not Yet = Belum
State of Instability = Kondisi Ketidakstabilan

Some of the cities in our civilization are suffering from severe aftermath of some negative events, maybe we should start dealing with them. = Beberapa kota di peradaban kita menderita akibat parah dari beberapa peristiwa negatif, mungkin kita harus mulai menanganinya.
We need new jobs for the people. = Kita membutuhkan pekerjaan baru untuk rakyat.
The number of [Consumption Demand] increases by [33]% for a fair amount of turns. Which may provide breathing rooms for our economy. = Jumlah [Consumption Demand] meningkat sebesar [33]% selama sejumlah giliran yang cukup lama, yang dapat memberikan ruang bernapas bagi ekonomi kita.
State of Ruins = Kondisi Reruntuhan

Here is the current status of your great civilization! What runs it, What state it is in and so on. = Berikut status terkini peradaban besarmu! Siapa yang menjalankannya, dalam kondisi apa, dan seterusnya.
No direct benefits – default stable state. = Tanpa manfaat langsung – kondisi stabil bawaan.
Before adopting [Anarchism]: = Sebelum mengadopsi [Anarchism]:
Cannot build [Settler], [Pioneer], [Worker], [Mechanised Worker], [Galley Work Ship], [Modern Work Ship] units = Tidak dapat membangun unit [Settler], [Pioneer], [Worker], [Mechanised Worker], [Galley Work Ship], [Modern Work Ship]
After adopting [Anarchism]: = Setelah mengadopsi [Anarchism]:
No direct penalties – baseline environment. = Tanpa hukuman langsung – lingkungan dasar.
I see = Paham
Present Current Status = Tampilkan Status Terkini

As your civilization grows, the [Influence] of the ruler of your civilization fluctuates. Keeping it above a certain thershold will be beneficial for decision making. = Seiring pertumbuhan peradabanmu, [Influence] penguasa peradabanmu berfluktuasi. Menjaganya di atas ambang tertentu akan bermanfaat untuk pengambilan keputusan.
We shall arrange a great hunt to show our military prowess! = Kita akan mengadakan perburuan besar untuk menunjukkan kehebatan militer kita!
We shall arrange a customary worship of our ancestry. = Kita akan mengadakan pemujaan adat kepada leluhur kita.
We shall arrange a great feast to show our wealth! = Kita akan mengadakan pesta besar untuk menunjukkan kekayaan kita!
We shall arrange a marriage in high class society to strengthen our internal ties! = Kita akan mengatur pernikahan di kalangan masyarakat kelas atas untuk memperkuat ikatan internal kita!
We shall do a military march to demostrate our might! = Kita akan melakukan parade militer untuk menunjukkan kekuatan kita!
Remove the [Influence Maintenance Cost] = Hapus [Influence Maintenance Cost]
Popularity Crisis = Krisis Popularitas

As your civilization grows, the lifestyle of your civilization fluctuates. It is sercretly a deciding factor of what civilization states, their unique and ability would your civilization be able to foster.\nTo do this normally, [20] [Influence] is required. = Seiring pertumbuhan peradabanmu, gaya hidup peradabanmu berfluktuasi. Ini diam-diam menjadi faktor penentu kondisi peradaban apa, unit unik dan kemampuan apa yang dapat dikembangkan peradabanmu.\nUntuk melakukannya secara normal, diperlukan [20] [Influence].
Growth requires our culture to suit the needs for new eras. = Pertumbuhan menuntut budaya kita menyesuaikan dengan kebutuhan era baru.
I guess we can simply expand our pantheon to include marginalised gods. = Kukira kita bisa memperluas panteon kita untuk mencakup dewa-dewa yang terpinggirkan.
Purity of our nation is the reason why we stood fast to this era. = Kemurnian bangsa kita adalah alasan mengapa kita bertahan hingga era ini.
Decrease the Cultural Diversity by a level if it hasnt reached lowest level yet. = Kurangi Keberagaman Budaya satu tingkat jika belum mencapai tingkat terendah.
Time to trim the leaves... = Saatnya memangkas daun-daun...
On the problem of Culture = Tentang masalah Kebudayaan

To begin our grand exploration, we must have a clear judgement of what we are dealing with. = Untuk memulai penjelajahan besar kita, kita harus memiliki penilaian yang jelas tentang apa yang sedang kita hadapi.
We shall find new oppotunities across the ocean. = Kita akan menemukan peluang baru di seberang lautan.
We shall find new oppotunities in the vast wild. = Kita akan menemukan peluang baru di alam liar yang luas.
Exploration Focus = Fokus Penjelajahan

Our settlement in the new land starts to adopt local plants and herds. If we import these stuff back into our continent. We could gain a lot more profits. = Permukiman kita di tanah baru mulai mengadopsi tanaman dan ternak setempat. Jika kita mengimpor barang-barang ini kembali ke benua kita, kita bisa memperoleh lebih banyak keuntungan.
We should focus on the new staple crops. = Kita harus fokus pada tanaman pangan pokok yang baru.
We should focus on the new economic crops. = Kita harus fokus pada tanaman komersial yang baru.
These exotic new animals are quite beautiful. = Hewan-hewan baru yang eksotis ini cukup indah.
We should respect the locals and exchange more [culture] = Kita harus menghormati penduduk setempat dan bertukar lebih banyak [culture]
Great Exchange = Pertukaran Besar

The [Caste System] is getting harder to maintain by the days. It restricts the upward mobility in our civilization way too much. = [Caste System] semakin hari semakin sulit dipertahankan. Ia terlalu membatasi mobilitas ke atas dalam peradaban kita.
We shall abandon the destinied inequality. = Kita akan meninggalkan ketidaksetaraan yang telah ditakdirkan.
We shall reinerpret it into a more idealistic system. = Kita akan menafsirkan ulang menjadi sistem yang lebih idealis.
What would the lower caste do anyway? They dont deserve anything. = Apa yang bisa dilakukan kasta rendah? Mereka tidak pantas mendapatkan apa pun.
Casted Away = Terbuangnya Kasta

As the productivity increases. The absurdity of seeing other people as objects soon came to be realised. People are supporting the abolition. = Seiring meningkatnya produktivitas, absurdnya memandang orang lain sebagai benda segera disadari. Rakyat mendukung penghapusan perbudakan.
Slavery is evil = Perbudakan itu jahat
But we are the superior race! = Tapi kita adalah ras yang unggul!
