There are no perfect world where our people will unite forever. Under just or unjust rulings from leaders of various competency. They will react differently, some reactions are more negative than others. = Tidak ada dunia yang sempurna di mana rakyat kita akan bersatu selamanya. Di bawah pemerintahan yang adil maupun tidak adil dari para pemimpin dengan beragam kemampuan, mereka akan bereaksi berbeda-beda; sebagian reaksi lebih negatif daripada yang lain.
