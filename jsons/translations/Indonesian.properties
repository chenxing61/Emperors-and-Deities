From Asia Minor To Afghanistan = Dari Asia Kecil hingga Afganistan
Central and West Asian Civilization is a huge bundle of nations ranging from Babylon to Kazakhstan and many more, inhabiting middle of eurosia, it was the birth place of the earliest Civilizations. = Peradaban Asia Tengah dan Barat adalah kumpulan besar bangsa-bangsa, dari Babilonia hingga Kazakhstan dan banyak lagi, yang mendiami tengah Eurasia, tempat lahirnya peradaban-peradaban paling awal.
Inherit the legacy of Darius the Great or follow the wisdom of the Last Prophet. Which one should it be? = Mewarisi warisan Darius Agung atau mengikuti kebijaksanaan Nabi Terakhir. Mana yang akan engkau pilih?
