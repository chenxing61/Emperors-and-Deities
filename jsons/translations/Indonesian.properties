Nomad Civilzation: = Peradaban Pengembara:
Nomadic Life Style brings high expansion potential, but is much limited in terms of settlement growth and defence. = Gaya Hidup Pengembara membawa potensi ekspansi yang tinggi, tetapi sangat terbatas dalam hal pertumbuhan permukiman dan pertahanan.
While having [Nomadic Culture]: = Saat memiliki [Nomadic Culture]:
Unlocks [Nomadic Settler], [Settler] alternative that is much cheaper but costs population. = Membuka [Nomadic Settler], alternatif [Settler] yang jauh lebih murah tetapi memakan populasi.
Start with [Primal Herder] instead of [Hunter Gatherer], [Primal Herder] can be summoned using [Influence] using [Nomadic Tribes] ability. = Mulai dengan [Primal Herder] alih-alih [Hunter Gatherer]; [Primal Herder] dapat dipanggil menggunakan [Influence] melalui kemampuan [Nomadic Tribes].
Start with ability to generate [Slaves] during fighting, 100 [Slaves] generates a [Peon] Unit. Which is an alternative to [Worker]s. = Mulai dengan kemampuan menghasilkan [Slaves] selama pertempuran; 100 [Slaves] menghasilkan satu unit [Peon], yang merupakan alternatif bagi [Worker]s.
Unhappiness from number of cities decreased vastly. = Ketidakbahagiaan dari jumlah kota menurun drastis.
Nearly free migrations and internal transports. = Migrasi dan transportasi internal nyaris gratis.
Cities cannot go above 10 population normally. = Kota biasanya tidak dapat melampaui 10 populasi.
Cannot Build [Worker]s, ['Agricultural Building']s and ['Static Defense'] aside from basic [Walls]. = Tidak dapat membangun [Worker]s, ['Agricultural Building']s, dan ['Static Defense'] selain [Walls] dasar.
Building Speed is vastly slower. = Kecepatan pembangunan jauh lebih lambat.
[High Cultural Diversity],[Medium Cultural Diversity] and [Low Cultural Diversity] affects the above buff and debuffs even further, remember to check the civilpedia for further informations. = [High Cultural Diversity], [Medium Cultural Diversity], dan [Low Cultural Diversity] semakin memengaruhi buff dan debuff di atas; ingatlah untuk memeriksa civilpedia untuk informasi lebih lanjut.
Upon entering a new era, a new culture emerges from the steppe. You would need to reach full [Influence] to let them unite the steppes to gain their bonuses. = Saat memasuki era baru, budaya baru muncul dari stepa. Kau perlu mencapai [Influence] penuh agar mereka menyatukan stepa untuk mendapatkan bonus mereka.
Unlocks [Herding Tents], [Pasture] replacement that works on tile with [Migrating Population] instead of normal population. But doesnt provide any stats starting out. = Membuka [Herding Tents], pengganti [Pasture] yang bekerja pada petak dengan [Migrating Population] alih-alih populasi normal, tetapi tidak memberikan statistik apa pun pada awalnya.
An unique government form that allows multiple uniques action that directly uses influences to creat units and give bonuses. = Bentuk pemerintahan unik yang memungkinkan berbagai aksi unik yang secara langsung menggunakan pengaruh untuk membuat unit dan memberikan bonus.
Unlocks [Stone Totem], [Shrine] replacement that decreases policy cost spike from city numbers. = Membuka [Stone Totem], pengganti [Shrine] yang mengurangi lonjakan biaya kebijakan dari jumlah kota.
Unlocks [Elite Horse Archer], [Horse Archer] replacement that starts out with more strength and [Nomadic Lifestyle]. = Membuka [Elite Horse Archer], pengganti [Horse Archer] yang dimulai dengan kekuatan lebih besar dan [Nomadic Lifestyle].
Unlocks [Great Khan], [Great Commander] replacement that has increased buff range at cost of less strength buff, can trigger golden age. = Membuka [Great Khan], pengganti [Great Commander] yang memiliki jangkauan buff lebih luas dengan mengorbankan buff kekuatan, dan dapat memicu zaman keemasan.
An transformation of [Nomadic Tribes] that allows you to spend influence to gain [Great Khan]s and gain building speed back for a few turns. = Transformasi [Nomadic Tribes] yang memungkinkanmu menghabiskan pengaruh untuk mendapatkan [Great Khan]s dan memperoleh kembali kecepatan pembangunan selama beberapa giliran.
Allow you to gain [Settlement Process] and settle down. Leaving Nomadic Life Style behind and inherit its legacy. = Memungkinkanmu memperoleh [Settlement Process] dan menetap. Meninggalkan Gaya Hidup Pengembara dan mewarisi peninggalannya.
Upon reaching (20 + 5 x No. of Cities) amount of [Settlement Process]. You can transform your civilization into a sedimentary civilization, which plays like any other civilization. You can intentionally expand more to lengthen this process. = Setelah mencapai (20 + 5 x Jumlah Kota) [Settlement Process], kau dapat mengubah peradabanmu menjadi peradaban menetap, yang bermain seperti peradaban lainnya. Kau dapat sengaja memperluas lebih jauh untuk memperpanjang proses ini.

