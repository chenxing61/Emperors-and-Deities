ED - Government Forms = ED - Bentuk Pemerintahan
(This mechanic does exist in BNW, but the author of this mod never copied that.) = (Mekanik ini memang ada di BNW, tetapi penulis mod ini tidak pernah menyalinnya.)
Government forms like [buildingFilter] and [buildingFilter2] are the first examples of government forms you might encounter. = Bentuk pemerintahan seperti [buildingFilter] dan [buildingFilter2] adalah contoh pertama bentuk pemerintahan yang mungkin Anda temui.
A government form provides army limits like [resource], [resource2]s, and unique bonuses. For [buildingFilter], it's a discount for policies. For [buildingFilter2], it's a growth bonus and a chance to evolve into [buildingFilter3] in the Ancient Era through reforms. = Suatu bentuk pemerintahan memberikan batas tentara seperti [resource], [resource2]s, dan bonus unik. Untuk [buildingFilter], itu berupa diskon kebijakan. Untuk [buildingFilter2], itu berupa bonus pertumbuhan dan peluang untuk berevolusi menjadi [buildingFilter3] di Era Kuno melalui reformasi.
There are two types of government forms: [buildingFilter] and [buildingFilter2]. [buildingFilter3] government forms have cheaper National Wonders, access to all diplomatic actions, and powerful uniques. Many historically significant empires belong to this category, like [buildingFilter4] and [buildingFilter5]. = Ada dua jenis bentuk pemerintahan: [buildingFilter] dan [buildingFilter2]. Bentuk pemerintahan [buildingFilter3] memiliki Keajaiban Nasional yang lebih murah, akses ke semua tindakan diplomatik, dan keunikan yang kuat. Banyak kekaisaran yang signifikan secara historis termasuk dalam kategori ini, seperti [buildingFilter4] dan [buildingFilter5].
On the other hand, it doesn't mean [buildingFilter] government forms are definitely weaker. They fit into their own niche by having cheaper policy costs, access to [buildingFilter2] via [buildingFilter3], and generally taking less effort to maintain. = Di sisi lain, bukan berarti bentuk pemerintahan [buildingFilter] pasti lebih lemah. Mereka memiliki ceruk sendiri dengan biaya kebijakan yang lebih murah, akses ke [buildingFilter2] melalui [buildingFilter3], dan umumnya membutuhkan lebih sedikit usaha untuk dipertahankan.
You can also force a political shift by having your [resource] go above the [resource2] or reform a [buildingFilter] government form when your [resource3] is at half or above the [resource4]. = Anda juga dapat memaksa pergeseran politik dengan membuat [resource] Anda melebihi [resource2], atau mereformasi bentuk pemerintahan [buildingFilter] ketika [resource3] Anda berada pada setengah atau di atas [resource4].
Shift in politic = Pergeseran politik
To keep a government form during a [param] event, you would need to keep your [resource] above 3/4 of the [resource2]. = Untuk mempertahankan bentuk pemerintahan selama peristiwa [param], Anda perlu menjaga [resource] Anda di atas 3/4 dari [resource2].
[buildingFilter] government forms are gated behind the requirement of having enough [stat] and [resource]. You need to have your [resource2] reach half of the [resource3] and your empire being happy. = Bentuk pemerintahan [buildingFilter] terhalang oleh persyaratan memiliki cukup [stat] dan [resource]. Anda perlu membuat [resource2] Anda mencapai setengah dari [resource3] dan kekaisaran Anda bahagia.
List of all possible government forms = Daftar semua bentuk pemerintahan yang mungkin

ED - Reworked Army Mechanic = ED - Mekanik Tentara yang Dikerjakan Ulang
Armies are now separated into four major categories:\n 'Levy Army', 'Standing Army', 'Noble Army', and 'Mercenary Army', each with different characteristics. = Tentara kini dipisahkan menjadi empat kategori utama:\n 'Tentara Wajib Militer', 'Tentara Tetap', 'Tentara Bangsawan', dan 'Tentara Bayaran', masing-masing dengan karakteristik berbeda.
'Levy Army' units are free and can be summoned using the [buildingFilter] function in any city with five or more population at the cost of [stat] and short-term negative effects. The [buildingFilter2] status can be reverted by disbanding your levies in peaceful times using [buildingFilter3] at the capital so they can be summoned again. = Unit 'Tentara Wajib Militer' gratis dan dapat dipanggil menggunakan fungsi [buildingFilter] di kota mana pun dengan populasi lima atau lebih dengan biaya [stat] dan efek negatif jangka pendek. Status [buildingFilter2] dapat dikembalikan dengan membubarkan wajib militer Anda di masa damai menggunakan [buildingFilter3] di ibu kota sehingga mereka dapat dipanggil lagi.
'Standing Army', 'Noble Army', and 'Mercenary Army' behave like normal units, except 'Mercenary Army' can only be bought and requires a [buildingFilter] to be built. 'Standing Army' and its elite variant 'Noble Army' are what you would rely upon most of the time; however, they do require resources like [param] and [resource] to be built. = 'Tentara Tetap', 'Tentara Bangsawan', dan 'Tentara Bayaran' berperilaku seperti unit normal, kecuali 'Tentara Bayaran' hanya dapat dibeli dan membutuhkan [buildingFilter] untuk dibangun. 'Tentara Tetap' dan varian elitnya 'Tentara Bangsawan' adalah yang akan Anda andalkan hampir sepanjang waktu; namun, mereka membutuhkan sumber daya seperti [param] dan [resource] untuk dibangun.
The main source of [resource] is government forms and [buildingFilter]s. = Sumber utama [resource] adalah bentuk pemerintahan dan [buildingFilter]s.
The main source of [resource] is government forms and policies. = Sumber utama [resource] adalah bentuk pemerintahan dan kebijakan.
The main source of [resource] is [buildingFilter]s and city-states. = Sumber utama [resource] adalah [buildingFilter]s dan negara-kota.

ED - Tags = ED - Tag
There are many tags for different buildings, resources, and units. = Ada banyak tag untuk berbagai bangunan, sumber daya, dan unit.
It is mostly a system for implementing strengths and weaknesses in terms of units, but for resources and buildings, it's a system that applies many buffs. = Ini sebagian besar adalah sistem untuk menerapkan kekuatan dan kelemahan dalam hal unit, tetapi untuk sumber daya dan bangunan, ini adalah sistem yang menerapkan banyak buff.
So you need to play with tags in mind. For example, when [param] from [param2] gives you a bonus on constructing [buildingFilter], you can build more [buildingFilter2]. And later adopt [param3] from [param4] to give them [stat] production. = Jadi Anda perlu bermain dengan mempertimbangkan tag. Misalnya, ketika [param] dari [param2] memberi Anda bonus dalam membangun [buildingFilter], Anda dapat membangun lebih banyak [buildingFilter2]. Lalu kemudian mengadopsi [param3] dari [param4] untuk memberi mereka produksi [stat].
This is a system that doesn't require overthinking. Normally, you just need to pay some attention to what you are doing, and the tag system will reward you accordingly. = Ini adalah sistem yang tidak memerlukan pemikiran berlebihan. Biasanya, Anda hanya perlu memberi sedikit perhatian pada apa yang Anda lakukan, dan sistem tag akan memberi imbalan yang sesuai.
All building sorted by type tags = Semua bangunan diurutkan berdasarkan tag tipe
All units sorted by army tags = Semua unit diurutkan berdasarkan tag tentara

ED - Before Industrial Age = ED - Sebelum Zaman Industri
Before the Industrial Era, the game runs mostly simliar to Civilization 5. You only have to worry about a few newly added features such as [resource], [resource2] and various [buildingFilter]s. = Sebelum Era Industri, permainan berjalan hampir mirip dengan Civilization 5. Anda hanya perlu mengkhawatirkan beberapa fitur yang baru ditambahkan seperti [resource], [resource2], dan berbagai [buildingFilter]s.
'Military Buildings' = 'Bangunan Militer'
[resource] and anything that says a unit consumes are unit limits. Later you would have to worry about [resource2] and so on but right now lets just say unit limit. You would want to build a lot of [param] to increase your [resource3] to get more capable unit into field. Instead of those free levied units that are way more fragile. [buildingFilter] also provides a lot of unit limits. = [resource] dan apa pun yang menyatakan unit mengonsumsinya adalah batas unit. Nanti Anda harus mengkhawatirkan [resource2] dan seterusnya, tetapi untuk saat ini kita sebut saja batas unit. Anda pasti ingin membangun banyak [param] untuk meningkatkan [resource3] Anda agar dapat mengerahkan unit yang lebih mumpuni, alih-alih unit wajib militer gratis yang jauh lebih rapuh. [buildingFilter] juga memberikan banyak batas unit.
Ancient Era = Era Kuno
Before the [param], the focus is to gather as much [stat], [stat2] and [stat3] and settle cities in good spots, the ways to gain [stat4] was mostly limited. = Sebelum [param], fokusnya adalah mengumpulkan sebanyak mungkin [stat], [stat2], dan [stat3] serta mendirikan kota di tempat yang baik; cara memperoleh [stat4] sebagian besar terbatas.
Imperial Era = Era Kekaisaran
However, after the [param], the focus on [stat] and [stat2] become appearent, although there are still few ways to gain [stat3], finally in [param2], you will have plenty of ways to gain [stat4]. = Namun, setelah [param], fokus pada [stat] dan [stat2] menjadi jelas; meskipun masih ada sedikit cara untuk memperoleh [stat3], akhirnya di [param2], Anda akan memiliki banyak cara untuk memperoleh [stat4].

ED - The Industrial Ages = ED - Zaman-Zaman Industri
Arriving at the Industrial Age, there are a few distinctive new features. = Sesampainya di Zaman Industri, ada beberapa fitur baru yang khas.
[buildingFilter]s and [buildingFilter2]s are new requirments for industries and new buildings. = [buildingFilter]s dan [buildingFilter2]s adalah persyaratan baru untuk industri dan bangunan baru.
You will have to allocate tiles near your city center to construct new [improvementFilter]s if you want a full access to buildings. But if you are willing to make compromises with land, you may settle at only building [buildingFilter]s. = Anda harus mengalokasikan petak di dekat pusat kota Anda untuk membangun [improvementFilter]s baru jika ingin akses penuh ke bangunan. Tetapi jika Anda bersedia berkompromi dengan lahan, Anda bisa cukup membangun [buildingFilter]s saja.
[improvementFilter]s do have their own synergies akin to [improvementFilter2]s and are buffed by certain buildings and policies. = [improvementFilter]s memang memiliki sinergi sendiri yang serupa dengan [improvementFilter2]s dan diperkuat oleh bangunan serta kebijakan tertentu.
[resource] and [resource2] are two new parameters you should keep in mind if you want to industrialize your civilization. = [resource] dan [resource2] adalah dua parameter baru yang harus Anda ingat jika ingin mengindustrialisasi peradaban Anda.
If [resource] outgrows [resource2] by 3 + Current Number of Cities*2, you will gain [buildingFilter], which slows down the construction of new industries but adds some positive effects. = Jika [resource] melampaui [resource2] sebesar 3 + Jumlah Kota Saat Ini*2, Anda akan memperoleh [buildingFilter], yang memperlambat pembangunan industri baru tetapi menambah beberapa efek positif.
If [resource] outgrows [resource2] by 3 + Current Number of Cities*2, you will gain [buildingFilter], which speeds up the construction of new industries but adds some negative effects. = Jika [resource] melampaui [resource2] sebesar 3 + Jumlah Kota Saat Ini*2, Anda akan memperoleh [buildingFilter], yang mempercepat pembangunan industri baru tetapi menambah beberapa efek negatif.
[resource] is also a new resource you should keep in mind if you want to keep your industries productive. = [resource] juga merupakan sumber daya baru yang harus Anda ingat jika ingin menjaga industri Anda tetap produktif.
Every industry will consume a certain amount of [resource]. If [resource2] is above [amount], they will have the full benefit of electricity in cities with [buildingFilter], like increased stats and resource production rates. = Setiap industri akan mengonsumsi sejumlah [resource]. Jika [resource2] berada di atas [amount], mereka akan mendapatkan manfaat penuh listrik di kota-kota dengan [buildingFilter], seperti peningkatan atribut dan laju produksi sumber daya.
When below [amount] [resource], the city switches to [buildingFilter], consuming [amount2] [resource2]. = Saat di bawah [amount] [resource], kota beralih ke [buildingFilter], mengonsumsi [amount2] [resource2].
When between [amount] to [amount2] [resource], the city switches to [buildingFilter], consuming [amount3] [resource2]. = Saat berada di antara [amount] hingga [amount2] [resource], kota beralih ke [buildingFilter], mengonsumsi [amount3] [resource2].
When above [amount] [resource], the city switches to [buildingFilter], consuming [amount2] [resource2]. = Saat di atas [amount] [resource], kota beralih ke [buildingFilter], mengonsumsi [amount2] [resource2].
[resource]s and [resource2]s are inevitable if you want to go anywhere in the [buildingFilter] and after that point. = [resource]s dan [resource2]s tidak terhindarkan jika Anda ingin maju dalam [buildingFilter] dan setelah titik itu.
The main source of [resource] are any industry, any tile improvement, those [buildingFilter]s that uses [buildingFilter2] and Rapid consumption. = Sumber utama [resource] adalah industri apa pun, peningkatan petak apa pun, [buildingFilter]s yang menggunakan [buildingFilter2], dan konsumsi cepat.
When it comes to halting the [resource], you could intentionially halt building Industries and tile improvements that you dont need. And focus on technologies, [param] Policy tree and the various [buildingFilter] [buildingFilter2]s. = Untuk menghentikan [resource], Anda bisa dengan sengaja berhenti membangun industri dan peningkatan petak yang tidak Anda butuhkan, lalu fokus pada teknologi, pohon Kebijakan [param], dan berbagai [buildingFilter] [buildingFilter2]s.
[resource] will be a great nuisance, at first it simply decrease the growth, but later it spreads to negatively influence your [stat], [stat2] and so on. Each [resource2] will get progressively ruinous to the aspect it spreads to. = [resource] akan menjadi gangguan besar; awalnya hanya menurunkan pertumbuhan, tetapi kemudian menyebar dan memengaruhi [stat], [stat2], dan seterusnya secara negatif. Setiap [resource2] akan semakin merusak aspek yang dijangkau olehnya.
