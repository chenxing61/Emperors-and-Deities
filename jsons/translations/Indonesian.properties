ED - Invention and Innovations = ED - Penemuan dan Inovasi
[buildingFilter]s and [buildingFilter2]s are new buildings that represent minor technological progression and act like mini National Wonders. They enable you to build certain units and buildings or give functionality boosts to existing buildings. They are built faster when other civilizations have already built them, but if you build it first, you are granted a [stat] and [stat2] boost that scales with the Era of the [buildingFilter3] or [buildingFilter4]. It is also important to state that there is no gameplay difference between [buildingFilter5]s and [buildingFilter6]s. = [buildingFilter]s dan [buildingFilter2]s adalah bangunan baru yang mewakili kemajuan teknologi kecil dan bertindak seperti Keajaiban Nasional mini. Mereka memungkinkan Anda membangun unit dan bangunan tertentu atau memberikan peningkatan fungsionalitas pada bangunan yang sudah ada. Mereka dibangun lebih cepat ketika peradaban lain telah membangunnya, tetapi jika Anda membangunnya lebih dulu, Anda diberikan peningkatan [stat] dan [stat2] yang menyesuaikan dengan Era dari [buildingFilter3] atau [buildingFilter4]. Penting juga untuk menyatakan bahwa tidak ada perbedaan gameplay antara [buildingFilter5]s dan [buildingFilter6]s.
Invention bonus before Industrial Era = Bonus penemuan sebelum Era Industri
[amount] [stat], [amount2] [stat2] = [amount] [stat], [amount2] [stat2]
