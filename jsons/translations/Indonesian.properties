ED - Religion Changes = ED - Perubahan Agama
faith = iman
At first, religion premise is decided by the three-way choice betwee [param], [param2] and [param3]. Although the one standing out is [param4].\nBecause the other two, [param5] seek to maintain a alliance between [stat] and [stat2], [param6] is ambiguous toward [param7], but [param8] is the way to go if you want to delve into religion faster than anyone else. They also have a different selection of wonder to build. Avoiding a fair amount of competition. = Pertama, dasar agama ditentukan oleh pilihan tiga arah antara [param], [param2], dan [param3]. Meskipun yang menonjol adalah [param4].\nKarena dua lainnya, [param5] berusaha menjaga persekutuan antara [stat] dan [stat2], [param6] bersikap ambigu terhadap [param7], tetapi [param8] adalah jalan yang harus diambil jika Anda ingin mendalami agama lebih cepat dari siapa pun. Mereka juga memiliki pilihan keajaiban yang berbeda untuk dibangun, sehingga menghindari cukup banyak persaingan.
Then, you have pantheon, which gives plenty of faith according to the terrain. Even [param] would have to choose a pantheon as it is a spritual step toward the lord. = Kemudian, Anda memiliki panteon, yang memberikan banyak iman sesuai medan. Bahkan [param] harus memilih panteon karena itu adalah langkah spiritual menuju sang penguasa.
Beliefs unlocks plenty of things, aside from buildings like [buildingFilter] and [buildingFilter2], some also unlocks wonders. They also helps with decreasing the unhappiness from the population. Some of them need specific policies like [param] to be adopted.\n Follower Beliefs are ability granters. They enable crucial abilities such as using [stat] to buy stuff.\n Enhancer Beliefs on the other hand, boosts the religion to spread itself better and gives even more bonuses toward various aspects like military and further utilises [stat2]. = Keyakinan membuka banyak hal; selain bangunan seperti [buildingFilter] dan [buildingFilter2], beberapa juga membuka keajaiban. Keyakinan juga membantu mengurangi ketidakbahagiaan dari populasi. Beberapa di antaranya membutuhkan kebijakan khusus seperti [param] untuk diadopsi.\n Keyakinan Pengikut adalah pemberi kemampuan. Mereka memungkinkan kemampuan penting seperti menggunakan [stat] untuk membeli barang.\n Keyakinan Penguat, di sisi lain, meningkatkan penyebaran agama agar lebih baik dan memberi lebih banyak bonus untuk berbagai aspek seperti militer serta lebih memanfaatkan [stat2].

ED - Great People Changes = ED - Perubahan Orang-Orang Besar
Great Persons have been changed. For example, [param] has been separated into [unit] and [unit2]. [unit3]s and [unit4]s have new unique mechanics like creating [resource]s and [resource2]s. Some [improvementFilter]s like [improvementName], [improvementName2]s, and [improvementName3]s have bonuses on specific tiles. = Orang-Orang Besar telah diubah. Misalnya, [param] telah dipisahkan menjadi [unit] dan [unit2]. [unit3]s dan [unit4]s memiliki mekanik unik baru seperti menciptakan [resource]s dan [resource2]s. Beberapa [improvementFilter]s seperti [improvementName], [improvementName2]s, dan [improvementName3]s memiliki bonus pada petak tertentu.
See also: Great Commander = Lihat juga: Panglima Besar
See also: Great Strategist = Lihat juga: Ahli Strategi Besar
See also: War Machine Blueprint = Lihat juga: Cetak Biru Mesin Perang

ED - Expansions, Consolidation and Modernization = ED - Ekspansi, Konsolidasi, dan Modernisasi
City development is organized into three tiers of building packages: "Expansion", "Consolidation", and "Modernization". = Perkembangan kota diorganisasikan ke dalam tiga tingkatan paket bangunan: "Ekspansi", "Konsolidasi", dan "Modernisasi".
How packages work: Each package lets you build multiple related buildings at once, saving [stat] and ensuring that development becomes easier with tech investment. Packages become available as you progress through eras. For example, [buildingFilter] builds [buildingFilter2], [buildingFilter3], and [buildingFilter4] together and is unlocked by [tech]. = Cara kerja paket: setiap paket memungkinkan Anda membangun beberapa bangunan terkait sekaligus, menghemat [stat] dan memastikan perkembangan menjadi lebih mudah dengan investasi teknologi. Paket tersedia seiring kemajuan Anda melalui era. Misalnya, [buildingFilter] membangun [buildingFilter2], [buildingFilter3], dan [buildingFilter4] bersama-sama dan dibuka oleh [tech].
"Expansion": \nCovers basic buildings which form the foundation of any town. Which are mostly unlocked before [buildingFilter] = "Ekspansi": \nMencakup bangunan dasar yang menjadi fondasi kota mana pun. Sebagian besar dibuka sebelum [buildingFilter]
"Consolidation" \nCovers buildings that forms a proper city and make it useful. Which are mostly unlocked starting from [buildingFilter] and before [buildingFilter2]. = "Konsolidasi" \nMencakup bangunan yang membentuk kota yang layak dan membuatnya berguna. Sebagian besar dibuka mulai dari [buildingFilter] dan sebelum [buildingFilter2].
"Modernization" \nCovers buildings that makes a city that is considered modernized. Which are mostly unlocked starting from [buildingFilter]. You wouldn't live without them in real life. = "Modernisasi" \nMencakup bangunan yang membuat sebuah kota dianggap modern. Sebagian besar dibuka mulai dari [buildingFilter]. Anda tidak akan bisa hidup tanpanya di kehidupan nyata.

