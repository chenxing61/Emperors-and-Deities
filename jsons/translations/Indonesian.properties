Qin collapsed, two new leader emerged and is battling it out. Which one of them have won? = Qin runtuh, dua pemimpin baru muncul dan saling bertempur. Manakah di antara mereka yang menang?
Liu Bang the slayer of white snake = Liu Bang sang pembunuh ular putih
Xiang Yu the dominator = Xiang Yu sang penguasa
Collapse of the Great Qin = Runtuhnya Qin Raya

Europa has a variety of cultures scattered around. Certain culture's futher developments can improve our Civilisation's performance greatly. = Eropa memiliki beragam budaya yang tersebar. Perkembangan lebih lanjut budaya tertentu dapat sangat meningkatkan kinerja Peradaban kita.
Gauls = Bangsa Galia
Albions = Albions
Goths = Goth
Saxons = Saxon
Slavs = Slavia
You need at least 5 [Influence] and 200 [Gold] to adopt a culture. = Anda membutuhkan setidaknya 5 [Influence] dan 200 [Gold] untuk mengadopsi sebuah budaya.
The Tribes of Europe = Suku-Suku Eropa

As the egyptian dynasty countinues to be... a new power in the same region grows... = Sementara dinasti Mesir terus berlanjut... kekuatan baru tumbuh di wilayah yang sama...
New culture, new blood... = Budaya baru, darah baru...
Who dares to defy the pharoh? = Siapa yang berani menentang firaun?
Rise of the Punics = Kebangkitan Bangsa Punik

A group of nomadic outsider has migrated and conquered their way into our land... With new ideals and army traditions. = Sekelompok pendatang nomaden telah bermigrasi dan menaklukkan jalan mereka ke tanah kita... Dengan cita-cita dan tradisi militer baru.
So begins the Indo-Aryan's leadership in South Asia. = Maka dimulailah kepemimpinan Indo-Arya di Asia Selatan.
The Harappans had successfully repelled the invasion. = Bangsa Harappa berhasil menghalau invasi tersebut.
Aryan Migration = Migrasi Arya

A wealthy prince named Siddhartha Gautama has became a great philosopher of sort and started a religious movement following his own ideal... = Seorang pangeran kaya bernama Siddhartha Gautama telah menjadi semacam filsuf besar dan memulai gerakan keagamaan yang mengikuti cita-citanya sendiri...
Maybe... We all need a bit of forgiveness in our life. = Mungkin... Kita semua butuh sedikit pengampunan dalam hidup kita.
Stops [Maurya Empire] from automatically adopting [Meritocracy]. = Menghentikan [Maurya Empire] untuk secara otomatis mengadopsi [Meritocracy].
Heretical Teaching. = Ajaran Sesat.
Buddha's birth = Kelahiran Buddha

As a new era arrives, a new culture emerges from the steppes. = Saat era baru tiba, budaya baru muncul dari padang rumput.
The Scythians Emerges = Bangsa Skithia Muncul
The Huns Emerges = Bangsa Hun Muncul
The Xiong Nu Emerges = Bangsa Xiongnu Muncul
Not yet... = Belum...
