As Enough [Settlement Process] has been gained. We may now futher develop our lands. = Setelah [Settlement Process] yang cukup diperoleh, kita kini dapat mengembangkan lebih lanjut tanah kita.
Now we have stability in hand. = Sekarang kita memiliki stabilitas di tangan.
