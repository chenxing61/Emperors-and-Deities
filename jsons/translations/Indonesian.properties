Greeks, Romans, Iberians and many others = Bangsa Yunani, Romawi, Iberia, dan banyak lainnya
Our interest conflicted, and you should step away. = Kepentingan kita bertentangan, dan Anda sebaiknya menjauh.
If you were wiser, you would've chosen a way of peace. = Jika Anda lebih bijaksana, Anda akan memilih jalan damai.
You can destroy our body, building towers upon our wonder, but our legacy remains. = Anda dapat menghancurkan tubuh kami, mendirikan menara di atas keajaiban kami, tetapi warisan kami tetap ada.
Greetings, stranger from other worldly land. = Salam, orang asing dari negeri dunia lain.
For the greater good of humanity, We should exchange our goods. = Demi kebaikan umat manusia yang lebih besar, kita sebaiknya saling bertukar barang.
Maybe we share the same ideal afterall... = Mungkin kita memiliki cita-cita yang sama...
Beware of your action. = Berhati-hatilah dengan tindakanmu.
From Constatinople To Gibraltar = Dari Konstantinopel ke Gibraltar
Mediterranean Civilization is a huge bundle of nations ranging from Mycenaean Greece to Spainish Empire and many more, held together by the same ocean and climate, it has brought thought provoking advances for humanity as a whole. = Peradaban Mediterania adalah kumpulan besar bangsa-bangsa mulai dari Yunani Mykenai hingga Kekaisaran Spanyol dan banyak lagi, disatukan oleh samudra dan iklim yang sama, serta telah membawa kemajuan yang menggugah pemikiran bagi umat manusia secara keseluruhan.
Inherit the legacy of Caesar or follow the wisdom of Aristotle. Which one should it be? = Warisi peninggalan Kaisar atau ikuti kebijaksanaan Aristoteles. Mana yang harus dipilih?
