We call upon our hordes. To combat the nature and our enemies. = Kita memanggil gerombolan kita untuk melawan alam dan musuh-musuh kita.
Recuit Wild Tribes into our culture = Rekrut Suku-Suku Liar ke dalam budaya kita
Organize a hunt for glory, and additional rations = Adakan perburuan demi kejayaan dan jatah tambahan
Double Yield from [Camp] for a short amount of time. = Gandakan Hasil dari [Camp] untuk waktu yang singkat.
We should exchange our knowledges amongst our tribes = Kita harus saling bertukar pengetahuan di antara suku-suku kita
[+1 Science] [in all cities] for a short amount of time. = [+1 Science] [in all cities] untuk waktu yang singkat.
Elect a new Khan! = Pilih Khan baru!
Sacrifice all your [Influence] to gain a [Great Khan] unit. If a certain amount of [Influence] is sacrificed, [Great Khan] may also double as a [Great Strategist]. = Korbankan semua [Influence]-mu untuk mendapatkan unit [Great Khan]. Jika sejumlah [Influence] dikorbankan, [Great Khan] juga dapat berfungsi ganda sebagai [Great Strategist].
Make use of our unified power = Manfaatkan kekuatan kita yang bersatu
Study the advanced culture of the other civilizations = Pelajari budaya maju peradaban lain
