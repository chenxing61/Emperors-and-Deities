Well every story has an end. The Great Commander finally steps down from his position in the army. But how does it play out is a story of its own. = Nah, setiap kisah memiliki akhir. Sang Panglima Besar akhirnya mundur dari posisinya di angkatan bersenjata. Namun bagaimana hal itu terjadi adalah kisah tersendiri.
Honorable Retirement = Pensiun Terhormat
The Great Commander has inspired countless people. His retirement is well deserved. He will be idolised. = Sang Panglima Besar telah menginspirasi banyak orang. Pensiunnya sangat layak. Ia akan diidolakan.
Backstabbed = Dikhianati
Lets just say that there are no perfect man. It would seems like power struggle and other caused this General to step down. Maybe he was too greedy? Too proud of himself? The history can't give a clear answer. = Katakan saja tidak ada manusia yang sempurna. Tampaknya perebutan kekuasaan dan hal lain membuat Jenderal ini mundur. Mungkin ia terlalu serakah? Terlalu bangga pada dirinya sendiri? Sejarah tidak bisa memberikan jawaban yang jelas.
Great Commander's Retirement = Pensiunnya Sang Panglima Besar

Many different theories has developed around how to manage our civilization's wealth and productions. As the wind of commerce starts to flow. = Banyak teori berbeda berkembang mengenai cara mengelola kekayaan dan produksi peradaban kita. Seiring angin perdagangan mulai bertiup.
If the market is free, then its a good deed = Jika pasar bebas, maka itu perbuatan baik
Profiteers would ruin the country. = Para pencari untung akan menghancurkan negara.
Economic Theories = Teori-Teori Ekonomi

The Traditional Feudal System crumbles before the new rising bourgeoisie class as industrial revolution continues. Subsequently, bourgeoisies and proletariats revolted against the traditional system, how does the revolution happen? = Sistem feodal tradisional runtuh di hadapan kelas borjuis baru yang sedang bangkit seiring berlanjutnya revolusi industri. Selanjutnya, kaum borjuis dan proletar memberontak melawan sistem tradisional; bagaimana revolusi itu terjadi?
The Revolution has failed. = Revolusi telah gagal.
The revolution is dead. The government of nobilities continue their ruling,'Noble Army' strength are increased by a third permanently. = Revolusi telah mati. Pemerintahan kaum bangsawan terus berkuasa; kekuatan 'Noble Army' meningkat sepertiga secara permanen.
Peaceful Transition. = Transisi Damai.
Long term societal divide hinders futher policy and economic development. But the revolution have its main goal achieved = Perpecahan sosial jangka panjang menghambat perkembangan kebijakan dan ekonomi lebih lanjut. Namun revolusi telah mencapai tujuan utamanya.
Both negotiations and conflicts are happening... = Negosiasi dan konflik sedang terjadi...
The revolution...is chaotic. Some cities have peacefully transitioned their power to the new ruling class, while some starts to infight violently. Our civilization has entered a state of [Struggle]. All [Revolutionaries] gain some basic promotions and the 'Standing Army' gains 5% strength bonus permanently. = Revolusi... kacau. Beberapa kota telah menyerahkan kekuasaan secara damai kepada kelas penguasa baru, sementara beberapa mulai bertikai dengan kekerasan. Peradaban kita telah memasuki kondisi [Struggle]. Semua [Revolutionaries] memperoleh beberapa promosi dasar dan 'Standing Army' memperoleh bonus kekuatan 5% secara permanen.
Clean the parasites! = Bersihkan para parasit!
The revolution violently shaked the basis of our society, but our society is able to leap toward progressiveness! the civilization enters a state of [Strife], but the will of the revolution is well preserved and people are more accepting to societal changes. All Revolutionaries gain many promotions and the 'Standing Army' gains 10% strength bonus permanently. = Revolusi mengguncang dasar masyarakat kita dengan keras, tetapi masyarakat kita mampu melompat menuju kemajuan! Peradaban memasuki kondisi [Strife], tetapi semangat revolusi tetap terjaga dengan baik dan masyarakat lebih menerima perubahan sosial. Semua Revolutionaries memperoleh banyak promosi dan 'Standing Army' memperoleh bonus kekuatan 10% secara permanen.
Bourgeoisie Revolution! = Revolusi Borjuis!

Through out the history of our grand civilization, what aspect should guide us to the future? = Sepanjang sejarah peradaban agung kita, aspek apa yang harus membimbing kita menuju masa depan?
We have no history! = Kita tidak punya sejarah!
How does one get conservative with no tradition to begin with? = Bagaimana seseorang bisa menjadi konservatif tanpa tradisi sama sekali?
We have no history? = Kita tidak punya sejarah?
We have no history... = Kita tidak punya sejarah...
The Gods = Para Dewa
The polytheistic root of our faith leads us to splendor, we are the most blessed out of all civilization in the world. = Akar politeistik dari iman kita membawa kita menuju kejayaan; kita adalah yang paling diberkati dari semua peradaban di dunia.
Our Lord = Tuhan Kita
The monotheistic root of our faith leads us to connect with the truth, the faith is our sword and our plow. = Akar monoteistik dari iman kita membawa kita terhubung dengan kebenaran; iman adalah pedang dan bajak kita.
Our will to unite = Tekad Kita untuk Bersatu
The power of unity has guided us through most of our history, without it, where would we be? = Kekuatan persatuan telah membimbing kita melalui sebagian besar sejarah kita; tanpanya, di mana kita sekarang?
Our wisdom = Kebijaksanaan Kita
Our civilization were once master of philosophy. They lived with great wisdom and we shall never give it up. = Peradaban kita pernah menjadi ahli filsafat. Mereka hidup dengan kebijaksanaan besar dan kita tidak akan pernah melepaskannya.
Our honor = Kehormatan Kita
Our civilization were once the most honored warriors. They died with honor and we shall never give it up. = Peradaban kita pernah memiliki para pejuang paling terhormat. Mereka gugur dengan terhormat dan kita tidak akan pernah melepaskannya.
Our wealth = Kekayaan Kita
Our civilization were once the smartest traders. They left us with all the capital and insights so that we may stay flourished = Peradaban kita pernah memiliki para pedagang paling cerdas. Mereka mewariskan semua modal dan wawasan agar kita tetap makmur.
Our noble bloodline = Garis Darah Bangsawan Kita
Our ruiling class has the purest blood with virtues passing down from father to son, we will stay true to the noble blood. = Kelas penguasa kita memiliki darah termurni dengan kebajikan yang diturunkan dari ayah ke anak; kita akan tetap setia pada darah bangsawan.
Our efficient bureaucracy = Birokrasi Efisien Kita
The fair and great system our ancestor has passed onto us is a testament to our longevity. = Sistem yang adil dan hebat yang diwariskan leluhur kita adalah bukti umur panjang kita.
Our divinity = Keilahian Kita
Our civilization has engraved our faith into everything, we are reaching for ultimate goals. = Peradaban kita telah mengukir iman kita ke dalam segala hal; kita sedang meraih tujuan-tujuan tertinggi.
Our humanitarianistic view = Pandangan Kemanusiaan Kita
We are the pioneer for progressive value to love all human beings. We will spread our care to the world for it to become a better place. = Kita adalah pelopor nilai progresif untuk mengasihi semua umat manusia. Kita akan menyebarkan kepedulian kita ke dunia agar menjadi tempat yang lebih baik.
Our globe-spanning empire = Kekaisaran Global Kita
We must maintain dominant and make sure things go our ways. = Kita harus tetap dominan dan memastikan segala sesuatunya berjalan sesuai keinginan kita.
Our glorious empire = Kekaisaran Agung Kita
Flower and Beauty doesnt keep our splendor. Iron and Blood Does! = Bunga dan keindahan tidak menjaga kejayaan kita. Besi dan darah yang melakukannya!
The Legacy We Inhereited. = Warisan yang Kita Terima.

As the gap between classes widen, the capitalists started to go overboard with their mistreatment of the working class. After struggles in the politics and countless protest, another revolution has unveiled. The Bourgeoisie had it coming... But how did this went down? = Seiring melebarnya kesenjangan antar kelas, kaum kapitalis mulai keterlaluan dalam memperlakukan kelas pekerja dengan buruk. Setelah perjuangan politik dan protes yang tak terhitung, revolusi lain pun pecah. Kaum borjuis memang pantas mendapatkannya... Tapi bagaimana ini bisa terjadi?
Do not let them pass! = Jangan biarkan mereka lewat!
The government and all the left wing power has sucessfully stopped Facists from taking over the civilization. = Pemerintah dan seluruh kekuatan sayap kiri telah berhasil menghentikan kaum fasis merebut peradaban.
For the Leader! = Demi Sang Pemimpin!
The Facists and their paramilitary militias took over the most important cities and then gradually took over the entire civilization by storm. = Kaum fasis dan milisi paramiliter mereka merebut kota-kota terpenting dan kemudian secara bertahap merebut seluruh peradaban dengan cepat.
Fascist Revolution! = Revolusi Fasis!

The revolution is dead. The government of capitalists continue their ruling, our civilization enters a state of [Struggle], But the route to Conservatism is unlocked = Revolusi telah mati. Pemerintahan kaum kapitalis terus berkuasa; peradaban kita memasuki kondisi [Struggle], tetapi jalur menuju Konservatisme terbuka.
Socialist Democracy will save the day.. = Demokrasi Sosialis akan menyelamatkan hari ini..
Is this even a revolution when at least half of the bourgeoisie are still up on their place? Who knows. The conflict is resolved peacefully but there are long term consequences toward policy and industry development, [Planned Economy] is not available in this route. = Apakah ini revolusi jika setidaknya separuh kaum borjuis masih tetap di tempat mereka? Entahlah. Konflik diselesaikan secara damai, tetapi ada konsekuensi jangka panjang terhadap perkembangan kebijakan dan industri; [Planned Economy] tidak tersedia di jalur ini.
The Workers have nothing to lose but their chains, they have a world to win. = Kaum pekerja tidak kehilangan apa pun kecuali rantai mereka; mereka memiliki dunia untuk dimenangkan.
promotions.One revolt, followed by many, the capitalist system died by a thousand cut. And a new nation ruled by workers is built. Our civilization enters [Struggle] due to the civil war. Newly born [Red Army Troop] now have more promotions. = Satu pemberontakan, diikuti oleh banyak pemberontakan; sistem kapitalis mati oleh seribu sayatan. Dan sebuah bangsa baru yang diperintah oleh kaum pekerja pun dibangun. Peradaban kita memasuki [Struggle] akibat perang saudara. [Red Army Troop] yang baru lahir kini memiliki lebih banyak promosi.
Workers, Farmers, Soldiers, Students, all shall be united to bring down the capitalists! = Kaum pekerja, petani, prajurit, pelajar, semuanya harus bersatu untuk menjatuhkan kaum kapitalis!
Compare to a worker's revolution, this revolution is a combined effort of all proletariats alike, althought that makes the process of revolution much faster, but the organization of the new country is much more complicated. Our Civilization enters [Strife], New [Red Army Troop] specialises into command promotion. = Dibandingkan dengan revolusi buruh, revolusi ini adalah upaya gabungan semua kaum proletar, yang meskipun membuat proses revolusi jauh lebih cepat, membuat organisasi negara baru jauh lebih rumit. Peradaban kita memasuki [Strife]; [Red Army Troop] yang baru mengkhususkan diri pada promosi komando.
Socialist Revolution! = Revolusi Sosialis!

The revolution is dead. The government of capitalists continue their ruling, our civilization enters a state of [Struggle], But the route to Conservatism is unlocked. = Revolusi telah mati. Pemerintahan kaum kapitalis terus berkuasa; peradaban kita memasuki kondisi [Struggle], tetapi jalur menuju Konservatisme terbuka.
What we proclaim is the Right to Well-Being; Well-Being for All! = Yang kita serukan adalah Hak atas Kesejahteraan; Kesejahteraan untuk Semua!
One revolt, followed by many, the capitalist system died by a thousand cut. There are no oppressions anymore. We have eliminated those ticks. Now is the time we enter [Anarchy] and turn it into something else. = Satu pemberontakan, diikuti oleh banyak pemberontakan; sistem kapitalis mati oleh seribu sayatan. Tidak ada lagi penindasan. Kita telah membasmi para parasit itu. Sekarang saatnya kita memasuki [Anarchy] dan mengubahnya menjadi sesuatu yang lain.
Installs Anarchist Ruling in all of your cities,an alternative ruling style ('Political Building') that replaces the intergration. It is free and built instantly, only providing small amount of debuff and needs Commune to be built to nullify its downsides. = Memasang Pemerintahan Anarkis di semua kota Anda, gaya pemerintahan alternatif ('Political Building') yang menggantikan integrasi. Gratis dan langsung dibangun, hanya memberikan sedikit debuff dan membutuhkan Komune untuk dibangun guna meniadakan kekurangannya.
Anarchist Revolution! = Revolusi Anarkis!

We've rebuilt our government in pursuit to adapt to the new era, but the current economy policy is outdated. We will need a economy reform before we can do anything else. = Kita telah membangun kembali pemerintahan demi beradaptasi dengan era baru, tetapi kebijakan ekonomi saat ini sudah ketinggalan zaman. Kita memerlukan reformasi ekonomi sebelum bisa melakukan hal lain.
Free Market = Pasar Bebas
We should believe in the unseen hand and solve all our problems with massive amount of capitals. = Kita harus percaya pada tangan tak terlihat dan menyelesaikan semua masalah kita dengan modal yang sangat besar.
The unseen hand of market economy is not to be fully relied upon. We should spend effort to properly and use more refined policy to guide our nation's productivity. = Tangan tak terlihat dari ekonomi pasar tidak boleh sepenuhnya diandalkan. Kita harus berupaya menggunakan kebijakan yang lebih halus untuk memandu produktivitas bangsa kita.
Stability First = Stabilitas Terlebih Dahulu
Our economy must serve the national unity first and formost, nothing is impossible when our nation is strong and its people united. = Ekonomi kita harus mengabdi pada persatuan nasional terlebih dahulu; tidak ada yang mustahil ketika bangsa kita kuat dan rakyatnya bersatu.
The might of our military overshadows any greed! = Kekuatan militer kita mengalahkan segala keserakahan!
Nothing is beyond the power of winning in a direct conflict. We must direct all our effort into military! = Tidak ada yang melampaui kekuatan untuk menang dalam konflik langsung. Kita harus mengarahkan seluruh upaya kita ke militer!
Centralised Economic Planning = Perencanaan Ekonomi Terpusat
The market economy only benefits capitalists and speculators, our new socialist economy should maximise our development potential and distributes the goods to those who need it. = Ekonomi pasar hanya menguntungkan kaum kapitalis dan spekulan; ekonomi sosialis baru kita harus memaksimalkan potensi pembangunan dan mendistribusikan barang kepada mereka yang membutuhkannya.
Decentralised Economy = Ekonomi Terdesentralisasi
The economy suffered from monopoly and hierarchy, we should liberate the economy in favour of enabling peoples'agency to work for the masses. With nationalised industries and policies being guiding forces. = Ekonomi menderita akibat monopoli dan hierarki; kita harus membebaskan ekonomi demi memungkinkan peran rakyat bekerja untuk massa, dengan industri-industri yang dinasionalisasi dan kebijakan sebagai kekuatan pemandu.
Self-Management Economy = Ekonomi Swakelola
Worker should take the matter into their own hands instead of being some subjects of any greater entities. Mutualism and free will shall reign surpreme. = Kaum pekerja harus mengambil alih urusan ke tangan mereka sendiri alih-alih menjadi subjek dari entitas yang lebih besar. Mutualisme dan kehendak bebas akan berkuasa.
New Economic Policies = Kebijakan Ekonomi Baru

The previous policies may have proven to be less potent. A rearrangement is thus needed. = Kebijakan sebelumnya mungkin terbukti kurang ampuh. Karena itu, penataan ulang diperlukan.
Changing economy policies = Mengubah kebijakan ekonomi

Here is a list of all of your active missions and their win conditions. = Berikut adalah daftar semua misi aktif Anda beserta syarat kemenangannya.
Build a Foundry! = Bangun sebuah Pengecoran!
Unify your civilization under an Empire using [Enact Policies]. = Satukan peradaban Anda di bawah sebuah Kekaisaran menggunakan [Enact Policies].
Adopt at least [1] policy in either [Monotheism] or [Polytheism]. = Adopsi setidaknya [1] kebijakan di [Monotheism] atau [Polytheism].
Complete [4] side quests. = Selesaikan [4] misi sampingan.
Keep your civilization above [Anarchy]! = Jaga peradaban Anda tetap di atas [Anarchy]!
Build [The Great Library]! = Bangun [The Great Library]!
Historically, Aside from the Great Library of Alexandria, the Library of Ashurbanipal, which is the Royal Library of Akkad, it was also renowned for holding the entire [The Epic of Gilgamesh] and dates further back, around 900BC. = Secara historis, selain Perpustakaan Besar Aleksandria, Perpustakaan Ashurbanipal, yang merupakan Perpustakaan Kerajaan Akkad, juga terkenal karena menyimpan keseluruhan [The Epic of Gilgamesh] dan berasal dari masa yang lebih awal, sekitar 900 SM.
And you are probably building it too early. = Dan Anda mungkin membangunnya terlalu dini.
One of the seven olde wonder of the western world. It was built around 600BC and nowadays we build it on every so called green highrises. = Salah satu dari tujuh keajaiban kuno dunia barat. Dibangun sekitar 600 SM dan kini kita membangunnya di setiap gedung tinggi yang disebut hijau.
We have no idea where Tin, the most important ore in bronze making came from, but the traders came from mediterranean sea. So estabilishing a trading hub in the land of Canaan seems to be the way. = Kita tidak tahu dari mana Timah, bijih terpenting dalam pembuatan perunggu, berasal, tetapi para pedagang datang dari laut Mediterania. Jadi, mendirikan pusat perdagangan di tanah Kanaan tampaknya adalah jalannya.
And you need to get enough [Pearl] by whatever means possible to conpete in mediterranean markets. = Dan Anda perlu mendapatkan [Pearl] yang cukup dengan cara apa pun untuk bersaing di pasar Mediterania.
Trade with North African Civilization! = Berdaganglah dengan Peradaban Afrika Utara!
Estabilish the [Incense] trade on the national level will encourge trade relation between our lower classes. And these egyptians are dubiously never lacking on wheats... For whatever reason. = Membangun perdagangan [Incense] di tingkat nasional akan mendorong hubungan dagang antara kelas bawah kita. Dan orang-orang Mesir ini secara mencurigakan tidak pernah kekurangan gandum... Entah apa alasannya.
We can give them some good quality copper... wait, they also have that? = Kita bisa memberi mereka tembaga berkualitas baik... tunggu, mereka juga punya itu?
In Emperors and Deities, Trading luxuries increases output of certain ['Economic Building']s as oppose to increasing [Happiness]. = Dalam Emperors and Deities, memperdagangkan barang mewah meningkatkan hasil dari ['Economic Building'] tertentu alih-alih meningkatkan [Happiness].
Build [6] [Town Hall]s! = Bangun [6] [Town Hall]s!
Nothing Encourages Unity more than the promise of giving land! = Tidak ada yang lebih mendorong persatuan selain janji memberikan tanah!
Explore and improve more than 10 units of [Horse]! = Jelajahi dan tingkatkan lebih dari 10 unit [Horse]!
A tile north of [Nippur] has [4] [Horse]! You may find more horses in the north eastern mountain ranges. = Sebuah petak di utara [Nippur] memiliki [4] [Horse]! Anda mungkin menemukan lebih banyak kuda di pegunungan timur laut.
Mission List = Daftar Misi

Well this tip is gonna appear every turn to annoy you out of playing the wrong civ. Maybe in the future Egypt will be playable in this scenario but the map isnt made for them. = Nah, tips ini akan muncul setiap giliran untuk mengganggu Anda agar berhenti memainkan peradaban yang salah. Mungkin di masa depan Mesir akan dapat dimainkan di skenario ini, tetapi petanya tidak dibuat untuk mereka.
Nope Nope Nope. = Tidak, tidak, tidak.
Hey, choose [Central and West Asia] for this scenario! = Hei, pilih [Central and West Asia] untuk skenario ini!
Spark of Civilization: Wrong Civilization = Percikan Peradaban: Peradaban yang Salah

Welcome to the Emperors and Deities mod. \nOne of the biggest unciv ruleset. \nAlthough the content of the mod is vast, the story takes place in roughly the same place as the original civilization series. Namely the Journey of Humanity. \nThe mod greatly expands the technological progess, element of customization and many other aspects of civ. It is going to be a bumpy ride so strap in. = Selamat datang di mod Emperors and Deities. \nSalah satu ruleset Unciv terbesar. \nMeskipun isi mod ini sangat luas, ceritanya berlangsung kira-kira di tempat yang sama dengan seri Civilization asli, yaitu Perjalanan Umat Manusia. \nMod ini sangat memperluas kemajuan teknologi, elemen kustomisasi, dan banyak aspek peradaban lainnya. Perjalanan ini akan berguncang, jadi bersiaplah.
Start the Tutorial = Mulai Tutorial
Dont forget to check civilipedia if you are in need of understanding certain mechanics. = Jangan lupa memeriksa civilopedia jika Anda perlu memahami mekanisme tertentu.
Mesopotamia, Spark of Civilization, 4000BCE = Mesopotamia, Percikan Peradaban, 4000 SM

You have the city of Uruk under your control as the center of your civilization. \nIt controls some lands which provides food and trade. Which abstracts into gold production. \nIn the city, there are populations, which includes the people working on the lands. = Anda menguasai kota Uruk sebagai pusat peradaban Anda. \nKota ini menguasai sejumlah lahan yang menyediakan makanan dan perdagangan, yang secara abstrak diterjemahkan menjadi produksi emas. \nDi dalam kota terdapat penduduk, termasuk orang-orang yang bekerja di lahan tersebut.
Whats my job? = Apa tugasku?
Your job in every game is to send [Settler]s, build cities and manage them along with a bunch of units. That is the most basic gameplay that civilization series has to offer. However, Emperors and Deities brings more outside factors to this gameplay. = Tugas Anda dalam setiap permainan adalah mengirim [Settler]s, membangun kota, dan mengelolanya bersama sejumlah unit. Itulah gameplay paling mendasar yang ditawarkan seri civilization. Namun, Emperors and Deities menghadirkan lebih banyak faktor eksternal ke dalam gameplay ini.
----- = -----
In this mission you need to build a [Foundry] to jump start the production of bronze to boost your city's [Production]. Afterwhich is another new mission. And so on and so fourth, if you are able to complete all missions thats labeled as main quests, you will win this scenario. = Dalam misi ini Anda perlu membangun [Foundry] untuk memulai produksi perunggu guna meningkatkan [Production] kota Anda. Setelah itu ada misi baru lainnya. Begitu seterusnya; jika Anda mampu menyelesaikan semua misi yang berlabel misi utama, Anda akan memenangkan skenario ini.
New Main Quest: Into The Bronze Age, 4000BCE = Misi Utama Baru: Menuju Zaman Perunggu, 4000 SM

With the increase of productivity, population grows, and risk of over population forced some people to set off to new lands. = Dengan meningkatnya produktivitas, populasi bertambah, dan risiko kelebihan penduduk memaksa sebagian orang berangkat ke tanah baru.
I wonder if they would stay by our side... = Aku bertanya-tanya apakah mereka akan tetap di sisi kita...
[Settler] Units can create new cities, which is absolutely essential for expanding. Every new city settled is a new production line of unit and buildings. = Unit [Settler] dapat membuat kota baru, yang sangat penting untuk ekspansi. Setiap kota baru yang didirikan adalah lini produksi baru untuk unit dan bangunan.
As for how loyal would they be? Well, the game doesnt allow them to rebel. However, new cities will take a big chunk of happiness away from you since the governing body of your civilization have to diverge their power. = Lalu seberapa setia mereka? Yah, game tidak mengizinkan mereka memberontak. Namun, kota baru akan mengurangi banyak kebahagiaan Anda karena badan pemerintahan peradaban Anda harus membagi kekuasaannya.
Low happiness can wreck havoc on unsuspecting civilizations as they decrease [Influence] and make negative events occur more often. = Kebahagiaan rendah dapat menimbulkan malapetaka bagi peradaban yang tidak waspada karena menurunkan [Influence] dan membuat peristiwa negatif lebih sering terjadi.
ALSO, LUXURY DOESNT PROVIDE HAPPINESS NATURALLY IN THIS MOD. = SELAIN ITU, BARANG MEWAH TIDAK MEMBERIKAN KEBAHAGIAAN SECARA ALAMI DI MOD INI.
Quest Reward: Into The Bronze Age, 4000BCE = Hadiah Misi: Menuju Zaman Perunggu, 4000 SM

A brilliant Semitic leader named Sargon has risen in the north. His military innovations and administrative talent promise to unite all of Mesopotamia. This is not a threat but an opportunity. Will you embrace unity or preserve the old city-states? = Seorang pemimpin Semit yang brilian bernama Sargon telah bangkit di utara. Inovasi militernya dan bakat administratifnya menjanjikan penyatuan seluruh Mesopotamia. Ini bukan ancaman, melainkan peluang. Apakah Anda akan merangkul persatuan atau mempertahankan negara-kota lama?
An Empire rises before my eyes! = Sebuah Kekaisaran bangkit di depan mataku!
The united realm will share knowledge and resources. = Kerajaan yang bersatu akan berbagi pengetahuan dan sumber daya.
Maintain the independence of city-states! = Pertahankan kemerdekaan negara-negara kota!
Sargon fails at his mission. The cities remain separate but cooperate through trade and mutual defense. Or not? = Sargon gagal dalam misinya. Kota-kota tetap terpisah tetapi bekerja sama melalui perdagangan dan pertahanan bersama. Atau tidak?
Sargon's Reign, 2334BCE = Pemerintahan Sargon, 2334 SM

Whether through alliance or federation, the time has come to formalize the political structure of your civilization. Use the [Enact Policies] decision in your capital to consolidate your rule. If you have enough Influence, you can declare a unified empire. This will unlock new government bonuses and prepare you for future challenges. = Baik melalui aliansi maupun federasi, saatnya telah tiba untuk meresmikan struktur politik peradaban Anda. Gunakan keputusan [Enact Policies] di ibu kota Anda untuk memperkuat kekuasaan Anda. Jika Anda memiliki cukup Pengaruh, Anda dapat mendeklarasikan kekaisaran bersatu. Ini akan membuka bonus pemerintahan baru dan mempersiapkan Anda menghadapi tantangan di masa depan.
How do I unify? = Bagaimana cara saya bersatu?
Open the city screen of your capital, find the [Enact Policies] building, and choose the option 'We are able to unify ourselves!' when you have at least half of your Influence Limit. = Buka layar kota ibu kota Anda, temukan bangunan [Enact Policies], dan pilih opsi 'Kita mampu menyatukan diri!' ketika Anda memiliki setidaknya setengah dari Batas Pengaruh Anda.
New Main Quest: Unify Mesopotamia, 2200BCE = Misi Utama Baru: Menyatukan Mesopotamia, 2200 SM

And so, the mesopotamian became the soverign owner of their own region. The legacy of Sargon will last. = Maka, bangsa Mesopotamia menjadi pemilik berdaulat atas wilayah mereka sendiri. Warisan Sargon akan bertahan.
United and Stronger than ever. = Bersatu dan lebih kuat dari sebelumnya.
Quest Reward: Unify Mesopotamia, 2200BCE = Hadiah Misi: Menyatukan Mesopotamia, 2200 SM

You have declined the offer of unification, which is an interesting choice. However, there is always another way to strengthen your civilization's unity. = Anda menolak tawaran penyatuan, yang merupakan pilihan menarik. Namun, selalu ada cara lain untuk memperkuat persatuan peradaban Anda.
A pantheon? Or something greater... = Sebuah panteon? Atau sesuatu yang lebih besar...
Choose between the [Polytheism] or [Monotheism], besides a unifying government that grants powerful uniques, you can also build a religion that outlive it. = Pilih antara [Polytheism] atau [Monotheism]; selain pemerintahan penyatu yang memberikan keunikan kuat, Anda juga dapat membangun agama yang hidup lebih lama darinya.
New Main Quest: A House Divided, 2200BCE = Misi Utama Baru: Rumah yang Terpecah, 2200 SM

And so, although history's tide changes, a long lasting faith system starts spreading along with all the glory of the west asian civilization = Dan begitulah, meskipun arus sejarah berubah, sistem kepercayaan yang bertahan lama mulai menyebar bersama seluruh kejayaan peradaban Asia Barat
Interesting = Menarik
Quest Reward: A House Divided, 2200BCE = Hadiah Misi: Rumah yang Terpecah, 2200 SM

The Wheel of history turns its tide, the empire of akkad didnt last. But the west asian civilization is now going through an era of prosperity, complete 4 side quests and \n Prepare for the inevitable. = Roda sejarah berputar mengubah arusnya, kekaisaran akkad tidak bertahan. Tetapi peradaban Asia Barat kini sedang melalui era kemakmuran; selesaikan 4 misi sampingan dan \n Bersiaplah menghadapi hal yang tak terelakkan.
You may check the list of available side quests by [Check Mission List] in capital. = Anda dapat memeriksa daftar misi sampingan yang tersedia melalui [Check Mission List] di ibu kota.
New Main Quest: The Old Babylon, 1900BCE = Misi Utama Baru: Babilonia Lama, 1900 SM

You have built a nation of prosperity, now its time for durability test. = Anda telah membangun bangsa yang makmur; sekarang saatnya uji ketahanan.
What are you talking about? = Apa yang kamu bicarakan?
Quest Reward: The Old Babylon, 1900BCE = Hadiah Misi: Babilonia Lama, 1900 SM

For whatever reason, a volcano event far far away has triggered an agricultural disaster across the entire ancient world.\nOld order is crumbling. Civilizations across the eastern Mediterranean are falling to famine, rebellion, and the loss of trade routes. But here in Mesopotamia, your leadership will determine whether our light fades or endures. Over the next 15 turns, you will face a series of crises. Each requires wise use of Influence and Gold. = Entah apa alasannya, peristiwa gunung berapi yang sangat jauh telah memicu bencana pertanian di seluruh dunia kuno.\nTatanan lama sedang runtuh. Peradaban di seluruh Mediterania timur jatuh karena kelaparan, pemberontakan, dan hilangnya jalur perdagangan. Namun di Mesopotamia ini, kepemimpinan Anda akan menentukan apakah cahaya kita meredup atau bertahan. Selama 15 giliran berikutnya, Anda akan menghadapi serangkaian krisis. Masing-masing membutuhkan penggunaan Pengaruh dan Emas yang bijak.
What must I do? = Apa yang harus kulakukan?
Over the following turns, disasters will strike: drought, civil unrest, economic collapse. Use the [Influence], [Enact Policies] and your stored resources to mitigate them. Survive all 15 turns to complete the tutorial and unlock a special reward. = Selama giliran-giliran berikutnya, bencana akan melanda: kekeringan, kerusuhan sipil, keruntuhan ekonomi. Gunakan [Influence], [Enact Policies], dan sumber daya yang Anda simpan untuk meredakannya. Bertahanlah selama 15 giliran untuk menyelesaikan tutorial dan membuka hadiah spesial.
New Main Quest: Survive the Bronze Age Collapse, 1200BCE = Misi Utama Baru: Bertahan dari Keruntuhan Zaman Perunggu, 1200 SM

You have completed a side quest! This glorious deed will be recorded in the global history. = Anda telah menyelesaikan misi sampingan! Perbuatan mulia ini akan dicatat dalam sejarah global.
Our story continues! = Kisah kita berlanjut!
Side Quest Completion = Penyelesaian Misi Sampingan

The harvest has failed. Food stores are empty, and people are beginning to starve. Entire villages started to escape for survival. = Panen gagal. Simpanan makanan kosong, dan orang-orang mulai kelaparan. Seluruh desa mulai mengungsi demi bertahan hidup.
Distribute emergency grain = Bagikan gandum darurat
The granaries opened. Providing much needed food sourced from both emergency storage and grains bought in a hurry... for now. = Lumbung-lumbung dibuka. Menyediakan makanan yang sangat dibutuhkan, bersumber dari penyimpanan darurat maupun gandum yang dibeli terburu-buru... untuk saat ini.
Import Grains from Egypt = Impor Gandum dari Mesir
Although Egypt also suffers from this horrible disaster. You managed to maintain a desperate alliance between the civilizations and kept the people fed. = Meskipun Mesir juga menderita akibat bencana mengerikan ini. Anda berhasil mempertahankan aliansi yang putus asa di antara peradaban-peradaban dan menjaga rakyat tetap makan.
... = ...
The granaries are emptied! They were already sold by greedy nobles and merchants who also directed the hatred to the leader! = Lumbung-lumbung telah dikosongkan! Mereka sudah dijual oleh para bangsawan dan pedagang serakah yang juga mengarahkan kebencian kepada sang pemimpin!
Drought and Famine = Kekeringan dan Kelaparan

Ambitious nobilities stopped their pursuit of expansion due to the disaster, however that only lead them into power struggle with each others, with the worsening global starvation, the Barbarians are invading as well. = Para bangsawan yang ambisius menghentikan upaya ekspansi mereka karena bencana; namun hal itu hanya membawa mereka ke perebutan kekuasaan satu sama lain. Dengan kelaparan global yang memburuk, kaum Barbar juga ikut menyerbu.
We must do something about it! = Kita harus melakukan sesuatu!
Tighten the Rulership. The amount of [Town Hall]s will lessen the rebellions. = Perketat pemerintahan. Jumlah [Town Hall] akan mengurangi pemberontakan.
Let them come! = Biarkan mereka datang!
Certainly, you have an army, why not use them? = Tentu saja, Anda punya pasukan; mengapa tidak digunakan?
Usurpers and Barbarians = Perampas Kuasa dan Kaum Barbar

The tin routes from distant lands have been severely impacted by the disaster. Without metals, your artisans cannot produce bronze weapons or tools. Production slows across the empire. = Rute timah dari negeri yang jauh terkena dampak parah akibat bencana. Tanpa logam, pengrajin Anda tidak dapat memproduksi senjata atau perkakas perunggu. Produksi melambat di seluruh kekaisaran.
Fix the route then. = Kalau begitu perbaiki rutenya.
Because you have done the related side quest. You have enough [Pearl]s to buy up all the remaining tins on the market! If you can still call it a market. = Karena Anda telah menyelesaikan misi sampingan terkait. Anda memiliki cukup [Pearl] untuk membeli semua sisa timah di pasar! Jika itu masih bisa disebut pasar.
Try to ration the material! = Coba jatahkan materialnya!
A correct call. = Keputusan yang tepat.
Encourage local alternatives. = Dorong alternatif lokal.
Downgrading the tool to pure copper, stone and bone is the desperate, but essential move. = Menurunkan perkakas menjadi tembaga murni, batu, dan tulang adalah langkah yang nekat, tetapi penting.
Trade Collapse = Runtuhnya Perdagangan

Scribes are fleeing the cities to avoid conscription and taxes. The art of writing is being forgotten. Your scientific progress halts. = Para juru tulis melarikan diri dari kota untuk menghindari wajib militer dan pajak. Seni menulis mulai dilupakan. Kemajuan ilmiah Anda terhenti.
Reward those who stayed. Punish those who fleed. = Beri hadiah bagi yang bertahan. Hukum mereka yang melarikan diri.
Maintaining the order. = Menjaga ketertiban.
We have [The Great Library] = Kita punya [The Great Library]
Well. We always have backups in the royal library. = Baiklah. Kita selalu punya cadangan di perpustakaan kerajaan.
Without scribes, records are lost. Generations of knowledges are lost to time. = Tanpa juru tulis, catatan-catatan hilang. Pengetahuan dari banyak generasi hilang ditelan waktu.
Loss of Writing = Hilangnya Tulisan

It is appearent that the gods are angry that such a disaster has struck... The priests are recieveing a lot of backlash because of this. And the power structure of the entire region has been weakened = Jelas bahwa para dewa marah karena bencana seperti ini telah melanda... Para pendeta menerima banyak reaksi keras karenanya. Dan struktur kekuasaan seluruh wilayah telah melemah
Trample the heretic! = Injak-injak si bidah!
Change [Hanging Gardens] to a site of worship and force the priests to pray to the god of fertility = Ubah [Hanging Gardens] menjadi tempat ibadah dan paksa para pendeta berdoa kepada dewa kesuburan
This does absolutely nothing, but peoples are slightly less angry and let it slipped. = Ini sama sekali tidak berpengaruh, tetapi rakyat sedikit kurang marah dan membiarkannya berlalu.
Without powerful priests, the sacredness of the throne isn't secure any more.. This leads to even more man-mode disasters. = Tanpa pendeta yang kuat, kesakralan takhta tidak lagi aman.. Ini berujung pada lebih banyak lagi bencana buatan manusia.
Loss of Faith = Hilangnya Iman

The crises have passed. Mesopotamia is battered but alive. Your decisions have shaped the survival of civilization itself. One last choice awaits. = Krisis telah berlalu. Mesopotamia babak belur tetapi tetap hidup. Keputusan Anda telah membentuk kelangsungan hidup peradaban itu sendiri. Satu pilihan terakhir menanti.
Look to the future (Tutorial Completion) = Menatap masa depan (Penyelesaian Tutorial)
You have completed the Spark of Civilization tutorial. Your people will remember your leadership. = Anda telah menyelesaikan tutorial Percikan Peradaban. Rakyat Anda akan mengingat kepemimpinan Anda.
Thank you for playing this scenario! = Terima kasih telah memainkan skenario ini!
Just another turn... = Satu giliran lagi...
You may keep playing the tutorial, but thats that. = Anda boleh terus memainkan tutorial, tetapi hanya itu saja.
The Final Hour = Saat Terakhir


